<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAGIS Tube Ultimate - Jorge</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase Clásico (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <script>
        if (typeof Babel !== 'undefined') {
            Babel.registerPreset('react-classic', {
                presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
            });
        }
    </script>
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">

    <style>
        body { background-color: #111827; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        .animate-slide-up { animation: slideUp 0.5s ease-out; }
        .text-gold-gradient { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        button:focus, div[tabindex="0"]:focus, input:focus, select:focus { outline: none; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#111827;color:white;flex-direction:column;font-family:sans-serif;">
            <div style="width:40px;height:40px;border:4px solid #E50914;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;"></div>
            <h2>Cargando MAGIS Tube Ultimate...</h2>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef, useMemo } = React;

        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } }
        };

        const timestamp = Date.now();
        const URLS = {
            TV: `https://raw.githubusercontent.com/sejo48/retrom3u/refs/heads/main/listaoficial.m3u?t=${timestamp}`,
            MOVIES: `https://raw.githubusercontent.com/sejo48/peliculas/refs/heads/main/peliculas.json?t=${timestamp}`,
            SERIES: `https://raw.githubusercontent.com/sejo48/jorgedrive/refs/heads/main/playlist.json?t=${timestamp}`,
            ANIMADOS: `https://raw.githubusercontent.com/sejo48/animados./refs/heads/main/animados.json?t=${timestamp}`
        };

        const convertDriveUrl = (url) => {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) {
                    const parts = url.split('/file/d/');
                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (url.includes('id=')) {
                    const parts = url.split('id=');
                    if (parts[1]) fileId = parts[1].split('&')[0];
                }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        };

        const App = () => {
            const [showIntro, setShowIntro] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            const [content, setContent] = useState({ tv: [], series: [], movies: [], animados: [] });
            const [search, setSearch] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedEpisode, setSelectedEpisode] = useState(null);
            const [isLocked, setIsLocked] = useState(false); 
            const [favorites, setFavorites] = useState([]);
            const [loading, setLoading] = useState(true);
            const [expandedSeason, setExpandedSeason] = useState(0);

            useEffect(() => {
                const init = async () => {
                    try {
                        setLoading(true);
                        const [resTV, resMovies, resSeries, resAnimados] = await Promise.all([ 
                            fetch(URLS.TV).catch(() => null),
                            fetch(URLS.MOVIES).catch(() => null),
                            fetch(URLS.SERIES).catch(() => null),
                            fetch(URLS.ANIMADOS).catch(() => null)
                        ]);

                        let tvChannels = [];
                        if (resTV && resTV.ok) {
                            const textTV = await resTV.text();
                            tvChannels = parseM3U(textTV);
                        }

                        let moviesList = [];
                        if (resMovies && resMovies.ok) {
                            const jsonMovies = await resMovies.json();
                            const rawMovies = Array.isArray(jsonMovies) ? jsonMovies : (jsonMovies.peliculas || jsonMovies.content || []);
                            moviesList = rawMovies.map((m, idx) => ({
                                ...m,
                                id: `mov-${idx}`,
                                type: 'movies',
                                title: m.titulo || m.title || m.name,
                                description: m.descripcion || m.sinopsis || m.plot,
                                image: m.imagen || m.poster || m.image,
                                url: convertDriveUrl(m.urlDrive || m.url)
                            }));
                        }

                        let seriesList = [];
                        if (resSeries && resSeries.ok) {
                            const jsonSeries = await resSeries.json();
                            const processSeries = (arr) => {
                                if (!Array.isArray(arr)) return;
                                arr.forEach((s) => {
                                    if (s.series || s.items || s.list || s.categorias || s.categoriasList) {
                                        processSeries(s.series || s.items || s.list || s.categorias || s.categoriasList);
                                        return;
                                    }
                                    const rawSeasons = s.seasons || s.temporadas || s.seasonsList || s.capitulosList || [];
                                    const seasons = rawSeasons.map((seas, sIdx) => ({
                                        title: seas.title || seas.nombre || `Temporada ${sIdx + 1}`,
                                        episodes: (seas.episodes || seas.capitulos || seas.episodios || []).map((ep, eIdx) => ({
                                            title: ep.title || ep.nombre || `Episodio ${eIdx + 1}`,
                                            url: convertDriveUrl(ep.urlDrive || ep.url || ep.link || ep.video)
                                        }))
                                    }));
                                    seriesList.push({
                                        ...s,
                                        id: `ser-${Math.random().toString(36).substr(2, 9)}`,
                                        type: 'series',
                                        title: s.titulo || s.title || s.name,
                                        description: s.descripcion || s.sinopsis || s.plot || s.resumen,
                                        image: s.imagen || s.poster || s.image || s.cover,
                                        seasons,
                                        url: convertDriveUrl(s.urlDrive || s.url || (seasons[0]?.episodes[0]?.url))
                                    });
                                });
                            };
                            const rawSeries = Array.isArray(jsonSeries) ? jsonSeries : (jsonSeries.series || jsonSeries.playlist || jsonSeries.content || jsonSeries.categorias || []);
                            processSeries(rawSeries);
                        }

                        let animadosList = [];
                        if (resAnimados && resAnimados.ok) {
                            const jsonAnimados = await resAnimados.json();
                            const processAnimados = (arr) => {
                                if (!Array.isArray(arr)) return;
                                arr.forEach((a) => {
                                    if (a.animados || a.items || a.list || a.series || a.categorias) {
                                        processAnimados(a.animados || a.items || a.list || a.series || a.categorias);
                                        return;
                                    }
                                    const rawSeasons = a.seasons || a.temporadas || a.seasonsList || [];
                                    const seasons = rawSeasons.map((seas, sIdx) => ({
                                        title: seas.title || seas.nombre || `Temporada ${sIdx + 1}`,
                                        episodes: (seas.episodes || seas.capitulos || seas.episodios || []).map((ep, eIdx) => ({
                                            title: ep.title || ep.nombre || `Episodio ${eIdx + 1}`,
                                            url: convertDriveUrl(ep.urlDrive || ep.url || ep.link || ep.video)
                                        }))
                                    }));
                                    animadosList.push({
                                        ...a,
                                        id: `ani-${Math.random().toString(36).substr(2, 9)}`,
                                        type: seasons.length > 0 ? 'animados_serie' : 'animados',
                                        title: a.titulo || a.title || a.name,
                                        description: a.descripcion || a.sinopsis || a.plot,
                                        image: a.imagen || a.poster || a.image,
                                        seasons,
                                        url: convertDriveUrl(a.urlDrive || a.url)
                                    });
                                });
                            };
                            const rawAnimados = Array.isArray(jsonAnimados) ? jsonAnimados : (jsonAnimados.animados || jsonAnimados.playlist || jsonAnimados.content || jsonAnimados.categorias || []);
                            processAnimados(rawAnimados);
                        }

                        setContent({ tv: tvChannels, movies: moviesList, series: seriesList, animados: animadosList });
                    } catch (err) {
                        console.error("Error cargando contenido remoto", err);
                    } finally {
                        setLoading(false);
                    }
                };

                const storedFavs = safeStorage.getItem('magistube_favs'); 
                if (storedFavs) { try { setFavorites(JSON.parse(storedFavs)); } catch(e) {} }
                init();
            }, []);

            const parseM3U = (data) => {
                const lines = data.split('\n'); const channels = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        let title = 'Canal';
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        if (url && url.startsWith('http')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/); const logo = logoMatch ? logoMatch[1] : '';
                            const groupMatch = line.match(/group-title="([^"]*)"/); const group = groupMatch ? groupMatch[1] : 'General';
                            const commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                            channels.push({ id: `tv-${i}`, title, image: logo, group, url, type: 'tv' });
                        }
                    }
                }
                return channels;
            };

            const toggleFavorite = (item) => { 
                const itemId = item.id || item.title; 
                const newFavs = favorites.some(f => (f.id || f.title) === itemId) ? favorites.filter(f => (f.id || f.title) !== itemId) : [item, ...favorites]; 
                setFavorites(newFavs); 
                safeStorage.setItem('magistube_favs', JSON.stringify(newFavs)); 
            };

            const handlePlay = (item) => { 
                const code = item.codigo || item.password || item.pin; 
                if (code) { setSelectedItem(item); setIsLocked(true); } 
                else { setSelectedItem(item); setIsLocked(false); } 
                setExpandedSeason(0); 
                if (item.type === 'series' || item.type === 'animados_serie') {
                    setSelectedEpisode(item.seasons?.[0]?.episodes?.[0] || null);
                } else {
                    setSelectedEpisode(null);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            };

            const getDisplayContent = () => { 
                let list = activeTab === 'home' 
                    ? [...content.movies, ...content.series, ...content.animados, ...content.tv.slice(0,20)] 
                    : activeTab === 'favorites' 
                    ? favorites 
                    : content[activeTab] || []; 
                if (search && activeTab !== 'jorgeflix') return list.filter(i => (i.title || i.name || i.titulo).toLowerCase().includes(search.toLowerCase())); 
                return list; 
            };

            const displayedItems = getDisplayContent();
            const heroItem = useMemo(() => (content.movies.length ? content.movies[Math.floor(Math.random() * content.movies.length)] : null), [content]);

            if (showIntro) return <IntroScreen onEnter={() => setShowIntro(false)} />;

            return (
                <div className="min-h-screen bg-[#111827] text-white font-sans flex flex-col md:flex-row relative">
                    <aside className="hidden md:flex w-20 flex-col items-center py-6 bg-[#0f1115] border-r border-[#1f2937] fixed h-full z-50">
                        <div className="mb-8 p-2 bg-[#E50914] rounded-lg shadow-lg cursor-pointer" onClick={() => {setActiveTab('home'); setSelectedItem(null); setIsLocked(false);}}><Icon name="play" size={22} fill="white" className="text-white"/></div>
                        <div className="flex flex-col gap-5 w-full items-center">
                            {[
                                { id: 'home', icon: 'search', label: 'Inicio' }, 
                                { id: 'movies', icon: 'clapperboard', label: 'Cine' }, 
                                { id: 'series', icon: 'film', label: 'Series' },
                                { id: 'animados', icon: 'smile', label: 'Animados' },
                                { id: 'tv', icon: 'tv', label: 'TV' }, 
                                { id: 'jorgeflix', icon: 'compass', label: 'Buscador' },
                                { id: 'favorites', icon: 'heart', label: 'Favs' }
                            ].map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); setSelectedItem(null); setSearch(''); setIsLocked(false); }} className={`flex flex-col items-center gap-1 transition-colors w-full py-1 ${activeTab === tab.id ? 'text-[#E50914]' : 'text-gray-500 hover:text-white'}`}>
                                    <Icon name={tab.icon} size={20} fill={activeTab === tab.id && tab.id === 'favorites' ? 'currentColor' : 'none'} className={activeTab === tab.id && tab.id === 'favorites' ? 'fill-current' : ''} /><span className="text-[9px] font-medium">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                        <div className="mt-auto flex flex-col items-center gap-4 mb-4">
                            <div className="w-7 h-7 rounded-full bg-gradient-to-tr from-yellow-400 to-yellow-600 flex items-center justify-center font-serif font-bold text-black text-xs border border-white/20">J</div>
                        </div>
                    </aside>

                    <div className="md:hidden fixed top-0 w-full bg-[#111827]/95 backdrop-blur z-50 px-4 py-3 flex items-center justify-between border-b border-[#1f2937]">
                        <div className="flex items-center gap-2 font-black text-lg tracking-tighter"><span className="text-[#E50914]">MAGIS</span> TUBE</div>
                    </div>

                    <div className="md:hidden fixed bottom-0 w-full bg-[#0f1115] border-t border-[#1f2937] z-50 flex justify-around py-2.5 pb-safe">
                        {[
                            { id: 'home', icon: 'search', label: 'Inicio' }, 
                            { id: 'movies', icon: 'clapperboard', label: 'Cine' }, 
                            { id: 'series', icon: 'film', label: 'Series' },
                            { id: 'animados', icon: 'smile', label: 'Animados' },
                            { id: 'tv', icon: 'tv', label: 'TV' },
                            { id: 'jorgeflix', icon: 'compass', label: 'Buscar' },
                            { id: 'favorites', icon: 'heart', label: 'Favs' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => { setActiveTab(tab.id); setSelectedItem(null); setIsLocked(false); }} className={`flex flex-col items-center gap-0.5 ${activeTab === tab.id ? 'text-[#E50914]' : 'text-gray-500'}`}>
                                <Icon name={tab.icon} size={17} /><span className="text-[7.5px] font-medium">{tab.label}</span>
                            </button>
                        ))}
                    </div>

                    <main className="flex-1 md:ml-20 min-h-screen pt-14 md:pt-0 pb-24 md:pb-0 relative z-10">
                        {activeTab === 'jorgeflix' ? (
                            <JorgeFlixSearch />
                        ) : activeTab === 'favorites' && !selectedItem ? (
                            <div className="p-4 sm:p-8 animate-fade-in">
                                <div className="mb-6 flex items-center gap-3 border-b border-white/10 pb-3">
                                    <div className="p-2 bg-[#E50914]/20 rounded-lg text-[#E50914]"><Icon name="heart" size={20} fill="currentColor" /></div>
                                    <h2 className="text-xl font-bold text-white">Tus Favoritos</h2>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
                                    {favorites.map((item, i) => (<Card key={i} item={item} onClick={handlePlay} isFavorite={true} onToggleFavorite={toggleFavorite} />))}
                                </div>
                                {favorites.length === 0 && <div className="text-center py-20 text-gray-500 text-sm"><p>No tienes favoritos guardados aún.</p></div>}
                            </div>
                        ) : activeTab === 'tv' || (selectedItem && selectedItem.type === 'tv') ? (
                            <div className="flex flex-col lg:flex-row h-full lg:h-screen lg:overflow-hidden">
                                <div className="flex-1 bg-[#111827] relative flex flex-col lg:h-full">
                                    {selectedItem && selectedItem.type === 'tv' ? (
                                        <div className="relative aspect-video w-full bg-[#111827] lg:flex-1 overflow-hidden flex items-center justify-center">
                                            <button onClick={() => setSelectedItem(null)} className="absolute top-3 left-3 z-30 bg-black/60 p-2 rounded-full text-white lg:hidden"><Icon name="arrowLeft" size={18} /></button>
                                            <iframe src={selectedItem.url} className="w-full h-full border-0" allow="autoplay; encrypted-media; fullscreen" allowFullScreen></iframe>
                                        </div>
                                    ) : (
                                        <div className="flex items-center justify-center h-full text-gray-500 text-sm"><p>Selecciona un canal de TV</p></div>
                                    )}
                                </div>
                                <div className="w-full lg:w-80 bg-[#111827] lg:border-l border-white/10 flex flex-col lg:h-full lg:overflow-hidden">
                                    <div className="p-3 sticky top-14 lg:top-0 bg-[#111827] z-20 border-b border-white/5">
                                        <div className="relative"><input type="text" placeholder="Buscar canal..." className="w-full bg-[#1f2937] border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:border-[#E50914] outline-none pl-9" value={search} onChange={(e) => setSearch(e.target.value)}/><Icon name="search" size={16} className="absolute left-3 top-2.5 text-gray-400"/></div>
                                    </div>
                                    <div className="p-2 space-y-1 lg:overflow-y-auto lg:h-full">
                                        {content.tv.filter(c => !search || c.title.toLowerCase().includes(search.toLowerCase())).map(channel => (
                                            <TvListItem key={channel.id} channel={channel} isActive={selectedItem?.id === channel.id} isFavorite={favorites.some(f => f.id === channel.id)} onToggleFavorite={toggleFavorite} onClick={handlePlay} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : selectedItem ? (
                            <div className="animate-fade-in flex flex-col min-h-screen">
                                <div className="w-full bg-black relative aspect-video md:h-[65vh] flex items-center justify-center overflow-hidden">
                                    <div className="absolute top-3 left-3 z-30 flex gap-2">
                                        <button onClick={() => {setSelectedItem(null); setIsLocked(false); setSelectedEpisode(null);}} className="bg-black/70 hover:bg-[#E50914] text-white px-3.5 py-1.5 rounded-full backdrop-blur-md flex items-center gap-1.5 text-xs transition-colors border border-white/15 shadow-lg">
                                            <Icon name="arrowLeft" size={16} /> <span>Volver</span>
                                        </button>
                                    </div>
                                    {isLocked ? (
                                        <LockScreen correctCode={selectedItem.codigo || selectedItem.password || selectedItem.pin} onUnlock={() => setIsLocked(false)} onCancel={() => {setSelectedItem(null); setIsLocked(false);}} />
                                    ) : (
                                        <iframe 
                                            src={convertDriveUrl(((selectedItem.type === 'series' || selectedItem.type === 'animados_serie') && selectedEpisode) ? selectedEpisode.url : selectedItem.url)} 
                                            className="w-full h-full border-0" 
                                            allow="autoplay; encrypted-media; fullscreen" 
                                            allowFullScreen
                                        ></iframe>
                                    )}
                                </div>
                                {!isLocked && (
                                    <div className="p-4 sm:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6 pb-24">
                                        <div className="lg:col-span-2">
                                            <div className="flex items-start justify-between mb-3">
                                                <div>
                                                    <h1 className="text-xl sm:text-2xl font-bold text-white mb-1">{selectedItem.titulo || selectedItem.title || selectedItem.name}</h1>
                                                    <div className="flex items-center gap-2.5 text-xs text-gray-400">
                                                        <span className="bg-[#1f2937] px-2 py-0.5 rounded text-white uppercase">{selectedItem.type}</span>
                                                    </div>
                                                </div>
                                                <button onClick={() => toggleFavorite(selectedItem)} className="p-2.5 bg-[#1f2937] rounded-full hover:bg-[#2d3748]">
                                                    <Icon name="heart" size={20} className={favorites.some(f => (f.id||f.title) === (selectedItem.id||selectedItem.title)) ? "text-[#E50914] fill-[#E50914]" : "text-gray-400"} fill={favorites.some(f => (f.id||f.title) === (selectedItem.id||selectedItem.title)) ? "#E50914" : "none"} />
                                                </button>
                                            </div>
                                            <p className="text-gray-300 text-xs sm:text-sm leading-relaxed mb-6">{selectedItem.descripcion || selectedItem.sinopsis || "Sin descripción disponible."}</p>
                                        </div>

                                        {/* Selector de Temporadas y Capítulos para Series y Animados tipo Serie */}
                                        {(((selectedItem.type === 'series' || selectedItem.type === 'animados_serie') && selectedItem.seasons && selectedItem.seasons.length > 0)) && (
                                            <div className="bg-[#161d2b] border border-[#263145] rounded-2xl p-4 h-fit shadow-xl">
                                                <h3 className="text-sm font-bold text-white mb-3 uppercase tracking-wider">Temporadas y Episodios</h3>
                                                <div className="space-y-2 max-h-[400px] overflow-y-auto pr-1">
                                                    {selectedItem.seasons.map((season, sIdx) => (
                                                        <div key={sIdx} className="bg-[#111722] rounded-xl border border-[#222c3d] overflow-hidden">
                                                            <button 
                                                                onClick={() => setExpandedSeason(expandedSeason === sIdx ? -1 : sIdx)}
                                                                className="w-full px-4 py-3 flex items-center justify-between text-left text-xs font-bold text-gray-200 hover:bg-white/5 transition-colors"
                                                            >
                                                                <span>{season.title}</span>
                                                                <Icon name={expandedSeason === sIdx ? "chevronUp" : "chevronDown"} size={16} />
                                                            </button>
                                                            {expandedSeason === sIdx && (
                                                                <div className="px-2 pb-2 space-y-1">
                                                                    {season.episodes && season.episodes.map((ep, eIdx) => (
                                                                        <button 
                                                                            key={eIdx}
                                                                            onClick={() => setSelectedEpisode(ep)}
                                                                            className={`w-full text-left px-3 py-2 rounded-lg text-xs transition-colors flex items-center gap-2 ${selectedEpisode?.url === ep.url ? 'bg-[#E50914] text-white font-bold' : 'text-gray-400 hover:bg-white/5 hover:text-white'}`}
                                                                        >
                                                                            <Icon name="play" size={12} fill="currentColor" />
                                                                            <span className="truncate">{ep.title}</span>
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <>
                                <div className="sticky top-14 md:top-0 z-40 bg-[#111827]/95 backdrop-blur py-3 px-4 sm:px-8 flex items-center justify-between border-b border-[#1f2937]">
                                    <div className="flex bg-[#1f2937] border border-[#374151] rounded-full px-3 py-1.5 w-full max-w-md items-center focus-within:border-[#E50914] transition-colors">
                                        <Icon name="search" className="text-gray-400 w-4 h-4 mr-2.5" />
                                        <input type="text" placeholder={`Buscar en ${activeTab === 'home' ? 'todo' : activeTab}...`} className="bg-transparent w-full outline-none text-xs sm:text-sm placeholder-gray-500 text-white" value={search} onChange={(e) => setSearch(e.target.value)}/>
                                    </div>
                                </div>
                                {activeTab === 'home' && !search && heroItem && <HeroSection item={heroItem} onPlay={handlePlay} isFavorite={favorites.some(f=>(f.id||f.title)===(heroItem.id||heroItem.title))} onToggleFavorite={toggleFavorite}/>}
                                <div className="p-4 sm:p-8">
                                    <div className="mb-4 flex items-center gap-2">
                                        <div className="w-1 h-5 bg-[#E50914] rounded-full"></div>
                                        <h2 className="text-base sm:text-lg font-bold uppercase tracking-wide">{activeTab === 'home' ? 'Tendencias' : activeTab}</h2>
                                    </div>
                                    {loading ? (
                                        <div className="flex justify-center py-16"><div className="animate-spin rounded-full h-10 w-10 border-3 border-[#E50914] border-t-transparent"></div></div>
                                    ) : displayedItems.length === 0 ? (
                                        <div className="text-center py-16 text-gray-500 text-xs"><p>No hay contenido disponible.</p></div>
                                    ) : (
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4 animate-slide-up">
                                            {displayedItems.map((item, i) => (
                                                <Card key={i} item={item} onClick={handlePlay} isFavorite={favorites.some(f => (f.id||f.title) === (item.id||item.title))} onToggleFavorite={toggleFavorite} />
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </main>
                </div>
            );
        };

        const JorgeFlixSearch = () => {
            const [lang, setLang] = useState("");
            const [query, setQuery] = useState("");
            const [typeVal, setTypeVal] = useState("");
            const [yearVal, setYearVal] = useState("");
            const [engine, setEngine] = useState("google");
            const [voiceStatus, setVoiceStatus] = useState("🎤 Pulse el micrófono y diga el nombre de la película o serie.");
            const [isListening, setIsListening] = useState(false);
            const [history, setHistory] = useState([]);

            const STORAGE_KEY = 'jorgeflix_history_v3';

            useEffect(() => {
                try {
                    const h = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
                    setHistory(Array.isArray(h) ? h : []);
                } catch (e) {
                    setHistory([]);
                }
            }, []);

            // Mejoras de efectividad en la construcción de la consulta:
            // 1. Forzar búsqueda estricta en ok.ru con o sin subdirectorios de video
            // 2. Uso de operadores adicionales opcionales para evitar ruido
            const buildQuery = () => {
                let cleanQuery = query.trim();
                let s = 'site:ok.ru';
                if (cleanQuery) {
                    s += ` "${cleanQuery}"`;
                }
                if (yearVal.trim()) {
                    s += ` ${yearVal.trim()}`;
                }
                if (typeVal) {
                    s += ` ${typeVal}`;
                }
                // Añadir términos de calidad o idioma clave para mejorar la relevancia
                s += ' (video OR pelicula OR serie OR español)';
                if (lang === 'latino') s += ' (latino OR latinoamerica)';
                if (lang === 'castellano') s += ' (castellano OR españa)';
                if (lang === 'doblada') s += ' doblada';
                if (lang === 'subtitulada') s += ' subtitulada';
                return s;
            };

            const currentCmd = buildQuery();

            const startVoice = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    setVoiceStatus("❌ El reconocimiento de voz no está disponible en este navegador.");
                    return;
                }
                const r = new SpeechRecognition();
                r.lang = "es-CR";
                r.continuous = false;
                r.interimResults = true;
                setIsListening(true);
                setVoiceStatus("🎙️ Escuchando... hable ahora.");
                r.onresult = (e) => {
                    let text = "";
                    for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript;
                    setQuery(text.trim());
                };
                r.onerror = (e) => {
                    let msg = "No se pudo usar el micrófono.";
                    if (e.error === "not-allowed") msg = "❌ Permiso de micrófono bloqueado. Permítalo en el navegador.";
                    if (e.error === "no-speech") msg = "🎤 No detecté voz. Inténtelo nuevamente.";
                    setVoiceStatus(msg);
                };
                r.onend = () => {
                    setIsListening(false);
                    if (query.trim()) setVoiceStatus("✅ Texto reconocido. Puede buscar.");
                    else setVoiceStatus("🎤 Pulse el micrófono y diga el nombre de la película o serie.");
                };
                try { r.start(); } catch (e) { r.onend(); }
            };

            const saveHistory = (title, y, t, l, eng) => {
                try {
                    let h = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
                    if (!Array.isArray(h)) h = [];
                    h = [{ title, y, t, l, eng }, ...h.filter(x => !(x.title === title && x.y === y && x.t === t && x.l === l))].slice(0, 10);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
                    setHistory(h);
                } catch (e) { }
            };

            const handleSearch = () => {
                if (!query.trim()) return;
                saveHistory(query.trim(), yearVal.trim(), typeVal, lang, engine);
                
                let searchUrl = '';
                const encoded = encodeURIComponent(currentCmd);
                if (engine === 'yandex') {
                    searchUrl = `https://yandex.com/search/?text=${encoded}`;
                } else if (engine === 'duckduckgo') {
                    searchUrl = `https://duckduckgo.com/?q=${encoded}`;
                } else {
                    searchUrl = `https://www.google.com/search?q=${encoded}`;
                }
                window.open(searchUrl, '_blank');
            };

            const repeatHistory = (x) => {
                setQuery(x.title);
                setYearVal(x.y || "");
                setTypeVal(x.t || "");
                setLang(x.l || "");
                if (x.eng) setEngine(x.eng);
                
                let cleanQuery = x.title.trim();
                let s = 'site:ok.ru';
                if (cleanQuery) s += ` "${cleanQuery}"`;
                if (x.y) s += ` ${x.y}`;
                if (x.t) s += ` ${x.t}`;
                s += ' (video OR pelicula OR serie OR español)';
                if (x.l === 'latino') s += ' (latino OR latinoamerica)';
                if (x.l === 'castellano') s += ' (castellano OR españa)';
                if (x.l === 'doblada') s += ' doblada';
                if (x.l === 'subtitulada') s += ' subtitulada';

                saveHistory(x.title, x.y, x.t, x.l, x.eng || 'google');
                
                let searchUrl = '';
                const encoded = encodeURIComponent(s);
                if (x.eng === 'yandex') searchUrl = `https://yandex.com/search/?text=${encoded}`;
                else if (x.eng === 'duckduckgo') searchUrl = `https://duckduckgo.com/?q=${encoded}`;
                else searchUrl = `https://www.google.com/search?q=${encoded}`;
                
                window.open(searchUrl, '_blank');
            };

            const clearHistory = () => {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                    setHistory([]);
                } catch (e) { }
            };

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-8 animate-fade-in text-white">
                    <div className="text-center py-6">
                        <h1 className="text-3xl sm:text-4xl font-black mb-2">Buscador Avanzado <span className="text-[#E50914]">JorgeFlix</span></h1>
                        <p className="text-gray-400 text-xs sm:text-sm">Encuentra videos en OK.ru con precisión quirúrgica usando operadores avanzados y selección de motor.</p>
                    </div>

                    <div className="bg-[#11151d] border border-[#29303b] rounded-2xl p-4 sm:p-6 shadow-2xl mb-8">
                        <div className="grid grid-cols-1 md:grid-cols-[1fr_160px_110px] gap-3 mb-4">
                            <div className="relative">
                                <input 
                                    id="q" 
                                    placeholder="Nombre exacto de película o serie..." 
                                    value={query} 
                                    onChange={(e) => setQuery(e.target.value)} 
                                    onKeyDown={(e) => e.key === "Enter" && handleSearch()}
                                    className="w-full bg-[#090c11] border border-[#29303b] rounded-xl px-4 py-3 text-sm text-white outline-none pr-12 focus:border-gray-500" 
                                    autoFocus 
                                />
                                <button 
                                    type="button" 
                                    onClick={startVoice} 
                                    title="Buscar por voz" 
                                    className={`absolute right-2 top-2 w-9 h-9 rounded-lg flex items-center justify-center text-lg ${isListening ? 'bg-[#E50914] animate-pulse' : 'bg-[#252b35]'}`}
                                >
                                    {isListening ? '🔴' : '🎤'}
                                </button>
                            </div>
                            <select 
                                value={typeVal} 
                                onChange={(e) => setTypeVal(e.target.value)}
                                className="bg-[#090c11] border border-[#29303b] rounded-xl px-3 py-3 text-sm text-white outline-none"
                            >
                                <option value="">Todo tipo</option>
                                <option value="película">Película</option>
                                <option value="serie">Serie</option>
                            </select>
                            <input 
                                inputMode="numeric" 
                                maxLength="4" 
                                placeholder="Año" 
                                value={yearVal} 
                                onChange={(e) => setYearVal(e.target.value)}
                                onKeyDown={(e) => e.key === "Enter" && handleSearch()}
                                className="bg-[#090c11] border border-[#29303b] rounded-xl px-3 py-3 text-sm text-white outline-none text-center" 
                            />
                        </div>

                        {/* Selector de Motor de Búsqueda para mayor efectividad */}
                        <div className="flex items-center gap-3 mb-4 bg-[#090c11] p-3 rounded-xl border border-[#29303b]">
                            <span className="text-xs text-gray-400 font-bold uppercase tracking-wider">Motor:</span>
                            <div className="flex gap-2 flex-wrap">
                                {[
                                    { id: 'google', label: '🔍 Google' },
                                    { id: 'yandex', label: '🌐 Yandex' },
                                    { id: 'duckduckgo', label: '🦆 DuckDuckGo' }
                                ].map(eng => (
                                    <button 
                                        key={eng.id}
                                        onClick={() => setEngine(eng.id)}
                                        className={`px-3 py-1 rounded-lg text-xs font-medium transition-colors ${engine === eng.id ? 'bg-[#E50914] text-white' : 'bg-[#181e28] text-gray-300 hover:bg-[#252b35]'}`}
                                    >
                                        {eng.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-2 mb-4">
                            {[
                                { lang: "", label: "🇪🇸 Cualquier español" },
                                { lang: "latino", label: "🇲🇽 Español latino" },
                                { lang: "castellano", label: "🇪🇸 Castellano" },
                                { lang: "doblada", label: "🎙️ Doblada" },
                                { lang: "subtitulada", label: "💬 Subtitulada" }
                            ].map((f, i) => (
                                <button 
                                    key={i} 
                                    onClick={() => setLang(f.lang)} 
                                    className={`px-3.5 py-1.5 rounded-full text-xs font-medium border transition-colors ${lang === f.lang ? 'bg-white text-black border-white' : 'bg-[#171c25] border-[#29303b] text-[#cbd2dc] hover:border-gray-500'}`}
                                >
                                    {f.label}
                                </button>
                            ))}
                        </div>

                        <div className="text-xs text-gray-400 mb-3">{voiceStatus}</div>
                        <div className="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Comando avanzado optimizado</div>
                        <div className="bg-[#080a0e] p-3 rounded-lg font-mono text-xs text-red-400 overflow-x-auto mb-4 border border-[#29303b]">{currentCmd}</div>

                        <button onClick={handleSearch} className="w-full bg-[#E50914] text-white py-3 rounded-xl font-bold text-sm hover:bg-red-700 transition-colors shadow-lg">
                            🔎 Buscar con máxima efectividad
                        </button>
                    </div>

                    <div className="bg-[#11151d] border border-[#29303b] rounded-2xl p-4 sm:p-6 shadow-xl">
                        <h2 className="text-base font-bold mb-3 flex items-center gap-2">🕘 Historial Avanzado</h2>
                        {history.length === 0 ? (
                            <p className="text-xs text-gray-500">Todavía no hay búsquedas recientes.</p>
                        ) : (
                            <div className="flex flex-wrap gap-2 items-center">
                                {history.map((x, idx) => (
                                    <button 
                                        key={idx} 
                                        onClick={() => repeatHistory(x)} 
                                        className="bg-[#181e28] border border-[#29303b] hover:border-gray-500 text-[#d8dde5] text-xs px-3.5 py-2 rounded-full transition-colors flex items-center gap-1.5"
                                    >
                                        <span>{x.title}</span> {x.y ? `· ${x.y}` : ''} <span className="text-[9px] bg-black/40 px-1 rounded text-red-400 uppercase">{x.eng || 'google'}</span>
                                    </button>
                                ))}
                                <button onClick={clearHistory} className="text-xs text-red-400 underline ml-2 hover:text-red-300">Borrar historial</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const IntroScreen = ({ onEnter }) => (
            <div className="fixed inset-0 z-[100] bg-[#111827] flex items-center justify-center overflow-hidden font-sans p-4">
                <div className="absolute inset-0"><img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=1000&auto=format&fit=crop" className="w-full h-full object-cover opacity-10" /><div className="absolute inset-0 bg-gradient-to-b from-[#111827] via-[#111827]/90 to-[#111827]"></div></div>
                <div className="relative z-10 text-center max-w-sm w-full animate-slide-up">
                    <div className="mb-3 inline-block bg-[#E50914] px-2.5 py-0.5 rounded text-[10px] font-bold tracking-widest uppercase text-white">Premium Access</div>
                    <h1 className="text-5xl font-black text-white mb-2 tracking-tighter">MAGIS<span className="text-[#E50914]">Tube</span></h1>
                    <p className="text-sm text-gray-400 font-light mb-6 italic">"Donde la nostalgia se encuentra con la tecnología."</p>
                    <button onClick={onEnter} className="w-full bg-white text-black py-3.5 rounded-full font-bold text-base shadow-lg flex items-center justify-center gap-2 mb-8 active:scale-95 transition-transform"><span>Comenzar a Ver</span> <Icon name="play" size={18} fill="black" /></button>
                    <div className="opacity-80"><p className="text-[9px] text-gray-500 uppercase tracking-widest mb-0.5">DISEÑADO Y PROGRAMADO POR</p><h3 className="text-base font-serif text-gold-gradient font-bold mb-1">JORGE ARTURO HERNÁNDEZ MÉNDEZ</h3><p className="text-[9px] text-gray-600">Potenciado por <span className="text-blue-400">Gemini AI</span></p></div>
                </div>
            </div>
        );

        const HeroSection = ({ item, onPlay, isFavorite, onToggleFavorite }) => {
            if (!item) return null;
            const imgSource = item.imagen || item.image || item.poster;
            const titleSource = item.titulo || item.title || item.name;
            const descSource = item.descripcion || item.sinopsis || item.plot;
            return (
                <div className="relative w-full h-[320px] sm:h-[380px] bg-[#0b0f19] overflow-hidden rounded-3xl mb-8 group animate-fade-in shadow-2xl border border-white/5 flex items-center">
                    <div className="absolute inset-0 overflow-hidden pointer-events-none">
                        <img 
                            src={imgSource} 
                            alt="Hero BG" 
                            className="w-full h-full object-cover filter blur-md opacity-75 scale-125 brightness-125 contrast-125" 
                            onError={(e) => e.target.style.display='none'} 
                        />
                        <div className="absolute inset-0 bg-gradient-to-r from-[#0b0f19]/80 via-[#0b0f19]/40 to-transparent"></div>
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-transparent to-transparent"></div>
                    </div>
                    <div className="relative z-10 w-full h-full flex flex-col sm:flex-row items-center justify-start px-6 sm:px-12 max-w-7xl mx-auto gap-8">
                        <div className="w-32 sm:w-44 aspect-[2/3] rounded-xl overflow-hidden shadow-2xl border border-white/20 flex-shrink-0 bg-black/50 transform group-hover:scale-105 transition-transform duration-300">
                            <img src={imgSource} alt={titleSource} className="w-full h-full object-cover" onError={(e) => e.target.src='https://placehold.co/300x450/1f2937/ffffff?text=Poster'} />
                        </div>
                        <div className="flex-1 flex flex-col gap-2 items-start max-w-xl">
                            <span className="bg-[#E50914] text-white text-[9px] font-extrabold px-2.5 py-1 rounded uppercase tracking-wider shadow">Destacado</span>
                            <h1 className="text-2xl sm:text-4xl font-black text-white leading-tight drop-shadow-md line-clamp-1">{titleSource}</h1>
                            <p className="text-gray-100 text-xs sm:text-sm line-clamp-3 leading-relaxed drop-shadow">{descSource || "Disfruta del mejor contenido seleccionado para ti."}</p>
                            <div className="flex gap-3 mt-3">
                                <button onClick={() => onPlay(item)} className="bg-white text-black px-6 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 active:scale-95 transition-transform shadow-lg hover:bg-gray-200">
                                    <Icon name="play" size={16} fill="black"/> Reproducir
                                </button>
                                <button onClick={() => onToggleFavorite(item)} className="bg-white/20 text-white p-2.5 rounded-xl flex items-center justify-center backdrop-blur-md border border-white/30 hover:bg-white/40">
                                    <Icon name="heart" size={18} className={isFavorite ? "text-[#E50914] fill-[#E50914]" : "text-white"} fill={isFavorite ? "#E50914" : "none"} />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TvListItem = ({ channel, isActive, onClick, isFavorite, onToggleFavorite }) => (
            <div tabIndex="0" onClick={() => onClick(channel)} className={`group flex items-center gap-3 p-3 border-b border-white/5 cursor-pointer transition-colors ${isActive ? 'bg-[#1f2937] border-l-4 border-l-[#E50914]' : 'hover:bg-white/5'}`} > 
                <div className="w-10 h-7 rounded bg-black flex items-center justify-center overflow-hidden flex-shrink-0 border border-white/10"> 
                    {channel.image ? ( <img src={channel.image} alt={channel.title} loading="lazy" className="w-full h-full object-contain" onError={(e) => e.target.style.display='none'} /> ) : ( <Icon name="tv" size={14} className="text-gray-400"/> )} 
                </div> 
                <div className="flex-1 min-w-0"> 
                    <p className={`text-xs sm:text-sm font-medium truncate ${isActive ? 'text-[#E50914]' : 'text-white'}`}>{channel.title}</p> 
                    <p className="text-[10px] text-gray-500 truncate">{channel.group || 'General'}</p> 
                </div> 
                <button onClick={(e) => { e.stopPropagation(); onToggleFavorite(channel); }} className="p-2 rounded-full text-gray-400 hover:text-white"> 
                    <Icon name="heart" size={16} className={isFavorite ? "text-[#E50914] fill-[#E50914]" : ""} fill={isFavorite ? "#E50914" : "none"} /> 
                </button> 
            </div> 
        );

        const Card = ({ item, onClick, isFavorite, onToggleFavorite }) => { 
            const isTv = item.type === 'tv'; 
            const hasLock = item.codigo || item.password || item.pin; 
            const isKids = item.isKids || item.type === 'animados' || item.type === 'animados_serie';
            const imgSource = item.imagen || item.image || item.poster || item.logo;
            const titleSource = item.titulo || item.title || item.name;
            return ( 
                <div tabIndex="0" className="group relative flex flex-col gap-1.5 cursor-pointer active:scale-95 transition-transform" onClick={() => onClick(item)}> 
                    <div className={`relative overflow-hidden rounded-lg bg-[#1f2937] shadow-md ${isTv ? 'aspect-video' : 'aspect-[2/3]'}`}> 
                        <img src={imgSource} loading="lazy" className={`w-full h-full ${isTv ? 'object-contain p-3' : 'object-cover'}`} onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/300x450/1f2937/ffffff?text=X`; }} alt={titleSource} /> 
                        <button onClick={(e) => { e.stopPropagation(); onToggleFavorite(item); }} className="absolute top-1.5 right-1.5 p-1.5 bg-black/60 rounded-full text-white"> 
                            <Icon name="heart" size={14} className={isFavorite ? "text-[#E50914] fill-[#E50914]" : ""} fill={isFavorite ? "#E50914" : "none"} /> 
                        </button> 
                        <div className="absolute bottom-1.5 left-1.5 flex gap-1"> 
                            {isTv && <span className="bg-[#E50914] text-white text-[8px] font-bold px-1.5 py-0.5 rounded">LIVE</span>} 
                            {isKids && <span className="bg-blue-600 text-white text-[8px] font-bold px-1.5 py-0.5 rounded">KIDS</span>}
                            {item.type === 'series' && <span className="bg-purple-600 text-white text-[8px] font-bold px-1.5 py-0.5 rounded">SERIE</span>}
                            {hasLock && <span className="bg-yellow-500 text-black text-[8px] font-bold px-1.5 py-0.5 rounded flex items-center gap-0.5"><Icon name="lock" size={7}/> PIN</span>} 
                        </div> 
                    </div> 
                    <h3 className="text-xs font-bold text-gray-200 truncate">{titleSource}</h3> 
                </div> 
            ); 
        };

        const Icon = ({ name, size = 22, className, fill = "none" }) => {
            const icons = {
                search: <path d="M21 21l-4.35-4.35m0 0a7.5 7.5 0 111.414-1.414 7.5 7.5 0 01-1.414 1.414z" />,
                x: <path d="M6 18L18 6M6 6l12 12" />,
                tv: <path d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125z" />,
                film: <path d="M19.82 2H4.18C2.97 2 2 2.97 2 4.18v15.64C2 21.03 2.97 22 4.18 22h15.64c1.21 0 2.18-.97 2.18-2.18V4.18C22 2.97 21.03 2 19.82 2zM7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5" />,
                play: <path d="M5 3l14 9-14 9V3z" />,
                heart: <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />,
                arrowLeft: <path d="M19 12H5m7 7l-7-7 7-7" />,
                chevronDown: <path d="M6 9l6 6 6-6" />,
                chevronUp: <path d="M18 15l-6-6-6 6" />,
                clapperboard: <g><path d="M20.2 6 3 11l-.9-2.4c-.5-1.1.2-2.3 1.3-2.8l3.2-1.4c1.1-.5 2.3.2 2.8 1.3l.9 2.4l7.9-3l2 4.5Z"/><path d="M4 11v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9"/></g>,
                lock: <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a7 7 0 00-14 0v2" />,
                smile: <g><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></g>,
                compass: <g><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></g>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.search}
                </svg>
            );
        };

        const LockScreen = ({ onUnlock, correctCode, onCancel }) => {
            const [input, setInput] = useState(''); const [error, setError] = useState(false);
            const handleSubmit = (e) => { e.preventDefault(); if (input === String(correctCode)) onUnlock(); else { setError(true); setInput(''); } };
            return (<div className="absolute inset-0 z-50 bg-black/95 backdrop-blur-sm flex flex-col items-center justify-center p-4 animate-fade-in"><div className="bg-[#1f2937] p-6 rounded-xl max-w-xs w-full text-center border border-white/10 shadow-2xl"><div className="mb-4 flex justify-center"><div className="p-3 bg-red-500/20 rounded-full text-red-500 border border-red-500/30"><Icon name="lock" size={28} /></div></div><h2 className="text-base font-bold text-white mb-2">Contenido Protegido</h2><form onSubmit={handleSubmit}><input type="password" maxLength="4" className="w-full bg-black/50 border border-white/20 rounded-lg px-4 py-2.5 text-center text-xl tracking-[0.4em] text-white focus:border-[#E50914] outline-none mb-3" value={input} onChange={(e) => { setInput(e.target.value); setError(false); }} placeholder="••••" autoFocus />{error && <p className="text-red-500 text-xs mb-3 font-bold">Código incorrecto</p>}<div className="flex gap-2"><button type="button" onClick={onCancel} className="flex-1 py-2 rounded-lg border border-white/10 text-gray-300 hover:bg-white/5 text-xs">Cancelar</button><button type="submit" className="flex-1 py-2 rounded-lg bg-[#E50914] text-white font-bold hover:bg-red-700 text-xs">Acceder</button></div></form></div></div>);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
