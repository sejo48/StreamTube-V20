                            const rawMovies = Array.isArray(dataMovies) ? dataMovies : (dataMovies.peliculas || dataMovies.content || []);
                            moviesList = rawMovies.map((m, idx) => ({ 
                                ...m, 
                                id: `mov-1-${idx}`, 
                                type: 'movies', 
                                title: m.titulo || m.title || m.name, 
                                description: m.descripcion || m.sinopsis || m.plot, 
                                image: m.imagen || m.poster || m.image, 
                                url: convertUrl(m.urlDrive || m.url || m.urlOkRu),
                                rawUrl: m.urlDrive || m.url || m.urlOkRu
                            }));
                        }
                        if (moviesList.length === 0) {
                            moviesList = [
                                { id: 'm-1', type: 'movies', title: 'STARSKY & HUTCH', description: 'Acción policial clásica.', image: 'https://placehold.co/300x450/0f172a/ffffff?text=Starsky+Hutch', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', rawUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
                                { id: 'm-2', type: 'movies', title: 'La Novicia Rebelde (1965)', description: 'Clásico musical galardonado.', image: 'https://placehold.co/300x450/14b8a6/ffffff?text=La+Novicia', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', rawUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ' }
                            ];
                        }

                        let movies2List = [];
                        if (dataMovies2) {
                            const rawMovies2 = Array.isArray(dataMovies2) ? dataMovies2 : (dataMovies2.peliculas || dataMovies2.content || []);
                            movies2List = rawMovies2.map((m, idx) => ({ 
                                ...m, 
                                id: `mov-2-${idx}`, 
                                type: 'movies2', 
                                title: m.titulo || m.title || m.name, 
                                description: m.descripcion || m.sinopsis || m.plot, 
                                image: m.imagen || m.poster || m.image, 
                                url: convertUrl(m.urlDrive || m.url || m.urlOkRu),
                                rawUrl: m.urlDrive || m.url || m.urlOkRu
                            }));
                        }

                        let seriesList = [];
                        if (dataSeries) {
                            const rawSeries = Array.isArray(dataSeries) ? dataSeries : (dataSeries.series || []);
                            seriesList = rawSeries.map((s, idx) => ({
                                ...s,
                                id: `serie-${idx}`,
                                type: 'series',
                                title: s.tituloSerie || s.titulo || s.title || s.name,
                                description: s.descripcion || s.sinopsis,
                                image: s.imagen || s.poster || s.image,
                                seasons: (s.temporadas || []).map((t, tIdx) => ({
                                    seasonNumber: t.numeroTemporada || (tIdx + 1),
                                    episodes: (t.episodios || []).map((ep, eIdx) => ({
                                        id: `ep-${idx}-${tIdx}-${eIdx}`,
                                        title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`,
                                        url: convertUrl(ep.urlDrive || ep.url),
                                        rawUrl: ep.urlDrive || ep.url
                                    }))
                                }))
                            }));
                        }
                        if (seriesList.length === 0) {
                            seriesList = [
                                {
                                    id: 's-1', type: 'series', title: 'La Isla de Gilligan', description: 'Comedia de situación clásica.', image: 'https://placehold.co/300x450/06b6d4/ffffff?text=Gilligans+Island',
                                    seasons: [{ seasonNumber: 1, episodes: [{ id: 'ep-1', title: 'Episodio 1: Naufragio', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', rawUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ' }] }]
                                }
                            ];
                        }

                        let animadosList = [];
                        if (dataAnimados) {
                            const rawAnimados = Array.isArray(dataAnimados) ? dataAnimados : (dataAnimados.animados || []);
                            animadosList = rawAnimados.map((a, idx) => ({
                                ...a,
                                id: `anim-${idx}`,
                                type: 'animados',
                                title: a.titulo || a.tituloSerie || a.title || a.name,
                                description: a.descripcion || a.sinopsis,
                                image: a.imagen || a.poster || a.image,
                                url: convertUrl(a.urlDrive || a.url),
                                rawUrl: a.urlDrive || a.url,
                                seasons: (a.temporadas || []).map((t, tIdx) => ({
                                    seasonNumber: t.numeroTemporada || (tIdx + 1),
                                    episodes: (t.episodios || []).map((ep, eIdx) => ({
                                        id: `ep-anim-${idx}-${tIdx}-${eIdx}`,
                                        title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`,
                                        url: convertUrl(ep.urlDrive || ep.url),
                                        rawUrl: ep.urlDrive || ep.url
                                    }))
                                }))
                            }));
                        }

                        if (dataRadios) {
                            const list = Array.isArray(dataRadios) ? dataRadios : (dataRadios.radios || dataRadios.emisoras || []);
                            if (list.length > 0) {
                                const mappedStations = list.map((r, idx) => ({
                                    ...r,
                                    id: r.id || `radio-fetched-${idx}-${(r.titulo || r.title || '').toLowerCase().replace(/[^a-z0-9]/g, '')}`,
                                    title: r.titulo || r.title || r.name || `Emisora ${idx + 1}`,
                                    group: r.group || r.genero || r.categoria || 'Variedad',
                                    image: r.imagen || r.image || r.logo || 'https://placehold.co/300x300/0f172a/ffffff?text=Radio',
                                    url: r.urlDrive || r.url || r.stream || r.urlStream || ''
                                }));
                                setRadioStations(mappedStations);
                            }
                        }

                        setContent({ tv: tvChannels, movies: moviesList, movies2: movies2List, series: seriesList, animados: animadosList });
                    } catch (err) {
                        console.error("Error cargando contenido", err);
                    } finally {
                        setLoading(false);
                    }
                };

                const storedFavs = safeStorage.getItem('boxplay_favs'); 
                if (storedFavs) { try { setFavorites(JSON.parse(storedFavs)); } catch(e) {} }

                const storedTvFavs = safeStorage.getItem('boxplay_tv_favs');
                if (storedTvFavs) { try { setTvFavorites(JSON.parse(storedTvFavs)); } catch(e) {} }

                const storedRadioFavs = safeStorage.getItem('boxplay_radio_favs');
                if (storedRadioFavs) { try { setRadioFavorites(JSON.parse(storedRadioFavs)); } catch(e) {} }

                const storedCW = safeStorage.getItem('boxplay_continue_watching');
                if (storedCW) { try { setContinueWatching(JSON.parse(storedCW)); } catch(e) {} }

                const storedWatched = safeStorage.getItem('boxplay_watched_eps');
                if (storedWatched) { try { setWatchedEpisodes(JSON.parse(storedWatched)); } catch(e) {} }

                const storedSearches = safeStorage.getItem('boxplay_recent_searches');
                if (storedSearches) { try { setRecentSearches(JSON.parse(storedSearches)); } catch(e) {} }

                init();
            }, []);

            useEffect(() => {
                let tvInterval;
                if (activeTab === 'tv' && selectedItem?.type === 'tv') {
                    tvInterval = setInterval(() => {
                        setTvRefreshTrigger(prev => prev + 1);
                    }, 480000);
                }
                return () => clearInterval(tvInterval);
            }, [activeTab, selectedItem]);

            useEffect(() => {
                if (activeTab === 'tv' && content.tv.length > 0) {
                    if (!selectedItem || selectedItem.type !== 'tv') {
                        const telerredChannel = content.tv.find(c => 
                            c.title.toLowerCase().includes('telerred') || 
                            c.title.toLowerCase().includes('tele red') ||
                            c.title.toLowerCase().includes('tele-red')
                        ) || content.tv[0];
                        
                        if (telerredChannel) {
                            setSelectedItem(telerredChannel);
                            setIsLocked(false);
                        }
                    }
                }
            }, [activeTab, content.tv]);

            useEffect(() => {
                if (!audioRef.current) {
                    const audio = new Audio();
                    audio.crossOrigin = "anonymous";
                    audio.preload = "none";
                    
                    audio.onerror = () => {
                        setIsRadioPlaying(false);
                        setStreamError(true);
                        setIsLoadingRadio(false);
                    };
                    
                    audio.onwaiting = () => setIsLoadingRadio(true);
                    audio.onplaying = () => {
                        setIsLoadingRadio(false);
                        setStreamError(false);
                    };
                    audio.oncanplay = () => {
                        setIsLoadingRadio(false);
                        setStreamError(false);
                    };
                    audioRef.current = audio;
                }

                const audio = audioRef.current;
                if (audio) {
                    audio.volume = radioVolume;
                }

                if (currentRadioStation && activeTab === 'radio') {
                    const playAudio = () => {
                        try {
                            const playPromise = audio.play();
                            if (playPromise !== undefined) {
                                playPromise.catch((e) => {
                                    setIsRadioPlaying(false);
                                    setStreamError(true);
                                    setIsLoadingRadio(false);
                                });
                            }
                        } catch (e) {}
                    };

                    const targetUrl = currentRadioStation.url || currentRadioStation.stream || '';

                    if (audio.dataset.currentUrl !== targetUrl) {
                        setIsLoadingRadio(true);
                        setStreamError(false);
                        audio.dataset.currentUrl = targetUrl;
                        
                        if (hlsRef.current) {
                            hlsRef.current.destroy();
                            hlsRef.current = null;
                        }

                        if (targetUrl.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
                            const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                            hlsRef.current = hls;
                            hls.loadSource(targetUrl);
                            hls.attachMedia(audio);
                            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                                if (isRadioPlaying) playAudio();
                            });
                            hls.on(Hls.Events.ERROR, function (event, data) {
                                if (data.fatal) {
                                    setIsRadioPlaying(false);
                                    setStreamError(true);
                                    setIsLoadingRadio(false);
                                }
                            });
                        } else {
                            audio.src = targetUrl; 
                            audio.load();
                            if (isRadioPlaying) playAudio();
                        }
                    } else {
                        if (isRadioPlaying) playAudio();
                        else audio.pause();
                    }
                } else if (audioRef.current && activeTab !== 'radio') {
                    audioRef.current.pause();
                }
            }, [currentRadioStation, isRadioPlaying, activeTab]);

            useEffect(() => {
                if (audioRef.current) audioRef.current.volume = radioVolume;
            }, [radioVolume]);

            const recordContinueWatching = (item, episode = null) => {
                if (item.type === 'tv' || item.type === 'radio') return;
                const record = { ...item, lastEpisode: episode ? episode.title : null, lastEpisodeUrl: episode ? episode.url : null, timestamp: Date.now() };
                const itemId = item.id || item.title;
                const updated = [record, ...continueWatching.filter(c => (c.id || c.title) !== itemId)].slice(0, 10);
                setContinueWatching(updated);
                safeStorage.setItem('boxplay_continue_watching', JSON.stringify(updated));
                if (episode) markEpisodeAsWatched(item, episode, true);
            };

            const markEpisodeAsWatched = (item, episode, isWatched) => {
                const itemId = item.id || item.title;
                const epId = episode.id || episode.url;
                const currentWatched = { ...watchedEpisodes };
                if (!currentWatched[itemId]) currentWatched[itemId] = [];
                if (isWatched) {
                    if (!currentWatched[itemId].includes(epId)) currentWatched[itemId].push(epId);
                } else {
                    currentWatched[itemId] = currentWatched[itemId].filter(id => id !== epId);
                }
                setWatchedEpisodes(currentWatched);
                safeStorage.setItem('boxplay_watched_eps', JSON.stringify(currentWatched));
            };

            const addRecentSearch = (term) => {
                if (!term || !term.trim()) return;
                const cleaned = term.trim();
                const updated = [cleaned, ...recentSearches.filter(s => s.toLowerCase() !== cleaned.toLowerCase())].slice(0, 8);
                setRecentSearches(updated);
                safeStorage.setItem('boxplay_recent_searches', JSON.stringify(updated));
            };

            const parseM3U = (data) => {
                const lines = data.split('\n'); const channels = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        let title = 'Canal';
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        if (url && url.startsWith('http')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/); const logo = logoMatch ? logoMatch[1] : '';
                            const groupMatch = line.match(/group-title="([^"]*)"/); const group = groupMatch ? groupMatch[1] : 'General';
                            const commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                            channels.push({ id: `tv-${i}`, title, image: logo, group, url, type: 'tv' });
                        }
                    }
                }
                return channels;
            };

            const tvGroups = useMemo(() => {
                const groups = new Set(content.tv.map(c => c.group || 'General'));
                return ['ALL', ...Array.from(groups)];
            }, [content.tv]);

            const toggleFavorite = (item) => { 
                if (item.type === 'tv') {
                    const itemId = item.id || item.title;
                    const newTvFavs = tvFavorites.some(f => (f.id || f.title) === itemId) ? tvFavorites.filter(f => (f.id || f.title) !== itemId) : [item, ...tvFavorites];
                    setTvFavorites(newTvFavs);
                    safeStorage.setItem('boxplay_tv_favs', JSON.stringify(newTvFavs));
                } else {
                    const itemId = item.id || item.title; 
                    const newFavs = favorites.some(f => (f.id || f.title) === itemId) ? favorites.filter(f => (f.id || f.title) !== itemId) : [item, ...favorites]; 
                    setFavorites(newFavs); 
                    safeStorage.setItem('boxplay_favs', JSON.stringify(newFavs)); 
                }
            };

            const isItemFavorite = (item) => {
                if (!item) return false;
                const itemId = item.id || item.title;
                if (item.type === 'tv') return tvFavorites.some(f => (f.id || f.title) === itemId);
                return favorites.some(f => (f.id || f.title) === itemId);
            };

            const toggleTvFullscreen = () => {
                if (tvContainerRef.current) {
                    if (!document.fullscreenElement) {
                        if (tvContainerRef.current.requestFullscreen) tvContainerRef.current.requestFullscreen().catch(() => {});
                        else if (tvContainerRef.current.webkitRequestFullscreen) tvContainerRef.current.webkitRequestFullscreen();
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    }
                }
            };

            const toggleMovieFullscreen = () => {
                if (movieContainerRef.current) {
                    if (!document.fullscreenElement) {
                        if (movieContainerRef.current.requestFullscreen) movieContainerRef.current.requestFullscreen().catch(() => {});
                        else if (movieContainerRef.current.webkitRequestFullscreen) movieContainerRef.current.webkitRequestFullscreen();
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    }
                }
            };

            const getDisplayContent = () => { 
                let list = activeTab === 'home' 
                    ? [...content.movies2, ...content.movies, ...content.series, ...content.animados, ...content.tv.slice(0,20)] 
                    : activeTab === 'favorites' 
                    ? favorites.filter(item => item.type !== 'tv' && item.type !== 'radio') 
                    : activeTab === 'topshows'
                    ? [...content.series, ...content.animados].slice(0, 15)
                    : content[activeTab] || []; 
                if (search && activeTab !== 'tv') return list.filter(i => (i.title || i.name || i.titulo || '').toLowerCase().includes(search.toLowerCase())); 
                return list; 
            };

            const displayedItems = getDisplayContent();
            
            const randomHeroItem = useMemo(() => {
                const pool = [...content.movies2, ...content.movies, ...content.series, ...content.animados];
                if (pool.length === 0) return null;
                const randomIndex = Math.floor(Math.random() * pool.length);
                return pool[randomIndex];
            }, [content]);

            const currentHeroItem = randomHeroItem || (content.movies.length ? content.movies[0] : null);

            const handlePlay = (item) => { 
                const code = item.codigo || item.password || item.pin; 
                if (code) { setSelectedItem(item); setIsLocked(true); } 
                else { setSelectedItem(item); setIsLocked(false); } 
                setExpandedSeason(0); 
                if (item.type === 'series' || item.type === 'animados') {
                    const firstEp = item.seasons?.[0]?.episodes?.[0] || null;
                    setSelectedEpisode(firstEp); 
                    recordContinueWatching(item, firstEp);
                } else if (item.type === 'movies' || item.type === 'movies2') {
                    setSelectedEpisode(null);
                    recordContinueWatching(item, null);
                } else {
                    setSelectedEpisode(null);
                }
                if (search.trim()) addRecentSearch(search);
                window.history.pushState({ appState: 'player', item: item.title }, '');
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            };

            const handlePlayRadioStation = (station) => {
                setCurrentRadioStation(station);
                setIsRadioPlaying(true);
                setStreamError(false);
            };

            const handleTabClick = (tab) => {
                if (tab.isExternal) {
                    window.open(tab.url, '_blank');
                } else {
                    setActiveTab(tab.id); 
                    setSearch(''); 
                    setIsLocked(false);
                    setShowMobileMoreMenu(false);
                    window.history.pushState({ appState: 'main', activeTab: tab.id }, '');
                    if (tab.id === 'tv') {
                        if (!selectedItem || selectedItem.type !== 'tv') {
                            const telerredChannel = content.tv.find(c => 
                                c.title.toLowerCase().includes('telerred') || 
                                c.title.toLowerCase().includes('tele red') ||
                                c.title.toLowerCase().includes('tele-red')
                            ) || content.tv[0];
                            if (telerredChannel) setSelectedItem(telerredChannel);
                        }
                    } else {
                        setSelectedItem(null); 
                    }
                }
            };

            if (showIntro) return <IntroScreen onEnter={() => { setShowIntro(false); window.history.pushState({ appState: 'main', activeTab: 'home' }, ''); }}/>;

            return (
                <div className="min-h-screen bg-[#020617] text-[#f8fafc] font-sans flex flex-col relative selection:bg-cyan-500 selection:text-white w-full max-w-[100vw] overflow-x-hidden">
                    {/* Header */}
                    <header className="sticky top-0 z-50 glass-header px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-2xl w-full">
                        <div className="flex items-center gap-4 lg:gap-8">
                            <div className="flex items-center gap-2.5 cursor-pointer group" onClick={() => handleTabClick(navTabs[0])}>
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)] group-hover:scale-105 transition-transform flex-shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className="w-5 h-5 fill-white">
                                        <polygon points="40,30 70,50 40,70"/>
                                    </svg>
                                </div>
                                <span className="font-black text-base sm:text-lg tracking-tight">BOXPLAY<span className="text-cyan-400">TV</span></span>
                            </div>

                            <nav className="hidden lg:flex items-center gap-1.5">
                                {navTabs.slice(0, 8).map(tab => (
                                    <button 
                                        key={tab.id} 
                                        onClick={() => handleTabClick(tab)} 
                                        className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${activeTab === tab.id && !tab.isExternal ? 'bg-cyan-500/15 text-cyan-400 border border-cyan-500/40 shadow-[0_0_15px_rgba(6,182,212,0.2)]' : 'text-slate-400 hover:text-white hover:bg-white/5 border border-transparent'}`}
                                    >
                                        <Icon name={tab.icon} size={14}/>
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        <div className="flex items-center gap-2 sm:gap-3">
                            <button onClick={() => { setShowSmartViewModal(true); window.history.pushState({ appState: 'smartview-modal' }, ''); }} className="p-2 sm:px-3 sm:py-2 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 border border-cyan-500/30 transition-all text-xs font-bold flex items-center gap-1.5 shadow-md" title="Ver en Smart TV">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-cyan-400"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                                <span className="hidden lg:inline">Smart TV</span>
                            </button>

                            <button onClick={() => handleTabClick(navTabs.find(t => t.id === 'favorites'))} className="p-2 sm:px-3 sm:py-2 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 border border-cyan-500/30 transition-all text-xs font-bold flex items-center gap-1.5 shadow-md">
                                <Icon name="heart" size={16} fill={activeTab === 'favorites' ? '#06b6d4' : 'none'} className="text-cyan-400"/>
                                <span className="hidden md:inline">Favs</span>
                            </button>

                            <button onClick={handleInstallApp} className="p-2 sm:px-3 sm:py-2 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 border border-cyan-500/30 transition-all text-xs font-bold flex items-center gap-1.5 shadow-md">
                                <Icon name="download" size={14}/>
                                <span className="hidden md:inline">Instalar App</span>
                            </button>

                            <div className="relative hidden sm:block w-36 lg:w-48">
                                <input 
                                    type="text" 
                                    placeholder="Buscar contenido..." 
                                    className="w-full bg-[#090d1f] border border-slate-800 rounded-full px-4 py-2 text-xs text-white focus:border-cyan-500 outline-none pl-9 transition-colors placeholder-slate-500 shadow-inner" 
                                    value={search} 
                                    onChange={(e) => setSearch(e.target.value)}
                                    onFocus={() => setIsSearchFocused(true)}
                                    onBlur={() => setTimeout(() => setIsSearchFocused(false), 250)}
                                    onKeyDown={(e) => { if (e.key === 'Enter' && search.trim()) { addRecentSearch(search); setIsSearchFocused(false); } }}
                                />
                                <Icon className="absolute left-3 top-2.5 text-slate-400" name="search" size={14}/>
                                {search && <button onClick={() => setSearch('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-white"><Icon name="x" size={14}/></button>}

                                {isSearchFocused && recentSearches.length > 0 && !search && (
                                    <div className="absolute top-full left-0 right-0 mt-2 glass-panel rounded-2xl p-2 shadow-2xl z-50 animate-fade-in">
                                        <div className="flex items-center justify-between px-2.5 py-1 text-[10px] text-cyan-400 font-bold uppercase tracking-wider border-b border-slate-800 mb-1">
                                            <span>Búsquedas Recientes</span>
                                            <button onClick={(e) => { e.stopPropagation(); setRecentSearches([]); safeStorage.setItem('boxplay_recent_searches', JSON.stringify([])); }} className="hover:text-white">Borrar</button>
                                        </div>
                                        <div className="flex flex-col gap-1 max-h-48 overflow-y-auto custom-scrollbar">
                                            {recentSearches.map((term, sIdx) => (
                                                <div 
                                                    key={sIdx} 
                                                    onMouseDown={() => { setSearch(term); addRecentSearch(term); setIsSearchFocused(false); }}
                                                    className="px-3 py-2 rounded-xl text-xs text-slate-300 hover:bg-cyan-500/20 hover:text-white cursor-pointer transition-colors flex items-center justify-between"
                                                >
                                                    <div className="flex items-center gap-2 truncate">
                                                        <Icon name="search" size={12} className="text-slate-500"/>
                                                        <span className="truncate">{term}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                <div tabIndex="0" className="group relative flex flex-col gap-2 cursor-pointer active:scale-95 transition-transform card-glow rounded-2xl w-full" onClick={() => onClick(item)}> 
                    <div className={`relative overflow-hidden bg-[#0f172a] border border-slate-800 shadow-xl ${isTv ? 'aspect-video rounded-full p-2' : 'aspect-[2/3] rounded-2xl'}`}> 
                        <img src={imgSource} loading="lazy" className={`w-full h-full transition-transform duration-500 group-hover:scale-110 ${isTv ? 'object-cover rounded-full' : 'object-cover'}`} onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/300x450/0f172a/ffffff?text=Boxplaytv`; }} alt={titleSource} /> 
                        <div className={`absolute inset-0 bg-gradient-to-t from-black/80 via-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 ${isTv ? 'rounded-full' : ''}`}></div>
                        <button onClick={(e) => { e.stopPropagation(); onToggleFavorite(item); }} className="absolute top-2 right-2 p-2 bg-black/70 rounded-full text-white backdrop-blur-md hover:bg-black transition-colors z-20"> 
                            <Icon name="heart" size={14} fill={isFavorite ? "#06b6d4" : "none"} className={isFavorite ? "text-cyan-500" : "text-white"}/> 
                        </button> 
                        <div className="absolute bottom-2 left-2 flex gap-1 flex-wrap z-10"> 
                            {isTv && <span className="bg-cyan-600 text-white text-[8px] font-black px-1.5 py-0.5 rounded shadow">LIVE</span>} 
                            {isKids && <span className="bg-teal-600 text-white text-[8px] font-black px-1.5 py-0.5 rounded shadow">KIDS</span>} 
                            {hasLock && <span className="bg-amber-500 text-black text-[8px] font-black px-1.5 py-0.5 rounded shadow flex items-center gap-0.5"><Icon name="lock" size={7}/> PIN</span>} 
                        </div> 
                    </div> 
                    <h3 className="text-[11px] sm:text-xs font-bold text-slate-200 truncate px-0.5 group-hover:text-cyan-400 transition-colors text-center">{titleSource}</h3> 
                </div> 
            ); 
        };

        const Icon = ({ name, size = 20, className, fill = "none" }) => {
            const icons = {
                search: <path d="M21 21l-4.35-4.35m0 0a7.5 7.5 0 111.414-1.414 7.5 7.5 0 01-1.414 1.414z" />,
                x: <path d="M6 18L18 6M6 6l12 12" />,
                tv: <path d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125z" />,
                film: <path d="M19.82 2H4.18C2.97 2 2 2.97 2 4.18v15.64C2 21.03 2.97 22 4.18 22h15.64c1.21 0 2.18-.97 2.18-2.18V4.18C22 2.97 21.03 2 19.82 2zM7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5" />,
                play: <path d="M5 3l14 9-14 9V3z" />,
                pause: <path d="M6 4h4v16H6zM14 4h4v16h-4z" />,
                heart: <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78 z" />,
                arrowLeft: <path d="M19 12H5m7 7l-7-7 7-7" />,
                clapperboard: <g><path d="M20.2 6 3 11l-.9-2.4c-.5-1.1.2-2.3 1.3-2.8l3.2-1.4c1.1-.5 2.3.2 2.8 1.3l.9 2.4l7.9-3l2 4.5Z"/><path d="M4 11v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9"/></g>,
                lock: <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a7 7 0 00-14 0v2" />,
                smile: <g><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></g>,
                music: <g><path d="M9 18V5l12-2v13"></path><path d="M9 9l12-2"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></g>,
                radio: <path d="M2 12a10 10 0 0110-10 10 10 0 0110 10M6 12a6 6 0 016-6 6 6 0 016 6M10 12a2 2 0 012-2 2 2 0 012 2v8a2 2 0 01-2 2 2 2 0 01-2-2v-8z" />,
                volume: <path d="M11 5L6 9H2v6h4l5 4V5z M15.54 8.46a5 5 0 010 7.07 M19.07 4.93a10 10 0 010 14.14" />,
                qr: <g><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="3" height="3"></rect><rect x="18" y="18" width="3" height="3"></rect><rect x="14" y="18" width="3" height="3"></rect><rect x="18" y="14" width="3" height="3"></rect></g>,
                chat: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>,
                star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>,
                download: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></g>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.search}
                </svg>
            );
        };

        const LockScreen = ({ onUnlock, correctCode, onCancel }) => {
            const [input, setInput] = useState(''); const [error, setError] = useState(false);
            const handleSubmit = (e) => { e.preventDefault(); if (input === String(correctCode)) onUnlock(); else { setError(true); setInput(''); } };
            return (<div className="absolute inset-0 z-50 bg-black/95 backdrop-blur-sm flex flex-col items-center justify-center p-4 animate-fade-in"><div className="glass-panel p-6 rounded-3xl max-w-xs w-full text-center shadow-2xl border border-cyan-500/30 animate-scale-in"><div className="mb-4 flex justify-center"><div className="p-3.5 bg-cyan-500/15 rounded-2xl text-cyan-400 border border-cyan-500/30"><Icon name="lock" size={24}/></div></div><h2 className="text-sm font-extrabold text-white mb-1">Contenido Protegido</h2><p className="text-[11px] text-slate-400 mb-4">Introduce el código PIN de acceso</p><form onSubmit={handleSubmit}><input type="password" maxLength="4" className="w-full bg-black/60 border border-slate-800 rounded-xl px-4 py-3 text-center text-xl tracking-[0.4em] text-white focus:border-cyan-500 outline-none mb-3 shadow-inner" value={input} onChange={(e) => { setInput(e.target.value); setError(false); }} placeholder="••••" autoFocus />{error && <p className="text-rose-400 text-xs mb-3 font-bold">Código incorrecto</p>}<div className="flex gap-2.5"><button type="button" onClick={onCancel} className="flex-1 py-2.5 rounded-xl border border-slate-800 text-slate-300 hover:bg-white/5 text-xs font-semibold">Cancelar</button><button type="submit" className="flex-1 py-2.5 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-500 text-white font-bold hover:brightness-110 text-xs shadow-[0_0_15px_rgba(6,182,212,0.5)]">Acceder</button></div></form></div></div>);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
