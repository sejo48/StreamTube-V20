<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAaa4Rs4vk2xq0PzXnb9tdLnt1oqqj4qa4",
    authDomain: "boxplaytv-b32d8.firebaseapp.com",
    projectId: "boxplaytv-b32d8",
    storageBucket: "boxplaytv-b32d8.firebasestorage.app",
    messagingSenderId: "165114643998",
    appId: "1:165114643998:web:d12cb70574ac11f29a100f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.verificarSuscripcion = async function(emailUsuario) {
    try {
      const docRef = doc(db, "suscripciones", emailUsuario);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        const hoy = new Date();
        const expiracion = new Date(data.expires_at);
        if (data.status === "active" && hoy <= expiracion) return true; 
      }
      return false; 
    } catch (error) {
      console.error("Error al verificar la suscripción:", error);
      return false;
    }
  };

  window.aprobarPagoSinpe = async function(emailUsuario) {
    try {
      const fechaExpiracion = new Date();
      fechaExpiracion.setDate(fechaExpiracion.getDate() + 30);
      const docRef = doc(db, "suscripciones", emailUsuario);
      await updateDoc(docRef, {
        status: "active",
        expires_at: fechaExpiracion.toISOString()
      });
      alert(`¡Suscripción de 30 días aprobada para ${emailUsuario}!`);
    } catch (error) {
      console.error("Error al aprobar el pago:", error);
    }
  };
</script>

        function SinpePaywall({ emailUsuario, onEmailChange, onVerificado, onClose }) {
            const [inputEmail, setInputEmail] = useState(emailUsuario || '');
            const [verificando, setVerificando] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleValidarPago = async (e) => {
                e.preventDefault();
                if (!inputEmail.trim()) {
                    setErrorMsg('Por favor ingresa tu correo electrónico.');
                    return;
                }
                setVerificando(true);
                setErrorMsg('');
                try {
                    const ok = await window.verificarSuscripcion(inputEmail.trim());
                    if (ok) {
                        onEmailChange(inputEmail.trim());
                        onVerificado();
                    } else {
                        setErrorMsg('Suscripción pendiente o vencida. Realiza tu pago de ₡3,000 por SINPE Móvil para continuar.');
                    }
                } catch (err) {
                    setErrorMsg('Error al conectar con la base de datos.');
                } finally {
                    setVerificando(false);
                }
            };

            return (
                <div style={{ position: 'fixed', inset: '0', zIndex: '120', background: 'rgba(2, 6, 23, 0.9)', backdropFilter: 'blur(10px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
                    <div style={{ padding: '30px', maxWidth: '480px', width: '100%', background: '#0f172a', color: 'white', borderRadius: '24px', textAlign: 'center', border: '1px solid #06b6d4', fontFamily: 'sans-serif', boxShadow: '0 0 50px rgba(6,182,212,0.3)', position: 'relative' }}>
                        <button onClick={onClose} style={{ position: 'absolute', top: '16px', right: '16px', background: 'transparent', border: 'none', color: '#94a3b8', fontSize: '1.2rem', cursor: 'pointer' }}>✕</button>
                        <div style={{ fontSize: '2.5rem', marginBottom: '8px' }}>🎬</div>
                        <h2 style={{ color: '#06b6d4', marginBottom: '8px', fontSize: '1.4rem', fontWeight: '800' }}>¡Suscríbete o Renueva tu Suscripción!</h2>
                        <p style={{ color: '#94a3b8', marginBottom: '16px', fontSize: '0.85rem', lineHeight: '1.4' }}>Para ver películas y series completas, realiza tu pago mensual de <strong>₡3,000 colones</strong> mediante <strong>SINPE Móvil</strong>.</p>
                        
                        <div style={{ background: '#020617', padding: '12px 16px', borderRadius: '12px', textAlign: 'left', marginBottom: '16px', border: '1px solid #1e293b' }}>
                            <p style={{ margin: '6px 0', fontSize: '0.85rem' }}>📱 <strong>Teléfono SINPE:</strong> 506-6013-2444</p>
                            <p style={{ margin: '6px 0', fontSize: '0.85rem' }}>👤 <strong>Titular:</strong> Jorge Hernández</p>
                            <p style={{ margin: '6px 0', fontSize: '0.85rem' }}>💳 <strong>Monto Mensual:</strong> ₡3,000 colones</p>
                        </div>

                        <form onSubmit={handleValidarPago} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                            <input 
                                type="email" 
                                placeholder="Ingresa tu correo electrónico" 
                                value={inputEmail} 
                                onChange={(e) => setInputEmail(e.target.value)} 
                                style={{ padding: '12px 16px', background: '#020617', border: '1px solid #334155', borderRadius: '10px', color: 'white', outline: 'none', fontSize: '0.9rem' }}
                                autoFocus
                            />
                            {errorMsg && <p style={{ color: '#f43f5e', fontSize: '0.75rem', margin: '0', textAlign: 'left' }}>{errorMsg}</p>}
                            <button 
                                type="submit" 
                                disabled={verificando}
                                style={{ padding: '12px', background: 'linear-gradient(to right, #06b6d4, #14b8a6)', color: '#020617', border: 'none', borderRadius: '10px', fontWeight: 'bold', cursor: 'pointer', fontSize: '0.9rem', marginTop: '4px' }}
                            >
                                {verificando ? 'Verificando pago...' : 'Ya pagué / Verificar acceso'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Reproductor central BOXPLAYTV
        function BoxProPlayer({ item, episode, onBack, onFullscreen, containerRef }) {
            const videoRef = React.useRef(null);
            const hlsRef = React.useRef(null);
            const [message, setMessage] = React.useState('');
            const [castReady, setCastReady] = React.useState(false);
            const [speed, setSpeed] = React.useState('1');
            const [muted, setMuted] = React.useState(false);
            const targetUrl = (item?.type === 'series' || item?.type === 'animados') && episode
                ? (episode.url || episode.urlDrive || episode.rawUrl || '')
                : (item?.url || item?.urlDrive || item?.rawUrl || '');
            const url = String(targetUrl || '').trim();
            const isOk = /(^|\.)ok\.ru\//i.test(url) || /odnoklassniki/i.test(url);
            const isDrive = /drive\.google\.com/i.test(url);
            const isHls = /\.m3u8(?:$|[?#])/i.test(url);
            const isDirect = /\.(mp4|webm|ogg|m4v|mov)(?:$|[?#])/i.test(url) || isHls;
            const driveEmbed = convertUrl(url);
            const okEmbed = convertUrl(url);
            const title = item?.title || item?.titulo || item?.name || 'Reproduciendo';

            React.useEffect(() => {
                const v = videoRef.current;
                if (!v || !isDirect) return;
                let hls;
                setMessage('');
                if (isHls && window.Hls && window.Hls.isSupported()) {
                    hls = new window.Hls({ enableWorker: true, lowLatencyMode: false });
                    hlsRef.current = hls;
                    hls.loadSource(url);
                    hls.attachMedia(v);
                    hls.on(window.Hls.Events.ERROR, (_, data) => {
                        if (data?.fatal) setMessage('No se pudo reproducir esta transmisión.');
                    });
                } else {
                    v.src = url;
                    if (isHls && v.canPlayType('application/vnd.apple.mpegurl')) v.src = url;
                }
                const onError = () => setMessage('No se pudo reproducir el archivo.');
                v.addEventListener('error', onError);
                return () => {
                    v.removeEventListener('error', onError);
                    if (hls) hls.destroy();
                    hlsRef.current = null;
                    v.pause();
                    v.removeAttribute('src');
                    v.load();
                };
            }, [url, isDirect, isHls]);

            return <div className="absolute inset-0 bg-black text-white flex flex-col" ref={containerRef}>
                <div className="absolute top-0 left-0 right-0 z-20 px-3 sm:px-5 py-3 flex items-center justify-between bg-gradient-to-b from-black/90 to-transparent">
                    <button onClick={onBack} className="px-3 py-2 rounded-full bg-black/60 border border-white/20 hover:bg-cyan-700 text-xs font-bold"><i className="fa-solid fa-arrow-left mr-2"></i>Volver</button>
                    <div className="text-xs sm:text-sm font-bold text-center px-2 truncate max-w-[40%]">{title}</div>
                    <button onClick={onFullscreen} className="w-9 h-9 rounded-full bg-black/60 border border-white/20 hover:bg-cyan-700"><i className="fa-solid fa-expand"></i></button>
                </div>
                {isOk ? <iframe key={url} src={okEmbed} title={title} className="absolute inset-0 w-full h-full border-0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowFullScreen referrerPolicy="no-referrer-when-downgrade" />
                : isDrive ? <iframe key={url} src={driveEmbed} title={title} className="absolute inset-0 w-full h-full border-0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowFullScreen />
                : isDirect ? <div className="absolute inset-0 flex flex-col items-center justify-center pt-12 pb-4 px-2">
                    <video ref={videoRef} controls autoPlay playsInline preload="metadata" className="w-full h-full object-contain" />
                </div> : <div className="flex flex-col items-center justify-center text-center p-8 gap-4"><h3 className="font-bold">No se reconoce el enlace de vídeo</h3><a href={url} target="_blank" rel="noreferrer" className="px-4 py-2 bg-cyan-600 rounded-lg text-sm font-bold">Abrir enlace</a></div>}
                {message && <div className="absolute z-30 bottom-14 left-3 right-3 bg-slate-900 border border-cyan-400/40 rounded-xl p-3 text-xs text-center">{message}</div>}
            </div>;
        }

        const fetchSmart = async (localUrl, rawUrl, isJson = true) => {
            const cacheBust = `?t=${Date.now()}`;
            try {
                const res = await fetch(localUrl + cacheBust);
                if (res.ok) {
                    const text = await res.text();
                    if (!text.trim().startsWith('<!DOCTYPE html') && !text.trim().startsWith('<html')) {
                        return isJson ? JSON.parse(text) : text;
                    }
                }
            } catch (e) {}
            try {
                const resRaw = await fetch(rawUrl + cacheBust);
                if (resRaw.ok) return isJson ? await resRaw.json() : await resRaw.text();
            } catch (e) {}
            return null;
        };

        const App = () => {
            const [showIntro, setShowIntro] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            const [content, setContent] = useState({ tv: [], series: [], movies: [], movies2: [], animados: [], tudum: [] });
            const [radioStations, setRadioStations] = useState(DEFAULT_RADIO_STATIONS);
            const [search, setSearch] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedEpisode, setSelectedEpisode] = useState(null);
            const [isLocked, setIsLocked] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [detailTab, setDetailTab] = useState('info');
            const [favorites, setFavorites] = useState([]);
            const [tvFavorites, setTvFavorites] = useState([]);
            const [radioFavorites, setRadioFavorites] = useState([]);
            const [continueWatching, setContinueWatching] = useState([]);
            const [loading, setLoading] = useState(true);
            const [expandedSeason, setExpandedSeason] = useState(0);
            const [showQrModal, setShowQrModal] = useState(false);
            const [showSmartViewModal, setShowSmartViewModal] = useState(false);
            const [showMobileMoreMenu, setShowMobileMoreMenu] = useState(false);

            const [emailUsuario, setEmailUsuario] = useState(safeStorage.getItem('boxplay_user_email') || 'sejo48@gmail.com');
            const [isSubscriberActive, setIsSubscriberActive] = useState(false);
            const [showPaywallModal, setShowPaywallModal] = useState(false);

            const [currentRadioStation, setCurrentRadioStation] = useState(null);
            const [isRadioPlaying, setIsRadioPlaying] = useState(false);
            const [radioVolume, setRadioVolume] = useState(0.8);
            const [streamError, setStreamError] = useState(false);
            const [isLoadingRadio, setIsLoadingRadio] = useState(false);
            const [radioFilter, setRadioFilter] = useState('');
            const [clockTime, setClockTime] = useState('12:34');
            const audioRef = useRef(null);

            const navTabs = [
                { id: 'home', icon: 'search', label: 'Inicio' }, 
                { id: 'movies', icon: 'clapperboard', label: 'Películas' }, 
                { id: 'movies2', icon: 'star', label: 'Estrenos 2026' },
                { id: 'series', icon: 'film', label: 'Series' },
                { id: 'animados', icon: 'smile', label: 'Animados' },
                { id: 'topshows', icon: 'star', label: 'Top Shows' },
                { id: 'tv', icon: 'tv', label: 'TV' }, 
                { id: 'radio', icon: 'radio', label: 'Radio HD' }, 
                { id: 'community', icon: 'chat', label: 'Comunidad' },
                { id: 'spotify', icon: 'music', label: 'Música', isExternal: true, url: './spotify.html' },
                { id: 'favorites', icon: 'heart', label: 'Favs' }
            ];

            useEffect(() => {
                async function checkSub() {
                    if (window.verificarSuscripcion && emailUsuario) {
                        const active = await window.verificarSuscripcion(emailUsuario);
                        setIsSubscriberActive(active);
                    }
                }
                checkSub();
            }, [emailUsuario]);

            useEffect(() => {
                const init = async () => {
                    try {
                        setLoading(true);
                        const [dataTV, dataSeries, dataAnimados, dataRadios, dataMovies, dataMovies2, dataTudum] = await Promise.all([ 
                            fetchSmart(URLS.TV, RAW_URLS.TV, false),
                            fetchSmart(URLS.SERIES, RAW_URLS.SERIES, true),
                            fetchSmart(URLS.ANIMADOS, RAW_URLS.ANIMADOS, true),
                            fetchSmart(URLS.RADIOS, RAW_URLS.RADIOS, true),
                            fetchSmart(URLS.MOVIES, RAW_URLS.MOVIES, true),
                            fetchSmart(URLS.MOVIES2, RAW_URLS.MOVIES2, true),
                            fetchSmart(URLS.TUDUM, RAW_URLS.TUDUM, true)
                        ]);

                        let tvChannels = dataTV ? parseM3U(dataTV) : [];
                        let moviesList = dataMovies ? (Array.isArray(dataMovies) ? dataMovies : (dataMovies.peliculas || [])) : [];
                        let movies2List = dataMovies2 ? (Array.isArray(dataMovies2) ? dataMovies2 : (dataMovies2.peliculas || [])) : [];
                        let seriesList = dataSeries ? (Array.isArray(dataSeries) ? dataSeries : (dataSeries.series || [])) : [];
                        let animadosList = dataAnimados ? (Array.isArray(dataAnimados) ? dataAnimados : (dataAnimados.animados || [])) : [];

                        setContent({ 
                            tv: tvChannels, 
                            movies: moviesList.map((m, idx) => ({ ...m, id: `mov-1-${idx}`, type: 'movies', title: m.titulo || m.title || 'Película' })), 
                            movies2: movies2List.map((m, idx) => ({ ...m, id: `mov-2-${idx}`, type: 'movies2', title: m.titulo || m.title || 'Estreno' })), 
                            series: seriesList.map((s, idx) => ({ ...s, id: `serie-${idx}`, type: 'series', title: s.tituloSerie || s.titulo || 'Serie' })), 
                            animados: animadosList.map((a, idx) => ({ ...a, id: `anim-${idx}`, type: 'animados', title: a.titulo || 'Animado' })),
                            tudum: dataTudum ? (Array.isArray(dataTudum) ? dataTudum : []) : []
                        });
                    } catch (err) {
                        console.error(err);
                    } finally {
                        setLoading(false);
                    }
                };
                init();
            }, []);

            const parseM3U = (data) => {
                const lines = data.split('\n'); const channels = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        let title = 'Canal';
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        if (url && url.startsWith('http')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/); const logo = logoMatch ? logoMatch[1] : '';
                            const groupMatch = line.match(/group-title="([^"]*)"/); const group = groupMatch ? groupMatch[1] : 'General';
                            const commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                            channels.push({ id: `tv-${i}`, title, image: logo || generatePlaceholder(title, 'tv'), group, url, type: 'tv' });
                        }
                    }
                }
                return channels;
            };

            const toggleFavorite = (item) => {
                const itemId = item.id || item.title;
                if (item.type === 'tv') {
                    setTvFavorites(prev => prev.some(f => (f.id || f.title) === itemId) ? prev.filter(f => (f.id || f.title) !== itemId) : [item, ...prev]);
                } else if (item.type === 'radio') {
                    setRadioFavorites(prev => prev.some(f => (f.id || f.title) === itemId) ? prev.filter(f => (f.id || f.title) !== itemId) : [item, ...prev]);
                } else {
                    setFavorites(prev => prev.some(f => (f.id || f.title) === itemId) ? prev.filter(f => (f.id || f.title) !== itemId) : [item, ...prev]);
                }
            };

            const isItemFavorite = (item) => {
                if (!item) return false;
                const itemId = item.id || item.title;
                if (item.type === 'tv') return tvFavorites.some(f => (f.id || f.title) === itemId);
                if (item.type === 'radio') return radioFavorites.some(f => (f.id || f.title) === itemId);
                return favorites.some(f => (f.id || f.title) === itemId);
            };

            const handlePlayNow = (item, episode = null) => {
                if (item.type !== 'tv' && item.type !== 'radio' && !isSubscriberActive) {
                    setShowPaywallModal(true);
                    return;
                }
                setSelectedItem(item);
                setIsPlaying(true);
                setSelectedEpisode(episode);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handlePlay = (item) => {
                if (item.type === 'tv' || item.type === 'radio') {
                    setSelectedItem(item);
                    setIsPlaying(true);
                    return;
                }
                setSelectedItem(item);
                setIsPlaying(false);
                setDetailTab('info');
                setExpandedSeason(0);
                setSelectedEpisode(item.seasons?.[0]?.episodes?.[0] || null);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleTabClick = (tab) => {
                if (tab.isExternal) { window.open(tab.url, '_blank'); }
                else {
                    setActiveTab(tab.id); setSearch(''); setSelectedItem(null); setIsPlaying(false); setShowMobileMoreMenu(false);
                }
            };

            if (showIntro) return <IntroScreen onEnter={() => setShowIntro(false)}/>;

            return (
                <div className="min-h-screen bg-[#020617] text-[#f8fafc] font-sans flex flex-col relative w-full max-w-[100vw] overflow-x-hidden">
                    <header className="fixed top-0 left-0 right-0 z-50 glass-header px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-2xl w-full">
                        <div className="flex items-center gap-4 lg:gap-8">
                            <div className="flex items-center gap-2.5 cursor-pointer group" onClick={() => handleTabClick(navTabs[0])}>
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className="w-5 h-5 fill-white"><polygon points="40,30 70,50 40,70"/></svg>
                                </div>
                                <span className="font-black text-base sm:text-lg tracking-tight">BOXPLAY<span className="text-cyan-400">TV</span></span>
                            </div>
                            <nav className="hidden lg:flex items-center gap-1.5">
                                {navTabs.slice(0, 9).map(tab => (
                                    <button key={tab.id} onClick={() => handleTabClick(tab)} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${activeTab === tab.id ? 'bg-cyan-500/15 text-cyan-400 border border-cyan-500/40' : 'text-slate-400 hover:text-white'}`}>
                                        <span className="truncate">{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main className="flex-1 min-h-screen pt-20 pb-32 md:pb-16 relative z-10 w-full max-w-[100vw]">
                        {selectedItem && isPlaying ? (
                            <div className="w-full h-screen relative bg-black">
                                <BoxProPlayer item={selectedItem} episode={selectedEpisode} onBack={() => setIsPlaying(false)} onFullscreen={() => {}} containerRef={useRef()} />
                            </div>
                        ) : selectedItem ? (
                            <div className="p-6 max-w-4xl mx-auto space-y-6">
                                <button onClick={() => setSelectedItem(null)} className="px-4 py-2 bg-slate-800 rounded-lg text-xs font-bold">← Volver</button>
                                <h1 className="text-3xl font-black">{selectedItem.titulo || selectedItem.title}</h1>
                                <p className="text-slate-300 text-sm">{selectedItem.descripcion || selectedItem.sinopsis || 'Sin descripción.'}</p>
                                <button onClick={() => handlePlayNow(selectedItem, selectedEpisode)} className="px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-black rounded-xl text-sm shadow-lg">▶ Ver ahora</button>
                            </div>
                        ) : (
                            <div className="p-4 sm:p-8 max-w-7xl mx-auto space-y-6">
                                <h2 className="text-xl font-black uppercase text-white">Catálogo Principal (Exploración Libre)</h2>
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                                    {[...content.movies2, ...content.movies, ...content.series, ...content.animados].map((item, i) => (
                                        <div key={i} onClick={() => handlePlay(item)} className="group cursor-pointer bg-[#0f172a] rounded-2xl overflow-hidden border border-slate-800 hover:border-cyan-500 transition-all">
                                            <div className="aspect-[2/3] bg-black relative">
                                                <RobustImage src={extractImageUrl(item)} alt={item.titulo || item.title} title={item.titulo || item.title} className="w-full h-full object-cover" />
                                            </div>
                                            <p className="text-xs font-bold p-2 truncate text-white">{item.titulo || item.title}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {showPaywallModal && (
                            <SinpePaywall 
                                emailUsuario={emailUsuario} 
                                onEmailChange={(email) => { setEmailUsuario(email); safeStorage.setItem('boxplay_user_email', email); }} 
                                onVerificado={() => {
                                    setIsSubscriberActive(true);
                                    setShowPaywallModal(false);
                                }} 
                                onClose={() => setShowPaywallModal(false)}
                            />
                        )}
                    </main>
                </div>
            );
        };

        const IntroScreen = ({ onEnter }) => (
            <div className="fixed inset-0 z-[100] bg-[#020617] flex items-center justify-center p-4">
                <div className="glass-panel p-8 rounded-3xl text-center max-w-sm w-full border border-cyan-500/30 space-y-6">
                    <h1 className="text-3xl font-black text-white">BOXPLAY<span className="text-cyan-400">TV</span></h1>
                    <button onClick={onEnter} className="w-full py-4 rounded-full bg-cyan-600 hover:bg-cyan-500 text-white font-extrabold text-sm shadow-[0_0_20px_rgba(6,182,212,0.5)]">Comenzar Experiencia</button>
                </div>
            </div>
        );

        const rootNode = document.getElementById('root');
        if (rootNode) {
            ReactDOM.createRoot(rootNode).render(<App />);
        }
    </script>
</body>
</html>
