<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic TV 2.0 - Ultimate Streaming & Anime Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <script>
        if (typeof Babel !== 'undefined') {
            Babel.registerPreset('react-classic', {
                presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
            });
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">

    <style>
        body { 
            background-color: #030712; 
            color: #f3f4f6; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent; 
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6366f1; }
        
        @keyframes fadeIn { from { opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        .animate-slide-up { animation: slideUp 0.5s ease-out; }
        
        .hbo-glow {
            box-shadow: 0 0 60px -15px rgba(99, 102, 241, 0.3);
        }
        .card-glow:hover {
            box-shadow: 0 12px 35px -10px rgba(99, 102, 241, 0.5);
            transform: translateY(-4px) scale(1.01);
        }
        .text-gold-gradient { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        .video-container-fix iframe {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important;
            border: none !important;
        }

        /* 1. TV Live Broadcast Radar Waves Animation */
        @keyframes radarPulse {
            0% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .tv-radar-anim {
            animation: radarPulse 2s infinite ease-in-out !important;
        }

        /* 2. Movie Cinema Projector / Film Strip Shimmer Animation */
        @keyframes projectorShimmer {
            0% { transform: translateX(-100%); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateX(200%); opacity: 0; }
        }
        .cinema-shimmer-container {
            position: relative;
            overflow: hidden;
        }
        .cinema-shimmer-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.35), transparent);
            animation: projectorShimmer 2.5s infinite linear;
            pointer-events: none;
        }

        /* 3. Radio / Audio Equalizer Bars Animation */
        .bar {
            width: 4px;
            background-color: #6366f1;
            border-radius: 2px;
            animation: equalize 1s infinite alternate;
            transform-origin: bottom;
        }
        .bar:nth-child(1) { animation-delay: -0.2s; height: 16px; }
        .bar:nth-child(2) { animation-delay: -0.4s; height: 24px; }
        .bar:nth-child(3) { animation-delay: -0.6s; height: 20px; }
        .bar:nth-child(4) { animation-delay: -0.8s; height: 28px; }
        .bar:nth-child(5) { animation-delay: -1.0s; height: 18px; }
        .bar:nth-child(6) { animation-delay: -0.3s; height: 25px; }

        @keyframes equalize {
            0% { transform: scaleY(0.2); opacity: 0.4; }
            50% { transform: scaleY(0.8); opacity: 0.8; }
            100% { transform: scaleY(1.2); opacity: 1; }
        }
        .paused-bar {
            transform: scaleY(0.15) !important;
            animation: none !important;
            opacity: 0.3;
        }

        button:focus, div[tabindex="0"]:focus, input:focus, select:focus { outline: none; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#030712;color:white;flex-direction:column;font-family:sans-serif;">
            <div style="width:48px;height:48px;border:4px solid #6366f1;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;"></div>
            <h2 style="font-weight: 700; letter-spacing: -0.025em; font-size: 1.125rem;">Cargando Magic TV 2.0 Ultimate...</h2>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef, useMemo } = React;

        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } }
        };

        const URLS = {
            TV: './listaoficial.m3u',
            SERIES: './playlist.json',
            MOVIES: ['./peliculas.json', './peliculas2.json'],
            ANIMADOS: './animados.json',
            RADIOS: './radios.json'
        };

        const RAW_URLS = {
            TV: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/listaoficial.m3u',
            SERIES: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/playlist.json',
            MOVIES: ['https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas.json', 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas2.json'],
            ANIMADOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/animados.json',
            RADIOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/radios.json'
        };

        const QR_IMAGE_URL = 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgsPiFVGiGuwJ3smwIQGJ-25kEkpEZpmR4PNZLdRF0_3LVfWAj2xhWSHiK7pY-C3jera3PD_XpmEtNy0kaCW1m8dayT9ebTV3YNBmbzMZeHF_oIf2XlniVGt6pj6BqtTyWEaUts1Ll_vYx2RuJvlrF9rqIwWcYcwMkTcdLCI-bShcR_KhhoILWEkdJ4Z4w/s1600/mi-qr-pro.png';

        const DEFAULT_RADIO_STATIONS = [
            { id: 'cr-teletica', title: 'Teletica Radio: 91.5 FM', group: 'Variedad', image: 'https://static.mytuner.mobi/media/tvos_radios/164/radio-hit-1047-fm.1180f4a3.jpg', url: 'https://icecasthd.teletica.com/teleticaradio' },
            { id: 'cr-besame', title: 'Bésame Costa Rica', group: 'Variedad', image: 'https://placehold.co/300x300/e50914/ffffff?text=Besame', url: 'https://icecasthd.teletica.com/besame' },
            { id: 'cr-columbia', title: 'Columbia Estéreo', group: 'Variedad', image: 'https://static.mytuner.mobi/media/tvos_radios/415/radio-sinfonola.79d5c3e6.png', url: 'https://icecasthd.teletica.com/columbia' },
            { id: 'cr-sinfonola', title: 'Radio Sinfonola 90.3 FM', group: 'Romántica / Clásicos', image: 'https://static.mytuner.mobi/media/tvos_radios/415/radio-sinfonola.79d5c3e6.png', url: 'https://live.turadio.stream:7006/;' },
            { id: 'cr-hit', title: 'Hit 104.7 FM', group: 'Juvenil / Pop', image: 'https://static.mytuner.mobi/media/tvos_radios/164/radio-hit-1047-fm.1180f4a3.jpg', url: 'https://live.turadio.stream:7004/stream?nocache=596&type=http' },
            { id: 'cr-crc', title: 'CRC 94.7 FM', group: 'Alternativo / Rock', image: 'https://static.mytuner.mobi/media/tvos_radios/nAwNLxJbnm.png', url: 'https://23263.live.streamtheworld.com/CRC_947AAC_SC' },
            { id: 'cr-zeta', title: 'Zeta FM 95.1', group: 'Tropical / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/879/zeta-fm.feb3fb70.png', url: 'https://d5g44yionyslb.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-monumental', title: 'Radio Monumental 93.5 FM', group: 'Noticias / Deportes', image: 'https://static.mytuner.mobi/media/tvos_radios/574/radio-monumental.7303764d.png', url: 'https://d26gdpbozqq700.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-mejor', title: 'La Mejor 99.1 FM', group: 'Regional / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/575/la-mejor-991.95c72890.png', url: 'https://d3svz5xnvdysyz.cloudfront.net/medialist_14854753276708185244_hls.m3u8' },
            { id: 'cr-r2', title: 'Radio Dos 99.5 FM', group: 'Clásicos / Rock', image: 'https://placehold.co/300x300/0033a0/ffffff?text=R2', url: 'https://icecasthd.teletica.com/radiodos' },
            { id: 'cr-los40', title: 'Los 40 Costa Rica 104.3 FM', group: 'Éxitos / Urbano', image: 'https://placehold.co/300x300/ffcc00/000000?text=Los40', url: 'https://icecasthd.teletica.com/los40' },
            { id: 'cr-disney', title: 'Radio Disney 101.1 FM', group: 'Pop / Éxitos', image: 'https://static.mytuner.mobi/media/tvos_radios/652/radio-disney-costa-rica.d297c76c.jpg', url: 'https://26673.live.streamtheworld.com/DISNEY_CRI_SJ_ADP/HLS/031b1ae7-b742-4bf3-8001-31b8478440ef/0/playlist.m3u8' },
            { id: 'cr-wao', title: 'WAO 92.3 FM', group: 'Urbano / Reggaeton', image: 'https://placehold.co/300x300/fd7e14/ffffff?text=WAO', url: 'https://icecasthd.teletica.com/wao' },
            { id: 'cr-musical', title: 'Radio Musical 97.5 FM', group: 'Romántica / Latina', image: 'https://static.mytuner.mobi/media/tvos_radios/085/radio-musical.fea3e089.jpg', url: 'https://live.turadio.stream:7005/stream/1/' }
        ];

        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/search') || url.includes('ok.ru/search')) return url;
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) {
                    const parts = url.split('/file/d/');
                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (url.includes('id=')) {
                    const parts = url.split('id=');
                    if (parts[1]) fileId = parts[1].split('&')[0];
                }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        };

        const fetchSmart = async (localUrl, rawUrl, isJson = true) => {
            const cacheBust = `?t=${Date.now()}`;
            try {
                const res = await fetch(localUrl + cacheBust);
                if (res.ok) {
                    const text = await res.text();
                    if (!text.trim().startsWith('<!DOCTYPE html') && !text.trim().startsWith('<html')) {
                        return isJson ? JSON.parse(text) : text;
                    }
                }
            } catch (e) {}

            try {
                const resRaw = await fetch(rawUrl + cacheBust);
                if (resRaw.ok) {
                    return isJson ? await resRaw.json() : await resRaw.text();
                }
            } catch (e) {}

            return null;
        };

        const handleQrError = (e) => {
            if (!e.target.dataset.triedBlogger) {
                e.target.dataset.triedBlogger = "true";
                e.target.src = QR_IMAGE_URL;
            } else if (!e.target.dataset.triedRaw) {
                e.target.dataset.triedRaw = "true";
                e.target.src = 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/mi-qr-pro.png';
            } else if (!e.target.dataset.triedApi) {
                e.target.dataset.triedApi = "true";
                e.target.src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(window.location.href || 'https://sejo48.github.io/StreamTube-V20/');
            }
        };

        const App = () => {
            const [showIntro, setShowIntro] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            const [content, setContent] = useState({ tv: [], series: [], movies: [], animados: [] });
            const [radioStations, setRadioStations] = useState(DEFAULT_RADIO_STATIONS);
            const [search, setSearch] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedEpisode, setSelectedEpisode] = useState(null);
            const [isLocked, setIsLocked] = useState(false); 
            const [favorites, setFavorites] = useState([]);
            const [loading, setLoading] = useState(true);
            const [expandedSeason, setExpandedSeason] = useState(0);
            const [showQrModal, setShowQrModal] = useState(false);

            const [tvRefreshTrigger, setTvRefreshTrigger] = useState(0);
            const [tvGroupFilter, setTvGroupFilter] = useState('ALL');

            const [currentRadioStation, setCurrentRadioStation] = useState(null);
            const [isRadioPlaying, setIsRadioPlaying] = useState(false);
            const [radioFavorites, setRadioFavorites] = useState([]);
            const [radioVolume, setRadioVolume] = useState(0.8);
            const [streamError, setStreamError] = useState(false);
            const [isLoadingRadio, setIsLoadingRadio] = useState(false);
            const [radioSearch, setRadioSearch] = useState('');
            const audioRef = useRef(null);
            const hlsRef = useRef(null);
            const tvContainerRef = useRef(null);
            const movieContainerRef = useRef(null);

            const navTabs = [
                { id: 'home', icon: 'search', label: 'Inicio' }, 
                { id: 'movies', icon: 'clapperboard', label: 'Películas' }, 
                { id: 'series', icon: 'film', label: 'Series' },
                { id: 'animados', icon: 'smile', label: 'Animados' },
                { id: 'topshows', icon: 'star', label: 'Top Shows' },
                { id: 'tv', icon: 'tv', label: 'TV' }, 
                { id: 'radio', icon: 'radio', label: 'Radio HD' }, 
                { id: 'community', icon: 'chat', label: 'Comunidad' },
                { id: 'spotify', icon: 'music', label: 'Música', isExternal: true, url: './spotify.html' },
                { id: 'favorites', icon: 'heart', label: 'Favs' }
            ];

            useEffect(() => {
                const handleOrientationChange = () => {
                    const isLandscape = window.innerWidth > window.innerHeight;
                    const isMediaActive = (activeTab === 'tv' && selectedItem?.type === 'tv') || (selectedItem && selectedItem.type !== 'tv');
                    
                    if (isLandscape && isMediaActive) {
                        const targetElem = activeTab === 'tv' ? tvContainerRef.current : movieContainerRef.current;
                        if (targetElem && !document.fullscreenElement) {
                            if (targetElem.requestFullscreen) {
                                targetElem.requestFullscreen().catch(() => {});
                            } else if (targetElem.webkitRequestFullscreen) {
                                targetElem.webkitRequestFullscreen();
                            }
                        }
                    }
                };

                window.addEventListener('resize', handleOrientationChange);
                window.addEventListener('orientationchange', handleOrientationChange);
                return () => {
                    window.removeEventListener('resize', handleOrientationChange);
                    window.removeEventListener('orientationchange', handleOrientationChange);
                };
            }, [activeTab, selectedItem]);

            useEffect(() => {
                window.history.replaceState({ appState: 'main', activeTab }, '');

                const handlePopState = (event) => {
                    if (showQrModal) {
                        setShowQrModal(false);
                        window.history.pushState({ appState: 'main', activeTab }, '');
                        return;
                    }

                    if (selectedItem) {
                        setSelectedItem(null);
                        setIsLocked(false);
                        window.history.pushState({ appState: 'main', activeTab }, '');
                        return;
                    }

                    if (activeTab !== 'home') {
                        setActiveTab('home');
                        setSearch('');
                        window.history.pushState({ appState: 'main', activeTab: 'home' }, '');
                        return;
                    }
                };

                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [selectedItem, activeTab, showQrModal, showIntro]);

            useEffect(() => {
                const init = async () => {
                    try {
                        setLoading(true);

                        const moviePromises = URLS.MOVIES.map((localPath, idx) => 
                            fetchSmart(localPath, RAW_URLS.MOVIES[idx], true)
                        );

                        const [dataTV, dataSeries, dataAnimados, dataRadios, ...moviesResults] = await Promise.all([ 
                            fetchSmart(URLS.TV, RAW_URLS.TV, false),
                            fetchSmart(URLS.SERIES, RAW_URLS.SERIES, true),
                            fetchSmart(URLS.ANIMADOS, RAW_URLS.ANIMADOS, true),
                            fetchSmart(URLS.RADIOS, RAW_URLS.RADIOS, true),
                            ...moviePromises
                        ]);

                        let tvChannels = [];
                        if (dataTV) tvChannels = parseM3U(dataTV);

                        let moviesList = [];
                        moviesResults.forEach((dataMovies, fileIdx) => {
                            if (dataMovies) {
                                const rawMovies = Array.isArray(dataMovies) ? dataMovies : (dataMovies.peliculas || dataMovies.content || []);
                                const mapped = rawMovies.map((m, idx) => ({ 
                                    ...m, 
                                    id: `mov-${fileIdx}-${idx}`, 
                                    type: 'movies', 
                                    title: m.titulo || m.title || m.name, 
                                    description: m.descripcion || m.sinopsis || m.plot, 
                                    image: m.imagen || m.poster || m.image, 
                                    url: convertUrl(m.urlDrive || m.url || m.urlOkRu),
                                    rawUrl: m.urlDrive || m.url || m.urlOkRu
                                }));
                                moviesList = [...moviesList, ...mapped];
                            }
                        });

                        let seriesList = [];
                        if (dataSeries) {
                            const rawSeries = Array.isArray(dataSeries) ? dataSeries : (dataSeries.series || []);
                            seriesList = rawSeries.map((s, idx) => ({
                                ...s,
                                id: `serie-${idx}`,
                                type: 'series',
                                title: s.tituloSerie || s.titulo || s.title || s.name,
                                description: s.descripcion || s.sinopsis,
                                image: s.imagen || s.poster || s.image,
                                seasons: (s.temporadas || []).map((t, tIdx) => ({
                                    seasonNumber: t.numeroTemporada || (tIdx + 1),
                                    episodes: (t.episodios || []).map((ep, eIdx) => ({
                                        id: `ep-${idx}-${tIdx}-${eIdx}`,
                                        title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`,
                                        url: convertUrl(ep.urlDrive || ep.url)
                                    }))
                                }))
                            }));
                        }

                        let animadosList = [];
                        if (dataAnimados) {
                            const rawAnimados = Array.isArray(dataAnimados) ? dataAnimados : (dataAnimados.animados || []);
                            animadosList = rawAnimados.map((a, idx) => ({
                                ...a,
                                id: `anim-${idx}`,
                                type: 'animados',
                                title: a.titulo || a.tituloSerie || a.title || a.name,
                                description: a.descripcion || a.sinopsis,
                                image: a.imagen || a.poster || a.image,
                                url: convertUrl(a.urlDrive || a.url),
                                seasons: (a.temporadas || []).map((t, tIdx) => ({
                                    seasonNumber: t.numeroTemporada || (tIdx + 1),
                                    episodes: (t.episodios || []).map((ep, eIdx) => ({
                                        id: `ep-anim-${idx}-${tIdx}-${eIdx}`,
                                        title: ep.tituloEpisodio || ep.titulo || `Episodio ${eIdx + 1}`,
                                        url: convertUrl(ep.urlDrive || ep.url)
                                    }))
                                }))
                            }));
                        }

                        if (dataRadios) {
                            const list = Array.isArray(dataRadios) ? dataRadios : (dataRadios.radios || dataRadios.emisoras || []);
                            if (list.length > 0) setRadioStations(list);
                        }

                        setContent({ tv: tvChannels, movies: moviesList, series: seriesList, animados: animadosList });
                    } catch (err) {
                        console.error("Error cargando contenido", err);
                    } finally {
                        setLoading(false);
                    }
                };

                const storedFavs = safeStorage.getItem('magistube_favs'); 
                if (storedFavs) { try { setFavorites(JSON.parse(storedFavs)); } catch(e) {} }

                const storedRadioFavs = safeStorage.getItem('magis_radio_favs');
                if (storedRadioFavs) { try { setRadioFavorites(JSON.parse(storedRadioFavs)); } catch(e) {} }

                init();
            }, []);

            useEffect(() => {
                let interval;
                if (activeTab === 'tv' && selectedItem?.type === 'tv' && tvContainerRef.current) {
                    interval = setInterval(() => { setTvRefreshTrigger(prev => prev + 1); }, 1800000); 
                }
                return () => clearInterval(interval);
            }, [activeTab, selectedItem]);

            useEffect(() => {
                if (activeTab === 'tv' && content.tv.length > 0) {
                    if (!selectedItem || selectedItem.type !== 'tv') {
                        const telerredChannel = content.tv.find(c => 
                            c.title.toLowerCase().includes('telerred') || 
                            c.title.toLowerCase().includes('tele red') ||
                            c.title.toLowerCase().includes('tele-red')
                        ) || content.tv[0];
                        
                        if (telerredChannel) {
                            setSelectedItem(telerredChannel);
                            setIsLocked(false);
                        }
                    }
                }
            }, [activeTab, content.tv]);

            useEffect(() => {
                if (!audioRef.current) {
                    audioRef.current = new Audio();
                    audioRef.current.crossOrigin = "anonymous";
                    
                    audioRef.current.addEventListener('error', () => {
                        setIsRadioPlaying(false);
                        setStreamError(true);
                        setIsLoadingRadio(false);
                    });
                    
                    audioRef.current.addEventListener('waiting', () => setIsLoadingRadio(true));
                    audioRef.current.addEventListener('playing', () => {
                        setIsLoadingRadio(false);
                        setStreamError(false);
                    });
                    audioRef.current.addEventListener('canplay', () => {
                        setIsLoadingRadio(false);
                        setStreamError(false);
                    });
                }

                const audio = audioRef.current;
                audio.volume = radioVolume;

                if (currentRadioStation && activeTab === 'radio') {
                    const playAudio = () => {
                        const playPromise = audio.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(() => {
                                setIsRadioPlaying(false);
                                setStreamError(true);
                                setIsLoadingRadio(false);
                            });
                        }
                    };

                    if (audio.dataset.currentUrl !== currentRadioStation.url) {
                        setIsLoadingRadio(true);
                        setStreamError(false);
                        audio.dataset.currentUrl = currentRadioStation.url;
                        
                        if (hlsRef.current) {
                            hlsRef.current.destroy();
                            hlsRef.current = null;
                        }

                        if (currentRadioStation.url.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
                            const hls = new Hls();
                            hlsRef.current = hls;
                            hls.loadSource(currentRadioStation.url);
                            hls.attachMedia(audio);
                            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                                if (isRadioPlaying) playAudio();
                            });
                            hls.on(Hls.Events.ERROR, function (event, data) {
                                if (data.fatal) {
                                    setIsRadioPlaying(false);
                                    setStreamError(true);
                                    setIsLoadingRadio(false);
                                }
                            });
                        } else {
                            audio.src = currentRadioStation.url; 
                            audio.load();
                            if (isRadioPlaying) playAudio();
                        }
                    } else {
                        if (isRadioPlaying) playAudio();
                        else audio.pause();
                    }
                } else if (audioRef.current) {
                    audioRef.current.pause();
                }
            }, [currentRadioStation, isRadioPlaying, activeTab]);

                    if (line.startsWith('#EXTINF:')) {
                        let title = 'Canal';
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        if (url && url.startsWith('http')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/); const logo = logoMatch ? logoMatch[1] : '';
                            const groupMatch = line.match(/group-title="([^"]*)"/); const group = groupMatch ? groupMatch[1] : 'General';
                            const commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                            channels.push({ id: `tv-${i}`, title, image: logo, group, url, type: 'tv' });
                        }
                    }
                }
                return channels;

                                        <div className="flex items-center gap-4 min-w-0">
                                            <div className="w-16 h-16 rounded-2xl overflow-hidden flex-shrink-0 bg-black border border-indigo-950/80 relative">
                                                <img src={station.image} alt={station.title} className="w-full h-full object-cover" onError={(e) => e.target.src='https://placehold.co/300x300/030712/ffffff?text=Radio'}/>
                                                <div className={`absolute inset-0 flex items-center justify-center bg-black/60 transition-opacity ${isCurrentPlaying ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}>
                                                    <Icon name={isCurrentPlaying ? "pause" : "play"} size={20} fill="currentColor" className="text-white"/>
                                                </div>
                                            </div>
                                            <div className="truncate">
                                                <h3 className="font-extrabold text-sm text-white truncate">{station.title}</h3>
                                                <p className="text-xs text-gray-400 truncate mt-1">{station.group}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 flex-shrink-0">
                                            <button onClick={(e) => onToggleFavorite(station, e)} className="p-2.5 rounded-full hover:bg-white/10 transition-colors">
                                                <Icon name="heart" size={16} fill={isFav ? '#6366f1' : 'none'} className={isFav ? 'text-indigo-500' : 'text-gray-500'}/>
                                            </button>
                                            <div className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors ${isCurrentPlaying ? 'bg-indigo-600 text-white shadow-[0_0_15px_#6366f1]' : 'bg-[#182038] text-gray-300 group-hover:bg-indigo-600 group-hover:text-white'}`}>
                                                <Icon name={isCurrentPlaying ? "pause" : "play"} size={16} fill="currentColor" className={!isCurrentPlaying ? "ml-0.5" : ""}/>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const IntroScreen = ({ onEnter }) => {
            const [isLoading, setIsLoading] = useState(false);
            const [progress, setProgress] = useState(0);

            const handleStart = () => {
                setIsLoading(true);
                let current = 0;
                const interval = setInterval(() => {
                    current += 2;
                    if (current <= 100) {
                        setProgress(current);
                    } else {
                        clearInterval(interval);
                        onEnter();
                    }
                }, 30); // 30ms * 100 = 3000ms (exactly 3 seconds)
            };

            return (
                <div className="fixed inset-0 z-[100] bg-[#030712] flex items-center justify-center overflow-hidden font-sans p-4">
                    <div className="absolute inset-0"><img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=1200&auto=format&fit=crop" className="w-full h-full object-cover opacity-15" /><div className="absolute inset-0 bg-gradient-to-b from-[#030712] via-[#030712]/90 to-[#030712]"></div></div>
                    <div className="relative z-10 text-center max-w-md w-full animate-slide-up bg-[#070b19]/80 backdrop-blur-xl border border-indigo-900/50 p-8 rounded-3xl shadow-[0_0_60px_rgba(99,102,241,0.25)]">
                        <div className="mb-4 inline-block bg-indigo-600 px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase text-white shadow-[0_0_15px_rgba(99,102,241,0.5)]">HBO Max Experience</div>
                        <h1 className="text-4xl sm:text-5xl font-black text-white mb-2 tracking-tighter">MAGIC <span className="text-indigo-400">TV 2.0</span></h1>
                        <p className="text-sm text-gray-300 font-light mb-8 italic">"Streaming de alta calidad cinematográfica."</p>
                        
                        {isLoading ? (
                            <div className="space-y-3 mb-8">
                                <div className="flex justify-between text-xs text-indigo-300 font-bold px-1">
                                    <span>Cargando plataforma...</span>
                                    <span>{progress}%</span>
                                </div>
                                <div className="w-full h-3 bg-black/60 rounded-full overflow-hidden border border-indigo-950 p-0.5">
                                    <div className="h-full bg-gradient-to-r from-indigo-600 to-indigo-400 rounded-full transition-all duration-75 shadow-[0_0_15px_#6366f1]" style={{ width: `${progress}%` }}></div>
                                </div>
                            </div>
                        ) : (
                            <button onClick={handleStart} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-full font-extrabold text-base shadow-[0_0_25px_rgba(99,102,241,0.6)] flex items-center justify-center gap-2.5 mb-8 active:scale-95 transition-all"><span>Comenzar Experiencia</span> <Icon fill="white" name="play" size={18}/></button>
                        )}

                        <div className="opacity-80 pt-4 border-t border-indigo-950/80"><p className="text-[9px] text-gray-400 uppercase tracking-widest mb-0.5">DISEÑADO Y PROGRAMADO POR</p><h3 className="text-base font-serif text-gold-gradient font-bold mb-1">JORGE ARTURO HERNÁNDEZ MÉNDEZ</h3><p className="text-[9px] text-gray-500">Magic TV 2.0 • Powered by Gemini AI</p></div>
                    </div>
                </div>
            );
        };

        const HeroSection = ({ item, onPlay, isFavorite, onToggleFavorite }) => {
            if (!item) return null;
            const imgSource = item.imagen || item.image || item.poster;
            const titleSource = item.titulo || item.title || item.name;
            const descSource = item.descripcion || item.sinopsis || item.plot;
            
            return (
                <div className="relative w-full h-[380px] sm:h-[460px] bg-[#070b19] overflow-hidden rounded-3xl mb-10 group animate-fade-in shadow-2xl border border-indigo-950/80 flex items-center max-w-7xl mx-auto px-6 sm:px-12 hbo-glow">
                    <div className="absolute inset-0 overflow-hidden pointer-events-none">
                        <img src={imgSource} alt="Hero BG" className="w-full h-full object-cover filter blur-2xl opacity-50 scale-125 brightness-110 contrast-125" onError={(e) => e.target.style.display='none'} />
                        <div className="absolute inset-0 bg-gradient-to-r from-[#030712] via-[#030712]/85 to-transparent"></div>
                        <div className="absolute inset-0 bg-gradient-to-t from-[#030712] via-transparent to-transparent"></div>
                    </div>
                    <div className="relative z-10 w-full h-full flex flex-col sm:flex-row items-center justify-start gap-8 py-6">
                        <div className="w-36 sm:w-52 aspect-[2/3] rounded-2xl overflow-hidden shadow-2xl border border-indigo-500/40 flex-shrink-0 bg-black/70 transform group-hover:scale-105 transition-transform duration-300 relative">
                            <img src={imgSource} alt={titleSource} className="w-full h-full object-cover" onError={(e) => e.target.src='https://placehold.co/300x450/0c1021/ffffff?text=Poster'} />
                        </div>
                        <div className="flex-1 flex flex-col gap-3.5 items-start max-w-xl">
                            <span className="bg-indigo-600 text-white text-[10px] font-black px-3.5 py-1 rounded-full uppercase tracking-widest shadow-[0_0_15px_rgba(99,102,241,0.5)]">Destacado HBO Max</span>
                            <h1 className="text-2xl sm:text-4xl font-black text-white leading-tight drop-shadow-md line-clamp-1">{titleSource}</h1>
                            <p className="text-gray-300 text-xs sm:text-sm line-clamp-3 leading-relaxed drop-shadow">{descSource || "Disfruta de las mejores películas y series en alta definición."}</p>
                            <div className="flex gap-3.5 mt-2">
                                <button onClick={() => onPlay(item)} className="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2.5 active:scale-95 transition-transform shadow-[0_0_20px_rgba(99,102,241,0.6)]">
                                    <Icon fill="white" name="play" size={16}/> Reproducir Ahora
                                </button>
                                <button onClick={() => onToggleFavorite(item)} className="bg-indigo-950/80 text-white p-3.5 rounded-xl flex items-center justify-center backdrop-blur-md border border-indigo-500/40 hover:bg-indigo-900/60 transition-colors shadow-lg">
                                    <Icon name="heart" size={18} fill={isFavorite ? "#6366f1" : "none"} className={isFavorite ? "text-indigo-500" : "text-white"}/>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Card = ({ item, onClick, isFavorite, onToggleFavorite }) => { 
            const isTv = item.type === 'tv'; 
            const hasLock = item.codigo || item.password || item.pin; 
            const isKids = item.isKids || item.type === 'animados';
            const imgSource = item.imagen || item.image || item.poster || item.logo;
            const titleSource = item.titulo || item.title || item.name;
            return ( 
                <div tabIndex="0" className="group relative flex flex-col gap-2.5 cursor-pointer active:scale-95 transition-transform card-glow rounded-2xl" onClick={() => onClick(item)}> 
                    <div className={`relative overflow-hidden rounded-2xl bg-[#0c1021] border border-indigo-950/80 shadow-xl ${isTv ? 'aspect-video' : 'aspect-[2/3]'}`}> 
                        <img src={imgSource} loading="lazy" className={`w-full h-full transition-transform duration-300 group-hover:scale-105 ${isTv ? 'object-contain p-3' : 'object-cover'}`} onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/300x450/0c1021/ffffff?text=MagicTV`; }} alt={titleSource} /> 
                        <button onClick={(e) => { e.stopPropagation(); onToggleFavorite(item); }} className="absolute top-2.5 right-2.5 p-2 bg-black/70 rounded-full text-white backdrop-blur-md hover:bg-black transition-colors z-20"> 
                            <Icon name="heart" size={15} fill={isFavorite ? "#6366f1" : "none"} className={isFavorite ? "text-indigo-500" : "text-white"}/> 
                        </button> 
                        <div className="absolute bottom-2.5 left-2.5 flex gap-1.5 flex-wrap z-10"> 
                            {isTv && <span className="bg-indigo-600 text-white text-[9px] font-black px-2 py-0.5 rounded shadow">LIVE</span>} 
                            {isKids && <span className="bg-purple-600 text-white text-[9px] font-black px-2 py-0.5 rounded shadow">KIDS</span>} 
                            {hasLock && <span className="bg-amber-500 text-black text-[9px] font-black px-2 py-0.5 rounded shadow flex items-center gap-0.5"><Icon name="lock" size={8}/> PIN</span>} 
                        </div> 
                    </div> 
                    <h3 className="text-xs font-bold text-gray-200 truncate px-1 group-hover:text-indigo-400 transition-colors">{titleSource}</h3> 
                </div> 
            ); 
        };

        const Icon = ({ name, size = 22, className, fill = "none" }) => {
            const icons = {
                search: <path d="M21 21l-4.35-4.35m0 0a7.5 7.5 0 111.414-1.414 7.5 7.5 0 01-1.414 1.414z" />,
                x: <path d="M6 18L18 6M6 6l12 12" />,
                tv: <path d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125z" />,
                film: <path d="M19.82 2H4.18C2.97 2 2 2.97 2 4.18v15.64C2 21.03 2.97 22 4.18 22h15.64c1.21 0 2.18-.97 2.18-2.18V4.18C22 2.97 21.03 2 19.82 2zM7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5" />,
                play: <path d="M5 3l14 9-14 9V3z" />,
                pause: <path d="M6 4h4v16H6zM14 4h4v16h-4z" />,
                heart: <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78 z" />,
                arrowLeft: <path d="M19 12H5m7 7l-7-7 7-7" />,
                clapperboard: <g><path d="M20.2 6 3 11l-.9-2.4c-.5-1.1.2-2.3 1.3-2.8l3.2-1.4c1.1-.5 2.3.2 2.8 1.3l.9 2.4l7.9-3l2 4.5Z"/><path d="M4 11v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9"/></g>,
                lock: <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a7 7 0 00-14 0v2" />,
                smile: <g><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></g>,
                music: <g><path d="M9 18V5l12-2v13"></path><path d="M9 9l12-2"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></g>,
                radio: <path d="M2 12a10 10 0 0110-10 10 10 0 0110 10M6 12a6 6 0 016-6 6 6 0 016 6M10 12a2 2 0 012-2 2 2 0 012 2v8a2 2 0 01-2 2 2 2 0 01-2-2v-8z" />,
                volume: <path d="M11 5L6 9H2v6h4l5 4V5z M15.54 8.46a5 5 0 010 7.07 M19.07 4.93a10 10 0 010 14.14" />,
                qr: <g><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="3" height="3"></rect><rect x="18" y="18" width="3" height="3"></rect><rect x="14" y="18" width="3" height="3"></rect><rect x="18" y="14" width="3" height="3"></rect></g>,
                chat: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>,
                star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.search}
                </svg>
            );
        };

        const LockScreen = ({ onUnlock, correctCode, onCancel }) => {
            const [input, setInput] = useState(''); const [error, setError] = useState(false);
            const handleSubmit = (e) => { e.preventDefault(); if (input === String(correctCode)) onUnlock(); else { setError(true); setInput(''); } };
            return (<div className="absolute inset-0 z-50 bg-black/95 backdrop-blur-sm flex flex-col items-center justify-center p-4 animate-fade-in"><div className="bg-[#0c1021] border border-indigo-900/60 p-6 rounded-3xl max-w-xs w-full text-center shadow-2xl"><div className="mb-4 flex justify-center"><div className="p-3.5 bg-indigo-600/20 rounded-2xl text-indigo-400 border border-indigo-500/30"><Icon name="lock" size={28}/></div></div><h2 className="text-base font-extrabold text-white mb-2">Contenido Protegido</h2><form onSubmit={handleSubmit}><input type="password" maxLength="4" className="w-full bg-black/60 border border-indigo-950 rounded-xl px-4 py-3 text-center text-xl tracking-[0.4em] text-white focus:border-indigo-500 outline-none mb-3 shadow-inner" value={input} onChange={(e) => { setInput(e.target.value); setError(false); }} placeholder="••••" autoFocus />{error && <p className="text-red-400 text-xs mb-3 font-bold">Código incorrecto</p>}<div className="flex gap-2.5"><button type="button" onClick={onCancel} className="flex-1 py-2.5 rounded-xl border border-indigo-950 text-gray-300 hover:bg-white/5 text-xs font-semibold">Cancelar</button><button type="submit" className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-500 text-xs shadow-[0_0_15px_rgba(99,102,241,0.5)]">Acceder</button></div></form></div></div>);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
