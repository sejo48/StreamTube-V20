        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/search') || url.includes('ok.ru/search')) return url;
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            if (url.includes('youtube.com') && !url.includes('/embed/')) {
                let videoId = '';
                if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
                if (videoId) return `https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}`;
            }
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) fileId = url.split('/file/d/')[1]?.split('/')[0];
                else if (url.includes('id=')) fileId = url.split('id=')[1]?.split('&')[0];
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;

        const fetchSmart = async (localUrl, rawUrl, isJson = true) => {
            const cacheBust = `?t=${Date.now()}`;
            try {
                const res = await fetch(localUrl + cacheBust);
                if (res.ok) {
                    const text = await res.text();
                    if (!text.trim().startsWith('<!DOCTYPE html') && !text.trim().startsWith('<html')) {
                        return isJson ? JSON.parse(text) : text;
                    }
                }
            } catch (e) {}
            try {
                const resRaw = await fetch(rawUrl + cacheBust);
                if (resRaw.ok) return isJson ? await resRaw.json() : await resRaw.text();
            } catch (e) {}
            return null;
        };

            if (!data) return [];
            const lines = data.split('\n');

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let title = 'Canal';
                    const url = lines[i + 1] ? lines[i + 1].trim() : '';
                    if (url && url.startsWith('http')) {
                        const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                        const logo = logoMatch ? logoMatch[1] : '';
                        const groupMatch = line.match(/group-title="([^"]*)"/);
                        const group = groupMatch ? groupMatch[1] : 'General';
                        const commaIndex = line.lastIndexOf(',');

                case 'heart': return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>;
                case 'play': return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>;
                case 'pause': return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
                case 'x': return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
                case 'arrowLeft': return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
                case 'arrowRight': return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
                case 'chat': return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
                case 'qr': return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>;
                case 'up': return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="18 15 12 9 6 15"/></svg>;
                default: return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/></svg>;
            }
        };

        const ClassicMusicSection = ({ albumsData = FALLBACK_ALBUMS }) => {
            const [selectedDecade, setSelectedDecade] = useState('TODOS');
            const [selectedGenre, setSelectedGenre] = useState('TODOS');
            const [viewingAlbum, setViewingAlbum] = useState(null);
            
            const audioRef = useRef(null);
            const [currentPlayback, setCurrentPlayback] = useState({ albumId: null, trackIndex: -1 });
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(0.85);
            
            const decades = ['TODOS', '60s', '70s', '80s', '90s'];
            const genres = ['TODOS', 'Rock', 'Pop', 'Baladas', 'Reggae', 'Disco', 'Latino', 'Soul', 'Clásicos'];

            useEffect(() => {
                const audio = new Audio();
                audio.crossOrigin = 'anonymous';
                audioRef.current = audio;

                const handleTimeUpdate = () => {
                    setCurrentTime(audio.currentTime);
                    if (audio.duration) {
                        setProgress((audio.currentTime / audio.duration) * 100);
                    }
                };
                const handleLoadedMetadata = () => { setDuration(audio.duration || 0); };
                const handleEnded = () => { nextTrack(); };

                audio.addEventListener('timeupdate', handleTimeUpdate);
                audio.addEventListener('loadedmetadata', handleLoadedMetadata);
                audio.addEventListener('ended', handleEnded);

                return () => {
                    audio.pause();
                    audio.removeEventListener('timeupdate', handleTimeUpdate);
                    audio.removeEventListener('loadedmetadata', handleLoadedMetadata);
                    audio.removeEventListener('ended', handleEnded);
                };
            }, [albumsData]);

            const playTrack = (album, index) => {
                // Si el álbum tiene canciones individuales, busca la pista
                const track = (album.tracks && album.tracks.length > 0) ? album.tracks[index] : null;
                // Si la canción tiene audio propio, lo usa; sino usa el musicUrl o urlDrive general del álbum
                const audioSource = (track && track.audio) ? track.audio : (album.musicUrl || album.urlDrive || album.url || '');
                
                if (!audioSource) {
                    console.warn("No hay dirección de música disponible para este álbum o canción");
                    return;
                }
                const audio = audioRef.current;
                if (!audio) return;

                if (currentPlayback.albumId === album.id && currentPlayback.trackIndex === index) {
                    if (isPlaying) {
                        audio.pause();
                        setIsPlaying(false);
                    } else {
                        audio.play().then(() => setIsPlaying(true)).catch(e => console.warn(e));
                    }
                    return;
                }

                audio.src = audioSource;
                audio.volume = volume;
                audio.play().then(() => {
                    setCurrentPlayback({ albumId: album.id, trackIndex: index });
                    setIsPlaying(true);
                }).catch(e => console.warn("Error al reproducir audio:", e));
            };

            const togglePlayPause = () => {
                if (!currentPlayback.albumId || !audioRef.current) return;
                if (isPlaying) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                } else {
                    audioRef.current.play().then(() => setIsPlaying(true)).catch(e => console.warn(e));
                }
            };

            const nextTrack = () => {
                if (!currentPlayback.albumId) return;
                const album = albumsData.find(a => a.id === currentPlayback.albumId);
                if (album && currentPlayback.trackIndex < album.tracks.length - 1) {
                    playTrack(album, currentPlayback.trackIndex + 1);
                } else {
                    setIsPlaying(false);
                    setProgress(0);
                }
            };

            const prevTrack = () => {
                if (!currentPlayback.albumId || !audioRef.current) return;
                const album = albumsData.find(a => a.id === currentPlayback.albumId);
                if (album && currentPlayback.trackIndex > 0) {
                    if (audioRef.current.currentTime > 3) {
                        audioRef.current.currentTime = 0;
                    } else {
                        playTrack(album, currentPlayback.trackIndex - 1);
                    }
                } else {
                    audioRef.current.currentTime = 0;
                }
            };

            const formatTime = (secs) => {
                if (isNaN(secs) || secs === 0) return "0:00";
                const m = Math.floor(secs / 60);
                const s = Math.floor(secs % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const getDecadeFromYear = (year) => {
                const y = parseInt(year);
                if (y >= 1960 && y <= 1969) return '60s';
                if (y >= 1970 && y <= 1979) return '70s';
                if (y >= 1980 && y <= 1989) return '80s';
                if (y >= 1990 && y <= 1999) return '90s';
                return 'Otra';
            };

            const filteredAlbums = albumsData.filter(album => {
                const matchDecade = selectedDecade === 'TODOS' || getDecadeFromYear(album.year) === selectedDecade;
                const matchGenre = selectedGenre === 'TODOS' || (album.genre || '').toLowerCase() === selectedGenre.toLowerCase();
                return matchDecade && matchGenre;
            });

            const activeAlbum = currentPlayback.albumId ? albumsData.find(a => a.id === currentPlayback.albumId) : null;
            const activeTrack = activeAlbum ? activeAlbum.tracks[currentPlayback.trackIndex] : null;

            return (
                <div className="min-h-[90vh] retro-museum-bg relative w-full text-white/90 animate-fade-in pb-32 pt-6">
                    {/* Header */}
                    <div className="pt-6 pb-6 px-4 text-center space-y-3">
                        <div className="inline-flex items-center gap-2 border border-retro-gold/40 bg-retro-gold/10 px-4 py-1.5 rounded-full backdrop-blur-md shadow-[0_0_20px_rgba(212,175,55,0.2)]">
                            <Icon name="disc" size={14} className="text-retro-gold animate-spin" />
                            <span className="text-[10px] sm:text-xs font-bold uppercase tracking-widest text-retro-gold">MUSEO DIGITAL DE DISCOS</span>
                        </div>
                        <h1 className="text-3xl sm:text-5xl md:text-6xl font-black playfair gold-text tracking-tight">
                            COLECCIÓN MUSICAL
                        </h1>
                        <p className="text-xs sm:text-sm text-gray-400 font-light max-w-xl mx-auto italic playfair">
                            Los grandes álbumes que marcaron generaciones. Una biblioteca sonora restaurada para los oídos más exigentes.
                        </p>
                    </div>

                    {/* Filtros */}
                    <div className="max-w-6xl mx-auto px-4 mb-8 space-y-4">
                        <div className="flex flex-wrap items-center justify-center gap-2">
                            <span className="text-[10px] uppercase tracking-widest text-gray-500 mr-2 font-bold hidden sm:inline">Décadas:</span>
                            {decades.map(dec => (
                                <button 
                                    key={dec} 
                                    onClick={() => setSelectedDecade(dec)}
                                    className={`px-4 py-1.5 rounded-full text-xs font-semibold transition-all border ${selectedDecade === dec ? 'bg-retro-gold text-black border-retro-gold shadow-[0_0_15px_rgba(212,175,55,0.5)]' : 'bg-black/50 text-gray-400 border-white/10 hover:border-retro-gold/50 hover:text-white'}`}
                                >
                                    {dec}
                                </button>
                            ))}
                        </div>
                        <div className="flex flex-wrap items-center justify-center gap-2 sm:gap-4">
                            <span className="text-[10px] uppercase tracking-widest text-gray-500 mr-2 font-bold hidden sm:inline">Géneros:</span>
                            {genres.map(gen => (
                                <button 
                                    key={gen} 
                                    onClick={() => setSelectedGenre(gen)}
                                    className={`px-3 py-1 rounded-lg text-[11px] font-medium transition-all ${selectedGenre === gen ? 'bg-white/10 text-retro-gold border-b-2 border-retro-gold' : 'text-gray-400 hover:text-white border-b-2 border-transparent'}`}
                                >
                                    {gen}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Grid Álbumes */}
                    <div className="max-w-6xl mx-auto px-4 sm:px-8">
                        {filteredAlbums.length === 0 ? (
                            <div className="text-center py-20 text-gray-500">
                                <Icon name="disc" size={48} className="mx-auto mb-3 opacity-20" />
                                <p className="text-xs">No se encontraron álbumes en esta categoría.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                                {filteredAlbums.map((album) => {
                                    const isThisPlaying = currentPlayback.albumId === album.id && isPlaying;
                                    return (
                                        <div key={album.id} className="album-card-hover group cursor-pointer flex flex-col items-center" onClick={() => setViewingAlbum(album)}>
                                            <div className="w-full aspect-square rounded-xl overflow-hidden relative shadow-[0_15px_30px_rgba(0,0,0,0.8)] border border-white/10 bg-black cover-reflection">
                                                <img 
                                                    src={album.cover} 
                                                    alt={album.album} 
                                                    className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                                                    onError={(e) => { e.target.src='https://placehold.co/400x400/111/d4af37?text=DISCO'; }}
                                                />
                                                {isThisPlaying && (
                                                    <div className="absolute top-2 right-2 flex items-end gap-[2px] h-4 bg-black/70 px-2 py-1 rounded border border-retro-gold/40">
                                                        <div className="playing-bar" style={{ animationDelay: '0s' }}></div>
                                                        <div className="playing-bar" style={{ animationDelay: '0.2s' }}></div>
                                                        <div className="playing-bar" style={{ animationDelay: '0.4s' }}></div>
                                                    </div>
                                                )}
                                                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); playTrack(album, 0); }} 
                                                        className="w-12 h-12 rounded-full bg-retro-gold text-black flex items-center justify-center shadow-lg hover:scale-110 transition-transform"
                                                    >
                                                        <Icon name={isThisPlaying ? "pause" : "play"} size={18} fill="currentColor" />
                                                    </button>
                                                </div>
                                            </div>
                                            <div className="mt-3 text-center w-full px-1">
                                                <h3 className="text-sm font-bold text-white truncate playfair">{album.album}</h3>
                                                <p className="text-xs text-retro-gold truncate mt-0.5">{album.artist}</p>
                                                <p className="text-[10px] text-gray-500 font-mono mt-1">{album.year} • {album.genre}</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    {/* Modal Detalle */}
                    {viewingAlbum && (
                        <div className="fixed inset-0 z-[150] bg-black/90 backdrop-blur-xl flex items-center justify-center p-4 animate-fade-in overflow-y-auto">
                            <button onClick={() => setViewingAlbum(null)} className="absolute top-4 right-4 text-white/70 hover:text-white p-2 bg-white/5 rounded-full z-50">
                                <Icon name="x" size={20} />
                            </button>

                            <div className="max-w-4xl w-full flex flex-col md:flex-row gap-8 bg-[#101216] border border-white/10 p-6 sm:p-8 rounded-3xl shadow-2xl">
                                <div className="w-full md:w-5/12 flex flex-col items-center md:items-start text-center md:text-left space-y-4">
                                    <div className="w-48 sm:w-60 aspect-square rounded-xl shadow-2xl border border-white/10 overflow-hidden cover-reflection">
                                        <img src={viewingAlbum.cover} alt={viewingAlbum.album} className="w-full h-full object-cover" />
                                    </div>
                                    <div>
                                        <h2 className="text-2xl sm:text-3xl font-black playfair gold-text leading-tight">{viewingAlbum.album}</h2>
                                        <p className="text-base text-white/90 font-semibold mt-1">{viewingAlbum.artist}</p>
                                        <div className="flex flex-wrap items-center justify-center md:justify-start gap-2 text-xs font-mono text-gray-400 mt-2">
                                            <span className="bg-white/5 px-2.5 py-1 rounded">{viewingAlbum.year}</span>
                                            <span className="bg-white/5 px-2.5 py-1 rounded">{viewingAlbum.genre}</span>
                                            <span className="bg-retro-gold/10 text-retro-gold border border-retro-gold/30 px-2.5 py-1 rounded">{viewingAlbum.tracks.length} Pistas</span>
                                        </div>
                                        <p className="text-xs text-gray-400 leading-relaxed font-light mt-3">{viewingAlbum.description}</p>
                                        <button 
                                            onClick={() => playTrack(viewingAlbum, 0)}
                                            className="mt-5 w-full bg-gradient-to-r from-retro-gold to-retro-goldDark text-black font-bold py-3 px-6 rounded-full shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform"
                                        >
                                            <Icon name="play" size={16} fill="currentColor" /> Reproducir Disco
                                        </button>
                                    </div>
                                </div>

                                <div className="w-full md:w-7/12 flex flex-col">
                                    <h3 className="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3 border-b border-white/10 pb-2">Lista de Canciones</h3>
                                    <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-1 max-h-80">
                                        {viewingAlbum.tracks.map((track, idx) => {
                                            const isPlayingTrack = currentPlayback.albumId === viewingAlbum.id && currentPlayback.trackIndex === idx && isPlaying;
                                            return (
                                                <div 
                                                    key={idx}
                                                    onClick={() => playTrack(viewingAlbum, idx)}
                                                    className={`flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all ${isPlayingTrack ? 'bg-retro-gold/15 border border-retro-gold/40' : 'hover:bg-white/5 border border-transparent'}`}
                                                >
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <span className="w-5 text-center text-xs font-mono text-gray-500">
                                                            {isPlayingTrack ? '▶' : idx + 1}
                                                        </span>
                                                        <span className={`text-xs sm:text-sm font-medium truncate ${isPlayingTrack ? 'text-retro-gold font-bold' : 'text-white'}`}>
                                                            {track.title}
                                                        </span>
                                                    </div>
                                                    <span className="text-[11px] font-mono text-gray-500">{track.duration || '3:30'}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Reproductor Inferior Fijo */}
                    <div className={`fixed bottom-0 left-0 right-0 z-[120] transition-transform duration-300 ${currentPlayback.albumId ? 'translate-y-0' : 'translate-y-full'}`}>
                        <div className="bg-[#08090d]/95 backdrop-blur-2xl border-t border-retro-gold/30 px-4 sm:px-8 py-2.5 shadow-2xl">
                            <div className="max-w-6xl mx-auto flex items-center justify-between gap-4">
                                <div className="flex items-center gap-3 w-1/3 min-w-0">
                                    <div className="w-11 h-11 rounded-lg overflow-hidden bg-black flex-shrink-0 border border-white/10 cursor-pointer" onClick={() => setViewingAlbum(activeAlbum)}>
                                        <img src={activeAlbum?.cover} alt="" className="w-full h-full object-cover" />
                                    </div>
                                    <div className="min-w-0 flex-1">
                                        <div className="text-xs font-bold text-white truncate gold-text">{activeTrack?.title || 'Seleccionado'}</div>
                                        <div className="text-[10px] text-gray-400 truncate">{activeAlbum?.artist}</div>
                                    </div>
                                </div>

                                <div className="flex flex-col items-center justify-center flex-1 max-w-xl">
                                    <div className="flex items-center gap-4 mb-1">
                                        <button onClick={prevTrack} className="text-gray-400 hover:text-white p-1"><i className="fas fa-backward-step text-xs"></i></button>
                                        <button onClick={togglePlayPause} className="w-8 h-8 rounded-full bg-retro-gold text-black flex items-center justify-center hover:scale-105 transition-transform">
                                            <Icon name={isPlaying ? "pause" : "play"} size={14} fill="currentColor" />
                                        </button>
                                        <button onClick={nextTrack} className="text-gray-400 hover:text-white p-1"><i className="fas fa-forward-step text-xs"></i></button>
                                    </div>
                                    <div className="w-full flex items-center gap-2 text-[9px] font-mono text-gray-400">
                                        <span>{formatTime(currentTime)}</span>
                                        <input 
                                            type="range" 
                                            min="0" max="100" 
                                            value={progress} 
                                            onChange={(e) => {
                                                const val = parseFloat(e.target.value);
                                                setProgress(val);
                                                if (audioRef.current && audioRef.current.duration) {
                                                    audioRef.current.currentTime = (val / 100) * audioRef.current.duration;
                                                }
                                            }}
                                            className="w-full h-1 bg-gray-800 rounded-full accent-amber-500 cursor-pointer"
                                        />
                                        <span>{formatTime(duration)}</span>
                                    </div>
                                </div>

                                <div className="w-1/3 justify-end items-center gap-2 hidden md:flex">
                                    <Icon name="radio" size={14} className="text-retro-gold" />
                                    <input 
                                        type="range" 
                                        min="0" max="1" step="0.05"
                                        value={volume}
                                        onChange={(e) => {
                                            const v = parseFloat(e.target.value);
                                            setVolume(v);
                                            if (audioRef.current) audioRef.current.volume = v;
                                        }}
                                        className="w-20 h-1 bg-gray-800 rounded-full accent-white cursor-pointer"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const CyberRadioSection = React.forwardRef(({ stations, currentStation, isPlaying, onPlayStation, volume, setVolume, streamError, isLoading, audioRef, clockTime, isMuted, setIsMuted, isPowerOn, setIsPowerOn, oscilloscopePoints, radioFilter, setRadioFilter, hlsRef, setIsRadioPlaying }, ref) => {
            const [selectedCategory, setSelectedCategory] = useState('global');
            const [favorites, setFavorites] = useState(() => {
                try { return JSON.parse(localStorage.getItem('boxplay_radio_favs') || '[]'); } catch (e) { return []; }
            });

            const toggleFavorite = (title, e) => {
                e.stopPropagation();
                let updated = favorites.includes(title) ? favorites.filter(f => f !== title) : [...favorites, title];
                setFavorites(updated);
                localStorage.setItem('boxplay_radio_favs', JSON.stringify(updated));
            };

            const filteredStations = useMemo(() => {
                const q = radioFilter.trim().toLowerCase();
                return stations.filter(s => {
                    const groupStr = (s.group || '').toLowerCase();
                    const isGlobal = groupStr.includes('global') || groupStr.includes('internacional') || groupStr.includes('online');
                    const matchesCategory = 
                        (selectedCategory === 'global' && isGlobal) ||
                        (selectedCategory === 'nacionales' && !isGlobal) ||
                        (selectedCategory === 'favorites' && favorites.includes(s.title));
                    const matchesQuery = !q || (s.title || '').toLowerCase().includes(q) || (s.genre && s.genre.toLowerCase().includes(q));
                    return matchesCategory && matchesQuery;
                });
            }, [stations, radioFilter, selectedCategory, favorites]);

            const currentIndex = stations.findIndex(s => s.id === currentStation?.id);

            const handleNext = () => {
                if (stations.length === 0) return;
                const nextIdx = (currentIndex + 1) % stations.length;
                onPlayStation(stations[nextIdx]);
            };

            const handlePrev = () => {
                if (stations.length === 0) return;
                const prevIdx = (currentIndex - 1 + stations.length) % stations.length;
                onPlayStation(stations[prevIdx]);
            };

            const togglePlay = () => {
                const audio = audioRef.current;
                if (!audio) return;
                if (isPlaying) {
                    audio.pause();
                    setIsRadioPlaying(false);
                } else {
                    audio.play().then(() => setIsRadioPlaying(true)).catch(() => setIsRadioPlaying(false));
                }
            };

            return (
                <div ref={ref} className="min-h-[85vh] flex flex-col justify-between p-3 sm:p-6 animate-fade-in w-full max-w-6xl mx-auto text-[#22c55e]">
                    <header className="w-full flex flex-col sm:flex-row justify-between items-center mb-6 gap-3 glass-panel px-6 py-4 rounded-2xl">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                                <i className="fa-solid fa-tower-broadcast text-white text-lg"></i>
                            </div>
                            <div>
                                <h1 className="orbitron font-extrabold text-sm sm:text-lg tracking-wider text-cyan-400">
                                    BOX PLAY TV <span className="text-[10px] px-2 py-0.5 rounded-full bg-cyan-500/20 border border-cyan-500/40 text-cyan-300 ml-1">CYBER RADIO PRO ULTRA</span>
                                </h1>
                                <p className="text-[10px] text-gray-400 font-mono">Terminal de audio digital sincronizado // v6.5</p>
                            </div>

        const AiAssistantSection = ({ content, onSelectMovie }) => {
            const [query, setQuery] = useState('');

            ]);
            const [isThinking, setIsThinking] = useState(false);

            const catalog = useMemo(() => [...content.movies2, ...content.movies, ...content.series, ...content.animated].filter(x => x && (x.title || x.name)), [content]);

            const handleSend = async (e) => {
                e.preventDefault();
                if (!query.trim() || isThinking) return;
                const q = query.trim();
                setQuery('');
                setMessages(prev => [...prev, { role: 'user', text: q }]);
                setIsThinking(true);
                const words = q.toLowerCase().split(/\s+/).filter(w => w.length > 2);
                const scored = catalog.map(item => {
                    const hay = [item.title, item.name, item.genre, item.description, item.sinopsis].filter(Boolean).join(' ').toLowerCase();
                    let score = 0;
                    words.forEach(w => { if (hay.includes(w)) score += 1; });
                    return { item, score };
                }).filter(x => x.score > 0).sort((a,b) => b.score - a.score).slice(0, 4);

                await new Promise(r => setTimeout(r, 300));
                if (scored.length) {
                    setMessages(prev => [...prev, { role: 'assistant', text: `Encontré estas opciones para "${q}":\n\n${scored.map((x,i) => `${i+1}. ${x.item.title}`).join('\n')}` }]);

                                    const rawTracks = alb.tracks || alb.pistas || alb.canciones || [];
                                    const albumMusicUrl = convertUrl(alb.musicUrl || alb.urlDrive || alb.url || '');
                                    
                                    // Si no trae canciones individuales pero sí trae la dirección de música del álbum, crea una pista inicial
                                    const finalTracks = rawTracks.length > 0 ? rawTracks.map((t, ti) => ({
                                        title: t.title || t.titulo || `Pista ${ti + 1}`,
                                        audio: convertUrl(t.audio || t.urlDrive || t.url || albumMusicUrl || ''),
                                        duration: t.duration || t.duracion || '3:30'
                                    })) : (albumMusicUrl ? [{
                                        title: alb.album || alb.titulo || 'Álbum Completo',
                                        audio: albumMusicUrl,
                                        duration: 'Completo'
                                    }] : []);

                                    return {
                                        id: alb.id || `alb-${idx}`,
                                        artist: alb.artist || alb.artista || 'Artista Clásico',
                                        album: alb.album || alb.titulo || alb.title || 'Álbum Clásico',
                                        year: String(alb.year || alb.año || '1980'),
                                        genre: alb.genre || alb.genero || 'Rock',
                                        cover: alb.cover || alb.imagen || alb.image || 'https://placehold.co/300x300/111/d4af37?text=DISCO',
                                        musicUrl: albumMusicUrl,
                                        description: alb.description || alb.descripcion || 'Colección histórica musical.',
                                        tracks: finalTracks
                                    };
                                });
                            }
                        }

                        setContent({ tv: tvChannels, movies: moviesList, movies2: movies2List, series: seriesList, animated: animatedList, tudum: [], albums: loadedAlbums });
                        setRadioStations(loadedRadios);
                        setCurrentRadioStation(loadedRadios[0]);
                    } catch (err) {
                        console.error("Error inicializando datos:", err);
                    } finally {
                        setLoading(false);
                    }
                };

                initData();
            }, []);

            // Audio radio controller
            useEffect(() => {
                if (!audioRef.current) {
                    audioRef.current = new Audio();
                    audioRef.current.crossOrigin = "anonymous";
                }
            }, []);

            const handlePlayRadio = (station) => {
                setCurrentRadioStation(station);
                setIsRadioPlaying(true);
                setStreamError(false);

                const audio = audioRef.current;
                if (!audio) return;

                if (hlsRef.current) {
                    hlsRef.current.destroy();
                    hlsRef.current = null;
                }

                const targetUrl = station.url || '';
                if (targetUrl.includes('.m3u8') && Hls.isSupported()) {
                    const hls = new Hls({ enableWorker: true });
                    hlsRef.current = hls;
                    hls.loadSource(targetUrl);
                    hls.attachMedia(audio);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => { audio.play().catch(() => {}); });
                    hls.on(Hls.Events.ERROR, () => { setStreamError(true); });
                } else {
                    audio.src = targetUrl;
                    audio.play().catch(() => setStreamError(true));
                }
            };

            const toggleFavorite = (item) => {
                const itemId = item.id || item.title;
                if (favorites.some(f => (f.id || f.title) === itemId)) {
                    setFavorites(favorites.filter(f => (f.id || f.title) !== itemId));
                } else {
                    setFavorites([...favorites, item]);
                }
            };

            const handlePlayMovie = (item) => {
                setSelectedItem(item);
                if (item.type === 'series') {
                    setSelectedEpisode(item.seasons?.[0]?.episodes?.[0] || null);
                } else {
                    setSelectedEpisode(null);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="min-h-screen bg-[#020617] text-[#f8fafc] font-sans flex flex-col relative w-full">
                    {/* Header */}
                    <header className="sticky top-0 z-50 glass-header px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-2xl w-full">
                        <div className="flex items-center gap-3 sm:gap-6">
                            <div className="flex items-center gap-2 cursor-pointer group" onClick={() => { setActiveTab('home'); setSelectedItem(null); }}>
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                                    <Icon name="play" fill="white" size={14}/>
                                </div>
                                <span className="font-black text-base sm:text-lg tracking-tight">BOXPLAY<span className="text-cyan-400">TV</span></span>
                            </div>

                            <nav className="hidden lg:flex items-center gap-1">
                                {navTabs.map(tab => (
                                    <button 
                                        key={tab.id}
                                        onClick={() => { setActiveTab(tab.id); setSelectedItem(null); }}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${activeTab === tab.id ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 shadow-sm' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                    >
                                        <Icon name={tab.icon} size={13} />
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        <div className="flex items-center gap-2 sm:gap-3">
                            <button onClick={() => { setActiveTab('aiassistant'); setSelectedItem(null); }} className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-cyan-600 to-teal-500 text-white text-xs font-bold flex items-center gap-1.5 shadow-md">
                                <Icon name="chat" size={14} />
                                <span className="hidden sm:inline">Asistente IA</span>
                            </button>
                            <input 
                                type="text"
                                placeholder="Buscar..."
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                                className="bg-[#090d1f] border border-slate-800 rounded-full px-3.5 py-1.5 text-xs text-white outline-none focus:border-cyan-500 w-28 sm:w-44"
                            />
                        </div>
                    </header>

                    {/* Barra Móvil Inferior */}
                    <div className="lg:hidden fixed bottom-0 w-full glass-panel border-t border-slate-800 z-50 flex py-2 px-1 items-center justify-around shadow-2xl">
                        {[
                            { id: 'home', icon: 'search', label: 'Inicio' },
                            { id: 'movies', icon: 'clapperboard', label: 'Películas' },
                            { id: 'tv', icon: 'tv', label: 'TV' },
                            { id: 'radio', icon: 'radio', label: 'Radio' },
                            { id: 'coleccion', icon: 'disc', label: 'Colección' }
                        ].map(tab => (
                            <button 
                                key={tab.id}
                                onClick={() => { setActiveTab(tab.id); setSelectedItem(null); }}
                                className={`flex flex-col items-center justify-center flex-1 py-1 gap-1 text-[9px] font-bold ${activeTab === tab.id ? 'text-cyan-400' : 'text-slate-400'}`}
                            >
                                <Icon name={tab.icon} size={16} />
                                <span>{tab.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* Cuerpo Principal */}
                    <main className="flex-1 w-full pb-20 lg:pb-10">
                        {activeTab === 'coleccion' ? (
                            <ClassicMusicSection albumsData={content.albums} />
                        ) : activeTab === 'radio' ? (
                            <CyberRadioSection 
                                stations={radioStations}
                                currentStation={currentRadioStation}
                                isPlaying={isRadioPlaying}
                                onPlayStation={handlePlayRadio}
                                volume={radioVolume}
                                setVolume={setRadioVolume}
                                streamError={streamError}
                                isLoading={isLoadingRadio}
                                audioRef={audioRef}
                                clockTime={clockTime}
                                isMuted={isMuted}
                                setIsMuted={setIsMuted}
                                isPowerOn={isPowerOn}
                                setIsPowerOn={setIsPowerOn}
                                oscilloscopePoints={oscilloscopePoints}
                                radioFilter={radioFilter}
                                setRadioFilter={setRadioFilter}
                                hlsRef={hlsRef}
                                setIsRadioPlaying={setIsRadioPlaying}
                            />
                        ) : activeTab === 'aiassistant' ? (
                            <AiAssistantSection content={content} onSelectMovie={handlePlayMovie} />
                        ) : activeTab === 'smartview' ? (
                            <div className="max-w-3xl mx-auto p-6 text-center space-y-4 animate-fade-in">
                                <div className="glass-panel p-8 rounded-3xl border border-cyan-500/30">
                                    <h2 className="text-xl font-black text-white">Configuración de Boxplaytv en Smart TV</h2>
                                    <p className="text-xs text-gray-300 mt-2">Instala la app <strong>Downloader</strong> e introduce el código oficial:</p>
                                    <div className="bg-cyan-950/80 border border-cyan-500/50 p-4 rounded-2xl my-4 text-2xl font-black tracking-widest text-cyan-300">
                                        8614069
                                    </div>
                                    <p className="text-[11px] text-gray-400">Guarda la web en favoritos para acceder siempre con un clic.</p>
                                </div>
                            </div>
                        ) : selectedItem ? (
                            /* Reproductor de Video */
                            <div className="w-full flex flex-col items-center animate-fade-in">
                                <div className="w-full aspect-video max-h-[70vh] bg-black relative flex items-center justify-center video-container-fix">
                                    <button onClick={() => setSelectedItem(null)} className="absolute top-4 left-4 z-30 bg-black/80 text-white px-4 py-1.5 rounded-full border border-cyan-500/40 text-xs font-bold flex items-center gap-2">
                                        <Icon name="arrowLeft" size={12}/> Volver
                                    </button>
                                    <iframe 
                                        src={convertUrl(selectedEpisode ? selectedEpisode.url : selectedItem.url)} 
                                        className="w-full h-full border-0 absolute inset-0 object-contain" 
                                        allow="autoplay; encrypted-media; fullscreen" 
                                        allowFullScreen
                                    ></iframe>
                                </div>
                                <div className="max-w-5xl w-full p-6 space-y-4">
                                    <h1 className="text-xl sm:text-2xl font-black text-white">{selectedItem.title}</h1>
                                    <p className="text-xs sm:text-sm text-gray-300 leading-relaxed">{selectedItem.descripcion || selectedItem.description || 'Sin descripción.'}</p>
                                </div>
                            </div>
                        ) : (
                            /* Catálogo / Inicio */
                            <div className="space-y-6 pt-6">
                                {activeTab === 'home' && (
                                    <>
                                        <ContentRow title="✨ Estrenos 2026" items={content.movies2} onPlay={handlePlayMovie} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />
                                        <ContentRow title="🎬 Películas Destacadas" items={content.movies} onPlay={handlePlayMovie} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />
                                        <ContentRow title="📺 Series" items={content.series} onPlay={handlePlayMovie} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />
                                        <ContentRow title="🎨 Animados" items={content.animated} onPlay={handlePlayMovie} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />
                                    </>
                                )}
                                {activeTab === 'movies' && <ContentRow title="🎬 Catálogo de Películas" items={content.movies} onPlay={handlePlayMovie} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />}
                                {activeTab === 'movies2' && <ContentRow title="✨ Estrenos 2026" items={content.movies2} onPlay={handlePlayMovie} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />}
                                {activeTab === 'series' && <ContentRow title="📺 Series Completas" items={content.series} onPlay={handlePlayMovie} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />}
                                {activeTab === 'animated' && <ContentRow title="🎨 Animados & Dibujos" items={content.animated} onPlay={handlePlayMovie} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />}
                                {activeTab === 'favorites' && <ContentRow title="❤️ Mis Favoritos" items={favorites} onPlay={handlePlayMovie} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} />}
                                {activeTab === 'tv' && (
                                    <div className="max-w-6xl mx-auto px-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                                        {content.tv.map((ch, idx) => (
                                            <div key={idx} onClick={() => handlePlayMovie(ch)} className="glass-panel p-3 rounded-xl border border-slate-800 hover:border-cyan-500 cursor-pointer flex items-center gap-3">
                                                <div className="w-9 h-9 rounded-full bg-black p-1 border border-cyan-500/40 shrink-0">
                                                    <img src={ch.image} alt="" className="w-full h-full object-cover rounded-full" onError={(e)=>e.target.style.display='none'} />
                                                </div>
                                                <div className="min-w-0 flex-1">
                                                    <h4 className="text-xs font-bold text-white truncate">{ch.title}</h4>
                                                    <span className="text-[10px] text-gray-400 truncate block">{ch.group}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
