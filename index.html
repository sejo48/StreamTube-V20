<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAaa4Rs4vk2xq0PzXnb9tdLnt1oqqj4qa4",
    authDomain: "boxplaytv-b32d8.firebaseapp.com",
    databaseURL: "https://boxplaytv-b32d8-default-rtdb.firebaseio.com",
    projectId: "boxplaytv-b32d8",
    storageBucket: "boxplaytv-b32d8.firebasestorage.app",
    messagingSenderId: "165114643998",
    appId: "1:165114643998:web:d12cb70574ac11f29a100f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Diagnóstico interno: no mostrar avisos técnicos a los espectadores.
  window.mostrarDiagnosticoPresencia = function(mensaje, error = false) {
    const avisoAnterior = document.getElementById('boxplay-presence-debug');
    if (avisoAnterior) avisoAnterior.remove();
    if (error) console.warn('[BOXPLAYTV presencia]', mensaje);
    else console.debug('[BOXPLAYTV presencia]', mensaje);
  };

  // Función pública para registrar actividad. El componente React está en otro script
  // y no puede acceder directamente a la variable db de este módulo.
  window.registrarPresenciaBoxplay = async function(emailUsuario, deviceId) {
    const email = String(emailUsuario || '').trim().toLowerCase();
    const id = String(deviceId || '').trim();
    if (!email || !id) throw new Error('Falta el correo o el identificador del dispositivo.');
    const presenceId = encodeURIComponent(email) + '__' + id;
    await setDoc(doc(db, 'presencia', presenceId), {
      email,
      deviceId: id,
      lastSeenMs: Date.now(),
      estado: 'online'
    }, { merge: true });
    return true;
  };

  // Verifica suscripción Y valida deviceId (1 dispositivo por cuenta)
  window.verificarSuscripcion = async function(emailUsuario, deviceId) {
    try {
      const email = String(emailUsuario || '').trim().toLowerCase();
      if (!email) return { activo: false, razon: 'no_existe' };

      const docRef = doc(db, "suscripciones", email);
      const docSnap = await getDoc(docRef);

      if (!docSnap.exists()) return { activo: false, razon: 'no_existe' };

      const data = docSnap.data();
      const hoy = new Date();
      const expiracion = new Date(data.expires_at);

      if (data.status !== "active" || !Number.isFinite(expiracion.getTime()) || hoy >= expiracion) {
        return { activo: false, razon: 'vencida', expiresAt: Number.isFinite(expiracion.getTime()) ? expiracion.toISOString() : null };
      }

      const devices = Array.isArray(data.devices) ? data.devices : [];

      if (devices.length === 0) {
        try { await updateDoc(docRef, { devices: [deviceId] }); } catch (e) {}
        return { activo: true, razon: 'ok', primerDispositivo: true, expiresAt: expiracion.toISOString() };
      }

      if (devices.includes(deviceId)) {
        return { activo: true, razon: 'ok', expiresAt: expiracion.toISOString() };
      }

      return { activo: false, razon: 'dispositivo_no_autorizado' };

    } catch (error) {
      console.error("Error al verificar la suscripción:", error);
      return { activo: false, razon: 'error' };
    }
  };

  window.resetearDispositivos = async function(emailUsuario) {
    try {
      const email = String(emailUsuario || '').trim().toLowerCase();
      const docRef = doc(db, "suscripciones", email);
      await updateDoc(docRef, { devices: [] });
      return true;
    } catch (error) {
      console.error("Error al resetear dispositivos:", error);
      return false;
    }
  };
</script>

<body>
    <div id="root">
        <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#020617;color:white;flex-direction:column;font-family:sans-serif;">
            <div style="width:40px;height:40px;border:3px solid #06b6d4;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
            <h2 style="font-weight: 700; font-size: 0.95rem; letter-spacing: 0.05em; color: #94a3b8;">Cargando Boxplaytv...</h2>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef, useMemo } = React;

        const safeStorage = {
            getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } }
        };

        // Genera un ID único por dispositivo
        const getOrCreateDeviceId = () => {
            let deviceId = safeStorage.getItem('boxplay_device_id');
            if (!deviceId) {
                deviceId = 'dev-' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
                safeStorage.setItem('boxplay_device_id', deviceId);
            }
            return deviceId;
        };

        const URLS = {
            TV: './listaoficial.m3u',
            SERIES: './playlist.json',
            MOVIES: './peliculas.json',
            MOVIES2: './peliculas2.json',
            ANIMADOS: './animados.json',
            RADIOS: './radios.json',
            TUDUM: './tudum.json'
        };

        const RAW_URLS = URLS; // Destination is resolved by catalog.js.


        const normalizeImageUrl = (value) => {
            if (typeof value !== 'string') return '';
            let url = value.trim().replace(/^['"]|['"]$/g, '');
            if (!url) return '';
            url = url.replace(/&amp;/gi, '&');
            if (url.startsWith('//')) url = 'https:' + url;
            if (url.startsWith('http://')) url = 'https://' + url.substring(7);
            return url;
        };

        const extractImageUrl = (obj) => {
            if (!obj || typeof obj !== 'object') return '';
            const fields = ['imagen', 'image', 'poster', 'img', 'logo', 'portada', 'cover', 'thumbnail', 'thumb', 'tvg-logo', 'backdrop'];
            for (const f of fields) {
                const value = normalizeImageUrl(obj[f]);
                if (value) return value;
            }
            return '';
        };

        const extractBackdropUrl = (obj) => {
            if (!obj || typeof obj !== 'object') return '';

        };

        const getImageCandidates = (url) => {
            const original = normalizeImageUrl(url);
            if (!original) return [];
            const candidates = [original];
            if (/^https?:\/\//i.test(original)) {
                candidates.push(`https://images.weserv.nl/?url=${encodeURIComponent(original)}`);
            }
            return [...new Set(candidates)];
        };

        const failedImageUrls = new Set();

        const generatePlaceholder = (title, type = 'poster') => {
            const safeTitle = (title || 'Sin Título').substring(0, 32).replace(/[<>&"']/g, '');
            if (type === 'tv') return `https://placehold.co/300x300/0f172a/06b6d4?text=${encodeURIComponent(safeTitle)}`;
            if (type === 'backdrop') return `https://placehold.co/1280x720/0f172a/06b6d4?text=${encodeURIComponent(safeTitle)}`;
            return `https://placehold.co/300x450/0f172a/06b6d4?text=${encodeURIComponent(safeTitle)}`;
        };

        const RobustImage = ({ src, alt = '', title = alt, type = 'poster', className = '', ...props }) => {
            const candidates = useMemo(() => getImageCandidates(src), [src]);
            const fallback = generatePlaceholder(title, type);
            const [sourceIndex, setSourceIndex] = useState(0);

            useEffect(() => { setSourceIndex(0); }, [src]);

            const currentSrc = candidates[
                failedImageUrls.has(candidates[0]) && candidates.length > 1
                    ? Math.max(sourceIndex, 1)
                    : sourceIndex
            ] || fallback;

            const handleError = () => {
                if (currentSrc && currentSrc !== fallback) failedImageUrls.add(currentSrc);
                if (sourceIndex < candidates.length - 1) setSourceIndex(prev => prev + 1);
                else if (sourceIndex !== candidates.length) setSourceIndex(candidates.length);
            };

            return <img src={currentSrc} alt={alt || title} className={className} onError={handleError} referrerPolicy="no-referrer" {...props} />;

            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) { 
                    const parts = url.split('/file/d/'); 
                    if (parts[1]) fileId = parts[1].split('/')[0]; 
                } else if (url.includes('id=')) { 
                    const parts = url.split('id='); 
                    if (parts[1]) fileId = parts[1].split('&')[0]; 
                }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;

            useEffect(() => {
                const canvas = canvasRef.current;
                const painter = canvas.getContext('2d');
                if (!painter) return;
                const buffer = new Uint8Array(128), peaks = new Float32Array(48);
                let frame, last = 0;
                const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
                const draw = time => {
                    frame = requestAnimationFrame(draw);
                    if (document.hidden || time - last < (reduced.matches ? 160 : 33)) return;
                    last = time;
                    const width = canvas.clientWidth, height = canvas.clientHeight;
                    const ratio = Math.min(window.devicePixelRatio || 1, 2);
                    if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) { canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio); }
                    painter.setTransform(ratio, 0, 0, ratio, 0, 0);
                    painter.clearRect(0, 0, width, height);
                    const active = engine?.frequencies(buffer);
                    painter.strokeStyle = 'rgba(103,232,249,.09)'; painter.lineWidth = 1;
                    for (let y = 24; y < height; y += 32) { painter.beginPath(); painter.moveTo(0,y); painter.lineTo(width,y); painter.stroke(); }
                    const gap = 3, barWidth = Math.max(1, (width - 47 * gap) / 48);
                    const gradient = painter.createLinearGradient(0, height, 0, 0);
                    gradient.addColorStop(0, '#0891b2'); gradient.addColorStop(.55, '#2dd4bf'); gradient.addColorStop(1, '#a5f3fc');
                    for (let i = 0; i < 48; i++) {
                        const from = Math.floor(Math.pow(i / 48, 1.7) * 116) + 1;
                        const to = Math.min(128, Math.max(from + 1, Math.floor(Math.pow((i + 1) / 48, 1.7) * 116) + 1));
                        let value = 0; for (let j = from; j < to; j++) value += buffer[j];
                        value = active ? value / (to - from) / 255 : 0;
                        const barHeight = Math.max(2, value * (height - 26));
                        peaks[i] = active ? Math.max(barHeight, peaks[i] - 2) : 2;
                        const x = i * (barWidth + gap);
                        painter.fillStyle = gradient; painter.fillRect(x, height - barHeight, barWidth, barHeight);
                        if (active) { painter.fillStyle = '#cffafe'; painter.fillRect(x, height - peaks[i] - 4, barWidth, 2); }
                    }
                };
                frame = requestAnimationFrame(draw);
                return () => cancelAnimationFrame(frame);
            }, [engine, status]);
            return <canvas ref={canvasRef} className="radio-spectrum" aria-label="Espectro de frecuencias del audio de la emisora" role="img" />;

            const migratePersonalCatalog = lists => {
                const all = Object.values(lists).flat();
                const migrate = item => {
                    const candidates = all.filter(entry => entry.type === item.type && entry.title === item.title);
                    const match = all.find(entry => entry.type === item.type && entry.id === item.id) || (candidates.length === 1 ? candidates[0] : null);
                    if (!match) return item;
                    return { ...item, ...match };
                };
                const watched = safeStorage.getItem('boxplay_watched_eps');
                if (watched) {
                    try {
                        const old = JSON.parse(watched), next = { ...old };
                        for (const item of all) {
                            const previous = [item.id, ...(item.legacyIds || [])];
                            const ids = previous.flatMap(key => Array.isArray(old[key]) ? old[key] : []);

                            const episodes = (item.seasons || []).flatMap(season => season.episodes);

                        const defaultStation = loadedStations.find(s => s.title.toLowerCase().includes('disco funk')) || loadedStations[0];
                        if (defaultStation && !catalogLoaded.current) setCurrentRadioStation(defaultStation);

                        migratePersonalCatalog({ movies: moviesList, movies2: movies2List, series: seriesList, animados: animadosList, tv: tvChannels, radio: loadedStations });
                        catalogLoaded.current = true;
                        setCatalogMessage('Catálogo actualizado.');
                        setHomeCoverConfig(coverConfiguration);
                        setContent({ tv: tvChannels, movies: moviesList, movies2: movies2List, series: seriesList, animados: animadosList, tudum: tudumList });
                    } catch (err) {
                        console.error("Error cargando contenido", err);
                        if (!cancelled) setCatalogMessage('No se pudo actualizar. Se conservó el catálogo anterior. ' + err.message);
                    } finally {
                        if (!cancelled) setLoading(false);
                    }
                };

                if (!catalogLoaded.current) {
                const storedFavs = safeStorage.getItem('boxplay_favs'); 
                if (storedFavs) { try { setFavorites(JSON.parse(storedFavs)); } catch(e) {} }
                const storedTvFavs = safeStorage.getItem('boxplay_tv_favs');
                if (storedTvFavs) { try { setTvFavorites(JSON.parse(storedTvFavs)); } catch(e) {} }
                const storedRadioFavs = safeStorage.getItem('boxplay_radio_favs');
                if (storedRadioFavs) { try { setRadioFavorites(recoverRadioFavorites(JSON.parse(storedRadioFavs), [])); } catch(e) {} }
                const storedCW = safeStorage.getItem('boxplay_continue_watching');
                if (storedCW) { try { setContinueWatching(JSON.parse(storedCW)); } catch(e) {} }
                const storedWatched = safeStorage.getItem('boxplay_watched_eps');
                if (storedWatched) { try { setWatchedEpisodes(JSON.parse(storedWatched)); } catch(e) {} }
                const storedSearches = safeStorage.getItem('boxplay_recent_searches');
                if (storedSearches) { try { setRecentSearches(JSON.parse(storedSearches)); } catch(e) {} }

                }
                init();
                return () => { cancelled = true; };
            }, [catalogRefresh]);

            useEffect(() => {
                if (activeTab === 'tv' && content.tv.length > 0) {
                    if (!selectedItem || selectedItem.type !== 'tv') {
                        const telerredChannel = BoxTVLive.initialChannel(content.tv);
                        if (telerredChannel) { setSelectedItem(telerredChannel); setIsLocked(false); }
                    }
                }
            }, [activeTab, content.tv]);

            useEffect(() => {
                if (activeTab !== 'radio') {
                    radioEngineRef.current?.stop();
                    setIsRadioPlaying(false);
                    return;
                }
                if (isRadioPlaying && currentRadioStation) {
                    const engine = getRadioEngine(), url = currentRadioStation.url || currentRadioStation.stream || '';
                    if (engine.url !== url || engine.status === 'idle') engine.start(currentRadioStation, radioVolume);
                } else radioEngineRef.current?.pause();
            }, [currentRadioStation, isRadioPlaying, activeTab]);
            useEffect(() => { radioEngineRef.current?.setVolume(radioVolume); }, [radioVolume]);
            useEffect(() => () => radioEngineRef.current?.dispose(), []);

            const recordContinueWatching = (item, episode = null) => {
                if (item.type === 'tv' || item.type === 'radio') return;
                const record = { ...item, lastEpisode: episode ? episode.title : null, lastEpisodeUrl: episode ? episode.url : null, timestamp: Date.now() };
                const itemId = item.id || item.title;
                const updated = [record, ...continueWatching.filter(c => (c.id || c.title) !== itemId)].slice(0, 7);
                setContinueWatching(updated);
                safeStorage.setItem('boxplay_continue_watching', JSON.stringify(updated));
                if (episode) markEpisodeAsWatched(item, episode, true);
            };

            const markEpisodeAsWatched = (item, episode, isWatched) => {
                const itemId = item.id || item.title;
                const epId = episode.id || episode.url;
                const currentWatched = { ...watchedEpisodes };
                if (!currentWatched[itemId]) currentWatched[itemId] = [];
                if (isWatched) { if (!currentWatched[itemId].includes(epId)) currentWatched[itemId].push(epId); }
                else { currentWatched[itemId] = currentWatched[itemId].filter(id => id !== epId); }
                setWatchedEpisodes(currentWatched);
                safeStorage.setItem('boxplay_watched_eps', JSON.stringify(currentWatched));
            };

            const addRecentSearch = (term) => {
                if (!term || !term.trim()) return;
                const cleaned = term.trim();
                const updated = [cleaned, ...recentSearches.filter(s => s.toLowerCase() !== cleaned.toLowerCase())].slice(0, 8);
                setRecentSearches(updated);
                safeStorage.setItem('boxplay_recent_searches', JSON.stringify(updated));
            };

            const parseM3U = (data) => {
                const lines = data.split('\n'); const channels = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        let title = 'Canal';
                        const url = lines[i + 1] ? lines[i + 1].trim() : '';
                        if (url && url.startsWith('http')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/); const logo = logoMatch ? logoMatch[1] : '';
                            const groupMatch = line.match(/group-title="([^"]*)"/); const group = groupMatch ? groupMatch[1] : 'General';
                            const commaIndex = line.lastIndexOf(',');
                            if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                            channels.push({ id: (line.match(/tvg-id="([^"]*)"/) || [,''])[1] || BoxCatalog.id({title}, 'tv'), title, image: logo || generatePlaceholder(title, 'tv'), group, url, type: 'tv' });
                        }
                    }
                }
                return channels;
            };

            const tvGroups = useMemo(() => {
                const groups = new Set(content.tv.map(c => c.group || 'General'));
                return ['ALL', ...Array.from(groups)];
            }, [content.tv]);

            const toggleFavorite = (item) => { 
                if (item.type === 'tv') {
                    const itemId = item.id || item.title;
                    const newTvFavs = tvFavorites.some(f => (f.id || f.title) === itemId) ? tvFavorites.filter(f => (f.id || f.title) !== itemId) : [item, ...tvFavorites];
                    setTvFavorites(newTvFavs);
                    safeStorage.setItem('boxplay_tv_favs', JSON.stringify(newTvFavs));
                } else if (item.type === 'radio') {
                    const station = BoxRadioFavorites.normalize([item], radioStations).items[0];
                    if (!station) return;
                    const identity = BoxRadioFavorites.key(station);
                    setRadioFavorites(previous => {
                        const saved = BoxRadioFavorites.normalize(previous, radioStations).items;
                        const next = saved.some(entry => BoxRadioFavorites.key(entry) === identity) ? saved.filter(entry => BoxRadioFavorites.key(entry) !== identity) : [station, ...saved];
                        safeStorage.setItem('boxplay_radio_favs', JSON.stringify(next));
                        return next;
                    });
                } else {
                    const itemId = item.id || item.title; 
                    const newFavs = favorites.some(f => (f.id || f.title) === itemId) ? favorites.filter(f => (f.id || f.title) !== itemId) : [item, ...favorites]; 
                    setFavorites(newFavs); 
                    safeStorage.setItem('boxplay_favs', JSON.stringify(newFavs)); 
                }
            };

            const isItemFavorite = (item) => {
                if (!item) return false;
                const itemId = item.id || item.title;
                if (item.type === 'tv') return tvFavorites.some(f => (f.id || f.title) === itemId);
                if (item.type === 'radio') { const identity = BoxRadioFavorites.key(item); return !!identity && radioFavorites.some(f => BoxRadioFavorites.key(f) === identity); }
                return favorites.some(f => (f.id || f.title) === itemId);
            };

            const toggleTvFullscreen = () => {
                if (tvContainerRef.current) {
                    if (!document.fullscreenElement) {
                        if (tvContainerRef.current.requestFullscreen) tvContainerRef.current.requestFullscreen().catch(() => {});
                        else if (tvContainerRef.current.webkitRequestFullscreen) tvContainerRef.current.webkitRequestFullscreen();
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    }
                }
            };

            const toggleMovieFullscreen = () => {
                if (movieContainerRef.current) {
                    if (!document.fullscreenElement) {
                        if (movieContainerRef.current.requestFullscreen) movieContainerRef.current.requestFullscreen().catch(() => {});
                        else if (movieContainerRef.current.webkitRequestFullscreen) movieContainerRef.current.webkitRequestFullscreen();
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    }
                }
            };

            const getDisplayContent = () => { 
                let list = activeTab === 'home' 
                    ? [...content.movies2, ...content.movies, ...content.series, ...content.animados, ...content.tv.slice(0,20)] 
                    : activeTab === 'trends' ? BoxHomeFeatures.pool(content)
                    : activeTab === 'favorites' 
                    ? [...favorites.filter(item => item.type !== 'tv' && item.type !== 'radio'), ...tvFavorites] 
                    : activeTab === 'topshows'
                    ? [...content.series, ...content.animados].slice(0, 15)
                    : content[activeTab] || []; 
                if (search && activeTab !== 'tv') return list.filter(i => (i.title || i.name || i.titulo || '').toLowerCase().includes(search.toLowerCase())); 
                return list; 
            };

            const displayedItems = getDisplayContent();
            
            const homeTrends = useMemo(() => BoxHomeFeatures.pool(content), [content]);
            const [featuredItems, setFeaturedItems] = useState([]);
            const [featuredLoading, setFeaturedLoading] = useState(false);
            useEffect(() => {
                let cancelled = false;
                setFeaturedLoading(true);
                BoxHomeFeatures.load(content, {
                    configuration: homeCoverConfig,
                    previous: safeStorage.getItem('boxplay_home_feature_last') || '',
                    isCancelled: () => cancelled
                }).then(items => { if (!cancelled) { setFeaturedItems(items); setFeaturedLoading(false); } });
                return () => { cancelled = true; };
            }, [content, homeCoverConfig]);
            const discardFeaturedArtwork = item => setFeaturedItems(items => items.filter(entry => BoxHomeFeatures.key(entry) !== BoxHomeFeatures.key(item)));

            const handleShowDetails = (item) => {
                if (item.type === 'radio') { setSelectedItem(null); setActiveTab('radio'); handlePlayRadioStation(item); window.history.pushState({ appState: 'main', activeTab: 'radio' }, ''); return; }
                if (item.type === 'tv' || item.type === 'radio') {
                    setSelectedItem(item);
                    setIsPlaying(false);
                    setIsLocked(false);
                    window.history.pushState({ appState: 'player', item: item.title }, '');
                    return;
                }
                setSelectedItem(item);
                setIsPlaying(false);
                setIsLocked(false);
                setDetailTab('info');
                setExpandedSeason(0);
                if (item.type === 'series' || item.type === 'animados') {
                    const firstEp = item.seasons?.[0]?.episodes?.[0] || null;
                    setSelectedEpisode(firstEp);
                } else {
                    setSelectedEpisode(null);
                }
                window.history.pushState({ appState: 'details', item: item.title }, '');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // 🔒 VALIDACIÓN AL DAR "VER AHORA" (Solo bloquea películas, series y animados. TV y Radio son gratis)
            const handlePlayNow = (item, episode = null) => {
                if (item.type !== 'tv' && item.type !== 'radio' && !isSubscriberActive) {
                    console.log("🔒 Paywall activado. isSubscriberActive =", isSubscriberActive, "tipo =", item.type);
                    setShowPaywallModal(true);
                    window.history.pushState({ appState: 'paywall-modal' }, '');
                    return;
                }

                const code = item.codigo || item.password || item.pin;
                setSelectedItem(item);
                setIsPlaying(true);
                
                if (code) { setIsLocked(true); } 
                else { setIsLocked(false); } 
                setExpandedSeason(0);
                
                if (item.type === 'series' || item.type === 'animados') {
                    const targetEp = episode || item.seasons?.[0]?.episodes?.[0] || null;
                    setSelectedEpisode(targetEp);
                    recordContinueWatching(item, targetEp);
                } else if (item.type === 'movies' || item.type === 'movies2') {
                    setSelectedEpisode(null);
                    recordContinueWatching(item, null);
                } else {
                    setSelectedEpisode(null);
                }
                
                if (search.trim()) addRecentSearch(search);
                window.history.pushState({ appState: 'player', item: item.title }, '');
                window.scrollTo({ top: 0, behavior: 'smooth' });

                setTimeout(() => {
                    const playerElement = movieContainerRef.current || document.querySelector('video') || document.querySelector('iframe');
                    if (playerElement) {
                        if (playerElement.requestFullscreen) {
                            playerElement.requestFullscreen().catch(() => {});
                        } else if (playerElement.webkitRequestFullscreen) {
                            playerElement.webkitRequestFullscreen();
                        }
                    }
                }, 300);
            };

            const handleRateMovie = item => {
                const identity = item.id || BoxHomeFeatures.key(item);
                const answer = window.prompt('Tu calificación personal (1-5). Se guarda en este dispositivo.', String(personalRatings[identity] || 5));
                if (answer === null) return;
                if (!/^[1-5]$/.test(answer.trim())) { window.alert('Escribe un número entero del 1 al 5.'); return; }
                const updated = { ...personalRatings, [identity]: Number(answer.trim()) };
                safeStorage.setItem('boxplay_personal_ratings', JSON.stringify(updated));
                setPersonalRatings(updated);
            };

            const handleDownloadMovie = item => {
                const targetUrl = item.urlDrive || item.rawUrl || item.url || '';
                if (!targetUrl.includes('drive.google.com')) return;
                setPendingDownloadUrl(getDriveDownloadUrl(targetUrl));
                setDownloadPinInput('');
                setDownloadPinError(false);
                setShowDownloadPinModal(true);
                window.history.pushState({ appState: 'download-modal' }, '');
            };

            const handleResume = item => {
                handleShowDetails(item);
                const episode = (item.seasons || []).flatMap(season => season.episodes).find(episode => episode.url === item.lastEpisodeUrl);
                if (episode) setSelectedEpisode(episode);
            };

            const handlePlay = (item) => {
                handleShowDetails(item);
            };

            const handlePlayRadioStation = record => {
                const station = BoxRadioFavorites.normalize([record], radioStations).items[0];
                if (!station) return;
                const engine = getRadioEngine(); engine.prepare();
                setCurrentRadioStation(station); setIsRadioPlaying(true);
                // A retry or selecting the current station must work without a state change.
                if (activeTab === 'radio') engine.start(station, radioVolume);
            };
            const handleToggleRadio = () => {
                if (['playing', 'loading'].includes(radioState.status)) { radioEngineRef.current?.pause(); setIsRadioPlaying(false); }
                else handlePlayRadioStation(currentRadioStation || radioStations[0]);
            };


            const handleTabClick = (tab) => {
                if (tab.id === 'home' && activeTab === 'home' && !loading) { lastHomeWake.current = Date.now(); setCatalogRefresh(value => value + 1); }
                if (tab.id !== 'radio') { radioEngineRef.current?.stop(); setIsRadioPlaying(false); }
                setActiveTab(tab.id); setSearch(''); setShowMobileSearch(false); setIsLocked(false); setIsPlaying(false); setShowMobileMoreMenu(false);
                window.history.pushState({ appState: 'main', activeTab: tab.id }, '');
                if (tab.id === 'tv') {
                    if (!selectedItem || selectedItem.type !== 'tv') {
                        const telerredChannel = BoxTVLive.initialChannel(content.tv);
                        if (telerredChannel) setSelectedItem(telerredChannel);
                    }
                } else if (tab.id === 'radio') {
                    if (!currentRadioStation && radioStations.length > 0) {
                        const def = radioStations.find(s => s.title.toLowerCase().includes('disco funk')) || radioStations[0];
                        setCurrentRadioStation(def);
                    }
                } else { setSelectedItem(null); }
            };

            if (showIntro) return <IntroScreen onEnter={() => { 
                setShowIntro(false); 
                window.history.pushState({ appState: 'main', activeTab: 'home' }, ''); 
            }}/>;

            return (
                <div className="min-h-screen bg-[#020617] text-[#f8fafc] font-sans flex flex-col relative selection:bg-cyan-500 selection:text-white w-full max-w-[100vw] overflow-x-hidden">
                    <header className="box-header fixed top-0 left-0 right-0 z-50 glass-header px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-2xl w-full">
                        <div className="flex items-center gap-4 lg:gap-8">
                            <div className="flex items-center gap-2.5 cursor-pointer group" onClick={() => handleTabClick(navTabs[0])}>
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)] group-hover:scale-105 transition-transform flex-shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className="w-5 h-5 fill-white"><polygon points="40,30 70,50 40,70"/></svg>
                                </div>
                                <span className="font-black text-base sm:text-lg tracking-tight">BOXPLAY<span className="text-cyan-400">TV</span></span>
                            </div>
                            <nav aria-label="Secciones principales" className="hidden lg:flex items-center gap-1.5">
                                {navTabs.slice(0, 9).map(tab => (
                                    <button key={tab.id} onClick={() => handleTabClick(tab)} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${activeTab === tab.id ? 'bg-cyan-500/15 text-cyan-400 border border-cyan-500/40 shadow-[0_0_15px_rgba(6,182,212,0.2)]' : 'text-slate-400 hover:text-white hover:bg-white/5 border border-transparent'}`}>
                                        <Icon name={tab.icon} size={14}/>
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>
                        <div className="box-header-actions flex items-center gap-2 sm:gap-3">
                            <button className="box-notification-toggle" aria-label={`Avisos${unreadNoticeCount ? ', ' + unreadNoticeCount + ' sin leer' : ''}`} aria-expanded={showNotices} onClick={() => { setShowNotices(true); refreshNotices(); }}>
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
                                {unreadNoticeCount > 0 && <span className="box-notification-count" aria-hidden="true">{unreadNoticeCount > 99 ? '99+' : unreadNoticeCount}</span>}
                            </button>
                            <button className="box-phone-search" aria-label="Buscar contenido" aria-expanded={showMobileSearch} onClick={() => { if (!showMobileSearch) { setActiveTab('home'); setSelectedItem(null); setIsPlaying(false); } setShowMobileSearch(value => !value); }}><Icon name={showMobileSearch ? 'x' : 'search'} size={22} /></button>
                            <button onClick={() => setCatalogRefresh(value => value + 1)} disabled={loading} className="p-2 sm:px-3 sm:py-2 rounded-xl bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 text-xs font-bold disabled:opacity-50" title="Actualizar catálogo">Actualizar catálogo</button>
                            <button onClick={() => handleTabClick(navTabs.find(t => t.id === 'favorites'))} className="p-2 sm:px-3 sm:py-2 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 border border-cyan-500/30 transition-all text-xs font-bold flex items-center gap-1.5 shadow-md">
                                <Icon name="heart" size={16} fill={activeTab === 'favorites' ? '#06b6d4' : 'none'} className="text-cyan-400"/>
                                <span className="hidden md:inline">Favs</span>
                            </button>
                            <button onClick={() => handleTabClick(navTabs.find(tab => tab.id === 'devices'))} className="p-2 sm:px-3 sm:py-2 rounded-xl bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 text-xs font-bold flex items-center gap-1.5"><Icon name="download" size={16}/><span>Instalar y dispositivos</span></button>
                            <div className="relative hidden sm:block w-36 lg:w-48">
                                <input type="text" placeholder="Buscar contenido..." className="w-full bg-[#090d1f] border border-slate-800 rounded-full px-4 py-2 text-xs text-white focus:border-cyan-500 outline-none pl-9 transition-colors placeholder-slate-500 shadow-inner" value={search} onChange={(e) => setSearch(e.target.value)} onFocus={() => setIsSearchFocused(true)} onBlur={() => setTimeout(() => setIsSearchFocused(false), 250)} onKeyDown={(e) => { if (e.key === 'Enter' && search.trim()) { addRecentSearch(search); setIsSearchFocused(false); } }}/>
                                <Icon className="absolute left-3 top-2.5 text-slate-400" name="search" size={14}/>
                                {search && <button onClick={() => setSearch('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-white"><Icon name="x" size={14}/></button>}
                                {isSearchFocused && recentSearches.length > 0 && !search && (
                                    <div className="absolute top-full left-0 right-0 mt-2 glass-panel rounded-2xl p-2 shadow-2xl z-50 animate-fade-in">
                                        <div className="flex items-center justify-between px-2.5 py-1 text-[10px] text-cyan-400 font-bold uppercase tracking-wider border-b border-slate-800 mb-1">
                                            <span>Búsquedas Recientes</span>
                                            <button onClick={(e) => { e.stopPropagation(); setRecentSearches([]); safeStorage.setItem('boxplay_recent_searches', JSON.stringify([])); }} className="hover:text-white">Borrar</button>
                                        </div>
                                        <div className="flex flex-col gap-1 max-h-48 overflow-y-auto custom-scrollbar">
                                            {recentSearches.map((term, sIdx) => (
                                                <div key={sIdx} onMouseDown={() => { setSearch(term); addRecentSearch(term); setIsSearchFocused(false); }} className="px-3 py-2 rounded-xl text-xs text-slate-300 hover:bg-cyan-500/20 hover:text-white cursor-pointer transition-colors flex items-center justify-between">
                                                    <div className="flex items-center gap-2 truncate">
                                                        <Icon name="search" size={12} className="text-slate-500"/>
                                                        <span className="truncate">{term}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                        </div>
                    </header>
                    {showMobileSearch && <form className="box-phone-only box-search-panel" role="search" onSubmit={event => { event.preventDefault(); addRecentSearch(search); setShowMobileSearch(false); }}>
                        <input autoFocus type="search" aria-label="Buscar películas y series" placeholder="Buscar películas y series…" value={search} onChange={event => { setSearch(event.target.value); if (selectedItem) { setSelectedItem(null); setIsPlaying(false); } }} />
                    </form>}
                    {catalogMessage && <p role="status" className={`box-catalog-status ${catalogMessage === 'Catálogo actualizado.' ? 'box-catalog-success' : ''} fixed top-20 left-4 z-40 text-xs bg-slate-900 text-cyan-100 p-2 rounded-xl max-w-[90vw]`}>{catalogMessage}</p>}

                    <nav aria-label="Navegación principal móvil" className="box-bottom-nav lg:hidden fixed bottom-0 w-full max-w-[100vw] glass-panel border-t border-slate-800 z-50 flex py-2 pb-safe px-1 items-center justify-around shadow-[0_-10px_30px_rgba(0,0,0,0.9)]">
                        {[{ id: 'home', icon: 'search', label: 'Inicio' }, { id: 'movies', icon: 'clapperboard', label: 'Películas' }, { id: 'movies2', icon: 'star', label: 'Estrenos' }, { id: 'tv', icon: 'tv', label: 'TV' }, { id: 'radio', icon: 'radio', label: 'Radio' }, { id: 'favorites', icon: 'heart', label: 'Favs' }].map(tab => (
                            <button key={tab.id} onClick={() => handleTabClick(tab)} className={`box-legacy-nav-button flex flex-col items-center justify-center flex-1 py-1 gap-1 transition-all active:scale-95 rounded-xl ${activeTab === tab.id ? 'text-cyan-400 bg-cyan-950/40 border border-cyan-500/30' : 'text-slate-400 hover:text-white'}`}>
                                <Icon name={tab.icon} size={16}/>
                                <span className="text-[9px] font-medium tracking-wide">{tab.label}</span>
                            </button>
                        ))}
                        {[{ id: 'home', icon: 'search', label: 'Inicio' }, { id: 'movies2', icon: 'star', label: 'Estrenos' }, { id: 'movies', icon: 'clapperboard', label: 'Películas' }, { id: 'series', icon: 'film', label: 'Series' }, { id: 'animados', icon: 'smile', label: 'Animados' }].map(tab => (
                            <button key={'phone-' + tab.id} onClick={() => handleTabClick(tab)} aria-current={activeTab === tab.id ? 'page' : undefined} className={`box-phone-nav-button flex-col items-center justify-center flex-1 gap-1 rounded-xl ${activeTab === tab.id ? 'text-cyan-400 bg-cyan-950/40' : 'text-slate-400'}`}>
                                <Icon name={tab.icon} size={20}/><span>{tab.label}</span>

                                                                            className="p-3 rounded-xl cursor-pointer flex items-center gap-3 bg-white/5 hover:bg-white/10 transition-colors border border-slate-800/50"
                                                                        >
                                                                            <div className="w-6 h-6 rounded-full bg-cyan-600 flex items-center justify-center text-white text-[10px] font-bold flex-shrink-0">
                                                                                {eIdx + 1}
                                                                            </div>
                                                                            <span className="text-sm text-slate-200 truncate flex-1 font-medium">{ep.title}</span>
                                                                            <Icon name="play" size={14} className="text-slate-500 flex-shrink-0"/>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        
                                        {(() => {
                                            const currentId = selectedItem.id || selectedItem.title;
                                            const otrasPeliculas = (content.movies2 || [])
                                                .filter(m => (m.id || m.title) !== currentId)
                                                .slice(0, 6);
                                            
                                            if (otrasPeliculas.length === 0) return null;
                                            
                                            return (
                                                <div className="mt-16 pt-8 border-t border-slate-800/80">
                                                    <div className="flex items-center gap-3 mb-6">
                                                        <span className="w-1.5 h-6 bg-cyan-500 rounded-full shadow-[0_0_15px_#06b6d4]"></span>
                                                        <h3 className="text-lg sm:text-xl font-black uppercase tracking-wider text-white">
                                                            Más estrenos 2026
                                                        </h3>
                                                        <span className="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-2.5 py-0.5 rounded-full font-mono">
                                                            {otrasPeliculas.length}
                                                        </span>
                                                    </div>
                                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                                                        {otrasPeliculas.map((sim, sIdx) => {
                                                            const simTitle = sim.titulo || sim.title || 'Estreno';
                                                            const simImg = extractImageUrl(sim);
                                                            return (
                                                                <div
                                                                    key={sim.id || sIdx}
                                                                    className="group cursor-pointer transition-transform duration-300 hover:-translate-y-2"
                                                                    onClick={() => {
                                                                        setSelectedItem(sim);
                                                                        setSelectedEpisode(null);
                                                                        setExpandedSeason(0);
                                                                        setDetailTab('info');
                                                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                                                    }}
                                                                >
                                                                    <div className="aspect-[2/3] rounded-2xl overflow-hidden border-2 border-slate-800 group-hover:border-cyan-500 transition-all duration-300 bg-black shadow-xl relative">
                                                                        <RobustImage
                                                                            src={simImg}
                                                                            alt={simTitle}
                                                                            title={simTitle}
                                                                            type="poster"
                                                                            className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
                                                                        />
                                                                        {sim.qualityTag && (
                                                                            <span className="absolute top-2 right-2 bg-cyan-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded uppercase">
                                                                                {sim.qualityTag}
                                                                            </span>
                                                                        )}
                                                                        {sim.rating && (
                                                                            <span className="absolute bottom-2 left-2 bg-black/80 backdrop-blur-md text-amber-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-500/40">
                                                                                ⭐ {sim.rating}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                    <p className="text-xs font-bold text-white mt-2 line-clamp-2 group-hover:text-cyan-300 transition-colors">
                                                                        {simTitle}
                                                                    </p>
                                                                    {(sim.year || sim.generosTexto) && (
                                                                        <p className="text-[10px] text-slate-400 mt-0.5 line-clamp-1">
                                                                            {sim.year}
                                                                            {sim.generosTexto && ` · ${sim.generosTexto.split(',')[0].trim()}`}
                                                                        </p>
                                                                    )}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}
                            </div>
                        ) : activeTab === 'devices' ? (
                            <DevicesSection onInstall={handleInstallApp} installed={isAppInstalled} installing={installingApp} />
                        ) : activeTab === 'payments' ? (
                            <PaymentsSection emailUsuario={emailUsuario} isSubscriberActive={isSubscriberActive} expiresAt={accessExpiresAt} onVerify={() => setShowPaywallModal(true)} />
                        ) : (
                            <>
                                {activeTab === 'home' && !search && <FeaturedHome key={featuredItems.map(item => item.id || BoxHomeFeatures.key(item)).join('|')} items={featuredItems} onArtworkError={discardFeaturedArtwork} onPlay={handlePlayNow} onRate={handleRateMovie} onDownload={handleDownloadMovie} ratings={personalRatings} pending={loading || featuredLoading} isItemFavorite={isItemFavorite} onToggleFavorite={toggleFavorite} />}
                                {activeTab === 'home' && !search && <HomeShortcuts onNavigate={id => handleTabClick(navTabs.find(tab => tab.id === id))} />}
                                {activeTab === 'home' && !search ? (
                                    <div className="home-shelves">
                                        {continueWatching.length > 0 && <HomeShelf title="Continuar viendo" subtitle="Retoma lo que estabas disfrutando." items={continueWatching} onPlay={handleResume} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} resume />}
                                        <HomeShelf title="Tendencias" subtitle="Una selección de estrenos y títulos para descubrir." items={homeTrends} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} onExplore={() => handleTabClick({ id: 'trends' })} />
                                        <HomeShelf title="Estrenos 2026" subtitle="Las novedades del catálogo, en un solo lugar." items={content.movies2} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} onExplore={() => handleTabClick(navTabs.find(tab => tab.id === 'movies2'))} />
                                        <HomeShelf title="Películas para ti" items={content.movies} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} onExplore={() => handleTabClick(navTabs.find(tab => tab.id === 'movies'))} />
                                        <HomeShelf title="Series" subtitle="Encuentra tu próxima historia." items={content.series} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} onExplore={() => handleTabClick(navTabs.find(tab => tab.id === 'series'))} />
                                        <HomeShelf title="Animados" items={content.animados} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} onExplore={() => handleTabClick(navTabs.find(tab => tab.id === 'animados'))} />
                                        <HomeShelf title="Mi lista" items={favorites.filter(item => item.type !== 'tv' && item.type !== 'radio')} onPlay={handlePlay} favorites={favorites} tvFavorites={tvFavorites} onToggleFavorite={toggleFavorite} onExplore={() => handleTabClick(navTabs.find(tab => tab.id === 'favorites'))} />
                                        {content.tudum.length > 0 && <section className="home-shelf" aria-label="Próximamente"><div className="home-shelf-heading"><div className="home-shelf-title"><span className="home-shelf-mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="m5 17 12-12M5 5h12v12"/></svg></span><div><h2>Próximamente</h2><p>Avances y próximos lanzamientos.</p></div></div></div><div className="home-coming">{content.tudum.slice(0, 6).map((item, index) => <article key={item.title + index}><RobustImage src={item.image} alt={item.title} title={item.title} type="poster" loading="lazy"/><div><h3>{item.title}</h3><p>{item.releaseDate}</p><p>{item.genre}</p><button onClick={() => handlePlayNow({ title: item.title, description: item.synopsis, image: item.image, url: item.trailerUrl, type: 'movies' })}><Icon name="play" size={12} fill="currentColor"/>Ver tráiler</button></div></article>)}</div></section>}
                                    </div>
                                ) : activeTab === 'topshows' ? (
                                    <div className="p-3 sm:p-10 max-w-7xl mx-auto w-full animate-fade-in">
                                        <div className="mb-6 flex items-center gap-3 border-b border-slate-800 pb-4">
                                            <div className="p-2.5 bg-yellow-500/20 rounded-xl text-yellow-400 border border-yellow-500/30"><Icon fill="currentColor" name="star" size={20}/></div>
                                            <div>
                                                <h2 className="text-lg sm:text-2xl font-black text-white">Vista Superior / Top Shows</h2>
                                                <p className="text-xs text-slate-400 mt-0.5">Los programas mejor valorados y más reproducidos por la comunidad.</p>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-5">
                                            {displayedItems.map((item, i) => (<Card item={item} key={item.id || item.title || i} onClick={handlePlay} isFavorite={isItemFavorite(item)} onToggleFavorite={toggleFavorite} />))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="p-3 sm:p-10 max-w-7xl mx-auto w-full animate-fade-in">
                                        <div className="mb-6 flex items-center gap-3">
                                            <div className="w-1.5 h-6 sm:h-7 bg-cyan-500 rounded-full shadow-[0_0_15px_#06b6d4]"></div>
                                            <h2 className="text-lg sm:text-2xl font-black uppercase tracking-wide text-white">{activeTab === 'home' ? 'Resultados de Búsqueda' : activeTab === 'movies2' ? 'Estrenos 2026' : activeTab === 'trends' ? 'Tendencias' : activeTab}</h2>
                                        </div>
                                        {loading ? (
                                            <div className="flex justify-center py-24"><div className="animate-spin rounded-full h-12 w-12 border-4 border-cyan-500 border-t-transparent shadow-[0_0_25px_#06b6d4]"></div></div>
                                        ) : displayedItems.length === 0 ? (
                                            <div className="text-center py-24 text-slate-500 text-sm"><p>No se encontraron resultados para tu búsqueda.</p></div>
                                        ) : (
                                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-5 animate-slide-up">
                                                {displayedItems.map((item, i) => (<Card item={item} key={item.id || item.title || i} onClick={handlePlay} isFavorite={isItemFavorite(item)} onToggleFavorite={toggleFavorite} />))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </>
                        )}
                    </main>

                    {showNotices && <div className="fixed inset-0 z-[115] bg-black/80 flex items-center justify-center p-4" onClick={() => setShowNotices(false)}>
                        <section role="dialog" aria-modal="true" aria-labelledby="notice-panel-title" className="box-notification-dialog" onKeyDown={event => { if (event.key === 'Escape') setShowNotices(false); }} onClick={event => event.stopPropagation()}>
                            <div className="flex items-center justify-between gap-3"><h2 id="notice-panel-title" className="text-xl font-bold">Avisos de Box Play TV</h2><button autoFocus aria-label="Cerrar avisos" className="p-3" onClick={() => setShowNotices(false)}>✕</button></div>
                            <p className="text-sm text-slate-400 mt-2">{noticeError ? 'No se pudo actualizar la lista' : !noticeLoaded ? 'Consultando avisos…' : unreadNoticeCount ? unreadNoticeCount + ' avisos sin leer' : 'Estás al día'}</p>
                            <div className="flex flex-wrap gap-3 mt-3"><button className="text-sm text-cyan-300" onClick={refreshNotices}>Actualizar avisos</button>{unreadNoticeCount > 0 && <button className="text-sm text-cyan-300" onClick={() => markNoticeRead(visibleNotices.map(BoxNotices.revision))}>Marcar todos como leídos</button>}</div>
                            {noticeError && <p role="alert" className="text-sm text-amber-300 mt-3">{noticeError}</p>}
                            {noticeLoaded && !noticeError && visibleNotices.length === 0 && <p className="text-sm text-slate-300 py-6">Todavía no hay avisos disponibles.</p>}
                            {visibleNotices.map(notice => {
                                const isUnread = !noticeReads.includes(BoxNotices.revision(notice));
                                return <article key={notice.id} className="box-notification-item" data-unread={isUnread}>
                                    <h3 className="font-bold text-white">{notice.title}</h3><p className="text-sm text-slate-300 mt-2">{notice.message}</p>
                                    <p className="text-xs text-slate-400 mt-2">{new Intl.DateTimeFormat('es-CR', { timeZone: 'America/Costa_Rica', day: 'numeric', month: 'long' }).format(new Date(notice.createdAt))}</p>
                                    <div className="flex flex-wrap gap-4 mt-3">{isUnread && <button className="text-sm text-cyan-300" onClick={() => markNoticeRead([BoxNotices.revision(notice)])}>Marcar como leído</button>}<button className="text-sm text-cyan-300" onClick={() => { markNoticeRead([BoxNotices.revision(notice)]); setShowNotices(false); handleTabClick(navTabs.find(tab => tab.id === notice.target) || navTabs[0]); }}>Ir a la sección</button></div>
                                </article>;
                            })}
                            {typeof navigator.setAppBadge === 'function' && badgePermission === 'default' && <button className="w-full mt-4 p-3 bg-cyan-600 rounded-xl text-sm font-bold" onClick={enableIconBadge}>Activar indicador en el icono</button>}
                            {badgePermission === 'denied' && <p className="text-xs text-slate-400 mt-3">El permiso está desactivado. Puedes habilitarlo en la configuración del navegador o de la app instalada.</p>}
                            <p className="text-xs text-slate-400 mt-4">En teléfonos compatibles, el icono muestra los avisos sin leer. El contador se actualiza al abrir la app y mientras permanece abierta.</p>
                        </section>
                    </div>}

                    {showPaywallModal && (
                        <SinpePaywall 
                            emailUsuario={emailUsuario} 
                            onEmailChange={(email) => { setEmailUsuario(email); safeStorage.setItem('boxplay_user_email', email); }} 
                            onExpiryChange={setAccessExpiresAt}
                            onStatusChange={setIsSubscriberActive}
                            onVerificado={() => {
                                setIsSubscriberActive(true);
                                setShowPaywallModal(false);
                                window.history.pushState({ appState: 'main', activeTab }, '');
                            }} 
                            onClose={() => {
                                setShowPaywallModal(false);
                                window.history.pushState({ appState: 'main', activeTab }, '');
                            }}
                        />
                    )}

                    {showDownloadPinModal && (
                        <div className="fixed inset-0 z-[110] bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
                            <div className="glass-panel p-6 rounded-3xl max-w-xs w-full text-center shadow-2xl border border-cyan-500/30 animate-scale-in space-y-4">
                                <div className="flex justify-center"><div className="p-3.5 bg-cyan-500/15 rounded-2xl text-cyan-400 border border-cyan-500/30"><Icon name="download" size={24}/></div></div>
                                <h2 className="text-sm font-extrabold text-white mb-1">Descarga Segura</h2>
                                <p className="text-[11px] text-slate-400 mb-2">Introduce la clave de descarga</p>
                                <form onSubmit={(e) => { e.preventDefault(); if (downloadPinInput === '8384') { setShowDownloadPinModal(false); window.open(pendingDownloadUrl, '_blank'); } else { setDownloadPinError(true); setDownloadPinInput(''); } }}>
                                    <input type="password" maxLength="4" className="w-full bg-black/60 border border-slate-800 rounded-xl px-4 py-3 text-center text-xl tracking-[0.4em] text-white focus:border-cyan-500 outline-none mb-3 shadow-inner" value={downloadPinInput} onChange={(e) => { setDownloadPinInput(e.target.value); setDownloadPinError(false); }} placeholder="••••" autoFocus />
                                    {downloadPinError && <p className="text-rose-400 text-xs mb-3 font-bold">Código incorrecto</p>}
                                    <div className="flex gap-2.5">
                                        <button type="button" onClick={() => { setShowDownloadPinModal(false); window.history.pushState({ appState: 'main', activeTab }, ''); }} className="flex-1 py-2.5 rounded-xl border border-slate-800 text-slate-300 hover:bg-white/5 text-xs font-semibold">Cancelar</button>
                                        <button type="submit" className="flex-1 py-2.5 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-500 text-white font-bold hover:brightness-110 text-xs shadow-[0_0_15px_rgba(6,182,212,0.5)]">Descargar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showInstallGuide && <div className="fixed inset-0 z-[100] bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                        <div role="dialog" aria-modal="true" aria-labelledby="install-guide-title" style={{ maxHeight: '90dvh', overflowY: 'auto' }} className="glass-panel rounded-3xl p-6 max-w-sm w-full text-center relative shadow-2xl space-y-4">
                            <div className="p-3 bg-cyan-500/20 rounded-2xl text-cyan-400 inline-block"><Icon name="download" size={24}/></div>
                            <h3 id="install-guide-title" className="text-lg font-bold text-white">Agregar Box Play TV</h3>
                            <p className="text-sm text-slate-300">Crea un acceso en tu dispositivo. El navegador te pedirá confirmar.</p>
                            <ol className="text-sm text-slate-200 space-y-3 text-left bg-black/40 p-4 rounded-2xl border border-slate-800 list-decimal list-inside">
                                {isIOS ? <>
                                    <li>Abre Box Play TV en Safari.</li>
                                    <li>Toca Compartir y busca «Agregar a pantalla de inicio».</li>
                                    <li>Confirma con «Agregar».</li>
                                </> : !/Android/i.test(navigator.userAgent) ? <>
                                    <li>Abre Box Play TV en Chrome o Edge.</li>
                                    <li>Busca el icono de instalación en la barra de direcciones o la opción «Instalar» en el menú del navegador.</li>
                                    <li>Confirma la instalación. Si no está disponible, guarda la página en Favoritos.</li>
                                </> : <>
                                    <li>Abre Box Play TV en Chrome o en un navegador compatible.</li>
                                    <li>Abre el menú (⋮) y selecciona «Instalar aplicación» o «Agregar a pantalla de inicio».</li>
                                    <li>Confirma la instalación.</li>
                                </>}
                            </ol>
                            <p className="text-xs text-slate-400">Si abriste el enlace desde otra aplicación, ábrelo primero en el navegador. La reproducción requiere Internet.</p>
                            <button onClick={() => setShowInstallGuide(false)} className="w-full bg-cyan-600 text-white py-3 rounded-xl font-bold text-sm">Entendido</button>
                        </div>
                    </div>}

                </div>
            );
        };

        const rootNode = document.getElementById('root');
        if (rootNode) {
            const root = ReactDOM.createRoot(rootNode);
            root.render(<App />);
        }
    </script>
</body>
</html>
