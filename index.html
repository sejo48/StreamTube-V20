<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGIS Tube - Panel de Administración</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f3f4f6; color: #1f2937; font-family: 'Inter', sans-serif; margin: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #e5e7eb; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex; justify-content:center; items-center; height:100vh; background:#111827; color:white; font-family:sans-serif; flex-direction:column; align-items:center;">
            <div style="width:50px; height:50px; border:4px solid #374151; border-top-color:#E50914; border-radius:50%; animation:spin 1s linear infinite;"></div>
            <p style="margin-top:20px;">Cargando Panel de Control...</p>
        </div>
        <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>

    <!-- Forzar a Babel a usar el modo clásico -->
    <script>
        if (typeof Babel !== 'undefined') {
            Babel.registerPreset('react-classic', {
                presets: [
                    [Babel.availablePresets['react'], { runtime: 'classic' }]
                ]
            });
        }
    </script>

    <script type="text/babel" data-type="module" data-presets="react-classic">
        const { useState, useEffect, useRef } = React;

        // URLs actuales de tu GitHub para cargar los datos iniciales
        const SOURCE_URLS = {
            TV: 'https://raw.githubusercontent.com/sejo48/retrom3u/refs/heads/main/listaoficial.m3u',
            SERIES: 'https://raw.githubusercontent.com/sejo48/jorgedrive/refs/heads/main/playlist.json',
            MOVIES: 'https://raw.githubusercontent.com/sejo48/peliculas/refs/heads/main/peliculas.json'
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                tv: <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm0 0v10h16V6H4zm8 14v2m-4 0h8" />,
                film: <path d="M19.82 2H4.18C2.97 2 2 2.97 2 4.18v15.64C2 21.03 2.97 22 4.18 22h15.64c1.21 0 2.18-.97 2.18-2.18V4.18C22 2.97 21.03 2 19.82 2zM7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5" />,
                clapperboard: <g><path d="M20.2 6 3 11l-.9-2.4c-.5-1.1.2-2.3 1.3-2.8l3.2-1.4c1.1-.5 2.3.2 2.8 1.3l.9 2.4l7.9-3l2 4.5Z"/><path d="M4 11v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9"/></g>,
                plus: <path d="M12 5v14m-7-7h14" />,
                trash: <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />,
                edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3" />,
                x: <path d="M18 6 6 18M6 6l12 12" />,
                up: <path d="m18 15-6-6-6 6" />,
                down: <path d="m6 9 6 6 6-6" />,
                save: <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8V3" />,
                alert: <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />,
                grid: <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z" />,
                list: <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />,
                refresh: <g><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21h5v-5"></path></g>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.plus}
                </svg>
            );
        };

        const Toast = ({ message, type = 'success', onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, []);
            const colors = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            return (
                <div className={`fixed bottom-4 right-4 ${colors} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 animate-fade-in z-[100]`}>
                    <Icon name={type === 'success' ? 'save' : 'alert'} size={20} />
                    <span className="font-bold">{message}</span>
                </div>
            );
        };

        const parseM3U = (data) => {
            // Dividir por saltos de línea normales y de Windows (\r\n)
            const lines = data.split(/\r?\n/);
            const channels = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const urlLine = lines[i + 1]?.trim();
                    if (urlLine && !urlLine.startsWith('#')) {
                        let title = 'Canal Sin Nombre';
                        
                        // 1. Intentar capturar por la coma estándar
                        const commaIndex = line.indexOf(',');
                        if (commaIndex !== -1) {
                            title = line.substring(commaIndex + 1).trim();
                        } 
                        
                        // 2. Fallback: Si falló o está vacío, intentar extraer de tvg-name="..."
                        if (!title || title === 'Canal Sin Nombre') {
                            const nameMatch = line.match(/tvg-name="([^"]*)"/i);
                            if (nameMatch && nameMatch[1].trim()) {
                                title = nameMatch[1].trim();
                            }
                        }

                        const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
                        const logo = logoMatch ? logoMatch[1] : '';
                        
                        const groupMatch = line.match(/group-title="([^"]*)"/i);
                        const group = groupMatch ? groupMatch[1] : 'General';
                        
                        channels.push({ id: `tv-${Date.now()}-${i}`, title: title || 'Canal', logo, group, url: urlLine });
                    }
                }
            }
            return channels;
        };

        const generateM3U = (channels) => {
            let m3u = '#EXTM3U\n';
            channels.forEach(ch => {
                // Añadimos tvg-name por seguridad adicional en la exportación
                m3u += `#EXTINF:-1 tvg-name="${ch.title}" tvg-logo="${ch.logo || ''}" group-title="${ch.group || 'General'}",${ch.title}\n`;
                m3u += `${ch.url}\n`;
            });
            return m3u;
        };

        const downloadFile = (content, filename, type) => {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        const MoviesEditor = ({ movies, setMovies, showToast }) => {
            const [editingItem, setEditingItem] = useState(null);
            const [viewMode, setViewMode] = useState('list');

            const handleSave = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newMovie = {
                    titulo: formData.get('titulo'),
                    descripcion: formData.get('descripcion'),
                    imagen: formData.get('imagen'),
                    urlDrive: formData.get('urlDrive'),
                    codigo: formData.get('codigo') || null
                };

                if (editingItem && editingItem.id) {
                    setMovies(movies.map(m => m.id === editingItem.id ? { ...newMovie, id: m.id } : m));
                    showToast('Película actualizada correctamente');
                } else {
                    setMovies([{ ...newMovie, id: Date.now().toString() }, ...movies]);
                    showToast('Película añadida correctamente');
                }
                setEditingItem(null);
            };

            const moveItem = (index, direction) => {
                const newMovies = [...movies];
                if (direction === 'up' && index > 0) {
                    [newMovies[index - 1], newMovies[index]] = [newMovies[index], newMovies[index - 1]];
                } else if (direction === 'down' && index < newMovies.length - 1) {
                    [newMovies[index + 1], newMovies[index]] = [newMovies[index], newMovies[index + 1]];
                }
                setMovies(newMovies);
            };

            const exportData = () => {
                // Limpiamos los IDs temporales antes de exportar
                const exportMovies = movies.map(({ id, ...rest }) => rest);
                downloadFile(JSON.stringify(exportMovies, null, 4), 'peliculas.json', 'application/json');
                showToast('Archivo peliculas.json generado');
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2"><Icon name="clapperboard" className="text-red-600"/> Gestor de Películas</h2>
                            <p className="text-gray-500 text-sm">Añade o modifica películas. Al final, exporta el archivo JSON.</p>
                        </div>
                        <div className="flex gap-3">
                            <div className="hidden sm:flex bg-gray-100 p-1 rounded-lg border border-gray-200">
                                <button onClick={() => setViewMode('list')} className={`p-1.5 rounded-md transition-colors ${viewMode === 'list' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-900'}`} title="Vista en Lista"><Icon name="list" size={18}/></button>
                                <button onClick={() => setViewMode('grid')} className={`p-1.5 rounded-md transition-colors ${viewMode === 'grid' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-900'}`} title="Vista en Cuadrícula"><Icon name="grid" size={18}/></button>
                            </div>
                            <button onClick={() => setEditingItem({})} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition-colors">
                                <Icon name="plus" size={18} /> Nueva Película
                            </button>
                            <button onClick={exportData} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition-colors">
                                <Icon name="download" size={18} /> Exportar JSON
                            </button>
                        </div>
                    </div>

                    {editingItem !== null && (
                        <div className="bg-blue-50 p-6 rounded-xl border border-blue-100 mb-8 animate-fade-in">
                            <h3 className="font-bold text-blue-900 mb-4">{editingItem.id ? 'Editar Película' : 'Añadir Nueva Película'}</h3>
                            <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm font-semibold mb-1">Título</label><input name="titulo" defaultValue={editingItem.titulo || ''} required className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                <div><label className="block text-sm font-semibold mb-1">URL de la Imagen (Portada)</label><input name="imagen" defaultValue={editingItem.imagen || ''} required className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                <div><label className="block text-sm font-semibold mb-1">URL del Video (Google Drive / MP4)</label><input name="urlDrive" defaultValue={editingItem.urlDrive || ''} required className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                <div><label className="block text-sm font-semibold mb-1">PIN de Bloqueo (Opcional)</label><input name="codigo" defaultValue={editingItem.codigo || ''} placeholder="Ej: 1234" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                <div className="md:col-span-2"><label className="block text-sm font-semibold mb-1">Sinopsis / Descripción</label><textarea name="descripcion" defaultValue={editingItem.descripcion || ''} rows="3" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none"></textarea></div>
                                <div className="md:col-span-2 flex justify-end gap-2 mt-2">
                                    <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded font-semibold">Cancelar</button>
                                    <button type="submit" className="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Guardar</button>
                                </div>
                            </form>
                        </div>
                    )}

                    <div className={`max-h-[60vh] overflow-y-auto custom-scrollbar pr-2 ${viewMode === 'grid' ? 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4' : 'space-y-3'}`}>
                        {movies.length === 0 ? <p className="text-gray-500 text-center py-8 col-span-full">No hay películas cargadas.</p> : 
                         movies.map((movie, index) => (
                            viewMode === 'list' ? (
                                <div key={movie.id} className="flex items-center gap-4 p-3 bg-gray-50 border border-gray-200 rounded-lg hover:bg-gray-100 transition-colors">
                                    <img src={movie.imagen} alt={movie.titulo} className="w-12 h-16 object-cover rounded bg-gray-200" onError={(e) => e.target.src='https://placehold.co/40x60?text=IMG'}/>
                                    <div className="flex-1 min-w-0">
                                        <h4 className="font-bold text-gray-900 truncate">{movie.titulo}</h4>
                                        <p className="text-xs text-gray-500 truncate">{movie.urlDrive}</p>
                                        {movie.codigo && <span className="inline-block mt-1 bg-yellow-100 text-yellow-800 text-[10px] font-bold px-2 py-0.5 rounded">PIN: {movie.codigo}</span>}
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <button onClick={() => moveItem(index, 'up')} disabled={index === 0} className="p-1 text-gray-400 hover:text-gray-800 disabled:opacity-30"><Icon name="up" size={16}/></button>
                                        <button onClick={() => moveItem(index, 'down')} disabled={index === movies.length - 1} className="p-1 text-gray-400 hover:text-gray-800 disabled:opacity-30"><Icon name="down" size={16}/></button>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setEditingItem(movie)} className="p-2 text-blue-600 hover:bg-blue-100 rounded-full" title="Editar"><Icon name="edit" /></button>
                                        <button onClick={() => { if(confirm('¿Eliminar película?')) { setMovies(movies.filter(m => m.id !== movie.id)); showToast('Película eliminada'); } }} className="p-2 text-red-600 hover:bg-red-100 rounded-full" title="Eliminar"><Icon name="trash" /></button>
                                    </div>
                                </div>
                            ) : (
                                <div key={movie.id} className="bg-gray-50 border border-gray-200 rounded-xl overflow-hidden hover:shadow-md transition-shadow flex flex-col group">
                                    <div className="relative aspect-[2/3] bg-gray-200">
                                        <img src={movie.imagen} alt={movie.titulo} className="w-full h-full object-cover" onError={(e) => e.target.src='https://placehold.co/300x450?text=IMG'}/>
                                        {movie.codigo && <span className="absolute top-2 right-2 bg-yellow-400 text-yellow-900 text-[10px] font-bold px-2 py-1 rounded shadow-sm">PIN</span>}
                                    </div>
                                    <div className="p-3 flex-1 flex flex-col justify-between">
                                        <div>
                                            <h4 className="font-bold text-gray-900 text-sm line-clamp-2 mb-1" title={movie.titulo}>{movie.titulo}</h4>
                                        </div>
                                        <div className="flex justify-between items-center mt-3 pt-3 border-t border-gray-200">
                                            <div className="flex gap-1">
                                                <button onClick={() => moveItem(index, 'up')} disabled={index === 0} className="p-1 text-gray-400 hover:text-gray-800 disabled:opacity-30 bg-white rounded shadow-sm border border-gray-200"><Icon name="up" size={14}/></button>
                                                <button onClick={() => moveItem(index, 'down')} disabled={index === movies.length - 1} className="p-1 text-gray-400 hover:text-gray-800 disabled:opacity-30 bg-white rounded shadow-sm border border-gray-200"><Icon name="down" size={14}/></button>
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => setEditingItem(movie)} className="p-1.5 text-blue-600 hover:bg-blue-100 rounded bg-white shadow-sm border border-gray-200" title="Editar"><Icon name="edit" size={16} /></button>
                                                <button onClick={() => { if(confirm('¿Eliminar película?')) { setMovies(movies.filter(m => m.id !== movie.id)); showToast('Película eliminada'); } }} className="p-1.5 text-red-600 hover:bg-red-100 rounded bg-white shadow-sm border border-gray-200" title="Eliminar"><Icon name="trash" size={16} /></button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )
                        ))}
                    </div>
                </div>
            );
        };

        const TvEditor = ({ channels, setChannels, showToast }) => {
            const [editingItem, setEditingItem] = useState(null);
            const [viewMode, setViewMode] = useState('list');

            const handleSave = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newChannel = {
                    title: formData.get('title'),
                    logo: formData.get('logo'),
                    group: formData.get('group') || 'General',
                    url: formData.get('url')
                };

                if (editingItem && editingItem.id) {
                    setChannels(channels.map(c => c.id === editingItem.id ? { ...newChannel, id: c.id } : c));
                    showToast('Canal actualizado');
                } else {
                    setChannels([{ ...newChannel, id: `tv-${Date.now()}` }, ...channels]);
                    showToast('Canal añadido');
                }
                setEditingItem(null);
            };

            const exportData = () => {
                const m3uString = generateM3U(channels);
                downloadFile(m3uString, 'listaoficial.m3u', 'audio/x-mpegurl');
                showToast('Archivo listaoficial.m3u generado');
            };

            const moveItem = (index, direction) => {
                const newChs = [...channels];
                if (direction === 'up' && index > 0) {
                    [newChs[index - 1], newChs[index]] = [newChs[index], newChs[index - 1]];
                } else if (direction === 'down' && index < newChs.length - 1) {
                    [newChs[index + 1], newChs[index]] = [newChs[index], newChs[index + 1]];
                }
                setChannels(newChs);
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2"><Icon name="tv" className="text-blue-600"/> Gestor de TV en Vivo</h2>
                            <p className="text-gray-500 text-sm">Modifica la lista IPTV. Al final, exporta el archivo M3U.</p>
                        </div>
                        <div className="flex gap-3">
                            <div className="hidden sm:flex bg-gray-100 p-1 rounded-lg border border-gray-200">
                                <button onClick={() => setViewMode('list')} className={`p-1.5 rounded-md transition-colors ${viewMode === 'list' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-900'}`} title="Vista en Lista"><Icon name="list" size={18}/></button>
                                <button onClick={() => setViewMode('grid')} className={`p-1.5 rounded-md transition-colors ${viewMode === 'grid' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-900'}`} title="Vista en Cuadrícula"><Icon name="grid" size={18}/></button>
                            </div>
                            <button onClick={() => setEditingItem({})} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition-colors">
                                <Icon name="plus" size={18} /> Nuevo Canal
                            </button>
                            <button onClick={exportData} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition-colors">
                                <Icon name="download" size={18} /> Exportar M3U
                            </button>
                        </div>
                    </div>

                    {editingItem !== null && (
                        <div className="bg-blue-50 p-6 rounded-xl border border-blue-100 mb-8 animate-fade-in">
                            <h3 className="font-bold text-blue-900 mb-4">{editingItem.id ? 'Editar Canal' : 'Añadir Nuevo Canal'}</h3>
                            <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm font-semibold mb-1">Nombre del Canal</label><input name="title" defaultValue={editingItem.title || ''} required className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                <div><label className="block text-sm font-semibold mb-1">Categoría / Grupo</label><input name="group" defaultValue={editingItem.group || 'General'} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: Deportes, Noticias..." /></div>
                                <div><label className="block text-sm font-semibold mb-1">URL del Logo (Opcional)</label><input name="logo" defaultValue={editingItem.logo || ''} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                <div><label className="block text-sm font-semibold mb-1">URL del Stream (.m3u8)</label><input name="url" defaultValue={editingItem.url || ''} required className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                <div className="md:col-span-2 flex justify-end gap-2 mt-2">
                                    <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded font-semibold">Cancelar</button>
                                    <button type="submit" className="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Guardar Canal</button>
                                </div>
                            </form>
                        </div>
                    )}

                    <div className={`max-h-[60vh] overflow-y-auto custom-scrollbar pr-2 ${viewMode === 'grid' ? 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4' : 'space-y-2'}`}>
                        {channels.length === 0 ? <p className="text-gray-500 text-center py-8 col-span-full">No hay canales cargados.</p> : 
                         channels.map((channel, index) => (
                            viewMode === 'list' ? (
                                <div key={channel.id} className="flex items-center gap-4 p-2 bg-gray-50 border border-gray-200 rounded-lg hover:bg-gray-100">
                                    <img src={channel.logo} alt="" className="w-10 h-10 object-contain rounded bg-white border border-gray-200" onError={(e) => e.target.style.display='none'}/>
                                    <div className="flex-1 min-w-0">
                                        <div className="flex items-center gap-2">
                                            <h4 className="font-bold text-gray-900 truncate">{channel.title}</h4>
                                            <span className="text-[10px] font-bold bg-gray-200 text-gray-600 px-2 py-0.5 rounded">{channel.group}</span>
                                        </div>
                                        <p className="text-xs text-gray-400 truncate">{channel.url}</p>
                                    </div>
                                    <div className="flex flex-col gap-0">
                                        <button onClick={() => moveItem(index, 'up')} disabled={index === 0} className="p-1 text-gray-400 hover:text-gray-800 disabled:opacity-30"><Icon name="up" size={14}/></button>
                                        <button onClick={() => moveItem(index, 'down')} disabled={index === channels.length - 1} className="p-1 text-gray-400 hover:text-gray-800 disabled:opacity-30"><Icon name="down" size={14}/></button>
                                    </div>
                                    <div className="flex gap-1">
                                        <button onClick={() => setEditingItem(channel)} className="p-2 text-blue-600 hover:bg-blue-100 rounded" title="Editar"><Icon name="edit" size={18} /></button>
                                        <button onClick={() => { if(confirm('¿Eliminar canal?')) { setChannels(channels.filter(c => c.id !== channel.id)); showToast('Canal eliminado'); } }} className="p-2 text-red-600 hover:bg-red-100 rounded" title="Eliminar"><Icon name="trash" size={18} /></button>
                                    </div>
                                </div>
                            ) : (
                                <div key={channel.id} className="bg-gray-50 border border-gray-200 rounded-xl overflow-hidden hover:shadow-md transition-shadow flex flex-col items-center p-4 text-center">
                                    <div className="w-16 h-16 mb-3 rounded-lg bg-white border border-gray-200 flex items-center justify-center overflow-hidden">
                                        {channel.logo ? <img src={channel.logo} alt="" className="w-full h-full object-contain" onError={(e) => e.target.style.display='none'}/> : <Icon name="tv" className="text-gray-300"/>}
                                    </div>
                                    <h4 className="font-bold text-gray-900 text-sm w-full truncate" title={channel.title}>{channel.title}</h4>
                                    <span className="text-[10px] font-bold bg-gray-200 text-gray-600 px-2 py-0.5 rounded mt-1 truncate max-w-full">{channel.group}</span>
                                    <div className="w-full flex justify-between items-center mt-4 pt-3 border-t border-gray-200">
                                        <div className="flex gap-1">
                                            <button onClick={() => moveItem(index, 'up')} disabled={index === 0} className="p-1 text-gray-400 hover:text-gray-800 disabled:opacity-30 bg-white rounded border border-gray-200"><Icon name="up" size={14}/></button>
                                            <button onClick={() => moveItem(index, 'down')} disabled={index === channels.length - 1} className="p-1 text-gray-400 hover:text-gray-800 disabled:opacity-30 bg-white rounded border border-gray-200"><Icon name="down" size={14}/></button>
                                        </div>
                                        <div className="flex gap-1">
                                            <button onClick={() => setEditingItem(channel)} className="p-1.5 text-blue-600 hover:bg-blue-100 rounded bg-white border border-gray-200" title="Editar"><Icon name="edit" size={16} /></button>
                                            <button onClick={() => { if(confirm('¿Eliminar canal?')) { setChannels(channels.filter(c => c.id !== channel.id)); showToast('Canal eliminado'); } }} className="p-1.5 text-red-600 hover:bg-red-100 rounded bg-white border border-gray-200" title="Eliminar"><Icon name="trash" size={16} /></button>
                                        </div>
                                    </div>
                                </div>
                            )
                        ))}
                    </div>
                </div>
            );
        };

        const SeriesEditor = ({ series, setSeries, showToast }) => {
            const [selectedSerieId, setSelectedSerieId] = useState(null);
            const [editingSerie, setEditingSerie] = useState(null); 
            const [editingSeason, setEditingSeason] = useState(null); 
            const [editingEpisode, setEditingEpisode] = useState(null); 
            const [viewMode, setViewMode] = useState('list');

            const selectedSerie = series.find(s => s.id === selectedSerieId);

            const exportData = () => {
                // Limpiar IDs temporales antes de exportar
                const exportSeries = series.map(({ id, ...s }) => ({
                    tituloSerie: s.tituloSerie,
                    descripcion: s.descripcion,
                    imagen: s.imagen,
                    codigo: s.codigo,
                    temporadas: s.temporadas.map(t => ({
                        numeroTemporada: t.numeroTemporada,
                        episodios: t.episodios.map(({ id, ...ep }) => ep) // Quitar IDs de episodios
                    }))
                }));
                downloadFile(JSON.stringify(exportSeries, null, 4), 'playlist.json', 'application/json');
                showToast('Archivo playlist.json generado');
            };

            const saveSerieBase = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newData = {
                    tituloSerie: formData.get('tituloSerie'),
                    descripcion: formData.get('descripcion'),
                    imagen: formData.get('imagen'),
                    codigo: formData.get('codigo') || null,
                };
                
                if (editingSerie.isNew) {
                    const newSerie = { ...newData, id: `serie-${Date.now()}`, temporadas: [] };
                    setSeries([newSerie, ...series]);
                    showToast('Serie creada');
                } else {
                    setSeries(series.map(s => s.id === editingSerie.id ? { ...s, ...newData } : s));
                    showToast('Serie actualizada');
                }
                setEditingSerie(null);
            };

            const addSeason = () => {
                if(!selectedSerie) return;
                const newSeasonNum = selectedSerie.temporadas.length + 1;
                const updatedSerie = {
                    ...selectedSerie,
                    temporadas: [...selectedSerie.temporadas, { numeroTemporada: newSeasonNum, episodios: [] }]
                };
                setSeries(series.map(s => s.id === selectedSerie.id ? updatedSerie : s));
                showToast(`Temporada ${newSeasonNum} añadida`);
            };

            const deleteSeason = (sIdx) => {
                if(!confirm('¿Eliminar toda la temporada y sus episodios?')) return;
                const updatedSerie = {
                    ...selectedSerie,
                    temporadas: selectedSerie.temporadas.filter((_, idx) => idx !== sIdx)
                };
                setSeries(series.map(s => s.id === selectedSerie.id ? updatedSerie : s));
                showToast('Temporada eliminada');
            };

            const saveEpisode = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const epData = { tituloEpisodio: formData.get('tituloEpisodio'), urlDrive: formData.get('urlDrive'), id: `ep-${Date.now()}` };
                
                const updatedTemporadas = [...selectedSerie.temporadas];
                const season = updatedTemporadas[editingEpisode.seasonIndex];
                
                if (editingEpisode.isNew) {
                    season.episodios.push(epData);
                    showToast('Episodio añadido');
                } else {
                    epData.id = season.episodios[editingEpisode.epIndex].id; // mantener ID si existe
                    season.episodios[editingEpisode.epIndex] = epData;
                    showToast('Episodio actualizado');
                }
                
                setSeries(series.map(s => s.id === selectedSerie.id ? { ...selectedSerie, temporadas: updatedTemporadas } : s));
                setEditingEpisode(null);
            };

            const deleteEpisode = (sIdx, eIdx) => {
                if(!confirm('¿Eliminar episodio?')) return;
                const updatedTemporadas = [...selectedSerie.temporadas];
                updatedTemporadas[sIdx].episodios = updatedTemporadas[sIdx].episodios.filter((_, idx) => idx !== eIdx);
                setSeries(series.map(s => s.id === selectedSerie.id ? { ...selectedSerie, temporadas: updatedTemporadas } : s));
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row min-h-[70vh] overflow-hidden">
                    {/* Lista de Series (Sidebar) */}
                    <div className="w-full md:w-1/3 border-r border-gray-200 bg-gray-50 flex flex-col max-h-[80vh]">
                        <div className="p-4 border-b border-gray-200 bg-white">
                            <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2"><Icon name="film" className="text-purple-600"/> Series</h2>
                            <div className="flex gap-2 mt-3">
                                <button onClick={() => setEditingSerie({isNew: true})} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-semibold text-sm transition-colors">Añadir Serie</button>
                                <button onClick={exportData} className="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded font-semibold text-sm transition-colors">Exportar</button>
                            </div>
                            <div className="flex justify-center mt-3 pt-3 border-t border-gray-100">
                                <div className="flex bg-gray-100 p-1 rounded-lg border border-gray-200">
                                    <button onClick={() => setViewMode('list')} className={`p-1 px-3 rounded-md transition-colors ${viewMode === 'list' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-900'}`}><Icon name="list" size={16}/></button>
                                    <button onClick={() => setViewMode('grid')} className={`p-1 px-3 rounded-md transition-colors ${viewMode === 'grid' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-900'}`}><Icon name="grid" size={16}/></button>
                                </div>
                            </div>
                        </div>
                        <div className={`overflow-y-auto custom-scrollbar flex-1 p-2 ${viewMode === 'grid' ? 'grid grid-cols-2 gap-2' : 'space-y-1'}`}>
                            {series.length === 0 ? <p className="text-sm text-gray-500 text-center py-4 col-span-full">No hay series</p> : 
                             series.map(serie => (
                                viewMode === 'list' ? (
                                    <div key={serie.id} onClick={() => setSelectedSerieId(serie.id)} className={`p-3 rounded-lg cursor-pointer flex items-center gap-3 transition-colors ${selectedSerieId === serie.id ? 'bg-purple-100 border border-purple-300' : 'hover:bg-gray-200 border border-transparent'}`}>
                                        <img src={serie.imagen} className="w-10 h-10 object-cover rounded" onError={(e)=>e.target.src='https://placehold.co/40x40?text=S'}/>
                                        <div className="flex-1 min-w-0">
                                            <h4 className={`font-bold truncate text-sm ${selectedSerieId === serie.id ? 'text-purple-900' : 'text-gray-800'}`}>{serie.tituloSerie}</h4>
                                            <p className="text-xs text-gray-500">{serie.temporadas?.length || 0} Temporadas</p>
                                        </div>
                                    </div>
                                ) : (
                                    <div key={serie.id} onClick={() => setSelectedSerieId(serie.id)} className={`relative p-2 rounded-lg cursor-pointer flex flex-col items-center gap-2 transition-colors ${selectedSerieId === serie.id ? 'bg-purple-100 border border-purple-300' : 'hover:bg-gray-200 border border-transparent'} text-center`}>
                                        <img src={serie.imagen} className="w-16 h-24 object-cover rounded shadow-sm" onError={(e)=>e.target.src='https://placehold.co/40x60?text=S'}/>
                                        <div className="w-full">
                                            <h4 className={`font-bold truncate text-xs ${selectedSerieId === serie.id ? 'text-purple-900' : 'text-gray-800'}`}>{serie.tituloSerie}</h4>
                                            <p className="text-[10px] text-gray-500">{serie.temporadas?.length || 0} Temp.</p>
                                        </div>
                                    </div>
                                )
                            ))}
                        </div>
                    </div>

                    {/* Área de Edición */}
                    <div className="w-full md:w-2/3 p-6 overflow-y-auto max-h-[80vh] custom-scrollbar bg-white relative">
                        {!selectedSerie ? (
                            <div className="h-full flex flex-col items-center justify-center text-gray-400">
                                <Icon name="film" size={64} className="mb-4 opacity-20"/>
                                <p>Selecciona una serie de la lista para editar sus episodios.</p>
                            </div>
                        ) : (
                            <div className="animate-fade-in">
                                <div className="flex justify-between items-start mb-6 pb-4 border-b border-gray-100">
                                    <div className="flex gap-4">
                                        <img src={selectedSerie.imagen} className="w-24 h-36 object-cover rounded shadow-md" />
                                        <div>
                                            <h1 className="text-3xl font-black text-gray-900">{selectedSerie.tituloSerie}</h1>
                                            {selectedSerie.codigo && <span className="inline-block mt-1 bg-yellow-100 text-yellow-800 text-[10px] font-bold px-2 py-0.5 rounded">PIN: {selectedSerie.codigo}</span>}
                                            <p className="text-sm text-gray-600 mt-2 line-clamp-3">{selectedSerie.descripcion}</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setEditingSerie(selectedSerie)} className="p-2 text-blue-600 hover:bg-blue-50 rounded border border-blue-200">Editar Info</button>
                                        <button onClick={() => { if(confirm('¿Borrar serie completa?')) { setSeries(series.filter(s=>s.id !== selectedSerie.id)); setSelectedSerieId(null); } }} className="p-2 text-red-600 hover:bg-red-50 rounded border border-red-200">Borrar</button>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold text-gray-800">Temporadas</h3>
                                    <button onClick={addSeason} className="text-sm bg-gray-900 text-white px-3 py-1.5 rounded hover:bg-gray-700 flex items-center gap-1"><Icon name="plus" size={14}/> Añadir Temporada</button>
                                </div>

                                <div className="space-y-6">
                                    {(selectedSerie.temporadas || []).map((season, sIdx) => (
                                        <div key={sIdx} className="border border-gray-200 rounded-xl overflow-hidden">
                                            <div className="bg-gray-100 px-4 py-3 flex justify-between items-center border-b border-gray-200">
                                                <h4 className="font-bold text-gray-800">Temporada {season.numeroTemporada}</h4>
                                                <div className="flex gap-2">
                                                    <button onClick={() => setEditingEpisode({ seasonIndex: sIdx, isNew: true })} className="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200">Añadir Episodio</button>
                                                    <button onClick={() => deleteSeason(sIdx)} className="text-xs text-red-600 hover:underline">Borrar Temp.</button>
                                                </div>
                                            </div>
                                            <div className="p-2 space-y-1 bg-white">
                                                {season.episodios.length === 0 ? <p className="text-xs text-gray-500 p-2 text-center">Sin episodios aún</p> : 
                                                 season.episodios.map((ep, eIdx) => (
                                                    <div key={eIdx} className="flex justify-between items-center p-2 hover:bg-gray-50 rounded group">
                                                        <div className="flex-1 min-w-0 pr-4">
                                                            <p className="text-sm font-semibold text-gray-800 truncate"><span className="text-gray-400 mr-2">{eIdx + 1}.</span>{ep.tituloEpisodio}</p>
                                                            <p className="text-xs text-gray-400 truncate ml-5">{ep.urlDrive}</p>
                                                        </div>
                                                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                            <button onClick={() => setEditingEpisode({ seasonIndex: sIdx, epIndex: eIdx, epData: ep, isNew: false })} className="p-1.5 text-blue-600 hover:bg-blue-100 rounded" title="Editar"><Icon name="edit" size={14}/></button>
                                                            <button onClick={() => deleteEpisode(sIdx, eIdx)} className="p-1.5 text-red-600 hover:bg-red-100 rounded" title="Eliminar"><Icon name="trash" size={14}/></button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Modales Superpuestos para Series */}
                    {editingSerie && (
                        <div className="absolute inset-0 bg-white/90 backdrop-blur z-20 flex items-center justify-center p-6 animate-fade-in">
                            <div className="bg-white p-6 rounded-xl shadow-2xl border border-gray-200 w-full max-w-lg">
                                <h3 className="font-bold text-xl mb-4">{editingSerie.isNew ? 'Nueva Serie' : 'Editar Serie'}</h3>
                                <form onSubmit={saveSerieBase} className="space-y-4">
                                    <div><label className="block text-sm font-semibold mb-1">Título de Serie</label><input name="tituloSerie" defaultValue={editingSerie.tituloSerie || ''} required className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    <div><label className="block text-sm font-semibold mb-1">URL de Portada</label><input name="imagen" defaultValue={editingSerie.imagen || ''} required className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    <div><label className="block text-sm font-semibold mb-1">PIN de Bloqueo (Opcional)</label><input name="codigo" defaultValue={editingSerie.codigo || ''} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" /></div>
                                    <div><label className="block text-sm font-semibold mb-1">Descripción</label><textarea name="descripcion" defaultValue={editingSerie.descripcion || ''} rows="4" className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none"></textarea></div>
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="button" onClick={() => setEditingSerie(null)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded font-semibold">Cancelar</button>
                                        <button type="submit" className="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Guardar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {editingEpisode && (
                        <div className="absolute inset-0 bg-black/50 backdrop-blur-sm z-30 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md">
                                <h3 className="font-bold text-xl mb-4 text-gray-900">{editingEpisode.isNew ? 'Añadir Episodio' : 'Editar Episodio'}</h3>
                                <form onSubmit={saveEpisode} className="space-y-4">
                                    <div><label className="block text-sm font-semibold mb-1">Título del Episodio</label><input name="tituloEpisodio" defaultValue={editingEpisode.epData?.tituloEpisodio || ''} required className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: Episodio 1" /></div>
                                    <div><label className="block text-sm font-semibold mb-1">URL del Video (Drive/MP4)</label><input name="urlDrive" defaultValue={editingEpisode.epData?.urlDrive || ''} required className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://drive.google.com/..." /></div>
                                    <div className="flex justify-end gap-2 pt-4">
                                        <button type="button" onClick={() => setEditingEpisode(null)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded font-semibold">Cancelar</button>
                                        <button type="submit" className="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Guardar Episodio</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('movies');
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            
            // Datos
            const [movies, setMovies] = useState([]);
            const [series, setSeries] = useState([]);
            const [channels, setChannels] = useState([]);
            const [dataInitialized, setDataInitialized] = useState(false);

            const showToast = (msg, type = 'success') => setToast({ msg, type, id: Date.now() });

            const fetchFromCloud = async () => {
                setLoading(true);
                try {
                    const [resTV, resSeries, resMovies] = await Promise.all([ fetch(SOURCE_URLS.TV), fetch(SOURCE_URLS.SERIES), fetch(SOURCE_URLS.MOVIES) ]);
                    const textTV = await resTV.text(); 
                    const jsonSeries = await resSeries.json(); 
                    const jsonMovies = await resMovies.json();

                    // Procesar TV
                    setChannels(parseM3U(textTV));
                    
                    // Procesar Series
                    const rawSeries = Array.isArray(jsonSeries) ? jsonSeries : [];
                    setSeries(rawSeries.map((s, i) => ({ 
                        ...s, 
                        id: `serie-${i}`,
                        temporadas: (s.temporadas || []).map(t => ({
                            ...t,
                            episodios: (t.episodios || []).map((ep, ei) => ({ ...ep, id: `ep-${i}-${ei}` }))
                        }))
                    })));

                    // Procesar Películas
                    const rawMovies = Array.isArray(jsonMovies) ? jsonMovies : (jsonMovies.peliculas || []);
                    setMovies(rawMovies.map((m, i) => ({ ...m, id: `mov-${i}` })));

                    showToast("Datos descargados de la nube");
                } catch (error) {
                    console.error("Error cargando datos:", error);
                    showToast("Error cargando los datos de GitHub.", "error");
                } finally {
                    setLoading(false);
                    setDataInitialized(true);
                }
            };

            useEffect(() => {
                const loadData = async () => {
                    const localMovies = localStorage.getItem('magis_admin_movies');
                    const localSeries = localStorage.getItem('magis_admin_series');
                    const localTV = localStorage.getItem('magis_admin_tv');

                    if (localMovies && localSeries && localTV) {
                        try {
                            setMovies(JSON.parse(localMovies));
                            setSeries(JSON.parse(localSeries));
                            setChannels(JSON.parse(localTV));
                            setLoading(false);
                            setDataInitialized(true);
                            showToast("Sesión local restaurada");
                            return;
                        } catch(e) {
                            console.error("Error parseando localStorage", e);
                        }
                    }
                    
                    // Si no hay datos locales, descargar de la nube
                    await fetchFromCloud();
                };
                loadData();
            }, []);

            // Auto-guardado en localStorage cada vez que cambian los datos
            useEffect(() => {
                if (dataInitialized) localStorage.setItem('magis_admin_movies', JSON.stringify(movies));
            }, [movies, dataInitialized]);

            useEffect(() => {
                if (dataInitialized) localStorage.setItem('magis_admin_series', JSON.stringify(series));
            }, [series, dataInitialized]);

            useEffect(() => {
                if (dataInitialized) localStorage.setItem('magis_admin_tv', JSON.stringify(channels));
            }, [channels, dataInitialized]);

            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-gray-50">
                        <div className="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent mb-4"></div>
                        <h2 className="text-xl font-bold text-gray-700">Importando datos de tu servidor...</h2>
                        <p className="text-gray-500 text-sm mt-2">Leyendo JSON y M3U actuales</p>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    {toast && <Toast key={toast.id} message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                    
                    {/* Header */}
                    <header className="bg-gray-900 text-white shadow-md z-10 relative">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h1 className="text-2xl font-black tracking-tight"><span className="text-red-500">MAGIS</span> Admin Panel</h1>
                                <p className="text-gray-400 text-xs mt-1">Herramienta visual para editar tus listas (JSON/M3U)</p>
                            </div>
                            <div className="flex flex-col sm:flex-row items-center gap-4">
                                <button onClick={() => { if(confirm('¿Descartar cambios locales y descargar la última versión de GitHub?')) fetchFromCloud(); }} className="text-xs text-gray-400 hover:text-white flex items-center gap-1 transition-colors bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">
                                    <Icon name="refresh" size={14} /> Sincronizar Nube
                                </button>
                                <div className="flex bg-gray-800 p-1 rounded-lg">
                                    {[
                                        { id: 'movies', label: 'Películas', icon: 'clapperboard' },
                                        { id: 'series', label: 'Series', icon: 'film' },
                                        { id: 'tv', label: 'TV en Vivo', icon: 'tv' }
                                    ].map(tab => (
                                        <button 
                                            key={tab.id} 
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-md font-semibold text-sm transition-all ${activeTab === tab.id ? 'bg-blue-600 text-white shadow-sm' : 'text-gray-400 hover:text-white hover:bg-gray-700'}`}
                                        >
                                            <Icon name={tab.icon} size={16} /> {tab.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8">
                        <div className="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4 flex gap-4 text-blue-800">
                            <Icon name="alert" size={24} className="flex-shrink-0 text-blue-600 mt-1" />
                            <div className="text-sm">
                                <p className="font-bold mb-1">Modo Auto-Guardado Activado</p>
                                <p>Tus cambios se guardan automáticamente en tu navegador. Puedes cerrar esta pestaña y continuar más tarde. Cuando termines, haz clic en <strong>Exportar</strong> para descargar el archivo y súbelo a GitHub. Si te equivocas, usa el botón "Sincronizar Nube" para restaurar todo.</p>
                            </div>
                        </div>

                        {activeTab === 'movies' && <MoviesEditor movies={movies} setMovies={setMovies} showToast={showToast} />}
                        {activeTab === 'series' && <SeriesEditor series={series} setSeries={setSeries} showToast={showToast} />}
                        {activeTab === 'tv' && <TvEditor channels={channels} setChannels={setChannels} showToast={showToast} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
