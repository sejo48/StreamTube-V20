        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/search') || url.includes('ok.ru/search')) return url;
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            if (url.includes('youtube.com') && !url.includes('/embed/')) {
                let videoId = '';
                if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1]?.split('&')[0];
                } else if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1]?.split('?')[0];
                }
                if (videoId) return `https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}`;
            }
            if (url.includes('/embed/') && !url.includes('enablejsapi=1')) {
                const sep = url.includes('?') ? '&' : '?';
                return `${url}${sep}enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}`;
            }
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) {
                    const parts = url.split('/file/d/');
                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (url.includes('id=')) {
                    const parts = url.split('id=');
                    if (parts[1]) fileId = parts[1].split('&')[0];
                }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        };

            if (!isFileProtocol && localUrl) {

                } else if (item.type === 'movies' || item.type === 'movies2' || item.type === 'animated') {

                const updated = [record, ...continueWatching.filter(c => (c.id || c.title) !== itemId)].slice(0, 8);

                if (episode) markEpisodeAsWatched(item, episode, true);

                if (!currentWatched[itemId]) currentWatched[itemId] = [];
                if (isWatched) {
                    if (!currentWatched[itemId].includes(epId)) currentWatched[itemId].push(epId);

            // Sistema Dual-Deck para reproducción continua en segundo plano y con pantalla apagada en móviles (iOS y Android)

            const lastProgressTimestampRef = useRef(Date.now()); // Marca de tiempo del último avance real de audio

            const [duration, setDuration] = useState(0);

            // Refs para sincronización en tiempo real sin cierres obsoletos (evita stale closure de React)
            const currentPlaybackRef = useRef(currentPlayback);
            currentPlaybackRef.current = currentPlayback;

            const activeAlbumRef = useRef(activeAlbum);
            activeAlbumRef.current = activeAlbum;

            const albumsDataRef = useRef(albumsData);
            albumsDataRef.current = albumsData;

            const playTrackRef = useRef(null);
            const playNextPreloadedRef = useRef(null);
            const nextTrackRef = useRef(null);
            const prevTrackRef = useRef(null);

            const genres = ['TODOS', 'Rock', 'Pop & Disco', 'Baladas & Romántica', 'Tropical & Salsa', 'Reggae & Soul'];

            // Control de Screen WakeLock para mantener pantalla despierta en primer plano
            const requestWakeLock = async () => {
                if (typeof navigator !== 'undefined' && 'wakeLock' in navigator) {
                    try {
                        if (!wakeLockRef.current) {
                            wakeLockRef.current = await navigator.wakeLock.request('screen');
                            wakeLockRef.current.addEventListener('release', () => {
                                wakeLockRef.current = null;
                            });
                        }
                    } catch (e) {}
                }
            };

            const releaseWakeLock = () => {
                if (wakeLockRef.current) {
                    try { wakeLockRef.current.release(); } catch (e) {}
                    wakeLockRef.current = null;
                }
            };

            // Comprobación periódica y recuperación automática v2
            // No asume que el audio suena solo por !audio.paused, sino que verifica el progreso real del tiempo.
            // Si la llamada o notificación interrumpió el foco de audio, vuelve a ejecutar play() desde currentTime sin reiniciar.
            const checkAndRecoverPlayback = () => {
                if (userPausedRef.current) return;

                const curAudio = activeDeckRef.current === 0 ? audioARef.current : audioBRef.current;
                if (!curAudio || !curAudio.src) return;

                // Si está cerca del final, el evento natural 'ended' se encarga de pasar a la siguiente canción
                if (curAudio.duration && curAudio.currentTime >= curAudio.duration - 0.4) {
                    return;
                }

                const now = Date.now();
                const isPaused = curAudio.paused;
                // Si el audio dice estar reproduciendo pero currentTime lleva más de 1.3s congelado sin avanzar:
                const isTimeStalled = (now - lastProgressTimestampRef.current) > 1300;

                if (isPaused || isTimeStalled) {
                    const p = curAudio.play();
                    if (p !== undefined) {
                        p.then(() => {
                            lastProgressTimestampRef.current = Date.now();
                            setIsPlaying(true);
                            requestWakeLock();
                        }).catch(() => {
                            // El sistema operativo sigue ocupado con la notificación o llamada entrante;
                            // el supervisor reintentará en el siguiente pulso
                        });
                    }
                }
            };

            // Desbloqueo inicial simultáneo de ambos reproductores para iOS Safari y Android Chrome
            const unlockAudioDecks = () => {
                if (isUnlockedRef.current) return;
                try {
                    const silentWav = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                    const a = audioARef.current;
                    const b = audioBRef.current;
                    if (a && !a.src) {
                        a.src = silentWav;
                        a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
                    }
                    if (b && !b.src) {
                        b.src = silentWav;
                        b.play().then(() => { b.pause(); b.currentTime = 0; }).catch(() => {});
                    }
                    isUnlockedRef.current = true;
                } catch (e) {}
            };

            // Soporte nativo de MediaSession en la pantalla de bloqueo y barra de notificaciones del teléfono
            const updateMediaSession = (track, album) => {
                if (typeof navigator !== 'undefined' && 'mediaSession' in navigator && track && album) {
                    try {
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: track.title || 'Pista de Audio',
                            artist: album.artist || 'Artista Clásico',
                            album: album.album || 'Álbum',
                            artwork: [
                                { src: album.cover || '', sizes: '512x512', type: 'image/jpeg' }
                            ]
                        });
                        navigator.mediaSession.playbackState = 'playing';

                        navigator.mediaSession.setActionHandler('play', () => {
                            userPausedRef.current = false;
                            const curAudio = activeDeckRef.current === 0 ? audioARef.current : audioBRef.current;
                            if (curAudio) {
                                curAudio.play().then(() => {
                                    lastProgressTimestampRef.current = Date.now();
                                    setIsPlaying(true);
                                    requestWakeLock();
                                }).catch(() => {});
                            }
                        });

                        navigator.mediaSession.setActionHandler('pause', () => {
                            userPausedRef.current = true;
                            const curAudio = activeDeckRef.current === 0 ? audioARef.current : audioBRef.current;
                            if (curAudio) {
                                curAudio.pause();
                                setIsPlaying(false);
                                releaseWakeLock();
                            }
                        });

                        navigator.mediaSession.setActionHandler('nexttrack', () => {
                            if (nextTrackRef.current) nextTrackRef.current();
                        });
                        navigator.mediaSession.setActionHandler('previoustrack', () => {
                            if (prevTrackRef.current) prevTrackRef.current();
                        });
                    } catch (e) {
                        console.warn('MediaSession notice:', e);
                    }
                }
            };

            // Función para subir suavemente arriba donde se encuentra el álbum y su reproductor
            const scrollToTop = () => {
                try {
                    if (topSectionRef.current) {
                        topSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    } else {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                } catch (e) {
                    window.scrollTo(0, 0);
                }
                setTimeout(() => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 60);
            };

            // Detección de visibilidad, foco y pageshow + latido supervisor continuo
            useEffect(() => {
                const handleVisibilityOrFocus = () => {
                    if (!userPausedRef.current) {
                        checkAndRecoverPlayback();
                    }
                };

                window.addEventListener('focus', handleVisibilityOrFocus);
                window.addEventListener('pageshow', handleVisibilityOrFocus);
                document.addEventListener('visibilitychange', handleVisibilityOrFocus);

                // Supervisor periódico cada 1000ms: vigila que la música avance realmente
                // Cuando desaparece una interrupción o mensaje, vuelve a ejecutar audio.play()
                // exactamente desde currentTime sin reiniciar la pista.
                const supervisorInterval = setInterval(() => {
                    if (!userPausedRef.current) {
                        checkAndRecoverPlayback();
                    }
                }, 1000);

                return () => {
                    window.removeEventListener('focus', handleVisibilityOrFocus);
                    window.removeEventListener('pageshow', handleVisibilityOrFocus);
                    document.removeEventListener('visibilitychange', handleVisibilityOrFocus);
                    clearInterval(supervisorInterval);
                    releaseWakeLock();
                };
            }, []);

            // Inicialización de los dos reproductores alternantes (Dual Deck)
            useEffect(() => {
                const initDeck = (deckIdx) => {
                    const audio = new Audio();
                    audio.preload = 'auto';
                    audio.setAttribute('playsinline', 'true');
                    audio.setAttribute('webkit-playsinline', 'true');
                    audio.setAttribute('x-webkit-airplay', 'allow');

                    const handleTimeUpdate = () => {
                        if (activeDeckRef.current !== deckIdx) return;
                        const curTime = audio.currentTime;
                        setCurrentTime(curTime);
                        if (audio.duration) {
                            setProgress((curTime / audio.duration) * 100);
                        }
                        // Registrar avance real del audio para el supervisor
                        if (curTime !== lastProgressTimeRef.current) {
                            lastProgressTimeRef.current = curTime;
                            lastProgressTimestampRef.current = Date.now();
                        }
                    };

                    const handleLoadedMetadata = () => {
                        if (activeDeckRef.current === deckIdx) {
                            setDuration(audio.duration || 0);
                        }
                    };

                    const handlePlay = () => {
                        if (activeDeckRef.current !== deckIdx) return;
                        setIsPlaying(true);
                        requestWakeLock();
                    };

                    const handlePlaying = () => {
                        if (activeDeckRef.current !== deckIdx) return;
                        lastProgressTimestampRef.current = Date.now();
                        setIsPlaying(true);
                        requestWakeLock();
                    };

                    const handlePause = () => {
                        if (activeDeckRef.current !== deckIdx) return;
                        // Si el usuario pulsó pausa manualmente, actualizar estado y no auto-reanudar
                        if (userPausedRef.current) {
                            setIsPlaying(false);
                            releaseWakeLock();
                        } else {
                            // Pausa provocada por el sistema (mensaje, llamada, notificación)
                            // Ejecutar reintentos rápidos inmediatos para sonidos breves de notificación
                            setTimeout(checkAndRecoverPlayback, 300);
                            setTimeout(checkAndRecoverPlayback, 750);
                        }
                    };

                    // REPRODUCCIÓN SECUENCIAL AUTOMÁTICA EN MÓVIL Y ESCRITORIO
                    const handleEnded = () => {
                        if (activeDeckRef.current !== deckIdx) return;
                        const cur = currentPlaybackRef.current;
                        const album = cur.albumId 
                            ? albumsDataRef.current.find(a => a.id === cur.albumId) 
                            : activeAlbumRef.current;
                        if (!album || !album.tracks || album.tracks.length === 0) return;

                        const nextIdx = cur.trackIndex + 1;
                        if (nextIdx < album.tracks.length) {
                            if (playNextPreloadedRef.current) {
                                playNextPreloadedRef.current(album, nextIdx);
                            }
                        } else {
                            // Fin de la lista de canciones del álbum
                            userPausedRef.current = true;
                            setIsPlaying(false);
                            setProgress(0);
                            setCurrentTime(0);
                            setCurrentPlayback({ albumId: album.id, trackIndex: 0 });
                            currentPlaybackRef.current = { albumId: album.id, trackIndex: 0 };
                            releaseWakeLock();
                            if (typeof navigator !== 'undefined' && 'mediaSession' in navigator) {
                                navigator.mediaSession.playbackState = 'none';
                            }
                        }
                    };

                    const handleError = (e) => {
                        if (activeDeckRef.current !== deckIdx) return;
                        if (audio.src && audio.src !== window.location.href && !audio.src.endsWith('/')) {
                            console.warn("Aviso en reproducción de audio deck " + deckIdx + ":", e);
                        }
                        const cur = currentPlaybackRef.current;
                        const album = cur.albumId 
                            ? albumsDataRef.current.find(a => a.id === cur.albumId) 
                            : activeAlbumRef.current;
                        if (album && album.tracks && cur.trackIndex + 1 < album.tracks.length) {
                            setTimeout(() => {
                                if (playNextPreloadedRef.current) {
                                    playNextPreloadedRef.current(album, cur.trackIndex + 1);
                                }
                            }, 500);
                        } else {
                            setIsPlaying(false);
                        }
                    };

                    audio.addEventListener('timeupdate', handleTimeUpdate);
                    audio.addEventListener('loadedmetadata', handleLoadedMetadata);
                    audio.addEventListener('play', handlePlay);
                    audio.addEventListener('playing', handlePlaying);
                    audio.addEventListener('pause', handlePause);
                    audio.addEventListener('ended', handleEnded);
                    audio.addEventListener('error', handleError);

                    return { audio, handleTimeUpdate, handleLoadedMetadata, handlePlay, handlePlaying, handlePause, handleEnded, handleError };
                };

                const deckA = initDeck(0);
                const deckB = initDeck(1);

                audioARef.current = deckA.audio;
                audioBRef.current = deckB.audio;
                audioRef.current = deckA.audio;

                return () => {
                    releaseWakeLock();
                    [deckA, deckB].forEach(({ audio, handleTimeUpdate, handleLoadedMetadata, handlePlay, handlePlaying, handlePause, handleEnded, handleError }) => {
                        audio.pause();
                        audio.removeEventListener('timeupdate', handleTimeUpdate);
                        audio.removeEventListener('loadedmetadata', handleLoadedMetadata);
                        audio.removeEventListener('play', handlePlay);
                        audio.removeEventListener('playing', handlePlaying);
                        audio.removeEventListener('pause', handlePause);
                        audio.removeEventListener('ended', handleEnded);
                        audio.removeEventListener('error', handleError);
                    });
                };
            }, []);

            const isArchiveTrack = (track) => {
                if (!track) return false;
                const audioUrl = track.audio || track.urlDrive || track.url || '';
                if (isAudioFileUrl(audioUrl)) return false;
                if (track.type === 'audio') return false;
                const archId = track.archiveId || getArchiveIdFromUrl(audioUrl);
                return Boolean(archId) || track.type === 'archive';
            };

            const stopAllAudio = () => {
                userPausedRef.current = true;
                if (audioARef.current) {
                    audioARef.current.pause();
                    audioARef.current.currentTime = 0;
                }
                if (audioBRef.current) {
                    audioBRef.current.pause();
                    audioBRef.current.currentTime = 0;
                }
                releaseWakeLock();
            };

            const toggleLikeAlbum = (albumId) => {
                setLikedAlbums(prev => {
                    const updated = prev.includes(albumId) ? prev.filter(id => id !== albumId) : [...prev, albumId];
                    try { localStorage.setItem('boxplay_liked_albums', JSON.stringify(updated)); } catch (e) {}
                    return updated;
                });
            };

            // Precarga anticipada de la siguiente pista en el reproductor de reserva (en segundo plano)
            const preloadTrack = (album, nextIdx) => {
                if (!album || !album.tracks || nextIdx < 0 || nextIdx >= album.tracks.length) return;
                const nextTrack = album.tracks[nextIdx];
                if (!nextTrack) return;
                const nextSource = nextTrack.audio || nextTrack.urlDrive || nextTrack.url || album.musicUrl || album.urlDrive || album.url || '';
                if (!nextSource) return;

                const standbyAudio = activeDeckRef.current === 0 ? audioBRef.current : audioARef.current;
                if (!standbyAudio) return;

                if (standbyAudio.src !== nextSource) {
                    standbyAudio.src = nextSource;
                    standbyAudio.preload = 'auto';
                    standbyAudio.load();
                }
            };

            // Conmutación inmediata al siguiente deck ya precargado (0ms de retraso, compatible con pantalla apagada)
            const playNextPreloaded = (album, nextIdx) => {
                if (!album || !album.tracks || nextIdx >= album.tracks.length) return;
                const track = album.tracks[nextIdx];
                if (!track) return;

                const audioSource = track.audio || track.urlDrive || track.url || album.musicUrl || album.urlDrive || album.url || '';
                if (!audioSource) return;

                const oldDeck = activeDeckRef.current;
                const newDeck = oldDeck === 0 ? 1 : 0;
                activeDeckRef.current = newDeck;

                const currentAudio = newDeck === 0 ? audioARef.current : audioBRef.current;
                const prevAudio = oldDeck === 0 ? audioARef.current : audioBRef.current;

                audioRef.current = currentAudio;

                if (prevAudio) {
                    prevAudio.pause();
                }

                userPausedRef.current = false;
                lastProgressTimestampRef.current = Date.now();

                setCurrentPlayback({ albumId: album.id, trackIndex: nextIdx });
                currentPlaybackRef.current = { albumId: album.id, trackIndex: nextIdx };
                activeAlbumRef.current = album;
                setIsPlaying(true);
                setProgress(0);
                setCurrentTime(0);

                if (currentAudio) {
                    if (currentAudio.src !== audioSource) {
                        currentAudio.src = audioSource;
                        currentAudio.load();
                    }
                    currentAudio.currentTime = 0;
                    currentAudio.volume = volume;

                    const p = currentAudio.play();
                    if (p !== undefined) {
                        p.then(() => {
                            setIsPlaying(true);
                            lastProgressTimestampRef.current = Date.now();
                            updateMediaSession(track, album);
                            requestWakeLock();
                        }).catch(err => {
                            console.warn("Aviso play continuado en segundo plano:", err);
                        });
                    }
                }

                // Inmediatamente precargar la pista posterior (nextIdx + 1) en el deck que quedó libre
                if (nextIdx + 1 < album.tracks.length) {
                    preloadTrack(album, nextIdx + 1);
                }
            };
            playNextPreloadedRef.current = playNextPreloaded;

            // Reproducir pista específica (por clic del usuario o inicio de álbum)
            const playTrack = (album, index = 0) => {
                if (!album || !album.tracks || album.tracks.length === 0) return;
                const safeIdx = (index >= 0 && index < album.tracks.length) ? index : 0;
                const track = album.tracks[safeIdx];
                if (!track) return;

                unlockAudioDecks();

                const cur = currentPlaybackRef.current;
                const currentAudio = activeDeckRef.current === 0 ? audioARef.current : audioBRef.current;

                // Si el usuario toca la misma pista que está sonando, actúa como toggle de pausa manual
                if (cur.albumId === album.id && cur.trackIndex === safeIdx) {
                    if (isArchiveTrack(track)) {
                        setIsPlaying(!isPlaying);
                        return;
                    }
                    if (isPlaying) {
                        userPausedRef.current = true;
                        currentAudio?.pause();
                        setIsPlaying(false);
                        releaseWakeLock();
                    } else {
                        userPausedRef.current = false;
                        lastProgressTimestampRef.current = Date.now();
                        currentAudio?.play().then(() => {
                            setIsPlaying(true);
                            lastProgressTimestampRef.current = Date.now();
                            requestWakeLock();
                        }).catch(e => console.warn(e));
                    }
                    return;
                }

                const audioSource = track?.audio || track?.urlDrive || track?.url || album.musicUrl || album.urlDrive || album.url || '';
                const hasDirectAudio = isAudioFileUrl(audioSource) || (audioSource && audioSource.includes('.mp3'));

                if (!hasDirectAudio && isArchiveTrack(track)) {
                    userPausedRef.current = false;
                    setCurrentPlayback({ albumId: album.id, trackIndex: safeIdx });
                    currentPlaybackRef.current = { albumId: album.id, trackIndex: safeIdx };
                    activeAlbumRef.current = album;
                    setIsPlaying(true);
                    setProgress(0);
                    setCurrentTime(0);
                    setDuration(0);
                    return;
                }

                if (!audioSource) return;
                if (!currentAudio) return;

                const standbyAudio = activeDeckRef.current === 0 ? audioBRef.current : audioARef.current;
                if (standbyAudio) {
                    standbyAudio.pause();
                }

                audioRef.current = currentAudio;

                userPausedRef.current = false;
                lastProgressTimestampRef.current = Date.now();

                setCurrentPlayback({ albumId: album.id, trackIndex: safeIdx });
                currentPlaybackRef.current = { albumId: album.id, trackIndex: safeIdx };
                activeAlbumRef.current = album;
                setIsPlaying(true);

                if (currentAudio.src !== audioSource) {
                    currentAudio.src = audioSource;
                    currentAudio.load();
                }
                currentAudio.currentTime = 0;
                currentAudio.volume = volume;

                const playPromise = currentAudio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        setIsPlaying(true);
                        lastProgressTimestampRef.current = Date.now();
                        updateMediaSession(track, album);
                        requestWakeLock();
                    }).catch(e => {
                        console.warn("Aviso al iniciar audio móvil:", e);
                    });
                }

                // Precargar inmediatamente la siguiente canción (safeIdx + 1) en el deck secundario
                if (safeIdx + 1 < album.tracks.length) {
                    preloadTrack(album, safeIdx + 1);
                }
            };
            playTrackRef.current = playTrack;
            // Al elegir un álbum en PC o móvil: cambia de álbum y SUBE AUTOMÁTICAMENTE A LA PORTADA
            const handleSelectAlbum = (alb) => {
                if (!alb) return;

                if (activeAlbum?.id !== alb.id) {
                    stopAllAudio();
                    setActiveAlbum(alb);
                    playTrack(alb, 0);
                } else {
                    handleTogglePlayCurrentAlbum();
                }

                scrollToTop();
            };

            const handleTogglePlayCurrentAlbum = () => {
                if (!activeAlbum) return;
                const isThisAlbumPlaying = currentPlayback.albumId === activeAlbum.id && isPlaying;

                if (isThisAlbumPlaying) {
                    if (audioRef.current) audioRef.current.pause();
                    setIsPlaying(false);
                } else {
                    const trackIdx = (currentPlayback.albumId === activeAlbum.id && currentPlayback.trackIndex >= 0)
                        ? currentPlayback.trackIndex
                        : 0;
                    playTrack(activeAlbum, trackIdx);
                }
            };

            const togglePlayPause = () => {
                handleTogglePlayCurrentAlbum();
            };

            const nextTrack = () => {
                const cur = currentPlaybackRef.current;
                const album = cur.albumId 
                    ? albumsDataRef.current.find(a => a.id === cur.albumId) 
                    : activeAlbumRef.current;
                if (!album || !album.tracks || album.tracks.length === 0) return;
                const curIdx = cur.trackIndex >= 0 ? cur.trackIndex : 0;
                const nextIdx = (curIdx + 1) % album.tracks.length;
                playTrack(album, nextIdx);
            };
            nextTrackRef.current = nextTrack;

            const prevTrack = () => {
                const cur = currentPlaybackRef.current;
                const album = cur.albumId 
                    ? albumsDataRef.current.find(a => a.id === cur.albumId) 
                    : activeAlbumRef.current;
                if (!album || !album.tracks || album.tracks.length === 0) return;
                const curIdx = cur.trackIndex >= 0 ? cur.trackIndex : 0;
                const prevIdx = (curIdx - 1 + album.tracks.length) % album.tracks.length;
                playTrack(album, prevIdx);
            };
            prevTrackRef.current = prevTrack;

            const formatTime = (secs) => {
                if (isNaN(secs) || secs === 0) return "0:00";
                const m = Math.floor(secs / 60);
                const s = Math.floor(secs % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const filteredAlbums = albumsData.filter(album => {
                const albGenre = (album.genre || album.genero || '').toLowerCase();
                const sel = selectedGenre.toLowerCase();
                if (selectedGenre === 'TODOS') return true;
                if (albGenre === sel) return true;
                if (selectedGenre === 'Rock') return /rock|metal/i.test(albGenre);
                if (selectedGenre === 'Pop & Disco') return /pop|disco|dance|new wave/i.test(albGenre);
                if (selectedGenre === 'Baladas & Romántica') return /balada|rom[aá]ntic|bolero/i.test(albGenre);
                if (selectedGenre === 'Tropical & Salsa') return /tropical|salsa|cumbia|merengue|cha-cha|latino/i.test(albGenre);
                if (selectedGenre === 'Reggae & Soul') return /reggae|soul|funk|r&b|ska/i.test(albGenre);
                return albGenre.includes(sel);
            });

            // Pista activa y datos de Archive.org o Audio
            const currentTrackIdx = (currentPlayback.albumId === activeAlbum?.id && currentPlayback.trackIndex >= 0) 
                ? currentPlayback.trackIndex 
                : 0;
            const activeTrack = activeAlbum?.tracks?.[currentTrackIdx] || activeAlbum?.tracks?.[0] || null;
            const activeTrackAudio = activeTrack?.audio || activeTrack?.urlDrive || activeTrack?.url || '';
            const hasDirectAudio = isAudioFileUrl(activeTrackAudio) || (activeTrackAudio && activeTrackAudio.includes('.mp3'));
            const activeTrackArchiveId = activeTrack?.archiveId || 
                getArchiveIdFromUrl(activeTrackAudio) || 
                activeAlbum?.archiveId || 
                getArchiveIdFromUrl(activeAlbum?.musicUrl || activeAlbum?.urlDrive || '');
            const isCurrentArchive = !hasDirectAudio && (Boolean(activeTrackArchiveId) || activeTrack?.type === 'archive');
            const isPlayingThisAlbum = currentPlayback.albumId === activeAlbum?.id && isPlaying;

            return (
                <div ref={topSectionRef} id="coleccion-top" className="min-h-[85vh] bg-[#090d16] text-white flex flex-col pb-32 animate-fade-in select-none">
                    {/* Contenedor Principal Amplio (En PC aprovecha toda la pantalla hasta 1650px) */}
                    <div className="flex-1 flex flex-col p-3 sm:p-6 lg:p-10 gap-8 max-w-[1650px] mx-auto w-full">
                        
                        {/* 1. SECCIÓN SUPERIOR: ÁLBUM ACTIVO (Banner Amplio estilo Spotify) */}
                        <div className="flex flex-col lg:flex-row gap-6 lg:gap-8 bg-gradient-to-b from-cyan-950/30 via-[#101726]/80 to-[#0a0e1a] p-4 sm:p-6 lg:p-8 rounded-3xl border border-white/5 shadow-2xl">
                            
                            {/* PORTADA CON REPRODUCTOR FÍSICO INCORPORADO */}
                            <div className="w-full sm:w-56 md:w-64 lg:w-72 flex-shrink-0 flex flex-col items-center mx-auto lg:mx-0">
                                <div className="w-full max-w-[210px] sm:max-w-[250px] lg:max-w-none rounded-2xl overflow-hidden shadow-[0_16px_40px_rgba(0,0,0,0.85)] border border-cyan-500/40 bg-[#080c14] flex flex-col">
                                    {/* Imagen de la Portada con Botón de Reproducción Principal de Álbum */}
                                    <div 
                                        onClick={handleTogglePlayCurrentAlbum}
                                        className="w-full aspect-square relative bg-black overflow-hidden group cursor-pointer"
                                        title={isPlayingThisAlbum ? "Pausar álbum" : "Reproducir álbum completo"}
                                    >
                                        <img 
                                            src={activeAlbum.cover} 
                                            alt={activeAlbum.album} 
                                            className={`w-full h-full object-cover transition-transform duration-500 ${isPlayingThisAlbum ? 'scale-105 brightness-90' : 'group-hover:scale-105'}`} 
                                        />
                                        
                                        {/* Overlay central interactivo: Play / Pause gigante */}
                                        <div className={`absolute inset-0 bg-black/40 backdrop-blur-[2px] transition-all duration-300 flex items-center justify-center ${isPlayingThisAlbum ? 'opacity-0 hover:opacity-100' : 'opacity-85 sm:opacity-0 group-hover:opacity-100'}`}>
                                            <div className="w-16 h-16 rounded-full bg-cyan-400 hover:bg-cyan-300 text-black flex items-center justify-center shadow-[0_0_35px_rgba(6,182,212,0.9)] transform transition-transform group-hover:scale-110 active:scale-95">
                                                <Icon name={isPlayingThisAlbum ? "pause" : "play"} size={26} fill="currentColor" />
                                            </div>
                                        </div>

                                        {/* Insignia de estado animada */}
                                        {isPlayingThisAlbum ? (
                                            <div className="absolute top-2.5 left-2.5 px-3 py-1 rounded-full bg-cyan-400 text-black font-mono text-[9px] font-black uppercase tracking-wider shadow-xl flex items-center gap-1.5 animate-pulse z-10">
                                                <span className="w-2 h-2 rounded-full bg-black animate-ping"></span>
                                                Reproduciendo Lista
                                            </div>
                                        ) : (
                                            <div className="absolute bottom-2.5 left-2.5 right-2.5 px-2.5 py-1 rounded-xl bg-black/80 backdrop-blur-md border border-cyan-500/40 text-cyan-300 font-mono text-[9px] font-bold text-center z-10 flex items-center justify-center gap-1.5 shadow-lg group-hover:border-cyan-400">
                                                <Icon name="play" size={10} fill="currentColor" />
                                                <span>Clic para reproducir álbum</span>
                                            </div>
                                        )}
                                    </div>

                                    {/* REPRODUCTOR INCORPORADO EN LA MISMA PORTADA */}
                                    <div className="p-2.5 sm:p-3 bg-[#05070d] border-t border-cyan-500/30 flex flex-col gap-1.5">
                                        <div className="flex items-center justify-between text-[10px] font-mono text-cyan-300 font-bold px-0.5">
                                            <span className="flex items-center gap-1 truncate max-w-[140px] sm:max-w-[160px]">
                                                <Icon name="music" size={11} className="text-cyan-400 flex-shrink-0" />

        // Sección Asistente IA
        const AiAssistantSection = ({ content, onSelectMovie }) => {
            const [query, setQuery] = useState('');
            const [messages, setMessages] = useState([
                { role: 'assistant', text: '¡Hola! Soy el asistente inteligente de Boxplaytv. Puedo buscar dentro de tu catálogo por título, género, actores o palabras clave de la sinopsis.' }
            ]);
            const [isThinking, setIsThinking] = useState(false);

            const catalog = useMemo(() => [...content.movies2, ...content.movies, ...content.series, ...content.animated].filter(x => x && (x.title || x.name)), [content]);

            const handleSend = async (e) => {
                e.preventDefault();
                if (!query.trim() || isThinking) return;
                const q = query.trim();
                setQuery('');
                setMessages(prev => [...prev, { role: 'user', text: q }]);
                setIsThinking(true);
                const words = q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/\s+/).filter(w => w.length > 2);
                const scored = catalog.map(item => {
                    const hay = [item.title, item.name, item.genre, item.genero, item.description, item.descripcion, item.sinopsis, item.plot].filter(Boolean).join(' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ' ');
                    let score = 0;
                    words.forEach(w => { if (hay.includes(w)) score += hay.includes(String(item.title || '').toLowerCase()) ? 2 : 1; });
                    return { item, score };
                }).filter(x => x.score > 0).sort((a,b) => b.score - a.score).slice(0, 5);
                await new Promise(r => setTimeout(r, 250));
                if (scored.length) {
                    setMessages(prev => [...prev, { role: 'assistant', text: `Encontré ${scored.length} recomendación(es) para ti:\n\n${scored.map((x,i) => `${i+1}. ${x.item.title}`).join('\n')}\n\nToca cualquiera de las tarjetas abajo para reproducirla.` }]);
                } else {
                    setMessages(prev => [...prev, { role: 'assistant', text: 'No encontré coincidencias directas en el catálogo. Prueba buscando por género (acción, comedia, terror), clásicos o palabras de la sinopsis.' }]);
                }
                setIsThinking(false);
            };

            const lastResults = useMemo(() => {
                if (!messages.length) return [];
                const last = messages[messages.length - 1];
                if (last.role !== 'assistant' || !last.text.includes('Encontré')) return [];
                const names = last.text.split('\n').filter(x => /^\d+\. /.test(x)).map(x => x.replace(/^\d+\. /,''));
                return names.map(n => catalog.find(x => x.title === n)).filter(Boolean);
            }, [messages, catalog]);

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-8 animate-fade-in w-full space-y-6">
                    <div className="glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl border border-cyan-500/30 flex flex-col min-h-[75vh]">
                        <div className="flex items-center gap-4 border-b border-slate-800 pb-4 mb-4">
                            <div className="p-3 bg-gradient-to-tr from-cyan-600 to-teal-500 rounded-2xl text-white shadow-[0_0_15px_rgba(6,182,212,0.5)]"><Icon name="chat" size={24}/></div>
                            <div><h1 className="text-lg sm:text-xl font-black text-white">Asistente de Boxplaytv</h1><p className="text-xs text-cyan-400 font-medium">Búsqueda y recomendación inteligente de contenido</p></div>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-4 pr-2 mb-4">
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[85%] p-4 rounded-2xl text-xs sm:text-sm leading-relaxed ${msg.role === 'user' ? 'bg-cyan-600 text-white rounded-br-none' : 'bg-[#090d1f] border border-slate-800 text-slate-200 rounded-bl-none'}`}><p className="whitespace-pre-wrap">{msg.text}</p></div>
                                </div>
                            ))}
                            {lastResults.length > 0 && (
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    {lastResults.map(item => <Card key={item.id || item.title} item={item} onClick={onSelectMovie} isFavorite={false} onToggleFavorite={()=>{}} />)}
                                </div>
                            )}
                            {isThinking && <div className="text-xs text-cyan-400 animate-pulse font-mono">Analizando el catálogo disponible...</div>}
                        </div>
                        <form onSubmit={handleSend} className="flex gap-2 pt-3 border-t border-slate-800">
                            <input type="text" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Ej. comedia, acción, dibujos, aventura..." className="flex-1 bg-[#020617] border border-slate-800 rounded-xl px-4 py-3 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" />
                            <button type="submit" disabled={isThinking} className="bg-gradient-to-r from-cyan-600 to-teal-500 text-white px-5 py-3 rounded-xl font-bold text-xs">Buscar</button>
                        </form>
                    </div>
                </div>
            );
        };

        // Sección Smart TV Guide
        const SmartViewGuideSection = () => (
            <div className="p-4 sm:p-10 max-w-4xl mx-auto w-full animate-fade-in space-y-6">
                <div className="glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl border border-cyan-500/30 space-y-8">
                    <div className="flex items-center gap-4 border-b border-slate-800 pb-5">
                        <div className="p-3.5 bg-cyan-500/20 rounded-2xl text-cyan-400 border border-cyan-500/30">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-cyan-400"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                        </div>
                        <div>
                            <h1 className="text-xl sm:text-2xl font-black text-white">📺 Guía de Instalación de Boxplaytv en tu Smart TV</h1>
                            <p className="text-xs sm:text-sm text-cyan-400 font-medium mt-1">Fire TV / Android TV / Chromecast</p>
                        </div>
                    </div>

                    <div className="space-y-6 text-sm text-slate-300 leading-relaxed">
                        <div className="bg-black/50 p-5 sm:p-6 rounded-2xl border border-slate-800 space-y-4">
                            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                <h3 className="text-base font-extrabold text-cyan-300 flex items-center gap-2">
                                    <span className="w-7 h-7 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400 border border-cyan-500/40 text-xs font-mono flex-shrink-0">1</span>
                                    📥 Paso 1: Instalar la aplicación Downloader
                                </h3>
                                <div className="w-16 h-16 rounded-xl overflow-hidden border border-cyan-500/40 bg-black shadow-lg flex-shrink-0 self-center sm:self-auto p-1">
                                    <img src="https://m.media-amazon.com/images/I/31KVvZnHbuL.png" alt="Downloader App" className="w-full h-full object-cover rounded-lg" onError={(e)=>{e.target.style.display='none';}} />
                                </div>
                            </div>
                            <ul className="list-disc list-inside space-y-1.5 pl-2 text-xs sm:text-sm text-slate-300">
                                <li>Enciende tu Smart TV o dispositivo Fire TV / Android TV.</li>
                                <li>Ve a la tienda de aplicaciones (Google Play Store o Amazon Appstore).</li>
                                <li>Busca la aplicación llamada <strong>Downloader</strong> (ícono naranja).</li>
                                <li>Descárgala e instálala en tu televisor.</li>
                            </ul>
                        </div>

                        <div className="bg-black/50 p-5 sm:p-6 rounded-2xl border border-slate-800 space-y-3">
                            <h3 className="text-base font-extrabold text-cyan-300 flex items-center gap-2">
                                <span className="w-7 h-7 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400 border border-cyan-500/40 text-xs font-mono flex-shrink-0">2</span>
                                🔢 Paso 2: Abrir Boxplaytv con el Código
                            </h3>
                            <ul className="list-disc list-inside space-y-1.5 pl-2 text-xs sm:text-sm text-slate-300 mb-4">
                                <li>Abre la aplicación Downloader.</li>
                                <li>En la barra de direcciones introduce el código numérico oficial:</li>
                            </ul>
                            
                            <div className="bg-cyan-950/80 border-2 border-cyan-500/60 rounded-2xl p-4 text-center shadow-[0_0_25px_rgba(6,182,212,0.3)] my-3">
                                <span className="text-xs text-cyan-400 uppercase tracking-widest block font-bold mb-1">Código Oficial Downloader</span>
                                <span className="text-3xl sm:text-4xl font-black font-mono tracking-[0.2em] text-white">8614069</span>
                            </div>

                            <ul className="list-disc list-inside space-y-1.5 pl-2 text-xs sm:text-sm text-slate-300">
                                <li>Haz clic en <strong>Go (Ir)</strong> con tu control remoto.</li>
                                <li>Boxplaytv se abrirá en pantalla completa inmediatamente.</li>
                            </ul>
                        </div>

                        <div className="bg-gradient-to-r from-cyan-950/80 to-teal-950/80 p-5 sm:p-6 rounded-2xl border border-cyan-500/40 text-center space-y-2">
                            <h4 className="text-base font-black text-white">🎉 ¡Listo para Disfrutar!</h4>
                            <p className="text-xs sm:text-sm text-slate-200">Guarda la página en favoritos dentro de Downloader para acceder directo cada vez que enciendas tu televisor.</p>
                        </div>
                    </div>
                </div>
            </div>
        );


        // Intro Screen
        const IntroScreen = ({ onEnter }) => {
            const [isLoading, setIsLoading] = useState(false);
            const [progress, setProgress] = useState(0);

            const handleStart = () => {
                setIsLoading(true);
                let current = 0;
                const interval = setInterval(() => {
                    current += 2;
                    if (current <= 100) {
                        setProgress(current);
                    } else {
                        clearInterval(interval);
                        onEnter();
                    }
                }, 25);
            };

            return (
                <div className="fixed inset-0 z-[100] bg-[#020617] flex items-center justify-center overflow-hidden font-sans p-4">
                    <div className="absolute inset-0">
                        <img src="https://img.magnific.com/foto-gratis/cine-caja-palomitas-maiz_23-2148133612.jpg?semt=ais_hybrid&w=740&q=80" className="w-full h-full object-cover opacity-15" alt="Cine" />
                        <div className="absolute inset-0 bg-gradient-to-b from-[#020617] via-[#020617]/90 to-[#020617]"></div>
                    </div>
                    <div className="relative z-10 text-center max-w-sm sm:max-w-md w-full animate-scale-in glass-panel p-6 sm:p-8 rounded-3xl shadow-[0_0_80px_rgba(6,182,212,0.2)] border border-cyan-500/20">
                        <div className="mb-3 inline-block bg-gradient-to-r from-cyan-600 to-teal-500 px-3 py-1 rounded-full text-[9px] font-black tracking-widest uppercase text-white shadow-[0_0_15px_rgba(6,182,212,0.4)]">Cinematic & Audio Hub</div>
                        <div className="flex items-center justify-center gap-2.5 mb-2">
                            <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.5)]">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className="w-5 h-5 fill-white">
                                    <polygon points="40,30 70,50 40,70"/>
                                </svg>
                            </div>
                            <h1 className="text-3xl sm:text-5xl font-black text-white tracking-tighter neon-logo-anim">BOXPLAY<span className="text-cyan-400">TV</span></h1>
                        </div>
                        <p className="text-xs sm:text-sm text-slate-300 font-light mb-6 italic">"Streaming de alta calidad cinematográfica, televisión y radio."</p>
                        
                        {isLoading ? (
                            <div className="space-y-3 mb-6 animate-fade-in">
                                <div className="flex justify-between text-xs text-cyan-300 font-bold px-1">
                                    <span>Iniciando experiencia...</span>
                                    <span>{progress}%</span>
                                </div>
                                <div className="w-full h-2.5 bg-black/60 rounded-full overflow-hidden border border-slate-800 p-0.5">
                                    <div className="h-full bg-gradient-to-r from-cyan-600 to-teal-400 rounded-full transition-all duration-75 shadow-[0_0_15px_#06b6d4]" style={{ width: `${progress}%` }}></div>
                                </div>
                            </div>
                        ) : (
                            <button onClick={handleStart} className="w-full bg-gradient-to-r from-cyan-600 to-teal-500 hover:brightness-110 text-white py-3.5 rounded-full font-extrabold text-sm sm:text-base shadow-[0_0_25px_rgba(6,182,212,0.5)] flex items-center justify-center gap-2 mb-6 active:scale-95 transition-all relative overflow-hidden group">
                                <span className="absolute inset-0 w-full h-full bg-white/20 transform -translate-x-full group-hover:translate-x-full transition-transform duration-700"></span>
                                <span>Comenzar Experiencia</span> <Icon fill="white" name="play" size={16}/>
                            </button>
                        )}

                        <div className="opacity-80 pt-3 border-t border-slate-800"><p className="text-[8px] text-slate-500 uppercase tracking-widest">Boxplaytv • Todos los derechos reservados</p></div>
                    </div>
                </div>
            );
        };

        // Hero Section
        const HeroSection = ({ item, onPlay, isFavorite, onToggleFavorite }) => {
            if (!item) return null;
            const imgSource = item.imagen || item.image || item.poster;
            const titleSource = item.titulo || item.title || item.name;
            const descSource = item.descripcion || item.sinopsis || item.plot;
            
            return (
                <div className="relative w-full bg-[#070b19] overflow-hidden rounded-none sm:rounded-3xl mb-4 sm:mb-8 group animate-fade-in shadow-2xl border-b sm:border border-slate-800 flex items-center max-w-7xl mx-auto px-4 sm:px-12 cinema-glow py-6 sm:py-16 md:py-20">
                    <div className="absolute inset-0 overflow-hidden pointer-events-none">
                        <img src="https://img.magnific.com/foto-gratis/cine-caja-palomitas-maiz_23-2148133612.jpg?semt=ais_hybrid&w=740&q=80" alt="Hero BG" className="w-full h-full object-cover opacity-25 scale-105 brightness-90" />
                        <div className="absolute inset-0 bg-gradient-to-r from-[#020617] via-[#020617]/90 to-transparent"></div>
                        <div className="absolute inset-0 bg-gradient-to-t from-[#020617] via-transparent to-transparent"></div>
                    </div>

                    <div className="relative z-10 w-full h-full flex flex-col sm:flex-row items-center justify-center sm:justify-start gap-4 sm:gap-10 text-center sm:text-left">
                        <div className="w-64 sm:w-60 md:w-68 aspect-[2/3] rounded-xl sm:rounded-2xl overflow-hidden shadow-2xl border border-cyan-500/40 flex-shrink-0 bg-black/70 flex items-center justify-center mx-auto sm:mx-0 group-hover:scale-105 transition-transform duration-500">
                            <img src={imgSource} alt={titleSource} className="w-full h-full object-cover" onError={(e) => e.target.src='https://placehold.co/300x450/0f172a/ffffff?text=Poster'} />
                        </div>
                        <div className="flex-1 flex flex-col gap-2.5 sm:gap-3 items-center sm:items-start max-w-xl">
                            <span className="bg-gradient-to-r from-cyan-600 to-teal-500 text-white text-[9px] sm:text-[10px] font-black px-3.5 py-1 rounded-full uppercase tracking-widest shadow-[0_0_15px_rgba(6,182,212,0.4)]">Destacado Boxplaytv</span>
                            <h1 className="text-xl sm:text-4xl md:text-5xl font-black text-white leading-tight drop-shadow-md line-clamp-2">{titleSource}</h1>
                            <p className="text-slate-300 text-xs sm:text-sm md:text-base line-clamp-3 leading-relaxed drop-shadow">{descSource || "Disfruta de las mejores películas y series en alta definición."}</p>
                            <div className="flex flex-wrap justify-center sm:justify-start gap-3 mt-1 sm:mt-2">
                                <button onClick={() => onPlay(item)} className="bg-gradient-to-tr from-cyan-600 to-teal-500 hover:brightness-110 text-white px-5 sm:px-8 py-2.5 sm:py-3 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-2 active:scale-95 transition-transform shadow-[0_0_20px_rgba(6,182,212,0.5)]">
                                    <Icon fill="white" name="play" size={15}/> Reproducir Ahora
                                </button>
                                <button onClick={() => onToggleFavorite(item)} className="glass-panel text-white p-2.5 sm:p-3 rounded-xl flex items-center justify-center backdrop-blur-md border border-cyan-500/40 hover:bg-slate-800 transition-colors shadow-lg">
                                    <Icon name="heart" size={16} fill={isFavorite ? "#06b6d4" : "none"} className={isFavorite ? "text-cyan-500" : "text-white"}/>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Fila de Contenido
        const ContentRow = ({ title, items, onPlay, favorites, tvFavorites, onToggleFavorite }) => {
            const rowRef = useRef(null);

            const scroll = (direction) => {
                if (rowRef.current) {
                    const { scrollLeft, clientWidth } = rowRef.current;
                    const scrollAmount = clientWidth * 0.75;
                    rowRef.current.scrollTo({ left: direction === 'left' ? scrollLeft - scrollAmount : scrollLeft + scrollAmount, behavior: 'smooth' });
                }
            };

            if (!items || items.length === 0) return null;

            return (
                <div className="max-w-7xl mx-auto px-2 sm:px-8 mb-3 sm:mb-10 w-full group">
                    <div className="flex items-center justify-between mb-2 sm:mb-4 px-1">
                        <div className="flex items-center gap-2 sm:gap-3">
                            <div className="w-1.5 h-4 sm:h-6 bg-cyan-500 rounded-full shadow-[0_0_15px_#06b6d4]"></div>
                            <h2 className="text-xs sm:text-lg font-black uppercase tracking-wider text-white">{title}</h2>
                        </div>
                        <div className="hidden sm:flex items-center gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onClick={() => scroll('left')} className="p-2 rounded-xl bg-black/60 hover:bg-cyan-600 text-white border border-slate-800 transition-colors"><Icon name="arrowLeft" size={14}/></button>
                            <button onClick={() => scroll('right')} className="p-2 rounded-xl bg-black/60 hover:bg-cyan-600 text-white border border-slate-800 transition-colors"><Icon name="arrowRight" size={14}/></button>
                        </div>
                    </div>
                    <div ref={rowRef} className="flex gap-1.5 sm:gap-4 overflow-x-auto pb-2 sm:pb-4 no-scrollbar scroll-smooth">
                        {items.map((item, idx) => {
                            const isFav = favorites.some(f => (f.id || f.title) === (item.id || item.title));
                            return <Card item={item} key={item.id || item.title || idx} onClick={onPlay} isFavorite={isFav} onToggleFavorite={onToggleFavorite} />;
                        })}
                    </div>
                </div>
            );
        };

        // Tarjeta de Contenido
        const Card = ({ item, onClick, isFavorite, onToggleFavorite }) => {
            const imgUrl = item.imagen || item.image || item.poster;
            const titleText = item.titulo || item.title || item.name;

            return (
                <div onClick={() => onClick(item)} className="card-item flex-shrink-0 w-[31%] sm:w-44 md:w-52 glass-panel rounded-xl sm:rounded-2xl p-1.5 sm:p-3 cursor-pointer group card-glow border border-slate-800/80 flex flex-col justify-between relative">
                    <div className="absolute top-2 right-2 sm:top-4 sm:right-4 z-20">
                        <button onClick={(e) => { e.stopPropagation(); onToggleFavorite(item); }} className="p-1.5 sm:p-2 rounded-full bg-black/70 backdrop-blur-md text-white hover:scale-110 transition-transform shadow-lg border border-white/10">
                            <Icon name="heart" size={12} fill={isFavorite ? "#06b6d4" : "none"} className={isFavorite ? "text-cyan-500" : "text-white"}/>
                        </button>
                    </div>
                    <div className="aspect-[2/3] w-full rounded-lg sm:rounded-xl overflow-hidden mb-1 sm:mb-2.5 bg-black/80 relative shadow-inner">
                        <img src={imgUrl} alt={titleText} loading="lazy" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/300x450/0f172a/ffffff?text=Poster'; }} />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-2 sm:p-3">
                            <span className="w-full py-1.5 sm:py-2 bg-cyan-600/90 text-white rounded-lg sm:rounded-xl text-[10px] sm:text-xs font-bold text-center shadow-lg backdrop-blur-sm">Ver Ahora</span>
                        </div>
                    </div>
                    <div className="px-0.5">
                        <h4 className="text-xs sm:text-sm font-bold text-white truncate group-hover:text-cyan-400 transition-colors">{titleText}</h4>
                        <span className="text-[9px] sm:text-[10px] text-slate-400 capitalize block mt-0.5">{item.type || 'Película'}</span>
                    </div>
                </div>
            );
        };

        // Modal de Bloqueo PIN
        const LockScreen = ({ correctCode, onUnlock, onCancel }) => {
            const [inputPin, setInputPin] = useState('');
            const [error, setError] = useState(false);

            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (!correctCode || inputPin === String(correctCode)) {
                    onUnlock();
                } else {
                    setError(true);
                    setInputPin('');
                }
            };

            return (
                <div className="absolute inset-0 z-40 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
                    <div className="glass-panel p-6 sm:p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl border border-cyan-500/30 animate-scale-in space-y-4">
                        <div className="flex justify-center">
                            <div className="p-3.5 bg-cyan-500/15 rounded-2xl text-cyan-400 border border-cyan-500/30">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            </div>
                        </div>
                        <div>
                            <h2 className="text-base sm:text-lg font-black text-white mb-1">Contenido Protegido</h2>
                            <p className="text-xs text-slate-400">Introduce el PIN de acceso para reproducir</p>
                        </div>
                        <form onSubmit={handlePinSubmit} className="space-y-4">
                            <input 
                                type="password" 
                                maxLength="6" 
                                className="w-full bg-black/60 border border-slate-800 rounded-xl px-4 py-3 text-center text-xl tracking-[0.4em] text-white focus:border-cyan-500 outline-none shadow-inner" 
                                value={inputPin} 
                                onChange={(e) => { setInputPin(e.target.value); setError(false); }} 
                                placeholder="••••" 
                                autoFocus 
                            />
                            {error && <p className="text-rose-400 text-xs font-bold">PIN incorrecto. Inténtalo de nuevo.</p>}
                            <div className="flex gap-2.5">
                                <button type="button" onClick={onCancel} className="flex-1 py-3 rounded-xl border border-slate-800 text-slate-300 hover:bg-white/5 text-xs font-semibold">Cancelar</button>
                                <button type="submit" className="flex-1 py-3 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-500 text-white font-bold hover:brightness-110 text-xs shadow-[0_0_15px_rgba(6,182,212,0.5)]">Desbloquear</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
