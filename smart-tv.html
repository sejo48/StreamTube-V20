<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><meta name="theme-color" content="#020617"><title>BOXPLAYTV · Smart TV</title><link rel="stylesheet" href="smart-tv.css?v=2.0.0"></head>
<body><header><strong>BOXPLAY<span>TV</span></strong><nav aria-label="Catálogo"><button id="new" data-section="new" aria-pressed="true">Estrenos</button><button id="movies" data-section="movies" aria-pressed="false">Películas</button></nav><form id="search-form"><input id="search" type="search" placeholder="Buscar película" aria-label="Buscar película"><button>Buscar</button></form><button id="account">Mi acceso</button></header>
<main><div class="heading"><h1 id="section-title">Estrenos</h1><p id="count"></p></div><p id="message" role="status">Cargando catálogo…</p><div id="grid"></div><div id="pages"><button id="prev">Anterior</button><span id="page-count"></span><button id="next">Siguiente</button></div></main>
<dialog id="details"><div class="detail"><img id="detail-image" alt=""><div><p class="eyebrow">BOXPLAYTV</p><h2 id="detail-title"></h2><p id="detail-meta"></p><p id="detail-description"></p><div class="actions"><button id="watch" class="primary">▶ Ver ahora</button><button id="detail-close">Volver</button></div></div></div></dialog>
<dialog id="login"><form id="login-form"><h2>Tu acceso a BOXPLAYTV</h2><p>₡3.000 por 30 días, por dispositivo.</p><p>SINPE Móvil: <strong>6013-2444</strong>. Comunica tu correo al administrador para activar tu suscripción.</p><label>Correo electrónico<input id="email" type="email" autocomplete="email" required></label><p id="login-message" role="status"></p><div class="actions"><button id="verify" class="primary">Verificar acceso</button><button id="login-close" type="button">Volver</button></div></form></dialog>
<dialog id="pin"><form id="pin-form"><h2>Clave de la película</h2><label>Introduce la clave<input id="pin-value" type="password" required autocomplete="off"></label><p id="pin-message" role="status"></p><div class="actions"><button class="primary">Continuar</button><button id="pin-close" type="button">Cancelar</button></div></form></dialog>
<section id="player" hidden aria-label="Reproductor"><div id="screen"></div><div id="player-controls"><strong id="playing-title"></strong><span id="player-status" role="status"></span><button id="player-go" class="primary">▶ Play / Pausa</button><button id="player-retry">Reintentar</button><button id="player-exit">Volver</button></div></section>
<script src="smart-tv.js?v=2.0.0"></script><script type="module" src="smart-tv-auth.js?v=2.0.0"></script></body></html>
