                    )}
                    <div className="max-h-[60vh] overflow-y-auto custom-scrollbar space-y-2.5 pr-1">
                        {filteredRadios.map((radio, index) => {
                            const logo = radio.logo || radio.imagen;
                            const title = radio.title || radio.titulo;
                            const stream = radio.url || radio.stream;
                            const group = radio.group || radio.categoria || 'Nacionales';
                            const genre = radio.genre || radio.genero;
                            return (
                                <div key={radio.id || index} className="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl hover:bg-slate-100/90 transition-all">
                                    <div className="flex items-center gap-3.5 min-w-0">
                                        <div className="w-11 h-11 rounded-xl bg-white border border-slate-200 overflow-hidden flex items-center justify-center p-1 shadow-sm shrink-0">
                                            {logo ? (<img src={logo} alt="" className="w-full h-full object-contain" onError={(e) => e.target.style.display='none'} />) : (<Icon name="radio" size={16} className="text-slate-400" />)}
                                        </div>
                                        <div className="min-w-0">
                                            <h4 className="font-extrabold text-slate-900 text-xs sm:text-sm truncate">{title}</h4>
                                            <p className="text-[11px] text-emerald-600 font-bold truncate mt-0.5">{group} {genre ? `· ${genre}` : ''}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 shrink-0">
                                        {stream && (<button onClick={() => onTestPlayer(title, stream)} className="p-1.5 bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-xl flex items-center gap-1 text-[11px] font-bold px-2.5 transition-colors"><Icon name="play" size={12} /> Probar</button>)}
                                        <div className="flex gap-1">
                                            <button onClick={() => moveItem(index, 'up')} disabled={index === 0} className="p-1.5 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="up" size={13}/></button>
                                            <button onClick={() => moveItem(index, 'down')} disabled={index === radios.length - 1} className="p-1.5 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="down" size={13}/></button>
                                        </div>
                                        <button onClick={() => setEditingItem(radio)} className="p-2 text-cyan-600 hover:bg-cyan-50 rounded-xl transition-colors" title="Editar"><Icon name="edit" size={15} /></button>
                                        <button onClick={() => requestConfirm(`¿Eliminar "${title}"?`, () => setRadios(radios.filter(r => r.id !== radio.id)))} className="p-2 text-rose-600 hover:bg-rose-50 rounded-xl transition-colors" title="Eliminar"><Icon name="trash" size={15} /></button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ============================================================
        // EDITOR: VIDEOTECA
        // ============================================================
        const VideotecaEditor = ({ videoteca, setVideoteca, showToast, requestConfirm, onTestPlayer }) => {
            const [selectedItemId, setSelectedItemId] = useState(null);
            const [editingItem, setEditingItem] = useState(null);
            const [editingPista, setEditingPista] = useState(null);
            const [isExtractingTracks, setIsExtractingTracks] = useState(false);
            const [pistaForm, setPistaForm] = useState({ title: '', audio: '', archiveId: '', duration: 'Álbum' });
            const selectedItem = videoteca.find(v => v.id === selectedItemId);

            const videotecaInitRef = useRef(false);
            useEffect(() => {
                if (videotecaInitRef.current) return;
                let needsUpdate = false;
                const withIds = videoteca.map((item, idx) => {
                    if (!item.id) { needsUpdate = true; return { ...item, id: `alb-${Date.now()}-${idx}` }; }
                    return item;
                });
                if (needsUpdate) { videotecaInitRef.current = true; setVideoteca(withIds); }
            }, [videoteca, setVideoteca]);

            useEffect(() => {
                if (editingPista) {
                    const track = editingPista.data || {};
                    const trackAudio = track.audio || track.urlDrive || track.url || '';
                    setPistaForm({
                        title: track.title || track.titulo || '',
                        audio: trackAudio,
                        archiveId: track.archiveId || getArchiveIdFromUrl(trackAudio) || '',
                        duration: track.duration || track.duracion || 'Álbum'
                    });
                }
            }, [editingPista]);

            const [searchTerm, setSearchTerm] = useState('');
            const [isFetchingMetadata, setIsFetchingMetadata] = useState(false);
            const [modalForm, setModalForm] = useState({ album: '', artist: '', year: '1970', genre: 'Rock', cover: '', musicUrl: '', description: '' });

            const GENRES = ['Rock', 'Pop & Disco', 'Baladas & Romántica', 'Tropical & Salsa', 'Reggae & Soul'];

            const mapLegacyGenre = (g) => {
                if (!g) return 'Rock';
                if (GENRES.includes(g)) return g;
                const lower = g.toLowerCase();
                if (/pop|disco|dance|new wave/i.test(lower)) return 'Pop & Disco';
                if (/balada|rom[aá]ntic|bolero/i.test(lower)) return 'Baladas & Romántica';
                if (/tropical|salsa|cumbia|merengue|cha-cha|latino/i.test(lower)) return 'Tropical & Salsa';
                if (/reggae|soul|funk|r&b|ska/i.test(lower)) return 'Reggae & Soul';
                if (/rock|metal/i.test(lower)) return 'Rock';
                return g;
            };

            useEffect(() => {
                if (editingItem) {
                    setModalForm({
                        album: editingItem.album || editingItem.titulo || editingItem.title || '',
                        artist: editingItem.artist || editingItem.artista || '',
                        year: String(editingItem.year || editingItem.año || '1970'),
                        genre: mapLegacyGenre(editingItem.genre || editingItem.genero || 'Rock'),
                        cover: editingItem.cover || editingItem.imagen || editingItem.image || '',
                        musicUrl: editingItem.musicUrl || editingItem.urlDrive || editingItem.url || '',
                        description: editingItem.description || editingItem.descripcion || ''
                    });
                }
            }, [editingItem]);

            const handleAutoFetchMetadata = async () => {
                const albumQuery = (modalForm.album || '').trim();
                const artistQuery = (modalForm.artist || '').trim();
                const searchCombined = (artistQuery ? `${artistQuery} ${albumQuery}` : albumQuery).trim();
                if (!searchCombined) { showToast('Escribe el nombre del álbum o artista'); return; }
                setIsFetchingMetadata(true);
                showToast('Buscando metadatos en iTunes y Wikipedia...', 'info');
                let updated = { ...modalForm };
                try {
                    const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(searchCombined)}&entity=album&limit=5`;
                    const res = await fetch(itunesUrl);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.results && data.results.length > 0) {
                            const match = data.results.find(r => !artistQuery || (r.artistName || '').toLowerCase().includes(artistQuery.toLowerCase())) || data.results[0];
                            if (match) {
                                if (match.collectionName && (!albumQuery || albumQuery.length < 5)) updated.album = match.collectionName;
                                if (match.artistName) updated.artist = match.artistName;
                                if (match.releaseDate) { const yr = new Date(match.releaseDate).getFullYear(); if (yr && !isNaN(yr)) updated.year = String(yr); }
                                if (match.primaryGenreName) updated.genre = mapLegacyGenre(match.primaryGenreName);
                                if (match.artworkUrl100) updated.cover = match.artworkUrl100.replace(/100x100bb/g, '1000x1000bb');
                            }
                        }
                    }
                } catch (err) {}
                try {
                    const targetAlbum = updated.album || albumQuery;
                    const targetArtist = updated.artist || artistQuery;
                    let wikiText = '';
                    const queries = [targetAlbum, `${targetAlbum} (álbum)`, `${targetAlbum} (álbum de ${targetArtist})`, `${targetArtist} ${targetAlbum}`];
                    for (const q of queries) {
                        if (wikiText) break;
                        try {
                            const wikiRes = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`);
                            if (wikiRes.ok) {
                                const wData = await wikiRes.json();
                                if (wData.extract && !wData.title?.toLowerCase().includes('desambiguación')) wikiText = wData.extract;
                            }
                        } catch (e) {}
                    }
                    if (!wikiText) {
                        for (const q of [targetAlbum, `${targetAlbum} (album)`]) {
                            if (wikiText) break;
                            try {
                                const enRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`);
                                if (enRes.ok) { const enData = await enRes.json(); if (enData.extract && !enData.title?.toLowerCase().includes('disambiguation')) wikiText = enData.extract; }
                            } catch (e) {}
                        }
                    }
                    if (wikiText) updated.description = wikiText;
                    else if (!updated.description) updated.description = `Producción discográfica clásica de ${updated.artist || 'artista'}, lanzada en ${updated.year}. Categoría: ${updated.genre}.`;
                } catch (err) {}
                setModalForm(updated);
                setIsFetchingMetadata(false);
                showToast('¡Metadatos autocompletados!');
            };

            const exportData = () => {
                const items = BoxCatalog.identify(videoteca, 'videoteca.json');
                downloadFile(JSON.stringify(items, null, 2), 'videoteca.json', 'application/json');
                showToast('Borrador de videoteca.json descargado; no publicado.');
            };

            const saveItemBase = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const album = (formData.get('album') || '').trim();
                const artist = (formData.get('artist') || '').trim();
                const rawMusicUrl = (formData.get('musicUrl') || '').trim();
                const archiveId = getArchiveIdFromUrl(rawMusicUrl);
                const existingIndex = videoteca.findIndex(v =>
                    (v.album || v.titulo || v.title || '').toLowerCase() === album.toLowerCase() &&
                    (v.artist || v.artista || '').toLowerCase() === artist.toLowerCase() &&
                    (!editingItem || v.id !== editingItem.id)
                );
                if (existingIndex !== -1) { showToast(`El álbum "${album}" ya existe.`, 'error'); return; }
                const normalizedCover = normalizeImageUrl(formData.get('cover') || '');
                const newData = {
                    artist, artista: artist,
                    album, titulo: album, title: album,
                    year: formData.get('year') || '1980',
                    genre: formData.get('genre') || 'Rock',
                    cover: normalizedCover, imagen: normalizedCover, image: normalizedCover,
                    musicUrl: rawMusicUrl, urlDrive: rawMusicUrl,
                    archiveId: archiveId || undefined,
                    description: formData.get('description') || ''
                };
                if (editingItem.isNew) {
                    const newItem = { ...newData, id: `alb-${Date.now()}`, tracks: [] };
                    setVideoteca([newItem, ...videoteca]);
                    setSelectedItemId(newItem.id);
                    showToast('Álbum Clásico creado');
                } else {
                    setVideoteca(videoteca.map(v => v.id === editingItem.id ? { ...v, ...newData } : v));
                    showToast('Álbum actualizado');
                }
                setEditingItem(null);
            };

            const savePista = (e) => {
                e.preventDefault();
                if (!selectedItem) return;
                const title = (pistaForm.title || '').trim();
                const audio = (pistaForm.audio || '').trim();
                const customArchiveId = (pistaForm.archiveId || '').trim();
                const extractedArchiveId = customArchiveId || getArchiveIdFromUrl(audio);
                const currentTracks = [...(selectedItem.tracks || selectedItem.pistas || [])];
                const existingPistaIndex = currentTracks.findIndex((p, i) =>
                    (p.title || p.titulo || '').toLowerCase() === title.toLowerCase() &&
                    (!editingPista || editingPista.index !== i)
                );
                if (existingPistaIndex !== -1) { showToast(`La pista "${title}" ya existe.`, 'error'); return; }
                const pistaData = {
                    title: title || 'Pista de Audio',
                    audio, url: audio, urlDrive: audio,
                    duration: (pistaForm.duration || 'Álbum').trim(),
                    type: (extractedArchiveId || audio.includes('archive.org')) ? 'archive' : 'audio',
                    archiveId: extractedArchiveId || undefined,
                    id: (editingPista && !editingPista.isNew && currentTracks[editingPista.index]?.id) ? currentTracks[editingPista.index].id : `pista-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`
                };
                if (editingPista.isNew) { currentTracks.push(pistaData); showToast('Canción añadida'); }
                else { currentTracks[editingPista.index] = pistaData; showToast('Canción actualizada'); }
                const updatedVideoteca = videoteca.map(v =>
                    (v.id === selectedItem.id || v === selectedItem) ? { ...v, tracks: currentTracks, pistas: currentTracks } : v
                );
                setVideoteca(updatedVideoteca);
                setEditingPista(null);
            };

            const deletePista = (idx) => {
                requestConfirm('¿Eliminar esta canción?', () => {
                    const currentTracks = [...(selectedItem.tracks || selectedItem.pistas || [])];
                    currentTracks.splice(idx, 1);
                    const updatedVideoteca = videoteca.map(v =>
                        (v.id === selectedItem.id || v === selectedItem) ? { ...v, tracks: currentTracks, pistas: currentTracks } : v
                    );
                    setVideoteca(updatedVideoteca);
                    showToast('Canción eliminada');
                });
            };

            const moveTrack = (idx, direction) => {
                if (!selectedItem) return;
                const currentTracks = [...(selectedItem.tracks || selectedItem.pistas || [])];
                if (direction === 'up' && idx > 0) [currentTracks[idx - 1], currentTracks[idx]] = [currentTracks[idx], currentTracks[idx - 1]];
                else if (direction === 'down' && idx < currentTracks.length - 1) [currentTracks[idx + 1], currentTracks[idx]] = [currentTracks[idx], currentTracks[idx + 1]];
                const updatedVideoteca = videoteca.map(v =>
                    (v.id === selectedItem.id || v === selectedItem) ? { ...v, tracks: currentTracks, pistas: currentTracks } : v
                );
                setVideoteca(updatedVideoteca);
            };

            const handleExtractArchiveTracks = async () => {
                const archId = selectedItem.archiveId || getArchiveIdFromUrl(selectedItem.musicUrl || selectedItem.urlDrive || '');
                if (!archId) { showToast('No se encontró identificador de Archive.org'); return; }
                setIsExtractingTracks(true);
                showToast('Consultando canciones en Archive.org...', 'info');
                try {
                    const res = await fetch(`https://archive.org/metadata/${encodeURIComponent(archId)}`);
                    if (res.ok) {
                        const data = await res.json();
                        const files = data.files || [];
                        const audioFiles = files.filter(f => f.format && (f.format.includes('VBR MP3') || f.format.includes('MP3') || f.format.includes('Audio') || (f.name || '').toLowerCase().endsWith('.mp3')));
                        if (audioFiles.length > 0) {
                            const extracted = audioFiles.map((f, i) => {
                                let rawTitle = f.title || f.name.replace(/\.[^/.]+$/, '').replace(/^[0-9]+[_\s-]+/, '');
                                let dur = 'Álbum';
                                if (f.length) {
                                    const total = parseFloat(f.length);
                                    if (!isNaN(total) && total > 0) {
                                        const m = Math.floor(total / 60);
                                        const s = Math.floor(total % 60);
                                        dur = `${m}:${s < 10 ? '0' : ''}${s}`;
                                    }
                                }
                                const audioUrl = `https://archive.org/download/${archId}/${encodeURIComponent(f.name)}`;
                                return { title: rawTitle.replace(/_/g, ' '), audio: audioUrl, url: audioUrl, urlDrive: audioUrl, duration: dur, type: 'audio', archiveId: archId, id: `pista-${Date.now()}-${i}` };
                            });
                            const updatedVideoteca = videoteca.map(v =>
                                (v.id === selectedItem.id || v === selectedItem) ? { ...v, tracks: extracted, pistas: extracted } : v
                            );
                            setVideoteca(updatedVideoteca);
                            showToast(`¡Se extrajeron ${extracted.length} canciones!`);
                        } else showToast('No se encontraron archivos de audio');
                    } else showToast('Error al conectar con Archive.org');
                } catch (e) { showToast('Error al procesar canciones'); }
                setIsExtractingTracks(false);
            };

            const moveItem = (index, direction) => {
                const newItems = [...videoteca];
                if (direction === 'up' && index > 0) [newItems[index - 1], newItems[index]] = [newItems[index], newItems[index - 1]];
                else if (direction === 'down' && index < newItems.length - 1) [newItems[index + 1], newItems[index]] = [newItems[index], newItems[index + 1]];
                setVideoteca(newItems);
            };

            const filteredVideoteca = videoteca.filter(v => {
                const name = (v.album || v.titulo || v.title || '').toLowerCase();
                const art = (v.artist || v.artista || '').toLowerCase();
                const gen = (v.genre || v.genero || '').toLowerCase();
                const yr = String(v.year || v.año || '');
                const q = searchTerm.toLowerCase();
                return name.includes(q) || art.includes(q) || gen.includes(q) || yr.includes(q);
            });

            return (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 flex flex-col md:flex-row min-h-[72vh] overflow-hidden">
                    <div className="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-slate-200 bg-slate-50 flex flex-col h-[50vh] md:h-auto md:max-h-[82vh]">
                        <div className="p-4 border-b border-slate-200 bg-white flex justify-between items-center">
                            <div>
                                <h2 className="text-base font-black text-slate-900 flex items-center gap-2"><Icon name="disc" className="text-amber-600" size={16}/> BoxPlayMusic</h2>
                                <span className="text-[10px] text-slate-500 font-bold">({videoteca.length} álbumes)</span>
                            </div>
                            <div className="flex gap-1.5">
                                <button onClick={() => setEditingItem({ isNew: true })} className="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1"><Icon name="plus" size={12} /> Nuevo</button>
                                <button onClick={exportData} className="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1"><Icon name="download" size={12} /> Exportar</button>
                            </div>
                        </div>
                        <div className="p-3 bg-white border-b border-slate-200">
                            <input type="text" placeholder="Buscar..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full p-2 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-amber-500 outline-none text-xs" />
                        </div>
                        <div className="overflow-y-auto custom-scrollbar flex-1 p-2 space-y-1.5">
                            {filteredVideoteca.map((item, index) => {
                                const albumTitle = item.album || item.titulo || item.title || 'Álbum';
                                const artistName = item.artist || item.artista || 'Artista';
                                const coverImg = item.cover || item.imagen || item.image;
                                const tracksCount = (item.tracks || item.pistas || []).length;
                                const isSelected = selectedItemId === item.id;
                                return (
                                    <div key={item.id || index} onClick={() => setSelectedItemId(item.id)} className={`p-2.5 rounded-2xl cursor-pointer flex items-center justify-between gap-3 transition-all ${isSelected ? 'bg-amber-100/80 border-l-4 border-amber-600 shadow-sm' : 'hover:bg-slate-200/60'}`}>
                                        <div className="flex items-center gap-3 min-w-0">
                                            <div className="w-11 h-11 rounded-lg bg-black border border-slate-200 overflow-hidden shrink-0 shadow-sm">
                                                <img src={coverImg} className="w-full h-full object-cover" onError={(e) => { e.target.src='https://placehold.co/80x80/111/d4af37?text=DISCO'; }} />
                                            </div>
                                            <div className="min-w-0">
                                                <h4 className="font-extrabold text-xs truncate text-slate-900">{albumTitle}</h4>
                                                <p className="text-[11px] text-amber-800 font-bold truncate">{artistName}</p>
                                                <p className="text-[10px] text-slate-400 truncate mt-0.5">{item.year || '1980'} · {item.genre || 'Rock'} · {tracksCount} pistas</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-1 shrink-0" onClick={e => e.stopPropagation()}>
                                            <button onClick={() => setEditingItem(item)} className="p-1.5 text-blue-600 hover:bg-blue-100 rounded-lg" title="Editar"><Icon name="edit" size={13}/></button>
                                            <div className="flex flex-col gap-0.5">
                                                <button onClick={() => moveItem(index, 'up')} disabled={index === 0} className="p-0.5 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="up" size={10}/></button>
                                                <button onClick={() => moveItem(index, 'down')} disabled={index === videoteca.length - 1} className="p-0.5 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="down" size={10}/></button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="w-full md:w-2/3 p-4 md:p-6 overflow-y-auto max-h-[70vh] md:max-h-[82vh] custom-scrollbar bg-white">
                        {!selectedItem ? (
                            <div className="h-full flex flex-col items-center justify-center text-slate-400 py-16">
                                <Icon name="disc" size={56} className="mb-3 opacity-20 text-amber-600"/>
                                <p className="text-sm font-bold text-slate-600">Ningún álbum seleccionado</p>
                            </div>
                        ) : (
                            <div className="animate-fade-in space-y-6">
                                <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b border-slate-100 pb-5">
                                    <div className="flex gap-3 sm:gap-4 items-start min-w-0 flex-1">
                                        <div className="w-20 h-20 sm:w-28 sm:h-28 rounded-2xl overflow-hidden bg-black border-2 border-amber-500/50 shadow-md shrink-0 relative group cursor-pointer" onClick={() => setEditingItem(selectedItem)} title="Clic para editar">
                                            <img src={selectedItem.cover || selectedItem.imagen} className="w-full h-full object-cover group-hover:scale-105 transition-transform" onError={(e) => { e.target.src='https://placehold.co/150x150/111/d4af37?text=DISCO'; }} />
                                            <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white transition-opacity"><Icon name="edit" size={18} /></div>
                                        </div>
                                        <div className="min-w-0 flex-1">
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <span className="bg-amber-100 text-amber-900 border border-amber-300 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider">{selectedItem.genre || 'Rock'}</span>
                                                <span className="bg-slate-100 text-slate-700 text-[10px] font-mono font-bold px-2 py-0.5 rounded-full">Año: {selectedItem.year || '1980'}</span>
                                                {selectedItem.archiveId && (<span className="bg-amber-500/10 text-amber-800 border border-amber-500/30 text-[9px] font-mono font-bold px-2 py-0.5 rounded-full flex items-center gap-1"><Icon name="archive" size={10} /> ID: {selectedItem.archiveId}</span>)}
                                            </div>
                                            <div className="flex items-center gap-2 mt-1">
                                                <h1 className="text-lg sm:text-2xl font-black text-slate-900 truncate">{selectedItem.album || selectedItem.titulo}</h1>
                                                <button type="button" onClick={() => setEditingItem(selectedItem)} className="p-1.5 text-blue-600 hover:bg-blue-100 rounded-xl transition-colors shrink-0" title="Editar info"><Icon name="edit" size={15}/></button>
                                            </div>
                                            <h2 className="text-xs sm:text-sm font-bold text-amber-800 truncate">{selectedItem.artist || selectedItem.artista}</h2>
                                            <div className="mt-2.5 bg-amber-50/80 border border-amber-200 rounded-xl p-2.5 text-xs flex items-center justify-between gap-2 max-w-full">
                                                <div className="truncate">
                                                    <span className="font-bold text-amber-950 block text-[10px]">URL Principal / Archive.org:</span>
                                                    <span className="text-[11px] font-mono text-slate-700 truncate block">{selectedItem.musicUrl || selectedItem.urlDrive || 'Sin enlace general'}</span>
                                                </div>
                                                {(selectedItem.musicUrl || selectedItem.urlDrive) && (
                                                    <button onClick={() => onTestPlayer(selectedItem.album || selectedItem.titulo, selectedItem.musicUrl || selectedItem.urlDrive)} className="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-[11px] font-bold shrink-0 flex items-center gap-1 shadow-sm transition-colors"><Icon name="play" size={11} /> Probar</button>
                                                )}
                                            </div>
                                            <p className="text-xs text-slate-600 mt-2 leading-relaxed line-clamp-2">{selectedItem.description || selectedItem.descripcion || 'Sin descripción disponible.'}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 w-full lg:w-auto justify-start lg:justify-end shrink-0 pt-2 lg:pt-0">
                                        <button type="button" onClick={() => setEditingItem(selectedItem)} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl text-xs font-black shadow-md flex items-center gap-1.5 transition-all"><Icon name="edit" size={14}/> Editar Álbum</button>
                                        <button type="button" onClick={() => requestConfirm(`¿Eliminar "${selectedItem.album || selectedItem.titulo}"?`, () => { setVideoteca(videoteca.filter(v => v.id !== selectedItem.id && v !== selectedItem)); setSelectedItemId(null); showToast('Álbum eliminado'); })} className="px-3.5 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-bold transition-colors flex items-center gap-1.5 border border-rose-200"><Icon name="trash" size={14}/> Borrar</button>
                                    </div>
                                </div>
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <div>
                                            <h3 className="text-sm font-extrabold text-slate-800 flex items-center gap-2"><Icon name="music" size={16} className="text-amber-600" /> Canciones ({(selectedItem.tracks || selectedItem.pistas || []).length})</h3>
                                            <p className="text-[11px] text-slate-400">Soporta MP3, Google Drive y Archive.org</p>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {(selectedItem.archiveId || getArchiveIdFromUrl(selectedItem.musicUrl || selectedItem.urlDrive || '')) && (
                                                <button type="button" onClick={handleExtractArchiveTracks} disabled={isExtractingTracks} className="text-xs bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 px-3 py-1.5 rounded-xl flex items-center gap-1.5 font-bold shadow-sm transition-all disabled:opacity-50">
                                                    {isExtractingTracks ? (<span className="flex items-center gap-1"><span className="animate-spin">⏳</span> Extrayendo...</span>) : (<><Icon name="archive" size={12}/> Extraer de Archive.org</>)}
                                                </button>
                                            )}
                                            <button onClick={() => setEditingPista({ isNew: true, data: {} })} className="text-xs bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-xl flex items-center gap-1.5 font-bold shadow-sm transition-all"><Icon name="plus" size={12}/> Añadir Canción</button>
                                        </div>
                                    </div>
                                    <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm bg-white">
                                        {(!selectedItem.tracks && !selectedItem.pistas) || (selectedItem.tracks || selectedItem.pistas || []).length === 0 ? (
                                            <div className="p-8 text-center text-slate-400 text-xs">Este álbum no tiene canciones añadidas.</div>
                                        ) : (
                                            (selectedItem.tracks || selectedItem.pistas).map((track, idx) => {
                                                const trackAudio = track.audio || track.urlDrive || track.url || '';
                                                const trackTitle = track.title || track.titulo || `Pista ${idx + 1}`;
                                                const trackDur = track.duration || track.duracion || 'Álbum';
                                                const isArchive = track.type === 'archive' || track.archiveId || trackAudio.includes('archive.org');
                                                return (
                                                    <div key={track.id || idx} className="flex items-center justify-between p-3 border-b border-slate-100 last:border-b-0 hover:bg-amber-50/40 transition-colors text-xs">
                                                        <div className="min-w-0 pr-3 flex items-center gap-3">
                                                            <span className="text-slate-400 font-mono font-bold w-5 text-right">{idx + 1}.</span>
                                                            <div className="min-w-0">
                                                                <p className="font-bold text-slate-900 truncate flex items-center gap-2">
                                                                    <span>{trackTitle}</span>
                                                                    {isArchive && (<span className="text-[9px] font-mono px-1.5 py-0.2 rounded bg-amber-100 text-amber-800 border border-amber-300 font-bold">ARCHIVE</span>)}
                                                                </p>
                                                                <p className="text-[10px] text-slate-400 font-mono truncate mt-0.5">{trackAudio}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-1.5 shrink-0 items-center">
                                                            <div className="flex gap-0.5">
                                                                <button onClick={() => moveTrack(idx, 'up')} disabled={idx === 0} className="p-1 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="up" size={11}/></button>
                                                                <button onClick={() => moveTrack(idx, 'down')} disabled={idx === (selectedItem.tracks || selectedItem.pistas || []).length - 1} className="p-1 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="down" size={11}/></button>
                                                            </div>
                                                            <span className="text-[11px] font-mono text-slate-400 px-1">{trackDur}</span>
                                                            {(trackAudio || track.archiveId) && (
                                                                <button onClick={() => onTestPlayer(trackTitle, track.archiveId ? `https://archive.org/embed/${track.archiveId}` : trackAudio)} className="p-1.5 bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-lg text-[11px] font-bold px-2 flex items-center gap-1 transition-colors"><Icon name="play" size={11} /> Probar</button>
                                                            )}
                                                            <button onClick={() => setEditingPista({ index: idx, data: track, isNew: false })} className="p-1.5 text-blue-600 hover:bg-blue-100 rounded-lg font-bold flex items-center gap-1 text-xs"><Icon name="edit" size={13}/> <span className="hidden sm:inline">Editar</span></button>
                                                            <button onClick={() => deletePista(idx)} className="p-1.5 text-rose-600 hover:bg-rose-100 rounded-lg"><Icon name="trash" size={13}/></button>
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {editingItem && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in overflow-y-auto">
                            <div className="bg-white p-6 sm:p-7 rounded-3xl shadow-2xl border border-slate-100 w-full max-w-lg space-y-4 my-8 max-h-[92vh] overflow-y-auto custom-scrollbar">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <h3 className="font-extrabold text-base text-slate-900 flex items-center gap-2"><Icon name="disc" className="text-amber-600" /> {editingItem.isNew ? 'Nuevo Álbum' : 'Editar Álbum'}</h3>
                                    <button onClick={() => setEditingItem(null)} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg"><Icon name="x" size={18} /></button>
                                </div>
                                <div className="bg-gradient-to-r from-amber-500/10 to-yellow-500/10 border border-amber-500/30 p-3 sm:p-3.5 rounded-2xl flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 shadow-inner">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-700 flex items-center justify-center flex-shrink-0"><Icon name="sparkles" size={16} /></div>
                                        <div className="min-w-0">
                                            <h4 className="text-xs font-black text-amber-950 truncate">Generador Automático de Metadatos</h4>
                                            <p className="text-[10px] text-amber-900/80 truncate">Autocompleta año, género, portada HD y reseña.</p>
                                        </div>
                                    </div>
                                    <button type="button" onClick={handleAutoFetchMetadata} disabled={isFetchingMetadata || (!modalForm.album && !modalForm.artist)} className="px-3.5 py-2 bg-gradient-to-r from-amber-600 to-yellow-500 hover:brightness-110 active:scale-95 text-white rounded-xl text-xs font-black transition-all shadow-md flex items-center justify-center gap-1.5 flex-shrink-0 disabled:opacity-50">
                                        {isFetchingMetadata ? (<span className="flex items-center gap-1.5"><span className="animate-spin">⏳</span> Buscando...</span>) : (<><Icon name="sparkles" size={13} /> Autocompletar</>)}
                                    </button>
                                </div>
                                {modalForm.cover && (
                                    <div className="flex items-center gap-3 p-2.5 bg-slate-50 border border-slate-200 rounded-2xl animate-fade-in">
                                        <img src={modalForm.cover} alt="Cover preview" className="w-14 h-14 object-cover rounded-xl shadow-md flex-shrink-0 border border-slate-200" onError={e => e.target.style.display='none'} />
                                        <div className="min-w-0 flex-1">
                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                <span className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-bold font-mono">{modalForm.year || '1970'}</span>
                                                <span className="px-2 py-0.5 rounded-full bg-cyan-100 text-cyan-800 text-[10px] font-bold">{modalForm.genre || 'Rock'}</span>
                                            </div>
                                            <h5 className="text-xs font-bold text-slate-800 truncate mt-1">{modalForm.album || 'Nombre del Álbum'}</h5>
                                            <p className="text-[11px] text-slate-500 truncate">{modalForm.artist || 'Artista'}</p>
                                        </div>
                                    </div>
                                )}
                                <form onSubmit={saveItemBase} className="space-y-3.5">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                    {editingPista && (

            );
        };

        // ============================================================
        // HOOK: HISTORIAL CENTRALIZADO
        // ============================================================
        const useHistoryTracker = ({
            movies, estrenos, tudumList, series, channels, animados, radios, videoteca, enabled
        }) => {
            const historyRef = useRef({ history: [], index: -1 });
            const skipRef = useRef(true);
            const timerRef = useRef(null);
            const [historyState, setHistoryState] = useState({ history: [], index: -1 });

            useEffect(() => {
                if (!enabled) return;
                if (skipRef.current) { skipRef.current = false; return; }
                if (timerRef.current) clearTimeout(timerRef.current);
                timerRef.current = setTimeout(() => {
                    const snapshot = { movies, estrenos, tudum: tudumList, series, channels, animados, radios, videoteca };
                    const ref = historyRef.current;
                    const baseIdx = ref.index < 0 ? 0 : ref.index;
                    const sliced = ref.history.slice(0, baseIdx + 1);
                    sliced.push(snapshot);
                    if (sliced.length > 30) sliced.shift();
                    ref.history = sliced;
                    ref.index = sliced.length - 1;
                    setHistoryState({ history: sliced, index: ref.index });
                }, 400);
                return () => { if (timerRef.current) clearTimeout(timerRef.current); };
            }, [movies, estrenos, tudumList, series, channels, animados, radios, videoteca, enabled]);

            const undo = useCallback(() => {
                const ref = historyRef.current;
                if (ref.index <= 0) return null;
                ref.index -= 1;
                const prev = ref.history[ref.index];
                setHistoryState({ history: ref.history, index: ref.index });
                return prev;
            }, []);

            return { historyState, undo };
        };

        // ============================================================
        // APP PRINCIPAL
        // ============================================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('movies');
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, message: '', onConfirm: null });
            const [githubModalOpen, setGithubModalOpen] = useState(false);
            const [playerData, setPlayerData] = useState({ isOpen: false, title: '', url: '' });

            const [movies, setMovies] = useState([]);
            const [estrenos, setEstrenos] = useState([]);
            const [tudumList, setTudumList] = useState([]);
            const [series, setSeries] = useState([]);
            const [channels, setChannels] = useState([]);
            const [animados, setAnimados] = useState([]);
            const [radios, setRadios] = useState([]);
            const [videoteca, setVideoteca] = useState([]);
            const [dataInitialized, setDataInitialized] = useState(false);

            const fileInputRef = useRef(null);

            const showToast = useCallback((msg, type = 'success') => {
                setToast({ msg, type, id: Date.now() });
            }, []);

            const requestConfirm = useCallback((message, onConfirm) => {
                setConfirmDialog({ isOpen: true, message, onConfirm });
            }, []);

            const openTestPlayer = useCallback((title, url) => {
                if (!url) { showToast('Este elemento no tiene una URL válida para probar', 'error'); return; }
                setPlayerData({ isOpen: true, title, url });
            }, [showToast]);

            const { historyState, undo } = useHistoryTracker({
                movies, estrenos, tudumList, series, channels, animados, radios, videoteca,
                enabled: dataInitialized
            });

            const handleUndo = () => {
                const prev = undo();
                if (!prev) { showToast('No hay más acciones previas para deshacer', 'error'); return; }
                setMovies(prev.movies);
                setEstrenos(prev.estrenos);
                setTudumList(prev.tudum);
                setSeries(prev.series);
                setChannels(prev.channels);
                setAnimados(prev.animados);
                setRadios(prev.radios);
                setVideoteca(prev.videoteca);
                showToast('Cambio deshecho');
            };

            const downloadAllBackups = () => {
                const datasets = BoxCatalog.serializeAll({ movies, estrenos, tudumList, series, channels, animados, radios, videoteca });
                const fullBackup = {
                    date: new Date().toISOString(), app: 'Box Play TV',
                    movies: datasets['peliculas.json'], estrenos2026: datasets['peliculas2.json'],
                    tudum: datasets['tudum.json'], series: datasets['playlist.json'],
                    animados: datasets['animados.json'], radios: datasets['radios.json'],
                    videoteca: datasets['videoteca.json'], tvM3U: datasets['listaoficial.m3u']
                };
                const dateStr = new Date().toISOString().slice(0, 10);
                downloadFile(JSON.stringify(fullBackup, null, 2), `boxplaytv_backup_completo_${dateStr}.json`, 'application/json');
                showToast('Backup descargado');
            };

            const fetchFromCloud = async () => {
                setLoading(true);
                try {
                    const [resTV, resSeries, resMovies, resEstrenos, resTudum, resAnimados, resRadios, resVideoteca] = await Promise.all([
                        fetchSmart(SOURCE_URLS.TV, RAW_URLS.TV, false),
                        fetchSmart(SOURCE_URLS.SERIES, RAW_URLS.SERIES, true),
                        fetchSmart(SOURCE_URLS.MOVIES, RAW_URLS.MOVIES, true),
                        fetchSmart(SOURCE_URLS.ESTRENOS2026, RAW_URLS.ESTRENOS2026, true),
                        fetchSmart(SOURCE_URLS.TUDUM, RAW_URLS.TUDUM, true),
                        fetchSmart(SOURCE_URLS.ANIMADOS, RAW_URLS.ANIMADOS, true),
                        fetchSmart(SOURCE_URLS.RADIOS, RAW_URLS.RADIOS, true),
                        fetchSmart(SOURCE_URLS.VIDEOTECA, RAW_URLS.VIDEOTECA, true)
                    ]);

                    const parsedChannels = parseM3U(resTV || '').map(c => ({ ...c, logo: normalizeImageUrl(c.logo || '') }));

                    const parsedSeries = (Array.isArray(resSeries) ? resSeries : (resSeries?.series || [])).map((s, i) => ({
                        ...s, id: BoxCatalog.id(s, 'playlist.json'),
                        imagen: normalizeImageUrl(s.imagen || s.image || ''),
                        image: normalizeImageUrl(s.imagen || s.image || ''),
                        temporadas: (s.temporadas || []).map(t => ({
                            ...t, episodios: (t.episodios || []).map((ep, ei) => ({ ...ep, id: ep.id || BoxCatalog.id(ep, s.id + '-episode') }))
                        }))
                    }));

                    const parsedMovies = (Array.isArray(resMovies) ? resMovies : (resMovies?.peliculas || [])).map((m, i) => ({
                        ...m, id: BoxCatalog.id(m, 'peliculas.json'),
                        imagen: normalizeImageUrl(m.imagen || m.image || ''),
                        image: normalizeImageUrl(m.imagen || m.image || '')
                    }));

                    const parsedEstrenos = (Array.isArray(resEstrenos) ? resEstrenos : (resEstrenos?.peliculas2 || resEstrenos?.peliculas || [])).map((m, i) => ({
                        ...m, id: BoxCatalog.id(m, 'peliculas2.json'),
                        imagen: normalizeImageUrl(m.imagen || m.image || ''),
                        image: normalizeImageUrl(m.imagen || m.image || '')
                    }));

                    const parsedTudum = (Array.isArray(resTudum) ? resTudum : (resTudum?.tudum || [])).map((t, i) => ({
                        ...t, id: BoxCatalog.id(t, 'tudum.json'),
                        image: normalizeImageUrl(t.image || t.imagen || ''),
                        imagen: normalizeImageUrl(t.image || t.imagen || '')
                    }));

                    const parsedAnimados = (Array.isArray(resAnimados) ? resAnimados : (resAnimados?.animados || resAnimados?.animated || [])).map((a, i) => ({
                        ...a, id: BoxCatalog.id(a, 'animados.json'),
                        imagen: normalizeImageUrl(a.imagen || a.image || ''),
                        image: normalizeImageUrl(a.imagen || a.image || ''),
                        temporadas: (a.temporadas || []).map(t => ({
                            ...t, episodios: (t.episodios || []).map((ep, ei) => ({ ...ep, id: ep.id || BoxCatalog.id(ep, a.id + '-episode') }))
                        }))
                    }));

                    const parsedRadios = (Array.isArray(resRadios) ? resRadios : (resRadios?.radios || [])).map((r, i) => ({
                        ...r, id: r.id || `cr-${i}`,
                        logo: normalizeImageUrl(r.logo || r.imagen || ''),
                        imagen: normalizeImageUrl(r.logo || r.imagen || '')
                    }));

                    const parsedVideoteca = (Array.isArray(resVideoteca) ? resVideoteca : (resVideoteca?.videoteca || resVideoteca?.albumes || [])).map((v, i) => ({
                        ...v, id: BoxCatalog.id(v, 'videoteca.json'),
                        cover: normalizeImageUrl(v.cover || v.imagen || v.image || ''),
                        imagen: normalizeImageUrl(v.cover || v.imagen || v.image || ''),
                        image: normalizeImageUrl(v.cover || v.imagen || v.image || ''),
                        tracks: (v.tracks || v.pistas || []).map((p, pi) => ({ ...p, id: p.id || BoxCatalog.id(p, v.id + '-track') }))
                    }));

                    setChannels(parsedChannels);
                    setSeries(parsedSeries);
                    setMovies(parsedMovies);
                    setEstrenos(parsedEstrenos);
                    setTudumList(parsedTudum);
                    setAnimados(parsedAnimados);
                    setRadios(parsedRadios);
                    setVideoteca(parsedVideoteca);

                    setDataInitialized(true);
                    showToast("Datos descargados y actualizados correctamente");
                } catch (error) {
                    console.error("Error sincronizando:", error);
                    showToast(error.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            const syncToGithub = async () => {
                const baseline = await BoxCatalog.readAll();
                const datasets = BoxCatalog.serializeAll({ movies, estrenos, tudumList, series, channels, animados, radios, videoteca });
                return BoxCatalog.makeDraft(baseline, datasets);
            };

            const applyDatasets = datasets => {
                for (const file of BoxCatalog.files) if (datasets[file] === undefined) throw new Error('Respaldo incompleto: ' + file);
                // Prepare every list before touching state; malformed backups cannot partially apply.
                const next = Object.fromEntries(BoxCatalog.files.filter(file => file.endsWith('.json')).map(file => [file, BoxCatalog.identify(datasets[file], file)]));
                const channels = BoxCatalog.parseM3U(datasets['listaoficial.m3u']);
                setMovies(next['peliculas.json']); setEstrenos(next['peliculas2.json']);
                setSeries(next['playlist.json']); setAnimados(next['animados.json']);
                setRadios(next['radios.json']); setTudumList(next['tudum.json']);
                setVideoteca(next['videoteca.json']); setChannels(channels);
                setDataInitialized(true);
                showToast('Respaldo restaurado localmente. No se ha publicado.');
            };
            const restoreBaseline = datasets => requestConfirm('¿Restaurar el respaldo en el panel? Se reemplazarán los cambios locales. GitHub no se modificará.', () => applyDatasets(datasets));

            const handleFileImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 10 * 1024 * 1024) { showToast('Archivo demasiado grande (máx 10MB)', 'error'); e.target.value = ''; return; }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const content = event.target.result;
                    try {
                        const filename = file.name.toLowerCase();
                        if (filename.endsWith('.m3u') || filename.endsWith('.m3u8')) {
                            const parsed = parseM3U(content).map(c => ({ ...c, logo: normalizeImageUrl(c.logo || '') }));
                            setChannels(parsed);
                            showToast(`Importados ${parsed.length} canales de TV`);
                        } else if (filename.includes('boxplaytv_borrador')) {
                            const parsed = JSON.parse(content);
                            if (parsed.schemaVersion !== 1 || parsed.mode !== 'draft') throw new Error('Borrador incompatible.');
                            applyDatasets(parsed.datasets);
                        } else if (filename.includes('backup_completo')) {
                            const parsed = JSON.parse(content);
                            if (parsed.movies) setMovies(parsed.movies.map((m, i) => ({ ...m, id: BoxCatalog.id(m, 'peliculas.json'), imagen: normalizeImageUrl(m.imagen || m.image || ''), image: normalizeImageUrl(m.imagen || m.image || '') })));
                            if (parsed.estrenos2026) setEstrenos(parsed.estrenos2026.map((m, i) => ({ ...m, id: BoxCatalog.id(m, 'peliculas2.json'), imagen: normalizeImageUrl(m.imagen || m.image || ''), image: normalizeImageUrl(m.imagen || m.image || '') })));
                            if (parsed.tudum) setTudumList(parsed.tudum.map((t, i) => ({ ...t, id: BoxCatalog.id(t, 'tudum.json'), image: normalizeImageUrl(t.image || t.imagen || ''), imagen: normalizeImageUrl(t.image || t.imagen || '') })));
                            if (parsed.series) setSeries(parsed.series.map((s, i) => ({ ...s, id: BoxCatalog.id(s, 'playlist.json'), imagen: normalizeImageUrl(s.imagen || s.image || ''), image: normalizeImageUrl(s.imagen || s.image || '') })));
                            if (parsed.animados) setAnimados(parsed.animados.map((a, i) => ({ ...a, id: BoxCatalog.id(a, 'animados.json'), imagen: normalizeImageUrl(a.imagen || a.image || ''), image: normalizeImageUrl(a.imagen || a.image || '') })));
                            if (parsed.radios) setRadios(parsed.radios.map((r, i) => ({ ...r, id: BoxCatalog.id(r, 'radios.json'), logo: normalizeImageUrl(r.logo || r.imagen || ''), imagen: normalizeImageUrl(r.logo || r.imagen || '') })));
                            if (parsed.videoteca) setVideoteca(parsed.videoteca.map((v, i) => ({ ...v, id: BoxCatalog.id(v, 'videoteca.json'), cover: normalizeImageUrl(v.cover || v.imagen || v.image || ''), imagen: normalizeImageUrl(v.cover || v.imagen || v.image || ''), image: normalizeImageUrl(v.cover || v.imagen || v.image || '') })));
                            if (parsed.tvM3U) setChannels(parseM3U(parsed.tvM3U).map(c => ({ ...c, logo: normalizeImageUrl(c.logo || '') })));
                            showToast('¡Backup completo restaurado!');
                        } else if (filename.includes('peliculas2')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.peliculas2 || parsed.peliculas || [])).map((m, i) => ({ ...m, id: BoxCatalog.id(m, 'peliculas2.json'), imagen: normalizeImageUrl(m.imagen || m.image || ''), image: normalizeImageUrl(m.imagen || m.image || '') }));
                            setEstrenos(list);
                            showToast(`Importados ${list.length} Estrenos 2026`);
                        } else if (filename.includes('tudum')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.tudum || [])).map((t, i) => ({ ...t, id: BoxCatalog.id(t, 'tudum.json'), image: normalizeImageUrl(t.image || t.imagen || ''), imagen: normalizeImageUrl(t.image || t.imagen || '') }));
                            setTudumList(list);
                            showToast(`Importados ${list.length} estrenos Tudum`);
                        } else if (filename.includes('peliculas') || filename.includes('movies')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.peliculas || [])).map((m, i) => ({ ...m, id: BoxCatalog.id(m, 'peliculas.json'), imagen: normalizeImageUrl(m.imagen || m.image || ''), image: normalizeImageUrl(m.imagen || m.image || '') }));
                            setMovies(list);
                            showToast(`Importadas ${list.length} películas`);
                        } else if (filename.includes('radios') || filename.includes('radio')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.radios || [])).map((r, i) => ({ ...r, id: r.id || `cr-${Date.now()}-${i}`, logo: normalizeImageUrl(r.logo || r.imagen || ''), imagen: normalizeImageUrl(r.logo || r.imagen || '') }));
                            setRadios(list);
                            showToast(`Importadas ${list.length} emisoras`);
                        } else if (filename.includes('playlist') || filename.includes('series')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.series || [])).map((s, i) => ({ ...s, id: BoxCatalog.id(s, 'playlist.json'), imagen: normalizeImageUrl(s.imagen || s.image || ''), image: normalizeImageUrl(s.imagen || s.image || '') }));
                            setSeries(list);
                            showToast(`Importadas ${list.length} series`);
                        } else if (filename.includes('animados') || filename.includes('animated')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.animados || parsed.animated || [])).map((a, i) => ({ ...a, id: BoxCatalog.id(a, 'animados.json'), imagen: normalizeImageUrl(a.imagen || a.image || ''), image: normalizeImageUrl(a.imagen || a.image || '') }));
                            setAnimados(list);
                            showToast(`Importados ${list.length} animados`);
                        } else if (filename.includes('videoteca') || filename.includes('albumes') || filename.includes('albums')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.videoteca || parsed.albumes || [])).map((v, i) => ({ ...v, id: BoxCatalog.id(v, 'videoteca.json'), cover: normalizeImageUrl(v.cover || v.imagen || v.image || ''), imagen: normalizeImageUrl(v.cover || v.imagen || v.image || ''), image: normalizeImageUrl(v.cover || v.imagen || v.image || '') }));
                            setVideoteca(list);
                            showToast(`Importados ${list.length} álbumes`);
                        } else {
                            showToast('Formato de archivo no reconocido', 'error');
                        }
                    } catch (err) {
                        showToast('Error al leer el archivo seleccionado', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            useEffect(() => {
                const loadData = async () => {
                    const localMovies = localStorage.getItem('boxplay_admin_movies') || localStorage.getItem('magis_admin_movies');
                    const localEstrenos = localStorage.getItem('boxplay_admin_estrenos') || localStorage.getItem('magis_admin_estrenos');
                    const localTudum = localStorage.getItem('boxplay_admin_tudum') || localStorage.getItem('magis_admin_tudum');
                    const localSeries = localStorage.getItem('boxplay_admin_series') || localStorage.getItem('magis_admin_series');
                    const localTV = localStorage.getItem('boxplay_admin_tv') || localStorage.getItem('magis_admin_tv');
                    const localAnimados = localStorage.getItem('boxplay_admin_animados') || localStorage.getItem('magis_admin_animados');
                    const localRadios = localStorage.getItem('boxplay_admin_radios') || localStorage.getItem('magis_admin_radios');
                    const localVideoteca = localStorage.getItem('boxplay_admin_videoteca') || localStorage.getItem('magis_admin_videoteca');

                    if (localMovies && localEstrenos && localTudum && localSeries && localTV && localAnimados && localVideoteca && localRadios) {
                        try {
                            const m = JSON.parse(localMovies);
                            const est = JSON.parse(localEstrenos);
                            const tud = JSON.parse(localTudum);
                            const s = JSON.parse(localSeries);
                            const t = JSON.parse(localTV);
                            const a = JSON.parse(localAnimados);
                            const r = JSON.parse(localRadios);
                            const v = JSON.parse(localVideoteca);

                            const baseline = await BoxCatalog.readAll();
                            const restore = (items, file) => BoxCatalog.restoreLocal(items, baseline[file], file);
                            setMovies(restore(m, 'peliculas.json')); setEstrenos(restore(est, 'peliculas2.json'));
                            setTudumList(restore(tud, 'tudum.json')); setSeries(restore(s, 'playlist.json'));
                            setChannels(BoxCatalog.restoreLocal(t, BoxCatalog.parseM3U(baseline['listaoficial.m3u']), 'tv'));
                            setAnimados(restore(a, 'animados.json')); setRadios(restore(r, 'radios.json'));
                            setVideoteca(restore(v, 'videoteca.json'));
                            setLoading(false); setDataInitialized(true);
                            showToast("Sesión local restaurada");
                            return;
                        } catch(e) { showToast('No se pudo restaurar la sesión local: ' + e.message, 'error'); setLoading(false); return; }
                    }
                    await fetchFromCloud();
                };
                loadData();
            }, []);

            useEffect(() => {
                if (dataInitialized) {
                    localStorage.setItem('boxplay_admin_movies', JSON.stringify(movies));
                    localStorage.setItem('boxplay_admin_estrenos', JSON.stringify(estrenos));
                    localStorage.setItem('boxplay_admin_tudum', JSON.stringify(tudumList));
                    localStorage.setItem('boxplay_admin_series', JSON.stringify(series));
                    localStorage.setItem('boxplay_admin_tv', JSON.stringify(channels));
                    localStorage.setItem('boxplay_admin_animados', JSON.stringify(animados));
                    localStorage.setItem('boxplay_admin_radios', JSON.stringify(radios));
                    localStorage.setItem('boxplay_admin_videoteca', JSON.stringify(videoteca));
                }
            }, [movies, estrenos, tudumList, series, channels, animados, radios, videoteca, dataInitialized]);

            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-[#0b0f19] text-white">
                        <div className="animate-spin rounded-full h-14 w-14 border-4 border-cyan-500 border-t-transparent mb-5 shadow-[0_0_20px_#06b6d4]"></div>
                        <h2 className="text-base font-extrabold tracking-wide text-slate-200">Sincronizando con Box Play TV...</h2>
                        <p className="text-xs text-slate-500 mt-1">Cargando catálogos remotos y configuración</p>
                    </div>
                );
            }

            const tabs = [
                { id: 'movies', label: 'Películas', icon: 'clapperboard', count: movies.length, color: 'text-blue-500' },
                { id: 'trending', label: 'Tendencias', icon: 'flame', count: 0, color: 'text-rose-400' },
                { id: 'estrenos2026', label: 'Estrenos 2026', icon: 'sparkles', count: estrenos.length, color: 'text-amber-500' },
                { id: 'tudum', label: 'Netflix Tudum', icon: 'flame', count: tudumList.length, color: 'text-rose-500' },
                { id: 'series', label: 'Series', icon: 'film', count: series.length, color: 'text-purple-500' },
                { id: 'animados', label: 'Animados', icon: 'smile', count: animados.length, color: 'text-orange-500' },
                { id: 'videoteca', label: 'BoxPlayMusic', icon: 'disc', count: videoteca.length, color: 'text-yellow-600' },
                { id: 'tv', label: 'TV en Vivo', icon: 'tv', count: channels.length, color: 'text-cyan-500' },
                { id: 'radios', label: 'Radios HD', icon: 'radio', count: radios.length, color: 'text-emerald-500' }
            ];

            return (
                <div className="min-h-screen flex flex-col bg-slate-100 text-slate-900">
                    {toast && <Toast key={toast.id} message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                    <ConfirmModal isOpen={confirmDialog.isOpen} message={confirmDialog.message} onConfirm={confirmDialog.onConfirm} onCancel={() => setConfirmDialog({ isOpen: false, message: '', onConfirm: null })} />
                    <GithubSyncModal isOpen={githubModalOpen} onClose={() => setGithubModalOpen(false)} onSync={syncToGithub} onRestore={restoreBaseline} />
                    <PlayerModal isOpen={playerData.isOpen} title={playerData.title} url={playerData.url} onClose={() => setPlayerData({ isOpen: false, title: '', url: '' })} />
                    <input type="file" ref={fileInputRef} onChange={handleFileImport} className="hidden" accept=".json,.m3u,.m3u8" />

                    <header className="bg-slate-950 text-white shadow-2xl sticky top-0 z-40 border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3 text-center md:text-left">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)] flex-shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className="w-5 h-5 fill-white"><polygon points="40,30 70,50 40,70"/></svg>
                                </div>
                                <div>
                                    <h1 className="text-lg font-black tracking-tight flex items-center gap-2">
                                        <span>BOXPLAY<span className="text-cyan-400">TV</span></span>
                                        <span className="text-[10px] uppercase font-bold tracking-widest bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-0.5 rounded-full">Panel Pro</span>
                                    </h1>
                                    <p className="text-slate-400 text-[10px]">Administración · Borrador local · Publicación deshabilitada</p>
                                </div>
                            </div>
                            <div className="flex flex-wrap items-center justify-center gap-2">
                                <button onClick={handleUndo} className="text-xs bg-slate-900 hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl border border-slate-800 flex items-center gap-1.5 font-bold transition-all shadow-sm" title="Deshacer última acción">
                                    <Icon name="undo" size={13} /> <span>Deshacer</span>
                                </button>
                                <button onClick={() => setGithubModalOpen(true)} className="text-xs bg-purple-600 hover:bg-purple-700 text-white px-3.5 py-2 rounded-xl flex items-center gap-1.5 font-bold transition-all shadow-[0_0_15px_rgba(147,51,234,0.3)]">
                                    <Icon name="github" size={14} /> <span>Revisar borrador</span>
                                </button>
                                <button onClick={() => fileInputRef.current.click()} className="text-xs bg-slate-900 hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl border border-slate-800 flex items-center gap-1.5 font-bold transition-all shadow-sm">
                                    <Icon name="upload" size={13} /> <span>Importar</span>
                                </button>
                                <button onClick={downloadAllBackups} className="text-xs bg-slate-900 hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl border border-slate-800 flex items-center gap-1.5 font-bold transition-all shadow-sm">
                                    <Icon name="download" size={13} /> <span>Backup</span>
                                </button>
                                <button onClick={() => requestConfirm('⚠ Se descargarán los datos desde GitHub y se SOBRESCRIBIRÁN los cambios locales no sincronizados. ¿Continuar?', fetchFromCloud)} className="text-xs bg-slate-900 hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl border border-slate-800 flex items-center gap-1.5 font-bold transition-all shadow-sm">
                                    <Icon name="refresh" size={13} /> <span>Recargar</span>
                                </button>
                            </div>
                        </div>
                        <div className="bg-slate-900 border-t border-slate-800/80 px-4 py-2">
                            <div className="max-w-7xl mx-auto flex items-center justify-between gap-2 overflow-x-auto custom-scrollbar">
                                <div className="flex gap-1.5 py-1">
                                    {tabs.map(tab => {
                                        const isActive = activeTab === tab.id;
                                        return (
                                            <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                                className={`flex items-center gap-2 px-3.5 py-2 rounded-xl font-bold text-xs transition-all whitespace-nowrap ${isActive ? 'bg-gradient-to-r from-cyan-600 to-teal-500 text-white tab-active-indicator shadow-lg' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}>
                                                <Icon name={tab.icon} size={14} className={isActive ? 'text-white' : tab.color} />
                                                <span>{tab.label}</span>
                                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-black ${isActive ? 'bg-black/30 text-white' : 'bg-slate-800 text-slate-300'}`}>{tab.count}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8">
                        <ErrorBoundary>
                            {activeTab === 'movies' && (<MoviesEditor movies={movies} setMovies={setMovies} showToast={showToast} requestConfirm={requestConfirm} onTestPlayer={openTestPlayer} />)}
                            {activeTab === 'trending' && (<TrendingImporter movies={movies} setMovies={setMovies} estrenos={estrenos} setEstrenos={setEstrenos} showToast={showToast} requestConfirm={requestConfirm} />)}
                            {activeTab === 'estrenos2026' && (<Estrenos2026Editor estrenos={estrenos} setEstrenos={setEstrenos} showToast={showToast} requestConfirm={requestConfirm} onTestPlayer={openTestPlayer} />)}
                            {activeTab === 'tudum' && (<TudumEditor tudumList={tudumList} setTudumList={setTudumList} showToast={showToast} requestConfirm={requestConfirm} onTestPlayer={openTestPlayer} />)}
                            {activeTab === 'series' && (<SeriesEditor series={series} setSeries={setSeries} showToast={showToast} requestConfirm={requestConfirm} onTestPlayer={openTestPlayer} />)}
                            {activeTab === 'animados' && (<AnimadosEditor animados={animados} setAnimados={setAnimados} showToast={showToast} requestConfirm={requestConfirm} onTestPlayer={openTestPlayer} />)}
                            {activeTab === 'videoteca' && (<VideotecaEditor videoteca={videoteca} setVideoteca={setVideoteca} showToast={showToast} requestConfirm={requestConfirm} onTestPlayer={openTestPlayer} />)}
                            {activeTab === 'tv' && (<TvEditor channels={channels} setChannels={setChannels} showToast={showToast} requestConfirm={requestConfirm} onTestPlayer={openTestPlayer} />)}
                            {activeTab === 'radios' && (<RadiosEditor radios={radios} setRadios={setRadios} showToast={showToast} requestConfirm={requestConfirm} onTestPlayer={openTestPlayer} />)}
                        </ErrorBoundary>
                    </main>

                    <footer className="bg-slate-900 border-t border-slate-800 text-slate-400 text-xs py-4 px-4 sm:px-8 text-center mt-auto">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
                            <span>Box Play TV Panel de Control Pro • Plataforma Administrativa</span>
                            <span className="font-mono text-[11px] text-cyan-400">Compatible con StreamTube-V20 // v7.1 (Tráilers OK)</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
