<!DOCTYPE html>
<html lang="es">
<head>
    <script src="./catalog.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Play TV - Panel de Control Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50:'#f0fdfa',100:'#ccfbf1',500:'#14b8a6',600:'#0d9488',900:'#134e4a' },
                        cyber: { cyan:'#06b6d4', teal:'#14b8a6', dark:'#0b0f19', darker:'#030712' }
                    }
                }
            }
        };
    </script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        if (typeof Babel !== 'undefined') {
            Babel.registerPreset('react-classic', {
                presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
            });
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; margin: 0; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { transform: translateY(0); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.25s ease-out; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .font-mono-code { font-family: 'Share Tech Mono', monospace; }
        .tab-active-indicator { box-shadow: 0 4px 14px 0 rgba(6, 182, 212, 0.35); }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#0b0f19;color:white;flex-direction:column;font-family:sans-serif;">
            <div style="width:40px;height:40px;border:3px solid #06b6d4;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
            <h2 style="font-weight:700;font-size:0.95rem;letter-spacing:0.05em;color:#94a3b8;">Iniciando Box Play TV Panel Pro...</h2>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef, useMemo, useCallback, Component } = React;

        const SOURCE_URLS = {
            TV: './listaoficial.m3u',
            SERIES: './playlist.json',
            MOVIES: './peliculas.json',
            ESTRENOS2026: './peliculas2.json',
            ANIMADOS: './animados.json',
            RADIOS: './radios.json',
            VIDEOTECA: './videoteca.json',
            TUDUM: './tudum.json'
        };

        const RAW_URLS = SOURCE_URLS; // Destination is resolved by catalog.js.

        const TMDB_DEFAULT_KEY = '8c5c81cb73f9f699696582a6f25647f4';

        // ============================================================
        // UTILIDADES
        // ============================================================

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("ErrorBoundary caught:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl m-4 text-xs font-bold space-y-2">
                            <p>⚠️ Ocurrió un error inesperado al renderizar este módulo.</p>
                            <p className="font-mono text-[11px] text-rose-500">{String(this.state.error)}</p>
                            <button onClick={() => this.setState({ hasError: false })} className="px-3 py-1.5 bg-rose-600 text-white rounded-lg hover:bg-rose-700 font-sans">Reintentar</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const normalizeImageUrl = (url) => {
            if (!url || typeof url !== 'string') return '';
            let cleanUrl = url.trim();
            if (cleanUrl.length === 0) return '';
            if (cleanUrl.includes(' ') && !cleanUrl.includes('%20')) cleanUrl = cleanUrl.replace(/ /g, '%20');
            if (cleanUrl.startsWith('data:') || cleanUrl.startsWith('blob:')) return cleanUrl;
            if (cleanUrl.startsWith('//')) return 'https:' + cleanUrl;
            if (cleanUrl.startsWith('http://') || cleanUrl.startsWith('https://')) return cleanUrl;
            if (cleanUrl.startsWith('/') || cleanUrl.startsWith('./') || cleanUrl.startsWith('../')) return cleanUrl;
            if (cleanUrl.includes('.') && !cleanUrl.includes(' ')) return 'https://' + cleanUrl;
            return cleanUrl;
        };

        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/search') || url.includes('ok.ru/search')) return url;
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');

            // ---- YouTube (mejorado) ----
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('watch?v='))      videoId = url.split('watch?v=')[1]?.split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
                else if (url.includes('/embed/'))   videoId = url.split('/embed/')[1]?.split('?')[0];
                else if (url.includes('/shorts/'))  videoId = url.split('/shorts/')[1]?.split('?')[0];
                if (videoId) {
                    const params = new URLSearchParams({
                        autoplay: '1',
                        mute: '1',
                        playsinline: '1',
                        rel: '0',
                        modestbranding: '1',
                        enablejsapi: '1',
                        origin: window.location.origin === 'null' ? 'https://www.youtube.com' : window.location.origin
                    });
                    return `https://www.youtube.com/embed/${videoId}?${params.toString()}`;
                }
            }

            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) { const parts = url.split('/file/d/'); if (parts[1]) fileId = parts[1].split('/')[0]; }
                else if (url.includes('id=')) { const parts = url.split('id='); if (parts[1]) fileId = parts[1].split('&')[0]; }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            const cleanUrlLower = url.toLowerCase();
            const isAudioExt = cleanUrlLower.endsWith('.mp3') || cleanUrlLower.endsWith('.m4a') || cleanUrlLower.includes('.mp3') || cleanUrlLower.includes('.m4a');
            if (!isAudioExt && (url.includes('archive.org/details/') || url.includes('archive.org/download/'))) {
                const match = url.match(/archive\.org\/(?:details|download)\/([^\/\?]+)/);
                if (match && match[1]) return `https://archive.org/embed/${match[1]}`;
            }
            return url;
        };

        const getArchiveIdFromUrl = (url) => {
            if (!url) return null;
            const match = url.match(/archive\.org\/(?:details|download|embed)\/([^\/\?]+)/);
            return match ? match[1] : null;
        };

        const utf8ToBase64 = (str) => {
            const utf8Bytes = new TextEncoder().encode(str);
            let binary = '';
            const len = utf8Bytes.byteLength;
            for (let i = 0; i < len; i++) binary += String.fromCharCode(utf8Bytes[i]);
            return btoa(binary);
        };

        const downloadFile = (content, filename, type) => {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        const generateM3U = channels => BoxCatalog.serializeAll({ movies: [], estrenos: [], series: [], animados: [], radios: [], tudumList: [], videoteca: [], channels })['listaoficial.m3u'];
        const parseM3U = data => BoxCatalog.parseM3U(data);

        const isFileProtocol = typeof window !== 'undefined' && window.location.protocol === 'file:';

        const fetchSmart = async (localUrl, rawUrl, isJson = true) => {
            const file = localUrl.split('/').pop().split('?')[0];
            return BoxCatalog.read(file);
        };

        // ============================================================
        // ICONOS
        // ============================================================
        const Icon = ({ name, size = 18, className = "" }) => {
            switch (name) {
                case 'tv': return <i className={`fa-solid fa-tv ${className}`} style={{ fontSize: size }}></i>;
                case 'film': return <i className={`fa-solid fa-film ${className}`} style={{ fontSize: size }}></i>;
                case 'clapperboard': return <i className={`fa-solid fa-clapperboard ${className}`} style={{ fontSize: size }}></i>;
                case 'sparkles': return <i className={`fa-solid fa-wand-magic-sparkles ${className}`} style={{ fontSize: size }}></i>;
                case 'plus': return <i className={`fa-solid fa-plus ${className}`} style={{ fontSize: size }}></i>;
                case 'trash': return <i className={`fa-solid fa-trash-can ${className}`} style={{ fontSize: size }}></i>;
                case 'edit': return <i className={`fa-solid fa-pen-to-square ${className}`} style={{ fontSize: size }}></i>;
                case 'download': return <i className={`fa-solid fa-download ${className}`} style={{ fontSize: size }}></i>;
                case 'upload': return <i className={`fa-solid fa-upload ${className}`} style={{ fontSize: size }}></i>;
                case 'x': return <i className={`fa-solid fa-xmark ${className}`} style={{ fontSize: size }}></i>;
                case 'up': return <i className={`fa-solid fa-arrow-up ${className}`} style={{ fontSize: size }}></i>;
                case 'down': return <i className={`fa-solid fa-arrow-down ${className}`} style={{ fontSize: size }}></i>;
                case 'save': return <i className={`fa-solid fa-floppy-disk ${className}`} style={{ fontSize: size }}></i>;
                case 'alert': return <i className={`fa-solid fa-triangle-exclamation ${className}`} style={{ fontSize: size }}></i>;
                case 'refresh': return <i className={`fa-solid fa-rotate ${className}`} style={{ fontSize: size }}></i>;
                case 'smile': return <i className={`fa-solid fa-face-smile ${className}`} style={{ fontSize: size }}></i>;
                case 'radio': return <i className={`fa-solid fa-tower-broadcast ${className}`} style={{ fontSize: size }}></i>;
                case 'disc': return <i className={`fa-solid fa-compact-disc ${className}`} style={{ fontSize: size }}></i>;
                case 'music': return <i className={`fa-solid fa-music ${className}`} style={{ fontSize: size }}></i>;
                case 'play': return <i className={`fa-solid fa-play ${className}`} style={{ fontSize: size }}></i>;
                case 'github': return <i className={`fa-brands fa-github ${className}`} style={{ fontSize: size }}></i>;
                case 'undo': return <i className={`fa-solid fa-rotate-left ${className}`} style={{ fontSize: size }}></i>;
                case 'grip': return <i className={`fa-solid fa-grip-vertical ${className}`} style={{ fontSize: size }}></i>;
                case 'flame': return <i className={`fa-solid fa-fire ${className}`} style={{ fontSize: size }}></i>;
                case 'search': return <i className={`fa-solid fa-magnifying-glass ${className}`} style={{ fontSize: size }}></i>;
                case 'archive': return <i className={`fa-solid fa-box-archive ${className}`} style={{ fontSize: size }}></i>;
                default: return <i className={`fa-solid fa-circle ${className}`} style={{ fontSize: size }}></i>;
            }
        };

        // ============================================================
        // HOOK: API KEY TMDB COMPARTIDA
        // ============================================================
        const useTmdbKey = (apiKeyProp) => {
            const [apiKey, setApiKey] = useState(() =>
                apiKeyProp || localStorage.getItem('boxplay_tmdb_key') || TMDB_DEFAULT_KEY
            );
            const [keyStatus, setKeyStatus] = useState('unknown');

            useEffect(() => {
                let cancelled = false;
                const validate = async () => {
                    const key = (apiKey || '').trim();
                    if (!key) { setKeyStatus('bad'); return; }
                    try {
                        const r = await fetch(`https://api.themoviedb.org/3/configuration?api_key=${encodeURIComponent(key)}`);
                        if (!cancelled) setKeyStatus(r.ok ? 'ok' : 'bad');
                    } catch {
                        if (!cancelled) setKeyStatus('bad');
                    }
                };
                validate();
                return () => { cancelled = true; };
            }, [apiKey]);

            const saveKey = (k) => {
                localStorage.setItem('boxplay_tmdb_key', k.trim());
                setApiKey(k.trim());
            };

            return { apiKey, setApiKey, keyStatus, saveKey };
        };

        // ============================================================
        // COMPONENTES UI GLOBALES
        // ============================================================

        const Toast = ({ message, type = 'success', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3200);
                return () => clearTimeout(timer);
            }, [onClose]);
            const bgStyle = type === 'success' ? 'bg-emerald-600 text-white' : type === 'info' ? 'bg-cyan-600 text-white' : 'bg-rose-600 text-white';
            return (
                <div className={`fixed bottom-5 right-5 ${bgStyle} px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-fade-in z-[400] border border-white/20`}>
                    <Icon name={type === 'success' ? 'save' : 'alert'} size={16} />
                    <span className="font-bold text-xs sm:text-sm tracking-wide">{message}</span>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, message, onConfirm, onCancel, confirmText = "Confirmar", cancelText = "Cancelar" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[500] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full border border-slate-100 space-y-4">
                        <div className="flex items-center gap-3 text-rose-600">
                            <div className="w-10 h-10 rounded-2xl bg-rose-100 flex items-center justify-center flex-shrink-0">
                                <Icon name="alert" size={20} />
                            </div>
                            <h3 className="font-extrabold text-base text-slate-900">Confirmación Requerida</h3>
                        </div>
                        <p className="text-slate-600 text-xs sm:text-sm leading-relaxed">{message}</p>
                        <div className="flex justify-end gap-2.5 pt-2">
                            <button onClick={onCancel} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-bold transition-colors">{cancelText}</button>
                            <button onClick={() => { onConfirm(); onCancel(); }} className="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition-colors shadow-md">{confirmText}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const PlayerModal = ({ isOpen, title, url, onClose }) => {
            const videoRef = useRef(null);
            const audioRef = useRef(null);
            const hlsRef = useRef(null);
            const [playerError, setPlayerError] = useState(false);

            const converted = useMemo(() => convertUrl(url), [url]);
            const isEmbed = useMemo(() => {
                if (!converted) return false;
                return converted.includes('ok.ru/videoembed') || converted.includes('youtube.com/embed') || converted.includes('drive.google.com') || converted.includes('archive.org/embed');
            }, [converted]);

            const isAudioStream = useMemo(() => {
                if (!url) return false;
                const lower = url.toLowerCase();
                return lower.endsWith('.mp3') || lower.endsWith('.m4a') || lower.endsWith('.aac') || lower.includes('/stream') || lower.includes('icecast') || lower.includes('streamtheworld') || lower.includes('turadio.stream');
            }, [url]);

            useEffect(() => {
                setPlayerError(false);
                if (!isOpen || !url || isEmbed) return;
                if (isAudioStream) {
                    const audio = audioRef.current;
                    if (audio) { audio.src = url; audio.play().catch(() => {}); }
                    return;
                }
                const video = videoRef.current;
                if (!video) return;
                if (url.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        if (hlsRef.current) hlsRef.current.destroy();
                        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        hlsRef.current = hls;
                        hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
                        hls.on(Hls.Events.ERROR, () => { setPlayerError(true); });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                        video.addEventListener('loadedmetadata', () => { video.play().catch(() => {}); });
                    }
                } else {
                    video.src = url;
                    video.play().catch(() => {});
                }
                return () => {
                    if (hlsRef.current) { hlsRef.current.destroy(); hlsRef.current = null; }
                };
            }, [isOpen, url, isEmbed, isAudioStream]);

            useEffect(() => {
                return () => {
                    if (videoRef.current) { try { videoRef.current.pause(); videoRef.current.src = ''; videoRef.current.load(); } catch (e) {} }
                    if (audioRef.current) { try { audioRef.current.pause(); audioRef.current.src = ''; } catch (e) {} }
                    if (hlsRef.current) { hlsRef.current.destroy(); hlsRef.current = null; }
                };
            }, []);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[550] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col">
                        <div className="px-5 py-3.5 bg-slate-950 flex justify-between items-center border-b border-slate-800">
                            <h3 className="text-white font-extrabold text-xs sm:text-sm truncate flex items-center gap-2">
                                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                                <span>Probando Reproducción: {title}</span>
                            </h3>
                            <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-white rounded-lg transition-colors"><Icon name="x" size={18} /></button>
                        </div>
                        <div className="p-2 sm:p-4 bg-black aspect-video flex items-center justify-center relative overflow-hidden">
                            {isEmbed ? (
                                <iframe
                                    src={converted}
                                    className="w-full h-full border-0 rounded-2xl"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
                                    allowFullScreen
                                    referrerPolicy="origin"
                                    title={title}
                                ></iframe>
                            ) : isAudioStream ? (
                                <div className="flex flex-col items-center justify-center gap-4 text-center p-6">
                                    <div className="w-16 h-16 rounded-full bg-cyan-500/20 border border-cyan-500/40 text-cyan-400 flex items-center justify-center text-2xl animate-pulse"><Icon name="music" size={28} /></div>
                                    <span className="text-white font-bold text-sm">{title}</span>
                                    <audio ref={audioRef} controls className="w-full max-w-md accent-cyan-500"></audio>
                                </div>
                            ) : (
                                <video ref={videoRef} controls className="w-full h-full max-h-[60vh] bg-black rounded-2xl"></video>
                            )}
                            {playerError && (
                                <div className="absolute inset-0 bg-black/80 flex items-center justify-center p-6 text-center">
                                    <div className="text-rose-400 text-xs font-bold space-y-2">
                                        <p>⚠️ No se pudo decodificar el flujo del video.</p>
                                        <p className="text-slate-400 text-[10px]">Verifica si la URL está en línea o requiere cabeceras CORS específicas.</p>
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="p-3 bg-slate-950 text-[11px] text-slate-400 border-t border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-2">
                            <span className="truncate max-w-md font-mono text-cyan-300">URL: {converted || url}</span>
                            <button onClick={onClose} className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xs transition-colors self-end sm:self-auto">Cerrar Ventana</button>
                        </div>
                    </div>
                </div>
            );
        };

        const GithubSyncModal = ({ isOpen, onClose, onSync, onRestore }) => {
            const [preparing, setPreparing] = useState(false);
            const [draft, setDraft] = useState(null);
            const [error, setError] = useState('');
            useEffect(() => { if (isOpen) { setDraft(null); setError(''); } }, [isOpen]);
            if (!isOpen) return null;
            const prepare = async () => {
                setPreparing(true); setError(''); setDraft(null);
                try { setDraft(await onSync()); }
                catch (err) { setError(err.message); }
                finally { setPreparing(false); }
            };
            return (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[500] flex items-center justify-center p-4">
                    <div role="dialog" aria-modal="true" aria-label="Revisar borrador" className="bg-white p-6 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto space-y-4">
                        <h3 className="font-extrabold text-lg text-slate-900">Revisar borrador</h3>
                        <p className="text-sm text-slate-600">Tus cambios son locales. Este borrador no publica ni modifica GitHub.</p>
                        <p className="text-xs text-slate-500">Destino compartido: {BoxCatalog.config.repository} · {BoxCatalog.config.branch}</p>
                        <button onClick={prepare} disabled={preparing} className="px-4 py-2 bg-cyan-600 text-white rounded-xl disabled:opacity-50">{preparing ? 'Comprobando catálogos…' : 'Validar y revisar cambios'}</button>
                        {error && <p role="alert" className="text-red-700">{error}</p>}
                        {draft && <>
                            <table className="w-full text-xs text-left"><thead><tr><th>Catálogo</th><th>Nuevos</th><th>Modificados</th><th>Eliminados</th></tr></thead>
                                <tbody>{draft.summary.map(row => <tr key={row.file}><td className="py-2">{row.file}</td><td>{row.added}</td><td>{row.modified}</td><td>{row.removed}</td></tr>)}</tbody>
                            </table>
                            <p className={draft.validation.passed ? 'text-green-700' : 'text-red-700'}>{draft.validation.passed ? 'Validación correcta. Pendiente de tu aceptación.' : 'Hay datos que corregir antes de una futura publicación.'}</p>
                            <ul className="text-xs text-red-700 space-y-1">{draft.validation.errors.map((message, i) => <li key={i}>{message}</li>)}</ul>
                            <button onClick={() => downloadFile(JSON.stringify(draft, null, 2), 'boxplaytv_borrador.json', 'application/json')} className="px-4 py-2 bg-slate-900 text-white rounded-xl">Descargar borrador y respaldo</button>
                            <button onClick={() => { onRestore(draft.baseline); onClose(); }} className="block px-4 py-2 border rounded-xl">Restaurar respaldo en el panel</button>
                            <p className="text-xs text-slate-500">Incluye la versión actual y los cambios propuestos. No incluye credenciales. Publicación deshabilitada.</p>
                        </>}
                        <button onClick={onClose} disabled={preparing} className="block px-4 py-2 text-slate-600">Cerrar</button>
                    </div>
                </div>
            );
        };

        // ============================================================
        // IMPORTADOR AUTOMÁTICO: NETFLIX TUDUM (TMDB)
        // ============================================================
        const TudumImporter = ({ tudumList, setTudumList, showToast, requestConfirm, onTestPlayer }) => {
            const { apiKey, keyStatus, saveKey } = useTmdbKey();
            const [kind, setKind] = useState('movie');
            const [region, setRegion] = useState('US');
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(false);
            const [showKeyBox, setShowKeyBox] = useState(false);
            const [tempKey, setTempKey] = useState(apiKey);
            const [importingIds, setImportingIds] = useState(new Set());
            const [selected, setSelected] = useState(null);

            const existingKeys = useMemo(() => {
                const s = new Set();
                tudumList.forEach(t => {
                    const title = (t.title || t.titulo || '').trim().toLowerCase();
                    if (title) s.add(title);
                    if (t.tmdbId) s.add(`tmdb:${t.tmdbId}`);
                });
                return s;
            }, [tudumList]);

            const isAlreadyImported = useCallback((m) => {
                const title = (m.title || m.name || '').trim().toLowerCase();
                return existingKeys.has(title) || existingKeys.has(`tmdb:${m.id}`);
            }, [existingKeys]);

            const today = new Date().toISOString().slice(0, 10);

            const buildUrl = () => {
                const k = encodeURIComponent((apiKey || '').trim());
                const lang = 'language=es-ES';
                if (kind === 'movie') {
                    return `https://api.themoviedb.org/3/discover/movie?api_key=${k}&${lang}` +
                           `&with_watch_providers=8&watch_region=${region}` +
                           `&sort_by=primary_release_date.asc&primary_release_date.gte=${today}` +
                           `&with_release_type=2|3&vote_count.gte=0&page=1`;
                }
                if (kind === 'tv') {
                    return `https://api.themoviedb.org/3/discover/tv?api_key=${k}&${lang}` +
                           `&with_watch_providers=8&watch_region=${region}` +
                           `&sort_by=first_air_date.asc&first_air_date.gte=${today}` +
                           `&with_networks=213&page=1`;
                }
                if (kind === 'upcoming') {
                    return `https://api.themoviedb.org/3/movie/upcoming?api_key=${k}&${lang}&region=${region}&page=1`;
                }
                return `https://api.themoviedb.org/3/trending/all/week?api_key=${k}&${lang}`;
            };

            const fetchItems = async () => {
                const key = (apiKey || '').trim();
                if (!key) { setShowKeyBox(true); showToast('Configura tu API Key de TMDB.', 'error'); return; }
                setLoading(true);
                setSelected(null);
                try {
                    const res = await fetch(buildUrl());
                    if (res.status === 401) { setShowKeyBox(true); throw new Error('API Key TMDB inválida.'); }
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.status_message || 'Error consultando TMDB');
                    let list = data.results || [];
                    list = list.map(r => ({
                        ...r,
                        media_type: r.media_type || (kind === 'tv' ? 'tv' : 'movie'),
                    }));
                    if (kind === 'movie' || kind === 'tv' || kind === 'upcoming') {
                        list.sort((a, b) => {
                            const da = a.release_date || a.first_air_date || '9999';
                            const db = b.release_date || b.first_air_date || '9999';
                            return da.localeCompare(db);
                        });
                    }
                    setItems(list.slice(0, 24));
                    showToast(`✓ ${list.length} resultados cargados`);
                } catch (e) {
                    console.error(e);
                    showToast(`Error: ${e.message}`, 'error');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (apiKey && keyStatus === 'ok') fetchItems();
                // eslint-disable-next-line
            }, [keyStatus, kind, region]);

            const buildTudumFromItem = (m) => {
                const isTv = m.media_type === 'tv' || m.name;
                const title = m.title || m.name || m.original_title || m.original_name || '';
                const releaseDate = m.release_date || m.first_air_date || '';
                const poster = m.poster_path ? `https://image.tmdb.org/t/p/w780${m.poster_path}` : '';
                return {
                    title,
                    titulo: title,
                    releaseDate: releaseDate ? new Date(releaseDate).toLocaleDateString('es-ES', { year: 'numeric', month: 'long' }) : 'Próximamente',
                    fechaEstreno: releaseDate || 'Próximamente',
                    genre: 'Estreno Netflix',
                    genero: 'Estreno Netflix',
                    synopsis: m.overview || '',
                    sinopsis: m.overview || '',
                    image: poster,
                    imagen: poster,
                    trailerUrl: '',
                    urlTrailer: '',
                    availability: `Netflix (${isTv ? 'Serie' : 'Película'})`,
                    disponibilidad: `Netflix (${isTv ? 'Serie' : 'Película'})`,
                    score: m.vote_average ? `${m.vote_average.toFixed(1)} / 10` : 'Próximamente',
                    puntuacion: m.vote_average ? `${m.vote_average.toFixed(1)} / 10` : 'Próximamente',
                    tmdbId: m.id,
                    mediaType: isTv ? 'tv' : 'movie',
                };
            };

            const enrichAndImport = async (m) => {
                const base = buildTudumFromItem(m);
                if (isAlreadyImported(m)) { showToast(`"${base.title}" ya está en Tudum.`, 'error'); return false; }
                setImportingIds(prev => new Set([...prev, m.id]));
                try {
                    const key = apiKey.trim();
                    const isTv = base.mediaType === 'tv';
                    const endpoint = isTv ? 'tv' : 'movie';
                    const detRes = await fetch(
                        `https://api.themoviedb.org/3/${endpoint}/${m.id}?api_key=${encodeURIComponent(key)}&language=es-ES` +
                        `&append_to_response=videos,release_dates,content_ratings,credits`
                    );
                    if (detRes.ok) {
                        const d = await detRes.json();
                        const videos = d.videos?.results || [];
                        // Fallback de idioma: ES → EN → Teaser → cualquier YouTube
                        const trailer = videos.find(v => v.type === 'Trailer' && v.site === 'YouTube' && v.iso_639_1 === 'es')
                                      || videos.find(v => v.type === 'Trailer' && v.site === 'YouTube' && v.iso_639_1 === 'en')
                                      || videos.find(v => (v.type === 'Trailer' || v.type === 'Teaser') && v.site === 'YouTube')
                                      || videos.find(v => v.site === 'YouTube');
                        if (trailer) base.trailerUrl = `https://www.youtube.com/watch?v=${trailer.key}`;
                        const genres = (d.genres || []).map(g => g.name).join(', ');
                        if (genres) { base.genre = genres; base.genero = genres; }
                        const release = d.release_date || d.first_air_date;
                        if (release) {
                            base.releaseDate = new Date(release).toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
                            base.fechaEstreno = release;
                        }
                        base.synopsis = d.overview || base.synopsis;
                        base.sinopsis = base.synopsis;
                        if (d.vote_average) {
                            base.score = `${d.vote_average.toFixed(1)} / 10`;
                            base.puntuacion = base.score;
                        }
                        if (isTv) {
                            const cr = d.content_ratings?.results || [];
                            const rating = cr.find(r => r.iso_3166_1 === 'ES' || r.iso_3166_1 === 'US')?.rating;
                            if (rating) base.clasificacion = rating;
                        } else {
                            const rd = d.release_dates?.results || [];
                            const cert = rd.find(r => r.iso_3166_1 === 'ES')?.release_dates?.[0]?.certification
                                      || rd.find(r => r.iso_3166_1 === 'US')?.release_dates?.[0]?.certification;
                            if (cert) base.clasificacion = cert;
                        }
                    }
                } catch (e) { /* importa con datos básicos si falla */ }

                const newItem = { ...base, id: `tudum-${Date.now()}-${m.id}` };
                setTudumList(prev => [newItem, ...prev]);
                setImportingIds(prev => { const n = new Set(prev); n.delete(m.id); return n; });
                showToast(`✓ "${base.title}" añadido a Tudum`);
                return true;
            };

            const importAll = () => {
                const pending = items.filter(m => !isAlreadyImported(m));
                if (pending.length === 0) { showToast('Todos ya están importados.', 'error'); return; }
                requestConfirm(
                    `¿Importar ${pending.length} títulos nuevos a Netflix Tudum? Se traerán tráiler y sinopsis completos.`,
                    async () => {
                        showToast(`Importando ${pending.length} títulos...`, 'info');
                        let ok = 0;
                        for (const m of pending) {
                            // eslint-disable-next-line no-await-in-loop
                            const r = await enrichAndImport(m);
                            if (r) ok++;
                            // eslint-disable-next-line no-await-in-loop
                            await new Promise(r => setTimeout(r, 130));
                        }
                        showToast(`✓ ${ok} títulos importados a Tudum`);
                    }
                );
            };

            const keyBadge = keyStatus === 'ok' ? { text: '✓ API activa', cls: 'bg-emerald-900/60 text-emerald-300 border-emerald-700' }
                : keyStatus === 'bad' ? { text: '⚠ API inválida', cls: 'bg-rose-900/60 text-rose-300 border-rose-700' }
                : { text: '⏳ Verificando…', cls: 'bg-slate-800 text-slate-400 border-slate-700' };

            const tabs = [
                { id: 'movie',    label: '🎬 Pelis Netflix' },
                { id: 'tv',       label: '📺 Series Netflix' },
                { id: 'upcoming', label: '🗓️ Próximos estrenos' },
                { id: 'trending', label: '🔥 Trending' },
            ];

            return (
                <div className="bg-gradient-to-br from-rose-950 via-slate-950 to-black rounded-3xl p-5 md:p-7 border border-rose-900/50 text-white space-y-5 animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-rose-900/40 pb-4">
                        <div>
                            <h2 className="text-xl sm:text-2xl font-black flex items-center gap-2.5">
                                <span className="p-2 bg-rose-500/20 text-rose-400 rounded-xl">🎬</span>
                                <span>Importador Netflix Tudum (TMDB)</span>
                                <span className={`text-[9px] font-mono px-2 py-0.5 rounded-full border ${keyBadge.cls}`}>{keyBadge.text}</span>
                            </h2>
                            <p className="text-xs text-slate-400 mt-1">
                                Trae automáticamente próximos estrenos de Netflix, series, cine y tendencias con póster, sinopsis, tráiler y clasificación.
                            </p>
                        </div>
                        <div className="flex flex-wrap gap-2 w-full md:w-auto">
                            <select value={region} onChange={e => setRegion(e.target.value)}
                                className="px-3 py-2 bg-slate-900 border border-rose-900/50 rounded-xl text-xs font-bold text-rose-200">
                                <option value="US">🌎 US</option>
                                <option value="ES">🇪🇸 ES</option>
                                <option value="MX">🇲🇽 MX</option>
                                <option value="CR">🇨🇷 CR</option>
                                <option value="AR">🇦🇷 AR</option>
                                <option value="CO">🇨🇴 CO</option>
                            </select>
                            <button onClick={fetchItems} disabled={loading}
                                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 rounded-xl text-xs font-bold flex items-center gap-2 border border-rose-900/50">
                                <Icon name="refresh" size={13} /> {loading ? 'Cargando...' : 'Refrescar'}
                            </button>
                            <button onClick={importAll} disabled={loading || items.length === 0}
                                className="px-4 py-2 bg-gradient-to-r from-rose-600 to-red-500 hover:brightness-110 disabled:opacity-50 rounded-xl text-xs font-black shadow-lg">
                                ⚡ Importar todo a Tudum
                            </button>
                            <button onClick={() => { setTempKey(apiKey); setShowKeyBox(v => !v); }}
                                className="px-3 py-2 bg-slate-900 hover:bg-slate-800 rounded-xl text-xs font-bold border border-rose-900/50">⚙️ API</button>
                        </div>
                    </div>

                    <div className="flex flex-wrap gap-2">
                        {tabs.map(t => (
                            <button key={t.id} onClick={() => setKind(t.id)}
                                className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                                    kind === t.id
                                        ? 'bg-rose-600 text-white shadow-lg'
                                        : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border border-rose-900/40'
                                }`}>
                                {t.label}
                            </button>
                        ))}
                    </div>

                    {showKeyBox && (
                        <div className="bg-slate-950 rounded-2xl p-4 border border-rose-800/60 space-y-2">
                            <label className="block text-[11px] font-bold text-slate-300">API Key de TMDB</label>
                            <div className="flex gap-2">
                                <input type="password" value={tempKey} onChange={e => setTempKey(e.target.value)}
                                    placeholder="Pega aquí tu API Key"
                                    className="flex-1 p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-xs outline-none focus:ring-2 focus:ring-rose-500 font-mono" />
                                <button onClick={() => { saveKey(tempKey); setShowKeyBox(false); showToast('API Key guardada'); }}
                                    className="px-4 py-2 bg-rose-600 hover:bg-rose-500 rounded-lg text-[11px] font-black">Guardar</button>
                            </div>
                        </div>
                    )}

                    {loading && (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                            {Array.from({ length: 12 }).map((_, i) => (
                                <div key={i} className="aspect-[2/3] bg-slate-800/60 rounded-xl animate-pulse"></div>
                            ))}
                        </div>
                    )}

                    {!loading && items.length === 0 && (
                        <div className="text-center py-12 text-slate-500">
                            <div className="text-5xl mb-3">🎬</div>
                            <p className="text-sm font-bold">Pulsa "Refrescar" para cargar contenido de Netflix.</p>
                        </div>
                    )}

                    {!loading && items.length > 0 && (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                            {items.map((m) => {
                                const already = isAlreadyImported(m);
                                const importing = importingIds.has(m.id);
                                const title = m.title || m.name;
                                const date = m.release_date || m.first_air_date;
                                const poster = m.poster_path ? `https://image.tmdb.org/t/p/w342${m.poster_path}` : '';
                                return (
                                    <div key={m.id} className={`group relative bg-slate-900 rounded-2xl overflow-hidden border ${already ? 'border-emerald-700/60' : 'border-slate-800'} hover:border-rose-500 transition-all`}>
                                        <div className="aspect-[2/3] bg-slate-800 relative overflow-hidden">
                                            {poster
                                                ? <img src={poster} alt={title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
                                                : <div className="w-full h-full flex items-center justify-center text-slate-600 text-[10px]">Sin póster</div>}
                                            {already && (
                                                <span className="absolute top-2 right-2 bg-emerald-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full">✓ YA</span>
                                            )}
                                            {importing && (
                                                <div className="absolute inset-0 bg-black/70 flex items-center justify-center">
                                                    <div className="w-6 h-6 border-2 border-rose-400 border-t-transparent rounded-full animate-spin"></div>
                                                </div>
                                            )}
                                            <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black via-black/70 to-transparent p-2">
                                                <p className="text-[11px] font-bold text-white line-clamp-2 leading-tight">{title}</p>
                                                <p className="text-[9px] text-slate-300 mt-0.5">
                                                    {date ? new Date(date).toLocaleDateString('es-ES', { year: 'numeric', month: 'short' }) : 'Fecha TBD'}
                                                    {' · '}
                                                    {m.vote_average ? `⭐ ${m.vote_average.toFixed(1)}` : '—'}
                                                </p>
                                            </div>
                                        </div>
                                        <div className="p-2 flex gap-1">
                                            <button onClick={() => setSelected(m)}
                                                className="flex-1 text-[10px] font-bold py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700">Ver</button>
                                            <button onClick={() => enrichAndImport(m)} disabled={already || importing}
                                                className="flex-1 text-[10px] font-black py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 disabled:opacity-40 disabled:cursor-not-allowed"
                                                title="Importar a Tudum">+ Tudum</button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {selected && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[550] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-3xl overflow-hidden shadow-2xl">
                                <div className="px-5 py-3.5 bg-slate-950 flex justify-between items-center border-b border-slate-800">
                                    <h3 className="text-white font-extrabold text-sm truncate">👁️ Vista previa: {selected.title || selected.name}</h3>
                                    <button onClick={() => setSelected(null)} className="p-1.5 text-slate-400 hover:text-white rounded-lg">
                                        <Icon name="x" size={18} />
                                    </button>
                                </div>
                                <div className="p-5 grid grid-cols-1 md:grid-cols-3 gap-5 text-white">
                                    <div className="md:col-span-1">
                                        {selected.poster_path
                                            ? <img src={`https://image.tmdb.org/t/p/w500${selected.poster_path}`} alt="" className="w-full rounded-2xl shadow-lg" />
                                            : <div className="aspect-[2/3] bg-slate-800 rounded-2xl flex items-center justify-center text-slate-500">Sin póster</div>}
                                    </div>
                                    <div className="md:col-span-2 space-y-3">
                                        <h2 className="text-2xl font-black">{selected.title || selected.name}</h2>
                                        {(selected.original_title || selected.original_name) && (selected.original_title || selected.original_name) !== (selected.title || selected.name) && (
                                            <p className="text-xs text-slate-400 italic">Título original: {selected.original_title || selected.original_name}</p>
                                        )}
                                        <div className="flex flex-wrap gap-2 text-xs">
                                            <span className="bg-slate-800 px-2.5 py-1 rounded-lg">
                                                {(selected.release_date || selected.first_air_date)?.slice(0, 4) || 'Año TBD'}
                                            </span>
                                            <span className="bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-lg font-bold">
                                                ⭐ {selected.vote_average?.toFixed(1) || 'N/D'}
                                            </span>
                                            <span className="bg-rose-500/20 text-rose-300 px-2.5 py-1 rounded-lg font-bold">
                                                {selected.media_type === 'tv' ? '📺 Serie' : '🎬 Película'}
                                            </span>
                                        </div>
                                        <p className="text-sm text-slate-300 leading-relaxed max-h-40 overflow-y-auto custom-scrollbar">
                                            {selected.overview || 'Sin sinopsis disponible.'}
                                        </p>
                                        <button onClick={async () => { await enrichAndImport(selected); setSelected(null); }}
                                            disabled={isAlreadyImported(selected)}
                                            className="w-full py-2.5 bg-rose-600 hover:bg-rose-500 disabled:opacity-40 rounded-xl text-xs font-black">
                                            ⬇ Importar a Netflix Tudum
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // EDITOR: NETFLIX TUDUM (con importador automático)
        // ============================================================
        const TudumEditor = ({ tudumList, setTudumList, showToast, requestConfirm, onTestPlayer }) => {
            const [mode, setMode] = useState('auto');
            const [editingItem, setEditingItem] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            const handleSave = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const title = formData.get('title').trim();
                const existingIndex = tudumList.findIndex(t => (t.title || t.titulo || '').toLowerCase() === title.toLowerCase() && (!editingItem || t.id !== editingItem.id));
                if (existingIndex !== -1) { showToast(`El estreno "${title}" ya existe en la lista Tudum.`, 'error'); return; }
                const rawImage = formData.get('image') || '';
                const normalizedImage = normalizeImageUrl(rawImage);
                const newItem = {
                    ...editingItem,
                    id: editingItem.id || `tudum-${Date.now()}`,
                    title, titulo: title,
                    releaseDate: formData.get('releaseDate') || 'Próximamente',
                    fechaEstreno: formData.get('releaseDate') || 'Próximamente',
                    genre: formData.get('genre') || 'Estreno',
                    genero: formData.get('genre') || 'Estreno',
                    synopsis: formData.get('synopsis') || '',
                    sinopsis: formData.get('synopsis') || '',
                    image: normalizedImage, imagen: normalizedImage,
                    trailerUrl: formData.get('trailerUrl') || '',
                    urlTrailer: formData.get('trailerUrl') || '',
                    availability: formData.get('availability') || 'Costa Rica (Disponible)',
                    disponibilidad: formData.get('availability') || 'Costa Rica (Disponible)',
                    score: formData.get('score') || '9.0 / 10',
                    puntuacion: formData.get('score') || '9.0 / 10'
                };
                if (editingItem && editingItem.id && !editingItem.isNew) {
                    setTudumList(tudumList.map(t => t.id === editingItem.id ? newItem : t));
                    showToast('Estreno Tudum actualizado');
                } else {
                    setTudumList([newItem, ...tudumList]);
                    showToast('Estreno Tudum añadido');
                }
                setEditingItem(null);
            };

            const exportData = () => {
                const items = BoxCatalog.identify(tudumList, 'tudum.json');
                downloadFile(JSON.stringify(items, null, 2), 'tudum.json', 'application/json');
                showToast('Borrador de tudum.json descargado; no publicado.');
            };

            const filteredList = tudumList.filter(t =>
                (t.title || t.titulo || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (t.genre || t.genero || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (t.synopsis || t.sinopsis || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-4 md:p-7 animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-100 pb-5">
                        <div>
                            <h2 className="text-xl sm:text-2xl font-black text-slate-900 flex items-center gap-2.5">
                                <span className="p-2 bg-rose-50 text-rose-600 rounded-xl"><Icon name="flame" size={20} /></span>
                                <span>Netflix Tudum</span>
                                <span className="text-xs font-bold text-slate-400 font-mono bg-slate-100 px-2.5 py-0.5 rounded-full">{tudumList.length} lanzamientos</span>
                            </h2>
                            <p className="text-xs text-slate-500 mt-1">Avances y próximos estrenos de Netflix para Box Play TV (<code>tudum.json</code>)</p>
                        </div>
                        <div className="flex gap-2 w-full md:w-auto">
                            <button onClick={() => setEditingItem({ isNew: true })} className="flex-1 md:flex-none bg-rose-600 hover:bg-rose-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-sm"><Icon name="plus" size={14} /> Nuevo Estreno</button>
                            <button onClick={exportData} className="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-sm"><Icon name="download" size={14} /> Exportar JSON</button>
                        </div>
                    </div>

                    <div className="flex gap-2">

                                    <h3 className="font-extrabold text-rose-950 text-sm sm:text-base flex items-center gap-2"><Icon name="edit" size={16} /> {editingItem.isNew ? 'Añadir Nuevo Estreno Tudum' : 'Editar Estreno Tudum'}</h3>
                                    <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><label className="block text-xs font-bold mb-1 text-slate-700">Título</label><input name="title" defaultValue={editingItem.title || editingItem.titulo || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-rose-500 bg-white" placeholder="Ej: Stranger Things 5" /></div>

                                        <div><label className="block text-xs font-bold mb-1 text-slate-700">Género</label><input name="genre" defaultValue={editingItem.genre || editingItem.genero || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-rose-500 bg-white" placeholder="Ej: Ciencia Ficción / Terror" /></div>
                                        <div><label className="block text-xs font-bold mb-1 text-slate-700">Puntuación / Calificación</label><input name="score" defaultValue={editingItem.score || editingItem.puntuacion || '9.2 / 10'} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-rose-500 bg-white" placeholder="9.5 / 10" /></div>
                                        <div><label className="block text-xs font-bold mb-1 text-slate-700">URL del Póster</label><input name="image" defaultValue={editingItem.image || editingItem.imagen || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-rose-500 bg-white font-mono" placeholder="https://..." /></div>
                                        <div><label className="block text-xs font-bold mb-1 text-slate-700">URL del Tráiler (YouTube)</label><input name="trailerUrl" defaultValue={editingItem.trailerUrl || editingItem.urlTrailer || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-rose-500 bg-white font-mono" placeholder="https://www.youtube.com/watch?v=..." /></div>
                                        <div><label className="block text-xs font-bold mb-1 text-slate-700">Disponibilidad Regional</label><input name="availability" defaultValue={editingItem.availability || editingItem.disponibilidad || 'Costa Rica (Estreno)'} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-rose-500 bg-white" placeholder="Costa Rica (Estreno en Netflix)" /></div>
                                        <div className="md:col-span-2"><label className="block text-xs font-bold mb-1 text-slate-700">Sinopsis</label><textarea name="synopsis" defaultValue={editingItem.synopsis || editingItem.sinopsis || ''} rows="3" required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-rose-500 bg-white" placeholder="Descripción del lanzamiento..."></textarea></div>
                                        <div className="md:col-span-2 flex justify-end gap-2.5 pt-2">
                                            <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-2 text-slate-600 hover:bg-slate-200 rounded-xl text-xs font-bold transition-colors">Cancelar</button>
                                            <button type="submit" className="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-xs shadow-md transition-colors">Guardar Estreno</button>

                            )}
                            <div className="max-h-[60vh] overflow-y-auto custom-scrollbar space-y-2.5 pr-1">
                                {filteredList.map((item, index) => {
                                    const poster = item.image || item.imagen;
                                    const title = item.title || item.titulo;
                                    const genre = item.genre || item.genero;
                                    const release = item.releaseDate || item.fechaEstreno;
                                    const trailer = item.trailerUrl || item.urlTrailer;
                                    return (
                                        <div key={item.id || index} className="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl hover:bg-slate-100/90 transition-all">

                                                <div className="w-12 h-16 rounded-xl bg-black overflow-hidden border border-slate-200 flex-shrink-0 shadow-sm"><img src={poster} alt="" className="w-full h-full object-cover" onError={(e) => { e.target.src='https://placehold.co/100x150/111/fff?text=TUDUM'; }} /></div>

                                                    <h4 className="font-extrabold text-slate-900 text-xs sm:text-sm truncate">{title}</h4>

                                                <button onClick={() => setEditingItem(item)} className="p-2 text-cyan-600 hover:bg-cyan-50 rounded-xl transition-colors" title="Editar"><Icon name="edit" size={15} /></button>

                    )}
