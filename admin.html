            );
        };

        // ============================================================
        // EDITOR: TV EN VIVO (M3U)
        // ============================================================
        const TvEditor = ({ channels, setChannels, showToast, requestConfirm, onTestPlayer }) => {
            const [editingItem, setEditingItem] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [localOrder, setLocalOrder] = useState(channels);
            const dragSourceIdRef = useRef(null);

            useEffect(() => { setLocalOrder(channels); }, [channels]);

            const handleSave = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const title = formData.get('title').trim();
                const existingIndex = channels.findIndex(c => c.title.toLowerCase() === title.toLowerCase() && (!editingItem || c.id !== editingItem.id));
                if (existingIndex !== -1) { showToast(`El canal "${title}" ya existe.`, 'error'); return; }
                const newChannel = {
                    ...editingItem,
                    id: editingItem.id || `tv-${Date.now()}`,
                    title,
                    logo: normalizeImageUrl(formData.get('logo') || ''),
                    group: formData.get('group') || 'General',
                    url: formData.get('url') || ''
                };
                if (editingItem && editingItem.id && !editingItem.isNew) {
                    setChannels(channels.map(c => c.id === editingItem.id ? newChannel : c));
                    showToast('Canal actualizado');
                } else {
                    setChannels([newChannel, ...channels]);
                    showToast('Canal añadido');
                }
                setEditingItem(null);
            };

            const exportData = () => {
                const m3uString = generateM3U(channels);
                downloadFile(m3uString, 'listaoficial.m3u', 'audio/x-mpegurl');
                showToast('Archivo listaoficial.m3u generado');
            };

            const moveItem = (index, direction) => {
                const newChs = [...channels];
                if (direction === 'up' && index > 0) [newChs[index - 1], newChs[index]] = [newChs[index], newChs[index - 1]];
                else if (direction === 'down' && index < newChs.length - 1) [newChs[index + 1], newChs[index]] = [newChs[index], newChs[index + 1]];
                setChannels(newChs);
            };

            const handleDragStart = (e, channelId) => {
                dragSourceIdRef.current = channelId;
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', String(channelId)); } catch (_) {}
            };

            const handleDragOver = (e, targetId) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const sourceId = dragSourceIdRef.current;
                if (sourceId == null || sourceId === targetId) return;
                setLocalOrder(prev => {
                    const fromIdx = prev.findIndex(c => c.id === sourceId);
                    const toIdx = prev.findIndex(c => c.id === targetId);
                    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return prev;
                    const next = [...prev];
                    const [moved] = next.splice(fromIdx, 1);
                    next.splice(toIdx, 0, moved);
                    return next;
                });
            };

            const handleDragEnd = () => {
                dragSourceIdRef.current = null;
                setChannels(localOrder);
                showToast('Orden de canales actualizado');
            };

            const dragDisabled = searchTerm.trim().length > 0;
            const visible = localOrder.filter(c =>
                (c.title || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (c.group || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-4 md:p-7 animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-100 pb-5">
                        <div>
                            <h2 className="text-xl sm:text-2xl font-black text-slate-900 flex items-center gap-2.5">
                                <span className="p-2 bg-cyan-50 text-cyan-600 rounded-xl"><Icon name="tv" size={20} /></span>
                                <span>Canales de TV en Vivo</span>
                                <span className="text-xs font-bold text-slate-400 font-mono bg-slate-100 px-2.5 py-0.5 rounded-full">{channels.length} canales</span>
                            </h2>
                            <p className="text-xs text-slate-500 mt-1">Lista oficial M3U compatible con reproductores HLS / Smart TV (<code>listaoficial.m3u</code>)</p>
                        </div>
                        <div className="flex gap-2 w-full md:w-auto">
                            <button onClick={() => setEditingItem({ isNew: true })} className="flex-1 md:flex-none bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-sm"><Icon name="plus" size={14} /> Nuevo Canal</button>
                            <button onClick={exportData} className="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-sm"><Icon name="download" size={14} /> Exportar M3U</button>
                        </div>
                    </div>
                    <div className="relative">
                        <input type="text" placeholder="Buscar canal por nombre o categoría..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full p-3.5 border border-slate-200 rounded-2xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-cyan-500 outline-none text-xs sm:text-sm pl-10" />
                        <div className="absolute left-3.5 top-4 text-slate-400"><Icon name="search" size={14} /></div>
                    </div>
                    {editingItem && (
                        <div className="bg-cyan-50/70 p-5 md:p-6 rounded-2xl border border-cyan-200/80 animate-fade-in space-y-4">
                            <h3 className="font-extrabold text-cyan-950 text-sm sm:text-base flex items-center gap-2"><Icon name="edit" size={16} /> {editingItem.isNew ? 'Añadir Nuevo Canal de TV' : 'Editar Canal'}</h3>
                            <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold mb-1 text-slate-700">Nombre del Canal</label><input name="title" defaultValue={editingItem.title || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-cyan-500 bg-white" placeholder="Ej: Teletica Canal 7" /></div>
                                <div><label className="block text-xs font-bold mb-1 text-slate-700">Grupo / Categoría</label><input name="group" defaultValue={editingItem.group || 'Costa Rica'} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-cyan-500 bg-white" placeholder="Ej: Costa Rica, Deportes..." /></div>
                                <div><label className="block text-xs font-bold mb-1 text-slate-700">URL del Logo (Opcional)</label><input name="logo" defaultValue={editingItem.logo || ''} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-cyan-500 bg-white font-mono" placeholder="https://..." /></div>
                                <div><label className="block text-xs font-bold mb-1 text-slate-700">URL del Stream (.m3u8 / .mpd / live)</label><input name="url" defaultValue={editingItem.url || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-cyan-500 bg-white font-mono" placeholder="https://.../playlist.m3u8" /></div>
                                <div className="md:col-span-2 flex justify-end gap-2.5 pt-2">
                                    <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-2 text-slate-600 hover:bg-slate-200 rounded-xl text-xs font-bold transition-colors">Cancelar</button>
                                    <button type="submit" className="px-5 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl font-bold text-xs shadow-md transition-colors">Guardar Canal</button>
                                </div>
                            </form>
                        </div>
                    )}
                    <div className="max-h-[60vh] overflow-y-auto custom-scrollbar space-y-2.5 pr-1">
                        {visible.map((channel) => {
                            const globalIndex = channels.findIndex(c => c.id === channel.id);
                            return (
                                <div key={channel.id}
                                    draggable={!dragDisabled}
                                    onDragStart={(e) => !dragDisabled && handleDragStart(e, channel.id)}
                                    onDragOver={(e) => !dragDisabled && handleDragOver(e, channel.id)}
                                    onDragEnd={handleDragEnd}
                                    className={`flex items-center justify-between p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl hover:bg-slate-100/90 transition-all ${dragDisabled ? 'opacity-90' : 'cursor-grab active:cursor-grabbing'}`}>
                                    <div className="flex items-center gap-3.5 min-w-0">
                                        <div className="text-slate-400 p-1"><Icon name="grip" size={15} /></div>
                                        <div className="w-11 h-11 rounded-xl bg-white border border-slate-200 overflow-hidden flex items-center justify-center p-1 shadow-sm shrink-0">
                                            {channel.logo ? (<img src={channel.logo} alt="" className="w-full h-full object-contain" onError={(e) => e.target.style.display='none'} />) : (<Icon name="tv" size={16} className="text-slate-400" />)}
                                        </div>
                                        <div className="min-w-0">
                                            <h4 className="font-extrabold text-slate-900 text-xs sm:text-sm truncate">{channel.title}</h4>
                                            <p className="text-[11px] text-cyan-600 font-bold truncate mt-0.5">{channel.group || 'General'}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 shrink-0">
                                        <button onClick={() => onTestPlayer(channel.title, channel.url)} className="p-1.5 bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-xl flex items-center gap-1 text-[11px] font-bold px-2.5 transition-colors"><Icon name="play" size={12} /> Probar</button>
                                        <div className="flex gap-1">
                                            <button onClick={() => moveItem(globalIndex, 'up')} disabled={globalIndex <= 0} className="p-1.5 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="up" size={13}/></button>
                                            <button onClick={() => moveItem(globalIndex, 'down')} disabled={globalIndex === channels.length - 1} className="p-1.5 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="down" size={13}/></button>
                                        </div>
                                        <button onClick={() => setEditingItem(channel)} className="p-2 text-cyan-600 hover:bg-cyan-50 rounded-xl transition-colors" title="Editar"><Icon name="edit" size={15} /></button>
                                        <button onClick={() => requestConfirm(`¿Eliminar "${channel.title}"?`, () => setChannels(channels.filter(c => c.id !== channel.id)))} className="p-2 text-rose-600 hover:bg-rose-50 rounded-xl transition-colors" title="Eliminar"><Icon name="trash" size={15} /></button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ============================================================
        // BUSCADOR TMDB ENRIQUECIDO
        // ============================================================
        const MovieAutoSearch = ({ onUse, showToast, apiKey: apiKeyProp }) => {
            const [query, setQuery] = useState('');
            const [results, setResults] = useState([]);
            const [selected, setSelected] = useState(null);
            const [loading, setLoading] = useState(false);
            const { apiKey, keyStatus, setApiKey, saveKey } = useTmdbKey(apiKeyProp);
            const [showKeyBox, setShowKeyBox] = useState(false);
            const [tempKey, setTempKey] = useState(apiKey);

            const searchMovies = async () => {
                const q = query.trim();
                if (!q) return;
                const key = (apiKey || '').trim();
                if (!key) { setShowKeyBox(true); showToast('Primero configura tu clave API de TMDB.', 'error'); return; }
                setLoading(true);
                setSelected(null);
                try {
                    const url = `https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(key)}&language=es-ES&include_adult=false&page=1&query=${encodeURIComponent(q)}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (response.status === 401) { setShowKeyBox(true); throw new Error('Clave TMDB inválida o revocada.'); }
                    if (!response.ok) throw new Error(data.status_message || 'No se pudo consultar TMDB');
                    setResults((data.results || []).slice(0, 8));
                    if (!data.results || data.results.length === 0) showToast('No se encontraron películas con ese título.', 'error');
                } catch (error) {
                    console.error(error);
                    showToast(`Error TMDB: ${error.message}`, 'error');
                } finally {
                    setLoading(false);
                }
            };

            const getDetails = async (movie) => {
                const key = (apiKey || '').trim();
                if (!key) return;
                setLoading(true);
                try {
                    const url = `https://api.themoviedb.org/3/movie/${movie.id}?api_key=${encodeURIComponent(key)}&language=es-ES&append_to_response=credits,videos,release_dates,recommendations,keywords,images,external_ids`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.status_message || 'No se pudieron obtener los detalles');
                    setSelected(data);
                } catch (error) {
                    console.error(error);
                    showToast('No se pudieron obtener los detalles de la película.', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const buildFullData = (selected) => {
                const directors = (selected.credits?.crew || []).filter(p => p.job === 'Director').map(p => p.name);
                const writers = (selected.credits?.crew || []).filter(p => ['Screenplay', 'Writer', 'Story'].includes(p.job)).slice(0, 3).map(p => p.name);
                const cast = (selected.credits?.cast || []).slice(0, 12).map(p => ({ nombre: p.name, personaje: p.character || '', foto: p.profile_path ? `https://image.tmdb.org/t/p/w185${p.profile_path}` : '' }));
                const allVideos = selected.videos?.results || [];
                // Fallback de idioma del tráiler
                const trailer = allVideos.find(v => v.type === 'Trailer' && v.site === 'YouTube' && v.iso_639_1 === 'es')
                              || allVideos.find(v => v.type === 'Trailer' && v.site === 'YouTube' && v.iso_639_1 === 'en')
                              || allVideos.find(v => (v.type === 'Trailer' || v.type === 'Teaser') && v.site === 'YouTube')
                              || allVideos.find(v => v.site === 'YouTube');
                const releaseData = selected.release_dates?.results || [];
                const ageRating = (releaseData.find(r => r.iso_3166_1 === 'ES')?.release_dates?.[0]?.certification) || (releaseData.find(r => r.iso_3166_1 === 'MX')?.release_dates?.[0]?.certification) || (releaseData.find(r => r.iso_3166_1 === 'US')?.release_dates?.[0]?.certification) || '';
                const similares = (selected.recommendations?.results || []).filter(r => r.poster_path).slice(0, 6).map(r => ({ titulo: r.title, poster: `https://image.tmdb.org/t/p/w342${r.poster_path}`, year: r.release_date ? r.release_date.slice(0, 4) : '', rating: r.vote_average ? r.vote_average.toFixed(1) : '' }));
                const keywords = (selected.keywords?.keywords || []).map(k => k.name);
                const coleccion = selected.belongs_to_collection?.name || '';
                let runtimeText = '';
                if (selected.runtime) { const h = Math.floor(selected.runtime / 60); const m = selected.runtime % 60; runtimeText = h > 0 ? `${h}h ${m}min` : `${m}min`; }
                let fechaLegible = '';
                if (selected.release_date) { const d = new Date(selected.release_date); fechaLegible = d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }); }
                return {
                    titulo: selected.title || selected.original_title || '',
                    tituloOriginal: selected.original_title || '',
                    descripcion: selected.overview || '',
                    sinopsis: selected.overview || '',
                    imagen: selected.poster_path ? `https://image.tmdb.org/t/p/w780${selected.poster_path}` : '',
                    backdrop: selected.backdrop_path ? `https://image.tmdb.org/t/p/w1280${selected.backdrop_path}` : '',
                    year: selected.release_date ? selected.release_date.slice(0, 4) : '',
                    fechaEstreno: selected.release_date || '',
                    fechaLegible,
                    rating: selected.vote_average ? selected.vote_average.toFixed(1) : '',
                    votos: selected.vote_count || 0,
                    runtime: runtimeText,
                    runtimeMin: selected.runtime || 0,
                    genres: (selected.genres || []).map(g => g.name),
                    generosTexto: (selected.genres || []).map(g => g.name).join(', '),
                    clasificacion: ageRating,
                    tagline: selected.tagline || '',
                    director: directors.join(', '),
                    guionistas: writers.join(', '),
                    reparto: cast,
                    pais: (selected.production_countries || []).map(c => c.name).join(', '),
                    idioma: selected.original_language || '',
                    productoras: (selected.production_companies || []).map(c => c.name).join(', '),
                    presupuesto: selected.budget || 0,
                    recaudacion: selected.revenue || 0,
                    trailerUrl: trailer ? `https://www.youtube.com/watch?v=${trailer.key}` : '',
                    coleccion,
                    keywords: keywords.join(', '),
                    similares,
                    tmdbId: selected.id,
                    homepage: selected.homepage || ''
                };
            };

            const useSelected = () => {
                if (!selected) return;
                onUse(buildFullData(selected));
                showToast('✓ Ficha completa cargada en el formulario');
            };

            const keyBadge = keyStatus === 'ok' ? { text: '✓ API activa', cls: 'bg-emerald-900/60 text-emerald-300 border-emerald-700' } : keyStatus === 'bad' ? { text: '⚠ API inválida', cls: 'bg-rose-900/60 text-rose-300 border-rose-700' } : { text: '⏳ Verificando…', cls: 'bg-slate-800 text-slate-400 border-slate-700' };

            return (
                <div className="md:col-span-2 bg-slate-950 rounded-2xl p-4 border border-slate-800 text-white space-y-3">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                            <h4 className="font-black text-sm flex items-center gap-2">
                                <span>🎬</span> Buscar ficha completa en TMDB
                                <span className={`text-[9px] font-mono px-2 py-0.5 rounded-full border ${keyBadge.cls}`}>{keyBadge.text}</span>
                            </h4>
                            <p className="text-[10px] text-slate-400 mt-0.5">Trae: portada HD, fondo, sinopsis, año, duración, rating, géneros, director, reparto con foto, país, tráiler, clasificación y similares.</p>
                        </div>
                        <button type="button" onClick={() => { setTempKey(apiKey); setShowKeyBox(v => !v); }} className="text-[10px] font-bold text-cyan-300 hover:text-white px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700">⚙️ API TMDB</button>
                    </div>

                    {showKeyBox && (
                        <div className="bg-slate-900 rounded-xl p-3 border border-slate-700 space-y-2">
                            <label className="block text-[10px] font-bold text-slate-300">Clave API de TMDB</label>
                            <div className="flex gap-2">
                                <input type="password" value={tempKey} onChange={e => setTempKey(e.target.value)} placeholder="Pega aquí tu API Key" className="flex-1 p-2 rounded-lg bg-slate-950 border border-slate-700 text-xs outline-none focus:ring-2 focus:ring-cyan-500 font-mono" />
                                <button type="button" onClick={() => { saveKey(tempKey); setShowKeyBox(false); showToast('API Key guardada'); }} className="px-3 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-[10px] font-black">Guardar</button>
                            </div>
                        </div>
                    )}

                    <div className="flex gap-2">
                        <input value={query} onChange={e => setQuery(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') searchMovies(); }} placeholder="Ej: Gladiador II, Dune, Interestelar..." className="flex-1 p-2.5 rounded-xl bg-white text-slate-900 text-xs outline-none focus:ring-2 focus:ring-cyan-500" />
                        <button type="button" onClick={searchMovies} disabled={loading} className="px-4 py-2.5 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 rounded-xl text-xs font-black">{loading ? 'Buscando...' : '🔎 Buscar'}</button>
                    </div>

                    {results.length > 0 && !selected && (
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 max-h-80 overflow-y-auto custom-scrollbar">
                            {results.map(movie => (
                                <button type="button" key={movie.id} onClick={() => getDetails(movie)} className="text-left bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500 rounded-xl overflow-hidden transition-all">
                                    <div className="aspect-[2/3] bg-slate-800">
                                        {movie.poster_path ? <img src={`https://image.tmdb.org/t/p/w342${movie.poster_path}`} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-[10px] text-slate-500">Sin portada</div>}
                                    </div>
                                    <div className="p-2">
                                        <div className="font-bold text-[10px] line-clamp-2">{movie.title || movie.original_title}</div>
                                        <div className="text-[9px] text-slate-500 mt-1">{movie.release_date?.slice(0,4) || 'Sin año'} · ⭐ {movie.vote_average?.toFixed(1) || 'N/D'}</div>
                                    </div>
                                </button>
                            ))}
                        </div>
                    )}

                    {selected && (
                        <div className="bg-slate-900 rounded-xl border border-cyan-800 p-3 space-y-3">
                            <div className="flex flex-col sm:flex-row gap-3">
                                <div className="w-24 h-36 rounded-lg overflow-hidden bg-black shrink-0">
                                    {selected.poster_path ? <img src={`https://image.tmdb.org/t/p/w342${selected.poster_path}`} alt="" className="w-full h-full object-cover" /> : null}
                                </div>
                                <div className="min-w-0 flex-1 space-y-1">
                                    <h5 className="font-black text-sm">{selected.title}</h5>
                                    {selected.tagline && <p className="text-[10px] italic text-cyan-300">"{selected.tagline}"</p>}
                                    <p className="text-[10px] text-cyan-300">{selected.release_date?.slice(0,4) || 'Año N/D'} · ⭐ {selected.vote_average?.toFixed(1) || 'N/D'} ({selected.vote_count || 0} votos) · {selected.runtime ? `${selected.runtime} min` : 'Duración N/D'}</p>
                                    <p className="text-[10px] text-slate-300"><b>Géneros:</b> {(selected.genres || []).map(g => g.name).join(', ') || 'N/D'}</p>
                                    <p className="text-[10px] text-slate-400 line-clamp-3">{selected.overview || 'Sin sinopsis.'}</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-2 text-[10px] text-slate-300 border-t border-slate-800 pt-2">
                                <span><b>Director:</b> {(selected.credits?.crew || []).filter(p => p.job === 'Director').map(p => p.name).join(', ') || 'N/D'}</span>
                                <span><b>País:</b> {(selected.production_countries || []).map(c => c.name).join(', ') || 'N/D'}</span>
                                <span className="col-span-2"><b>Reparto:</b> {(selected.credits?.cast || []).slice(0, 5).map(p => p.name).join(', ') || 'N/D'}</span>
                            </div>
                            {(selected.credits?.cast || []).length > 0 && (
                                <div className="flex gap-2 overflow-x-auto custom-scrollbar pb-1">
                                    {(selected.credits.cast || []).slice(0, 8).map((p, i) => (
                                        <div key={i} className="text-center shrink-0 w-14">
                                            <div className="w-14 h-14 rounded-full overflow-hidden bg-slate-800 border border-slate-700">
                                                {p.profile_path ? <img src={`https://image.tmdb.org/t/p/w185${p.profile_path}`} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-[8px] text-slate-500">👤</div>}
                                            </div>
                                            <p className="text-[8px] mt-1 text-slate-300 line-clamp-2">{p.name}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                            <div className="flex flex-wrap gap-2 pt-1">
                                <button type="button" onClick={useSelected} className="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-[10px] font-black">✓ USAR ESTA INFORMACIÓN COMPLETA</button>
                                <button type="button" onClick={() => setSelected(null)} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-[10px] font-bold">Volver a resultados</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // IMPORTADOR MASIVO: TENDENCIAS TMDB
        // ============================================================
        const TrendingImporter = ({
            movies, setMovies,
            estrenos, setEstrenos,
            showToast, requestConfirm
        }) => {
            const { apiKey, keyStatus, saveKey } = useTmdbKey();
            const [timeWindow, setTimeWindow] = useState('week');
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(false);
            const [showKeyBox, setShowKeyBox] = useState(false);
            const [selected, setSelected] = useState(null);
            const [tempKey, setTempKey] = useState(apiKey);
            const [importingIds, setImportingIds] = useState(new Set());

            const existingKeys = useMemo(() => {
                const s = new Set();
                [...movies, ...estrenos].forEach(m => {
                    const t = (m.titulo || m.title || '').trim().toLowerCase();
                    if (t) s.add(t);
                    if (m.tmdbId) s.add(`tmdb:${m.tmdbId}`);
                });
                return s;
            }, [movies, estrenos]);

            const isAlreadyImported = useCallback((m) => {
                const titleKey = (m.title || '').trim().toLowerCase();
                return existingKeys.has(titleKey) || existingKeys.has(`tmdb:${m.id}`);
            }, [existingKeys]);

            const fetchTrending = async () => {
                const key = (apiKey || '').trim();
                if (!key) { setShowKeyBox(true); showToast('Configura tu API Key de TMDB primero.', 'error'); return; }
                setLoading(true);
                setSelected(null);
                try {
                    const url = `https://api.themoviedb.org/3/trending/movie/${timeWindow}?api_key=${encodeURIComponent(key)}&language=es-ES`;
                    const res = await fetch(url);
                    if (res.status === 401) { setShowKeyBox(true); throw new Error('API Key de TMDB inválida.'); }
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.status_message || 'Error consultando tendencias');
                    setItems((data.results || []).slice(0, 20));
                    showToast(`✓ ${data.results?.length || 0} tendencias cargadas`);
                } catch (e) {
                    console.error(e);
                    showToast(`Error: ${e.message}`, 'error');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (apiKey && keyStatus === 'ok') fetchTrending();
                // eslint-disable-next-line
            }, [keyStatus]);

            const buildMovieFromTrending = (m) => ({
                titulo: m.title || m.original_title || '',
                title: m.title || m.original_title || '',
                tituloOriginal: m.original_title || '',
                descripcion: m.overview || '',
                sinopsis: m.overview || '',
                imagen: m.poster_path ? `https://image.tmdb.org/t/p/w780${m.poster_path}` : '',
                image: m.poster_path ? `https://image.tmdb.org/t/p/w780${m.poster_path}` : '',
                backdrop: m.backdrop_path ? `https://image.tmdb.org/t/p/w1280${m.backdrop_path}` : '',
                year: m.release_date ? m.release_date.slice(0, 4) : '',
                fechaEstreno: m.release_date || '',
                rating: m.vote_average ? m.vote_average.toFixed(1) : '',
                votos: m.vote_count || 0,
                generosTexto: '',
                genres: [],
                reparto: [],
                similares: [],
                tmdbId: m.id,
                urlDrive: '',
                urlOkRu: '',
                qualityTag: '',
                codigo: null,
                trailerUrl: '',
                director: '',
                runtime: '',
                runtimeMin: 0,
                clasificacion: '',
                tagline: '',
                guionistas: '',
                pais: '',
                idioma: '',
                productoras: '',
                presupuesto: 0,
                recaudacion: 0,
                coleccion: '',
                keywords: '',
                homepage: ''
            });

            const importOne = async (m, target = 'movies') => {
                const built = buildMovieFromTrending(m);
                if (isAlreadyImported(m)) { showToast(`"${built.titulo}" ya está en el catálogo.`, 'error'); return false; }
                setImportingIds(prev => new Set([...prev, m.id]));
                try {
                    const key = apiKey.trim();
                    const detRes = await fetch(`https://api.themoviedb.org/3/movie/${m.id}?api_key=${encodeURIComponent(key)}&language=es-ES&append_to_response=credits,videos,release_dates`);
                    if (detRes.ok) {
                        const d = await detRes.json();
                        const videos = d.videos?.results || [];
                        const trailer = videos.find(v => v.type === 'Trailer' && v.site === 'YouTube' && v.iso_639_1 === 'es')
                                      || videos.find(v => v.type === 'Trailer' && v.site === 'YouTube' && v.iso_639_1 === 'en')
                                      || videos.find(v => (v.type === 'Trailer' || v.type === 'Teaser') && v.site === 'YouTube')
                                      || videos.find(v => v.site === 'YouTube');
                        const directors = (d.credits?.crew || []).filter(p => p.job === 'Director').map(p => p.name).join(', ');
                        const cast = (d.credits?.cast || []).slice(0, 12).map(p => ({
                            nombre: p.name, personaje: p.character || '',
                            foto: p.profile_path ? `https://image.tmdb.org/t/p/w185${p.profile_path}` : ''
                        }));
                        built.director = directors;
                        built.reparto = cast;
                        built.runtime = d.runtime ? `${Math.floor(d.runtime / 60)}h ${d.runtime % 60}min` : '';
                        built.runtimeMin = d.runtime || 0;
                        built.genres = (d.genres || []).map(g => g.name);
                        built.generosTexto = (d.genres || []).map(g => g.name).join(', ');
                        built.trailerUrl = trailer ? `https://www.youtube.com/watch?v=${trailer.key}` : '';
                        built.clasificacion = (d.release_dates?.results || []).find(r => r.iso_3166_1 === 'ES')?.release_dates?.[0]?.certification || '';
                    }
                } catch (e) { /* Importación básica si falla el detalle */ }

                if (target === 'estrenos') {
                    setEstrenos(prev => [{ ...built, id: `est-${Date.now()}-${m.id}` }, ...prev]);
                } else {
                    setMovies(prev => [{ ...built, id: `mov-${Date.now()}-${m.id}` }, ...prev]);
                }
                setImportingIds(prev => { const n = new Set(prev); n.delete(m.id); return n; });
                showToast(`✓ "${built.titulo}" importado a ${target === 'estrenos' ? 'Estrenos 2026' : 'Películas'}`);
                return true;
            };

            const importAll = (target = 'movies') => {
                const pending = items.filter(m => !isAlreadyImported(m));
                if (pending.length === 0) { showToast('Todas las tendencias ya están importadas.', 'error'); return; }
                requestConfirm(
                    `¿Importar ${pending.length} películas nuevas a ${target === 'estrenos' ? 'Estrenos 2026' : 'Películas'}? Se traerán fichas completas (director, reparto, tráiler).`,
                    async () => {
                        showToast(`Importando ${pending.length} títulos...`, 'info');
                        let ok = 0;
                        for (const m of pending) {
                            // eslint-disable-next-line no-await-in-loop
                            const res = await importOne(m, target);
                            if (res) ok++;
                            // eslint-disable-next-line no-await-in-loop
                            await new Promise(r => setTimeout(r, 120));
                        }
                        showToast(`✓ ${ok} títulos importados`);
                    }
                );
            };

            const keyBadge = keyStatus === 'ok' ? { text: '✓ API activa', cls: 'bg-emerald-900/60 text-emerald-300 border-emerald-700' }
                : keyStatus === 'bad' ? { text: '⚠ API inválida', cls: 'bg-rose-900/60 text-rose-300 border-rose-700' }
                : { text: '⏳ Verificando…', cls: 'bg-slate-800 text-slate-400 border-slate-700' };

            return (
                <div className="bg-gradient-to-br from-slate-900 via-slate-950 to-black rounded-3xl p-5 md:p-7 border border-slate-800 text-white space-y-5 animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-4">
                        <div>
                            <h2 className="text-xl sm:text-2xl font-black flex items-center gap-2.5">
                                <span className="p-2 bg-rose-500/20 text-rose-400 rounded-xl">🔥</span>
                                <span>Tendencias de la Semana (TMDB)</span>
                                <span className={`text-[9px] font-mono px-2 py-0.5 rounded-full border ${keyBadge.cls}`}>{keyBadge.text}</span>
                            </h2>
                            <p className="text-xs text-slate-400 mt-1">Importación masiva con ficha completa: portada, sinopsis, reparto, tráiler y más.</p>
                        </div>
                        <div className="flex flex-wrap gap-2 w-full md:w-auto">
                            <div className="flex rounded-xl overflow-hidden border border-slate-700">
                                {['day', 'week'].map(w => (
                                    <button key={w} onClick={() => setTimeWindow(w)}
                                        className={`px-3 py-2 text-xs font-bold transition-colors ${timeWindow === w ? 'bg-rose-600 text-white' : 'bg-slate-900 text-slate-300 hover:bg-slate-800'}`}>
                                        {w === 'day' ? 'Hoy' : 'Semana'}
                                    </button>
                                ))}
                            </div>
                            <button onClick={fetchTrending} disabled={loading}
                                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 rounded-xl text-xs font-bold flex items-center gap-2 border border-slate-700">
                                <Icon name="refresh" size={13} /> {loading ? 'Cargando...' : 'Refrescar'}
                            </button>
                            <button onClick={() => importAll('movies')} disabled={loading || items.length === 0}
                                className="px-4 py-2 bg-gradient-to-r from-cyan-600 to-teal-500 hover:brightness-110 disabled:opacity-50 rounded-xl text-xs font-black shadow-lg">
                                ⚡ Importar todo a Películas
                            </button>
                            <button onClick={() => importAll('estrenos')} disabled={loading || items.length === 0}
                                className="px-4 py-2 bg-gradient-to-r from-amber-600 to-orange-500 hover:brightness-110 disabled:opacity-50 rounded-xl text-xs font-black shadow-lg">
                                ✨ Importar todo a Estrenos 2026
                            </button>
                            <button onClick={() => { setTempKey(apiKey); setShowKeyBox(v => !v); }}
                                className="px-3 py-2 bg-slate-900 hover:bg-slate-800 rounded-xl text-xs font-bold border border-slate-700">⚙️ API</button>
                        </div>
                    </div>

                    {showKeyBox && (
                        <div className="bg-slate-950 rounded-2xl p-4 border border-slate-700 space-y-2">
                            <label className="block text-[11px] font-bold text-slate-300">API Key de TMDB</label>
                            <div className="flex gap-2">
                                <input type="password" value={tempKey} onChange={e => setTempKey(e.target.value)}
                                    placeholder="Pega aquí tu API Key"
                                    className="flex-1 p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-xs outline-none focus:ring-2 focus:ring-cyan-500 font-mono" />
                                <button onClick={() => { saveKey(tempKey); setShowKeyBox(false); showToast('API Key guardada'); }}
                                    className="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-[11px] font-black">Guardar</button>
                            </div>
                        </div>
                    )}

                    {loading && (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                            {Array.from({ length: 10 }).map((_, i) => (
                                <div key={i} className="aspect-[2/3] bg-slate-800/60 rounded-xl animate-pulse"></div>
                            ))}
                        </div>
                    )}

                    {!loading && items.length === 0 && (
                        <div className="text-center py-12 text-slate-500">
                            <div className="text-5xl mb-3">🍿</div>
                            <p className="text-sm font-bold">Pulsa "Refrescar" para cargar las tendencias de TMDB.</p>
                            <p className="text-xs mt-1">Necesitas una API Key válida configurada en ⚙️ API.</p>
                        </div>
                    )}

                    {!loading && items.length > 0 && (
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                            {items.map((m, idx) => {
                                const already = isAlreadyImported(m);
                                const importing = importingIds.has(m.id);
                                return (
                                    <div key={m.id} className={`group relative bg-slate-900 rounded-2xl overflow-hidden border ${already ? 'border-emerald-700/60' : 'border-slate-800'} hover:border-cyan-500 transition-all`}>
                                        <div className="aspect-[2/3] bg-slate-800 relative overflow-hidden">
                                            {m.poster_path ? (
                                                <img src={`https://image.tmdb.org/t/p/w342${m.poster_path}`} alt={m.title}
                                                    className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
                                            ) : (
                                                <div className="w-full h-full flex items-center justify-center text-slate-600 text-[10px]">Sin póster</div>
                                            )}
                                            <span className="absolute top-2 left-2 bg-black/70 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full">#{idx + 1}</span>
                                            {already && (
                                                <span className="absolute top-2 right-2 bg-emerald-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full">✓ YA</span>
                                            )}
                                            {importing && (
                                                <div className="absolute inset-0 bg-black/70 flex items-center justify-center">
                                                    <div className="w-6 h-6 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
                                                </div>
                                            )}
                                            <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black via-black/70 to-transparent p-2">
                                                <p className="text-[11px] font-bold text-white line-clamp-2 leading-tight">{m.title}</p>
                                                <p className="text-[9px] text-slate-300 mt-0.5">
                                                    {m.release_date?.slice(0, 4) || '—'} · ⭐ {m.vote_average?.toFixed(1) || 'N/D'}
                                                </p>
                                            </div>
                                        </div>
                                        <div className="p-2 flex gap-1">
                                            <button onClick={() => setSelected(m)}
                                                className="flex-1 text-[10px] font-bold py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700">Ver</button>
                                            <button onClick={() => importOne(m, 'movies')} disabled={already || importing}
                                                className="flex-1 text-[10px] font-black py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 disabled:cursor-not-allowed"
                                                title="Importar a Películas">+ Pelis</button>
                                            <button onClick={() => importOne(m, 'estrenos')} disabled={already || importing}
                                                className="flex-1 text-[10px] font-black py-1.5 rounded-lg bg-amber-600 hover:bg-amber-500 disabled:opacity-40 disabled:cursor-not-allowed"
                                                title="Importar a Estrenos 2026">+ 2026</button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {selected && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[550] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-3xl overflow-hidden shadow-2xl">
                                <div className="px-5 py-3.5 bg-slate-950 flex justify-between items-center border-b border-slate-800">
                                    <h3 className="text-white font-extrabold text-sm truncate">👁️ Vista previa: {selected.title}</h3>
                                    <button onClick={() => setSelected(null)} className="p-1.5 text-slate-400 hover:text-white rounded-lg">
                                        <Icon name="x" size={18} />
                                    </button>
                                </div>
                                <div className="p-5 grid grid-cols-1 md:grid-cols-3 gap-5 text-white">
                                    <div className="md:col-span-1">
                                        {selected.poster_path
                                            ? <img src={`https://image.tmdb.org/t/p/w500${selected.poster_path}`} alt="" className="w-full rounded-2xl shadow-lg" />

                    setEstrenos(estrenos.map(m => m.id === editingItem.id ? newItem : m));
                    showToast('Estreno 2026 actualizado con ficha completa');
                } else {
                    setEstrenos([newItem, ...estrenos]);
                    showToast('Estreno 2026 añadido con ficha completa');

                setEditingItem(null);
                setAutoData(null);
            };

            const exportData = () => {
                const items = BoxCatalog.identify(estrenos, 'peliculas2.json');
                downloadFile(JSON.stringify(items, null, 2), 'peliculas2.json', 'application/json');
